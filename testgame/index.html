<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Star Fox Clone</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; touch-action: none; }
        #game-container { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }
        
        #canvas-container { height: 50vh; position: relative; }
        #ui-container { height: 50vh; background-color: #111; display: flex; align-items: center; justify-content: space-around; border-top: 2px solid #444; padding-bottom: 20px; }
        canvas { display: block; width: 100%; height: 100%; }
        
        .btn { padding: 15px 20px; font-size: 18px; font-weight: bold; border-radius: 10px; border: none; touch-action: manipulation; user-select: none; }
        #btn-brake { background-color: #e74c3c; color: white; }
        #btn-boost { background-color: #3498db; color: white; }
        
        #hud { position: absolute; top: 10px; left: 10px; right: 100px; display: flex; flex-direction: column; color: white; pointer-events: none; z-index: 10; font-size: 16px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .hud-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        
        #hp-bar-bg { width: 100px; height: 15px; background-color: rgba(255,0,0,0.5); border: 2px solid #fff; transition: width 0.3s; }
        #hp-bar-fill { width: 100%; height: 100%; background-color: #2ecc71; transition: width 0.1s; }
        
        #radar { position: absolute; top: 10px; right: 10px; width: 80px; height: 80px; border-radius: 50%; background-color: rgba(0, 50, 0, 0.4); border: 2px solid #0f0; pointer-events: none; z-index: 10; overflow: hidden; }
        
        #joystick-area { width: 130px; height: 130px; border-radius: 50%; background-color: rgba(255,255,255,0.1); position: relative; display: flex; justify-content: center; align-items: center; touch-action: none; margin-bottom: 20px; }
        #joystick-knob { width: 50px; height: 50px; border-radius: 50%; background-color: rgba(255,255,255,0.5); position: absolute; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; background-color: rgba(0,0,0,0.7); color: white; z-index: 20; }
        .hidden { display: none !important; }
        
        /* ダメージ演出用：画面の縁を赤く発光させる */
        #damage-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 50vh; pointer-events: none; z-index: 15; box-shadow: inset 0 0 50px rgba(255, 0, 0, 0); transition: box-shadow 0.1s; }
        .damage-active { box-shadow: inset 0 0 80px rgba(255, 0, 0, 1) !important; }

        h1 { font-size: 32px; margin-bottom: 20px; text-shadow: 2px 2px 4px #000; text-align: center; }
        p { font-size: 16px; text-align: center; margin-bottom: 20px; line-height: 1.5; }
        .action-btn { padding: 12px 30px; font-size: 20px; background-color: #f1c40f; color: black; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; touch-action: manipulation; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="canvas-container">
            <div id="hud">
                <div class="hud-row">
                    <div id="hp-bar-bg"><div id="hp-bar-fill"></div></div>
                    <div id="score-display">SCORE: 0</div>
                </div>
                <div id="stage-info">STAGE: OCEAN</div>
            </div>
            
            <canvas id="radar"></canvas>
            
            <div id="damage-overlay"></div>
            
            <div id="start-screen" class="overlay">
                <h1>STAR FOX LITE</h1>
                <p>Drag joystick to move.<br>Hold Boost/Brake.<br>Avoid obstacles!</p>
                <button id="btn-start" class="action-btn">START</button>
            </div>
            
            <div id="game-over-screen" class="overlay hidden">
                <h1 style="color: #e74c3c;">GAME OVER</h1>
                <p id="final-score-over">SCORE: 0</p>
                <button id="btn-restart" class="action-btn">RETRY</button>
            </div>

            <div id="game-clear-screen" class="overlay hidden">
                <h1 style="color: #f1c40f;">MISSION COMPLETE!</h1>
                <p id="final-score-clear">SCORE: 0</p>
                <button id="btn-restart-clear" class="action-btn">PLAY AGAIN</button>
            </div>
        </div>
        <div id="ui-container">
            <div id="joystick-area"><div id="joystick-knob"></div></div>
            <button id="btn-brake" class="btn">BRAKE</button>
            <button id="btn-boost" class="btn">BOOST</button>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
