<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eggerland Clone - Medusa Sight Fixed</title>
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: #fff; display: flex; flex-direction: column; align-items: center; touch-action: none; font-family: sans-serif; }
        #game-container { width: 100vw; max-width: 600px; display: flex; flex-direction: column; align-items: center; }
        canvas { background-color: #000; width: 100vw; height: 100vw; max-width: 600px; max-height: 600px; image-rendering: pixelated; }
        #ui-area { width: 100%; height: 40vh; display: flex; justify-content: center; align-items: center; position: relative; }
        .status-bar { position: absolute; top: 5px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-weight: bold; }
        #message { color: yellow; } #shots { color: #00ffaa; }
        .dpad { position: relative; width: 150px; height: 150px; left: -40px; }
        .btn { position: absolute; width: 50px; height: 50px; background-color: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px; user-select: none; }
        .btn:active { background-color: rgba(255, 255, 255, 0.5); }
        #btn-up { top: 0; left: 50px; } #btn-down { bottom: 0; left: 50px; } #btn-left { top: 50px; left: 0; } #btn-right { top: 50px; right: 0; }
        #btn-shot { position: absolute; right: 20px; bottom: 50px; width: 70px; height: 70px; border-radius: 35px; background-color: rgba(255, 50, 50, 0.4); border: 2px solid rgba(255, 100, 100, 0.6); display: flex; justify-content: center; align-items: center; font-weight: bold; user-select: none; }
        #btn-shot:active { background-color: rgba(255, 50, 50, 0.8); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-area">
        <div class="status-bar"><div id="message">Loading...</div><div id="shots-disp">Shots: <span id="shots">0</span></div></div>
        <div class="dpad">
            <div class="btn" id="btn-up" data-dir="up">↑</div><div class="btn" id="btn-down" data-dir="down">↓</div>
            <div class="btn" id="btn-left" data-dir="left">←</div><div class="btn" id="btn-right" data-dir="right">→</div>
        </div>
        <div id="btn-shot">SHOT</div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const msgDiv = document.getElementById('message');
const shotsSpan = document.getElementById('shots');

const TILE_SIZE = 32;
canvas.width = 13 * TILE_SIZE;
canvas.height = 13 * TILE_SIZE;

// --- 外部ファイルから読み込むグローバル変数 ---
let PALETTE = {};
let SPRITES = {};
let INITIAL_MAP = [];
let state;
const input = { up: false, down: false, left: false, right: false, shot: false };

// --- データの非同期読み込み ---
async function bootGame() {
    try {
        const assetsRes = await fetch('assets.json');
        const assetsData = await assetsRes.json();
        PALETTE = assetsData.palette;
        SPRITES = assetsData.sprites;

        const stageRes = await fetch('stage_01.json');
        const stageData = await stageRes.json();
        INITIAL_MAP = stageData.map;

        initGame();
        requestAnimationFrame(loop);
    } catch (e) {
        console.error(e);
        msgDiv.innerText = "Error: ファイル読み込み失敗(ローカルサーバーを使用してください)";
        msgDiv.style.color = "red";
    }
}

function initGame() {
    let pStartX = 12, pStartY = 20; 

    state = {
        map: [], entities: [], floatingEggs: [], projectiles: [], needle: null,
        totalHearts: 0, collectedHearts: 0, shots: 0, chestOpen: false, cleared: false,
        animation: { active: false, duration: 120, startTime: 0, elapsed: 0 } 
    };

    for (let y = 0; y < 13; y++) {
        let row = [];
        for (let x = 0; x < 13; x++) {
            let cell = INITIAL_MAP[y][x];
            if (cell === 'P') { 
                pStartX = x * 2; pStartY = y * 2; row.push(0);
            } else if (cell === 'F' || cell === 'S' || cell === 'M') {
                state.entities.push({
                    type: cell === 'F' ? 'framer' : (cell === 'S' ? 'snakey' : 'medusa'),
                    x: x * 2, y: y * 2,
                    startX: x * 2, startY: y * 2, targetX: x * 2, targetY: y * 2,
                    isMoving: false, awake: false, eggTimer: 0
                });
                row.push(0); 
            } else {
                if (cell === 2 || cell === 7) state.totalHearts++;
                row.push(cell);
            }
        }
        state.map.push(row);
    }
    
    state.player = {
        x: pStartX, y: pStartY, startX: pStartX, startY: pStartY, 
        targetX: pStartX, targetY: pStartY, dir: 'down'
    };
    updateUI();
}

function updateUI() {
    shotsSpan.innerText = state.shots;
    if (state.cleared) msgDiv.innerText = "ステージクリア！";
    else if (state.chestOpen) msgDiv.innerText = "宝箱が開いた！";
    else msgDiv.innerText = "";
}

// キー入力イベント群
['up', 'down', 'left', 'right'].forEach(id => {
    const btn = document.getElementById(`btn-${id}`);
    const press = (e) => { e.preventDefault(); input[id] = true; };
    const release = (e) => { e.preventDefault(); input[id] = false; };
    btn.addEventListener('touchstart', press, {passive: false}); 
    btn.addEventListener('touchend', release, {passive: false});
    btn.addEventListener('mousedown', press); btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
});
const btnShot = document.getElementById('btn-shot');
const shotPress = (e) => { e.preventDefault(); input.shot = true; };
btnShot.addEventListener('touchstart', shotPress, {passive: false}); 
btnShot.addEventListener('mousedown', shotPress);

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') input.up = true;
    if (e.key === 'ArrowDown') input.down = true;
    if (e.key === 'ArrowLeft') input.left = true;
    if (e.key === 'ArrowRight') input.right = true;
    if (e.key === 'z' || e.key === 'Z' || e.key === ' ') input.shot = true;
});
document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowUp') input.up = false;
    if (e.key === 'ArrowDown') input.down = false;
    if (e.key === 'ArrowLeft') input.left = false;
    if (e.key === 'ArrowRight') input.right = false;
    if (e.key === 'z' || e.key === 'Z' || e.key === ' ') input.shot = false;
});

// ゲームロジック群
function getEntityAt(hx, hy, ignore = null) {
    for (let e of state.entities) {
        if (e === ignore) continue;
        if (Math.abs(hx - e.x) < 2 && Math.abs(hy - e.y) < 2) return e;
    }
    return null;
}

function getFloatingEggAt(hx, hy) {
    for (let fe of state.floatingEggs) {
        if (Math.abs(hx - fe.x) < 2 && Math.abs(hy - fe.y) < 2) return fe;
    }
    return null;
}

function checkMapCollision(hx, hy, isPlayer = false) {
    const minTx = Math.floor(hx / 2), maxTx = Math.floor((hx + 1.9) / 2);
    const minTy = Math.floor(hy / 2), maxTy = Math.floor((hy + 1.9) / 2);
    
    let isAllRiver = true, hasRiver = false;

    for (let y = minTy; y <= maxTy; y++) {
        for (let x = minTx; x <= maxTx; x++) {
            if (y < 0 || y >= 13 || x < 0 || x >= 13) return { hit: true, tile: -1, hasRiver: false, allRiver: false };
            const tile = state.map[y][x];
            
            if (tile === 1 || tile === 4 || (tile === 3 && !isPlayer)) {
                return { hit: true, tile: tile, hasRiver: false, allRiver: false };
            }
            if (tile === 5) hasRiver = true;
            else isAllRiver = false;
        }
    }
    
    if (isAllRiver) {
        let onFloating = getFloatingEggAt(hx, hy);
        if (!onFloating) return { hit: true, tile: 5, hasRiver: true, allRiver: true };
    } else if (hasRiver) {
        return { hit: true, tile: 5, hasRiver: true, allRiver: false };
    }
    return { hit: false, hasRiver: false, allRiver: false };
}

function tryMove(dx, dy) {
    if (state.animation.active || state.cleared || state.needle) return;

    if (dy === -1) state.player.dir = 'up';
    if (dy === 1) state.player.dir = 'down';
    if (dx === -1) state.player.dir = 'left';
    if (dx === 1) state.player.dir = 'right';

    const pNextX = state.player.x + dx, pNextY = state.player.y + dy;

    if (checkMapCollision(pNextX, pNextY, true).hit) return;

    const hitE = getEntityAt(pNextX, pNextY);
    if (hitE) {
        if (hitE.type === 'snakey' || hitE.type === 'medusa') return;
        if (dx !== 0 && hitE.y !== state.player.y) return;
        if (dy !== 0 && hitE.x !== state.player.x) return;

        let fNextX = hitE.x + dx, fNextY = hitE.y + dy;

        if (hitE.type === 'egg') {
            let nextCol = checkMapCollision(fNextX, fNextY, false);
            if (nextCol.hasRiver && !nextCol.allRiver) {
                let fNextX2 = hitE.x + dx * 2, fNextY2 = hitE.y + dy * 2;
                let nextCol2 = checkMapCollision(fNextX2, fNextY2, false);
                if (nextCol2.allRiver && !getEntityAt(fNextX2, fNextY2, hitE)) {
                    fNextX = fNextX2; fNextY = fNextY2; hitE.willFloat = true;
                } else return;
            } else if (nextCol.allRiver) {
                hitE.willFloat = true;
            } else if (nextCol.hit) return;
        } else {
            if (checkMapCollision(fNextX, fNextY, false).hit) return;
        }

        if (getEntityAt(fNextX, fNextY, hitE)) return;

        hitE.startX = hitE.x; hitE.startY = hitE.y;
        hitE.targetX = fNextX; hitE.targetY = fNextY;
        hitE.isMoving = true;
    }

    state.player.startX = state.player.x; state.player.startY = state.player.y;
    state.player.targetX = pNextX; state.player.targetY = pNextY;
    state.animation.active = true; state.animation.elapsed = 0; state.animation.startTime = 0; 
}

function tryShoot() {
    if (state.shots > 0 && !state.animation.active && !state.needle && state.projectiles.length === 0) {
        state.shots--; updateUI();
        state.projectiles.push({ x: state.player.x, y: state.player.y, dir: state.player.dir, active: true });
        input.shot = false; 
    }
}

// 修正箇所：メデューサの視線判定
function checkLOS(m, p, axis) {
    let minX, maxX, minY, maxY;
    if (axis === 'y') {
        minX = Math.min(m.x, p.x); maxX = Math.max(m.x, p.x) + 1.9;
        minY = Math.min(m.y, p.y) + 2; maxY = Math.max(m.y, p.y) - 0.1;
    } else {
        minY = Math.min(m.y, p.y); maxY = Math.max(m.y, p.y) + 1.9;
        minX = Math.min(m.x, p.x) + 2; maxX = Math.max(m.x, p.x) - 0.1;
    }
    if (minX > maxX || minY > maxY) return true;

    for(let ty = Math.floor(minY/2); ty <= Math.floor(maxY/2); ty++) {
        for(let tx = Math.floor(minX/2); tx <= Math.floor(maxX/2); tx++) {
            let tile = state.map[ty][tx];
            // 4（木）を除外し、1（岩）、2（ハート）、7（ショットハート）、3（宝箱）のみ視線を遮るように変更
            if ([1,2,7,3].includes(tile)) return false;
        }
    }
    for(let e of state.entities) {
        if (e === m) continue;
        if (e.x + 1.9 >= minX && e.x <= maxX && e.y + 1.9 >= minY && e.y <= maxY) return false;
    }
    return true;
}

function checkMedusa() {
    if (state.needle || state.animation.active || state.cleared) return;
    let p = state.player;
    for (let e of state.entities) {
        if (e.type !== 'medusa') continue;
        let wakeUp = false, attack = false;
        let overlapX = Math.abs(p.x - e.x), overlapY = Math.abs(p.y - e.y);

        if (overlapX < 2 && checkLOS(e, p, 'y')) { wakeUp = true; if (overlapX === 0) attack = true; }
        if (overlapY < 2 && checkLOS(e, p, 'x')) { wakeUp = true; if (overlapY === 0) attack = true; }
        
        e.awake = wakeUp;
        if (attack) {
            state.needle = { x: e.x, y: e.y, tx: p.x, ty: p.y, axis: overlapX === 0 ? 'y' : 'x', progress: 0 };
            break;
        }
    }
}

function update(timestamp) {
    if (state.needle) {
        state.needle.progress += 0.1;
        if (state.needle.progress >= 1) initGame();
        return;
    }

    if (state.cleared) return;

    for (let i = state.projectiles.length - 1; i >= 0; i--) {
        let p = state.projectiles[i];
        if (p.dir === 'up') p.y -= 1; else if (p.dir === 'down') p.y += 1;
        else if (p.dir === 'left') p.x -= 1; else if (p.dir === 'right') p.x += 1;

        if (p.x < 0 || p.x > 24 || p.y < 0 || p.y > 24 || checkMapCollision(p.x, p.y, false).hit) {
            state.projectiles.splice(i, 1); continue;
        }
        
        let hitE = getEntityAt(p.x, p.y);
        if (hitE) {
            let isAligned = false;
            if ((p.dir === 'up' || p.dir === 'down') && p.x === hitE.x) isAligned = true;
            if ((p.dir === 'left' || p.dir === 'right') && p.y === hitE.y) isAligned = true;

            if (isAligned) {
                if (hitE.type === 'snakey') { hitE.type = 'egg'; hitE.eggTimer = 16; }
                else if (hitE.type === 'egg') state.entities = state.entities.filter(e => e !== hitE);
            }
            state.projectiles.splice(i, 1);
        }
    }

    if (state.animation.active) {
        if (state.animation.startTime === 0) state.animation.startTime = timestamp;
        const elapsed = timestamp - state.animation.startTime;
        state.animation.elapsed = elapsed;
        
        if (elapsed >= state.animation.duration) {
            state.player.x = state.player.targetX; state.player.y = state.player.targetY;

            for (let i = state.entities.length - 1; i >= 0; i--) {
                let e = state.entities[i];
                if (e.isMoving) {
                    e.x = e.targetX; e.y = e.targetY; e.isMoving = false;
                    if (e.type === 'egg') {
                        e.eggTimer -= 1; 
                        if (e.eggTimer <= 0) e.type = 'snakey';
                        if (e.willFloat) {
                            state.floatingEggs.push({ x: e.x, y: e.y, walks: 2, playerOn: false });
                            state.entities.splice(i, 1);
                        }
                    }
                }
            }
            state.animation.active = false;
            
            for (let i = state.floatingEggs.length - 1; i >= 0; i--) {
                let fe = state.floatingEggs[i];
                let isPlayerOn = (state.player.x === fe.x && state.player.y === fe.y);
                if (isPlayerOn && !fe.playerOn) { fe.playerOn = true; fe.walks--; }
                else if (!isPlayerOn && fe.playerOn) {
                    fe.playerOn = false;
                    if (fe.walks <= 0) state.floatingEggs.splice(i, 1);
                }
            }

            if (state.player.x % 2 === 0 && state.player.y % 2 === 0) {
                const tx = state.player.x / 2, ty = state.player.y / 2;
                if (tx >= 0 && tx < 13 && ty >= 0 && ty < 13) {
                    const tile = state.map[ty][tx];
                    if (tile === 2 || tile === 7) {
                        state.map[ty][tx] = 0; state.collectedHearts++;
                        if (tile === 7) state.shots++;
                        updateUI();
                        if (state.collectedHearts >= state.totalHearts) { state.chestOpen = true; updateUI(); }
                    } else if (tile === 3 && state.chestOpen && !state.cleared) {
                        state.map[ty][tx] = 0; state.cleared = true; updateUI();
                    }
                }
            }
            checkMedusa();
        }
    } else {
        if (input.shot) tryShoot();
        else {
            let dx = 0, dy = 0;
            if (input.up) dy -= 1; else if (input.down) dy += 1;
            else if (input.left) dx -= 1; else if (input.right) dx += 1;
            if (dx !== 0 || dy !== 0) tryMove(dx, dy);
        }
    }
}

function drawSprite(spriteData, cx, cy, scale) {
    if (!spriteData) return;
    const dotSize = scale / 8;
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const colorCode = spriteData[r][c];
            if (PALETTE[colorCode]) {
                ctx.fillStyle = PALETTE[colorCode];
                ctx.fillRect(cx + c * dotSize, cy + r * dotSize, dotSize + 0.5, dotSize + 0.5);
            }
        }
    }
}

function draw(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!state) return; 

    let prog = state.animation.active ? Math.min(1, state.animation.elapsed / state.animation.duration) : 0;
    
    let time = timestamp || 0;
    let riverSeq = Math.floor(time / 300) % 4; 
    let riverFrame = riverSeq === 0 ? 1 : (riverSeq === 1 ? 2 : (riverSeq === 2 ? 3 : 2));
    let fFrame = Math.floor(time / 500) % 2 + 1;

    for (let y = 0; y < 13; y++) {
        for (let x = 0; x < 13; x++) {
            const tile = state.map[y][x];
            const px = x * TILE_SIZE, py = y * TILE_SIZE;
            
            drawSprite(SPRITES.floor, px, py, TILE_SIZE);
            if (tile === 1) drawSprite(SPRITES.rock, px, py, TILE_SIZE);
            if (tile === 4) drawSprite(SPRITES.tree, px, py, TILE_SIZE);
            if (tile === 5) drawSprite(SPRITES[`river_${riverFrame}`], px, py, TILE_SIZE);
            if (tile === 2) drawSprite(SPRITES.heart_normal, px, py, TILE_SIZE);
            if (tile === 7) drawSprite(SPRITES.heart_shot, px, py, TILE_SIZE);
            if (tile === 3) drawSprite(state.chestOpen ? SPRITES.chest_open : SPRITES.chest_closed, px, py, TILE_SIZE);
        }
    }

    for (let fe of state.floatingEggs) drawSprite(SPRITES.egg, fe.x * (TILE_SIZE/2), fe.y * (TILE_SIZE/2), TILE_SIZE);

    for (let e of state.entities) {
        let fx = e.x, fy = e.y;
        if (state.animation.active && e.isMoving) {
            fx = e.startX + (e.targetX - e.startX) * prog;
            fy = e.startY + (e.targetY - e.startY) * prog;
        }
        const px = fx * (TILE_SIZE/2), py = fy * (TILE_SIZE/2);
        
        if (e.type === 'framer') drawSprite(SPRITES[`framer_${fFrame}`], px, py, TILE_SIZE);
        if (e.type === 'snakey') {
            let sSprite;
            if (state.chestOpen) sSprite = SPRITES[`snakey_happy_${Math.floor(time / 250) % 2 + 1}`];
            else sSprite = (state.player.x < e.x) ? SPRITES['snakey_left'] : SPRITES['snakey_right'];
            drawSprite(sSprite, px, py, TILE_SIZE);
        }
        if (e.type === 'medusa') drawSprite(e.awake ? SPRITES.medusa_awake : SPRITES.medusa_sleep, px, py, TILE_SIZE);
        if (e.type === 'egg') {
            drawSprite(SPRITES.egg, px, py, TILE_SIZE);
            let text = Math.ceil(e.eggTimer).toString();
            let textX = px + TILE_SIZE - 18, textY = py + TILE_SIZE - 4;
            ctx.font = 'bold 14px sans-serif';
            ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.strokeText(text, textX, textY);
            ctx.fillStyle = '#0000ff'; ctx.fillText(text, textX, textY);
        }
    }

    for (let p of state.projectiles) drawSprite(SPRITES.bullet, p.x * (TILE_SIZE/2), p.y * (TILE_SIZE/2), TILE_SIZE);

    let px = state.player.x, py = state.player.y;
    if (state.animation.active) {
        px = state.player.startX + (state.player.targetX - state.player.startX) * prog;
        py = state.player.startY + (state.player.targetY - state.player.startY) * prog;
    }
    let pFrame = Math.floor(time / 250) % 2 + 1;
    drawSprite(SPRITES[`player_${state.player.dir}_${pFrame}`], px * (TILE_SIZE/2), py * (TILE_SIZE/2), TILE_SIZE);

    if (state.needle) {
        let n = state.needle;
        let nx = n.x + (n.tx - n.x) * n.progress;
        let ny = n.y + (n.ty - n.y) * n.progress;
        drawSprite(n.axis === 'x' ? SPRITES.needle_h : SPRITES.needle_v, nx * (TILE_SIZE/2), ny * (TILE_SIZE/2), TILE_SIZE);
    }
}

function loop(timestamp) {
    update(timestamp);
    draw(timestamp);
    requestAnimationFrame(loop);
}

bootGame();
</script>
</body>
</html>
