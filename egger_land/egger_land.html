<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eggerland Clone - Lava & Gamepad</title>
    <script src="tori_se.js"></script>
    <script src="tori_music.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: #fff; display: flex; flex-direction: column; align-items: center; touch-action: none; font-family: sans-serif; }
        #game-container { width: 100vw; max-width: 600px; position: relative; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        #gameCanvas { background-color: #000; width: 100vw; height: 100vw; max-width: 600px; max-height: 600px; image-rendering: pixelated; touch-action: none; }
        
        #title-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        #title-screen h1 { color: #ffcc00; font-size: 3rem; margin-bottom: 2rem; text-shadow: 2px 2px 0px #ff0000; }
        .title-btn { padding: 15px 30px; font-size: 1.2rem; font-weight: bold; margin: 10px; border-radius: 8px; border: 2px solid #fff; background-color: #333; color: #fff; cursor: pointer; width: 200px; text-align: center; }
        .title-btn:active { background-color: #555; }
        
        #stage-select-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #111; display: none; flex-direction: column; align-items: center; z-index: 10; overflow-y: auto; padding: 20px 0; box-sizing: border-box; }
        #stage-select-screen h2 { color: #ffcc00; margin-bottom: 20px; }
        #worlds-container { display: flex; flex-direction: column; gap: 15px; width: 90%; max-width: 400px; padding-bottom: 30px; }
        .world-row { display: flex; align-items: center; justify-content: center; }
        .world-label { width: 80px; font-weight: bold; color: #fff; text-align: right; margin-right: 10px; font-size: 14px; }
        .stage-nodes { display: flex; gap: 8px; position: relative; }
        .stage-nodes::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 4px; background-color: #555; z-index: 0; transform: translateY(-50%); }
        .stage-node { width: 35px; height: 35px; background-color: #222; border: 3px solid #aaa; border-radius: 4px; display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; z-index: 1; }
        .stage-node:active { transform: scale(0.95); }
        .stage-node.cleared { background-color: #004400; border-color: #00ff00; }
        .stage-node.cleared::after { content: '✓'; color: #00ff00; font-size: 20px; font-weight: bold; }
        #btn-back-title { margin-top: auto; padding: 10px 20px; background: #444; color: #fff; border: 2px solid #fff; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 20px;}

        dialog { background-color: #222; color: #fff; border: 2px solid #fff; border-radius: 10px; padding: 20px; max-width: 80%; }
        dialog::backdrop { background: rgba(0,0,0,0.7); }
        
        #item-area { display: flex; gap: 10px; margin-top: 10px; height: 40px; justify-content: center; width: 100%; }
        .item-slot { width: 40px; height: 40px; border: 2px solid #555; border-radius: 5px; background-color: #222; position: relative; display: flex; justify-content: center; align-items: center; }
        .item-slot.hidden { opacity: 0.5; }
        .item-slot.hidden::after { content: ""; position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); }
        .item-slot.ready { border-color: #ffcc00; box-shadow: 0 0 10px #ffcc00; opacity: 1; }
        .item-slot.used { visibility: hidden; }
        .item-slot canvas { width: 32px; height: 32px; image-rendering: pixelated; }

        #ui-area { width: 100%; height: 35vh; display: flex; justify-content: center; align-items: center; position: relative; }
        .status-bar { position: absolute; top: -30px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-weight: bold; }
        #message { color: yellow; } #shots { color: #00ffaa; }
        
        .dpad { position: absolute; left: 20px; bottom: 70px; width: 120px; height: 120px; }
        .btn { position: absolute; width: 40px; height: 40px; background-color: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 10px; display: flex; justify-content: center; align-items: center; user-select: none; }
        .btn:active { background-color: rgba(255, 255, 255, 0.5); }
        #btn-up { top: 0; left: 40px; } #btn-down { bottom: 0; left: 40px; } #btn-left { top: 40px; left: 0; } #btn-right { top: 40px; right: 0; }
        
        #btn-use-item { position: absolute; right: 20px; bottom: 140px; width: 50px; height: 50px; border-radius: 25px; background-color: rgba(50, 50, 255, 0.4); border: 2px solid rgba(100, 100, 255, 0.6); display: flex; justify-content: center; align-items: center; font-weight: bold; user-select: none; font-size: 12px; }
        #btn-use-item:active { background-color: rgba(50, 50, 255, 0.8); }
        #btn-shot { position: absolute; right: 20px; bottom: 70px; width: 60px; height: 60px; border-radius: 30px; background-color: rgba(255, 50, 50, 0.4); border: 2px solid rgba(255, 100, 100, 0.6); display: flex; justify-content: center; align-items: center; font-weight: bold; user-select: none; }
        #btn-shot:active { background-color: rgba(255, 50, 50, 0.8); }
        
        #btn-sub-menu { position: absolute; left: 50%; bottom: 70px; transform: translateX(-65px); width: 60px; height: 35px; border-radius: 10px; background-color: rgba(150, 50, 50, 0.6); border: 2px solid rgba(255, 100, 100, 0.6); display: none; justify-content: center; align-items: center; font-weight: bold; font-size: 10px; user-select: none; text-align: center;}
        #btn-sub-menu:active { background-color: rgba(200, 50, 50, 0.8); }
        #btn-retry { position: absolute; left: 50%; bottom: 70px; transform: translateX(5px); width: 60px; height: 35px; border-radius: 10px; background-color: rgba(100, 100, 100, 0.4); border: 2px solid rgba(200, 200, 200, 0.6); display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 12px; user-select: none; }
        #btn-retry:active { background-color: rgba(100, 100, 100, 0.8); }

        #edit-ui { width: 100%; height: 40vh; display: none; flex-direction: column; align-items: center; padding-top: 10px; box-sizing: border-box; }
        .edit-tabs { display: flex; width: 90%; max-width: 400px; background: #333; border-radius: 5px 5px 0 0; overflow: hidden; }
        .edit-tab { flex: 1; text-align: center; padding: 8px 0; font-size: 12px; cursor: pointer; border-right: 1px solid #222; }
        .edit-tab.active { background: #555; font-weight: bold; }
        .tab-content { display: none; width: 90%; max-width: 400px; background: #222; padding: 10px; box-sizing: border-box; border-radius: 0 0 5px 5px; height: 180px; overflow-y: auto; }
        .tab-content.active { display: flex; flex-direction: column; align-items: center; }
        .palette-category-title { font-size: 12px; font-weight: bold; margin: 5px 0; width: 100%; text-align: left; border-bottom: 1px solid #444; padding-bottom: 3px; }
        .palette-group { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-start; width: 100%; margin-bottom: 5px; }
        .palette-btn { width: 30px; height: 30px; border: 2px solid #555; border-radius: 4px; cursor: pointer; display: flex; justify-content: center; align-items: center; background-color: #111; }
        .palette-btn canvas { width: 24px; height: 24px; image-rendering: pixelated; }
        .edit-controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 5px; width: 100%; }
        .edit-controls button { padding: 6px 12px; font-size: 0.9rem; font-weight: bold; border-radius: 6px; border: 2px solid #fff; background-color: #444; color: #fff; cursor: pointer; }
        .edit-controls button:active { background-color: #666; }
        #import-json-text { width: 100%; height: 80px; min-height: 80px; flex-shrink: 0; font-size: 0.8rem; border-radius: 4px; border: 1px solid #555; background: #111; color: #fff; box-sizing: border-box; resize: none; padding: 4px; margin-bottom: 5px; }
        .edit-input { width: 100px; padding: 5px; font-size: 0.9rem; border-radius: 4px; border: 1px solid #555; background: #111; color: #fff; box-sizing: border-box; }
        .item-setting-row { display: flex; gap: 5px; align-items: center; font-size: 12px;}
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="item-area">
        <div class="item-slot used" id="item-slot-0"></div>
        <div class="item-slot used" id="item-slot-1"></div>
        <div class="item-slot used" id="item-slot-2"></div>
    </div>

    <div id="title-screen">
        <h1>たまごランド</h1>
        <div class="title-btn" id="btn-start-game">スタート</div>
        <div class="title-btn" id="btn-edit-mode">エディット</div>
        <div class="title-btn" id="btn-show-notes">リリースノート</div>
    </div>
    
    <div id="stage-select-screen">
        <h2>ステージ選択</h2>
        <div id="worlds-container"></div>
        <div id="btn-back-title">タイトルへ戻る</div>
    </div>
    
    <dialog id="notes-dialog">
        <h2 style="margin-top:0;">リリースノート</h2>
        <ul style="padding-left:20px; line-height: 1.6;">
            <li>溶岩マス、および「溶岩の上の橋」を追加しました（橋は2回の通行で溶岩に戻ります）。</li>
            <li>溶岩に卵を落とした場合、1回の通行で卵が沈むように仕様を調整しました。</li>
            <li>ゲームパッド（コントローラー）操作に対応しました。</li>
        </ul>
        <div style="text-align: right; margin-top: 20px;">
            <button id="btn-close-notes" style="padding: 5px 15px;">閉じる</button>
        </div>
    </dialog>

    <div id="ui-area">
        <div class="status-bar"><div id="message">Loading...</div><div id="shots-disp">Shots: <span id="shots">0</span></div></div>
        <div class="dpad">
            <div class="btn" id="btn-up" data-dir="up"></div>
            <div class="btn" id="btn-down" data-dir="down"></div>
            <div class="btn" id="btn-left" data-dir="left"></div>
            <div class="btn" id="btn-right" data-dir="right"></div>
        </div>
        <div id="btn-use-item">ITEM</div>
        <div id="btn-sub-menu"></div> <div id="btn-retry">RETRY</div>
        <div id="btn-shot">SHOT</div>
    </div>

    <div id="edit-ui">
        <div class="edit-tabs">
            <div class="edit-tab active" data-target="tab-palette">パレット</div>
            <div class="edit-tab" data-target="tab-items">アイテム</div>
            <div class="edit-tab" data-target="tab-save-load">保存／読込</div>
            <div class="edit-tab" data-target="tab-general">総合</div>
        </div>
        <div id="tab-palette" class="tab-content active"><div id="palette-container" style="width:100%;"></div></div>
        <div id="tab-items" class="tab-content">
            <div style="font-size:12px; font-weight:bold; margin-bottom:5px;">アイテム設定</div>
            <div id="edit-items-container"></div>
        </div>
        <div id="tab-save-load" class="tab-content">
            <textarea id="import-json-text" placeholder='{"map":...}'></textarea>
            <div class="edit-controls"><button id="btn-import-json">JSON読込</button></div>
            <hr style="width:100%; border-color:#444; margin:10px 0;">
            <div class="edit-controls">
                <input type="text" id="save-stage-name" class="edit-input" placeholder="ステージ名">
                <button id="btn-save-local">保存</button>
            </div>
            <div class="edit-controls">
                <select id="load-stage-select" class="edit-input"><option value="">--選択--</option></select>
                <button id="btn-load-local">読込</button>
            </div>
        </div>
        <div id="tab-general" class="tab-content">
            <div class="edit-controls" style="margin-bottom:10px;">
                W <input type="number" id="edit-world" class="edit-input" style="width:40px;" value="0" min="0" max="9">
                S <input type="number" id="edit-stage" class="edit-input" style="width:40px;" value="1" min="1" max="6">
                <input type="text" id="edit-music" class="edit-input" style="width:80px;" placeholder="music_id">
            </div>
            <div class="edit-controls" style="flex-direction:column; align-items:center; gap: 15px;">
                <button id="btn-edit-test" style="width:80%;">テストプレイ</button>
                <button id="btn-edit-export" style="width:80%;">JSON出力</button>
                <button id="btn-edit-exit" style="width:80%;">タイトルへ</button>
            </div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const msgDiv = document.getElementById('message');
const shotsSpan = document.getElementById('shots');

const music = loadMusic ? loadMusic(5) : { play:()=>{}, stop:()=>{} }; // Fallback if missing
let se = null;

const TILE_SIZE = 32;
canvas.width = 13 * TILE_SIZE;
canvas.height = 13 * TILE_SIZE;

// --- グローバル変数 ---
let PALETTE = {};
let SPRITES = {};
let STAGES_DATA = [];
let currentWorld = 0;
let currentStage = 1;
let gameMode = ''; 
let initTimer = 0;

let INITIAL_MAP = [];
let INITIAL_ITEMS = []; 
let state;
const input = { up: false, down: false, left: false, right: false, shot: false, item: false };

// --- ゲームパッド管理 ---
let gpState = { up: false, down: false, left: false, right: false, shot: false, item: false };

function updateGamepad() {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    let gp = null;
    for (let i = 0; i < gamepads.length; i++) {
        if (gamepads[i] && gamepads[i].connected) { gp = gamepads[i]; break; }
    }
    if (!gp) {
        gpState.up = gpState.down = gpState.left = gpState.right = false;
        return;
    }

    gpState.up = gp.buttons[12]?.pressed || gp.axes[1] < -0.5;
    gpState.down = gp.buttons[13]?.pressed || gp.axes[1] > 0.5;
    gpState.left = gp.buttons[14]?.pressed || gp.axes[0] < -0.5;
    gpState.right = gp.buttons[15]?.pressed || gp.axes[0] > 0.5;

    let currentShot = gp.buttons[0]?.pressed || gp.buttons[2]?.pressed;
    if (currentShot && !gpState.shot) input.shot = true;
    gpState.shot = currentShot;

    let currentItem = gp.buttons[1]?.pressed || gp.buttons[3]?.pressed;
    if (currentItem && !gpState.item) input.item = true;
    gpState.item = currentItem;
}

let SAVE_DATA = { cleared: {}, unlockedWorld: 0 };
let editMap = [];
let selectedEditItemId = 1;

// エディタパレット拡張（溶岩系を追加）
const EDIT_PALETTE = [
    { id: 0, sprite: 'floor_0', category: 'terrain' },
    { id: 'F1', sprite: 'floor_1', category: 'terrain' }, { id: 'F2', sprite: 'floor_2', category: 'terrain' }, { id: 'F3', sprite: 'floor_3', category: 'terrain' },
    { id: 'F4', sprite: 'floor_4', category: 'terrain' }, { id: 'F5', sprite: 'floor_5', category: 'terrain' }, { id: 'F6', sprite: 'floor_6', category: 'terrain' },
    { id: 'F7', sprite: 'floor_7', category: 'terrain' }, { id: 'F8', sprite: 'floor_8', category: 'terrain' }, { id: 'F9', sprite: 'floor_9', category: 'terrain' },
    { id: 1, sprite: 'wall_1', category: 'terrain' },
    { id: 'W0', sprite: 'wall_0', category: 'terrain' }, { id: 'W2', sprite: 'wall_2', category: 'terrain' }, { id: 'W3', sprite: 'wall_3', category: 'terrain' },
    { id: 'W4', sprite: 'wall_4', category: 'terrain' }, { id: 'W5', sprite: 'wall_5', category: 'terrain' }, { id: 'W6', sprite: 'wall_6', category: 'terrain' },
    { id: 'W7', sprite: 'wall_7', category: 'terrain' }, { id: 'W8', sprite: 'wall_8', category: 'terrain' }, { id: 'W9', sprite: 'wall_9', category: 'terrain' },
    { id: 'GS', sprite: 'grasses', category: 'terrain' }, { id: 5, sprite: 'river_1', category: 'terrain' }, { id: 6, sprite: 'lava_1', category: 'terrain' },
    { id: 'U', sprite: 'arrow_top', category: 'terrain' }, { id: 'D', sprite: 'arrow_bottom', category: 'terrain' },
    { id: 'L', sprite: 'arrow_left', category: 'terrain' }, { id: 'R', sprite: 'arrow_right', category: 'terrain' },
    
    { id: 4, sprite: 'tree', category: 'object' },
    { id: 'FL', sprite: 'flower_1', category: 'object' },
    { id: 'B1', sprite: 'floor_1', category: 'object' }, { id: 'B2', sprite: 'floor_2', category: 'object' }, // 溶岩の上の橋
    { id: 2, sprite: 'heart_normal', category: 'object' }, { id: 7, sprite: 'heart_shot', category: 'object' },
    { id: 3, sprite: 'chest_closed', unique: true, category: 'object' },
    { id: 'P', sprite: 'player_down_1', unique: true, category: 'object' },
    { id: 'F', sprite: 'framer_1', category: 'object' }, 
    
    { id: 'S', sprite: 'snakey_left', category: 'enemy' },
    { id: 'M', sprite: 'medusa_sleep', category: 'enemy' }, { id: 'DV', sprite: 'don_medosa_1', category: 'enemy' }, { id: 'DH', sprite: 'don_medosa_1', category: 'enemy' },
    { id: 'GU', sprite: 'gol_up_sleep', category: 'enemy' }, { id: 'GD', sprite: 'gol_down_sleep', category: 'enemy' },
    { id: 'GL', sprite: 'gol_left_sleep', category: 'enemy' }, { id: 'GR', sprite: 'gol_right_sleep', category: 'enemy' }
];

// --- セーブロード処理 ---
function loadGameData() {
    let data = localStorage.getItem('egger_save');
    if (data) SAVE_DATA = JSON.parse(data);
    else SAVE_DATA = { cleared: {}, unlockedWorld: 0 };
}
function saveGameData() { localStorage.setItem('egger_save', JSON.stringify(SAVE_DATA)); }

// --- モード遷移 ---
function setMode(mode) {
    gameMode = mode;
    document.getElementById('title-screen').style.display = (mode === 'title') ? 'flex' : 'none';
    document.getElementById('stage-select-screen').style.display = (mode === 'stage_select') ? 'flex' : 'none';
    document.getElementById('ui-area').style.display = (mode === 'game' || mode === 'test_play') ? 'flex' : 'none';
    document.getElementById('edit-ui').style.display = (mode === 'edit') ? 'flex' : 'none';
    
    const btnSubMenu = document.getElementById('btn-sub-menu');
    if (mode === 'test_play' || mode === 'game') {
        btnSubMenu.style.display = 'flex';
        btnSubMenu.innerHTML = mode === 'test_play' ? 'エディタに<br>戻る' : 'ステージ<br>選択';
    } else { btnSubMenu.style.display = 'none'; }
    
    if (mode === 'title') { music.stop(); } 
    else if (mode === 'stage_select') { buildStageSelectUI(); music.stop(); } 
    else if (mode === 'init') { initTimer = performance.now(); } 
    else if (mode === 'edit') { updateLoadSelect(); }
}

function buildStageSelectUI() {
    const container = document.getElementById('worlds-container');
    container.innerHTML = '';
    
    for (let w = 0; w <= SAVE_DATA.unlockedWorld; w++) {
        if (w > 9) break; 
        let row = document.createElement('div'); row.className = 'world-row';
        let label = document.createElement('div'); label.className = 'world-label'; label.innerText = `ワールド${w}`; row.appendChild(label);
        let nodes = document.createElement('div'); nodes.className = 'stage-nodes';
        
        for (let s = 1; s <= 6; s++) {
            let node = document.createElement('div'); node.className = 'stage-node';
            let stageKey = `${w}-${s}`;
            if (SAVE_DATA.cleared[stageKey]) node.classList.add('cleared');
            node.addEventListener('click', () => {
                let targetStage = STAGES_DATA.find(st => st.world === w && st.stage === s);
                if (targetStage) { currentWorld = w; currentStage = s; loadStageData(targetStage); } 
                else { alert("ステージデータがありません"); }
            });
            nodes.appendChild(node);
        }
        row.appendChild(nodes); container.appendChild(row);
    }
}

function loadStageData(stageInfo) {
    INITIAL_MAP = JSON.parse(JSON.stringify(stageInfo.map));
    INITIAL_ITEMS = stageInfo.items ? JSON.parse(JSON.stringify(stageInfo.items)) : [];
    initGame(stageInfo.stage, stageInfo.password);
    setMode('init');
}

// UIイベントリスナ
document.getElementById('btn-start-game').addEventListener('click', () => { loadGameData(); setMode('stage_select'); });
document.getElementById('btn-back-title').addEventListener('click', () => { setMode('title'); });
document.getElementById('btn-show-notes').addEventListener('click', () => document.getElementById('notes-dialog').showModal());
document.getElementById('btn-close-notes').addEventListener('click', () => document.getElementById('notes-dialog').close());

document.getElementById('btn-retry').addEventListener('pointerdown', (e) => {
    e.preventDefault(); music.stop();
    if (gameMode === 'game') {
        let targetStage = STAGES_DATA.find(st => st.world === currentWorld && st.stage === currentStage);
        if (targetStage) loadStageData(targetStage);
    } else if (gameMode === 'test_play') { startTestPlay(); }
});

document.getElementById('btn-sub-menu').addEventListener('pointerdown', (e) => {
    e.preventDefault(); music.stop();
    if (gameMode === 'test_play') setMode('edit'); else setMode('stage_select');
});

document.getElementById('btn-edit-mode').addEventListener('click', () => { initEditMap(); setEditItems([]); setMode('edit'); });
document.getElementById('btn-edit-exit').addEventListener('click', () => setMode('title'));
document.getElementById('btn-edit-test').addEventListener('click', startTestPlay);
document.getElementById('btn-edit-export').addEventListener('click', exportEditMap);

document.querySelectorAll('.edit-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.edit-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.getAttribute('data-target')).classList.add('active');
    });
});

function buildEditItemsUI() {
    const container = document.getElementById('edit-items-container');
    container.innerHTML = '';
    for(let i=0; i<3; i++) {
        let div = document.createElement('div'); div.className = 'item-setting-row';
        div.innerHTML = `${i+1}. <select id="edit-item-type-${i}" class="edit-input" style="width:100px;">
                <option value="">なし</option> <option value="arrow_top">矢印床変更</option> <option value="floor_1">橋</option> <option value="hammer">ハンマー</option>
            </select> ♡<input type="number" id="edit-item-hearts-${i}" class="edit-input" value="0" min="0" style="width:40px;">`;
        container.appendChild(div);
    }
}
function getEditItems() {
    let items = [];
    for(let i=0; i<3; i++) {
        let type = document.getElementById(`edit-item-type-${i}`).value; let h = parseInt(document.getElementById(`edit-item-hearts-${i}`).value) || 0;
        if (type) items.push({ type: type, needHearts: h });
    }
    return items;
}
function setEditItems(itemsArr) {
    for(let i=0; i<3; i++) {
        let item = (itemsArr && itemsArr[i]) ? itemsArr[i] : {type: '', needHearts: 0};

function drawIconToCanvas(spriteData, ctxCanvas) {
    if (!spriteData) return;
    const dotSize = 32 / 8;
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const colorCode = spriteData[r][c];
            if (PALETTE[colorCode]) {
                ctxCanvas.fillStyle = PALETTE[colorCode]; ctxCanvas.fillRect(c * dotSize, r * dotSize, dotSize + 0.5, dotSize + 0.5);
            }
        }
    }
}

function putEditItem(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    const tx = Math.floor(x / TILE_SIZE), ty = Math.floor(y / TILE_SIZE);
    
    if (tx < 0 || tx >= 13 || ty < 0 || ty >= 13) return;
    const item = EDIT_PALETTE.find(p => p.id === selectedEditItemId);
    if (item.unique) {
        for (let r = 0; r < 13; r++) { for (let c = 0; c < 13; c++) if (editMap[r][c] === item.id) editMap[r][c] = 0; }
    }
    editMap[ty][tx] = item.id;
}

// --- ゲームコアロジック ---
function initGame(stageNum = 1, password = "") {
    let pStartX = 12, pStartY = 20; 
    state = {
        map: [], entities: [], floatingEggs: [], projectiles: [], needle: null,
        totalHearts: 0, collectedHearts: 0, shots: 0, chestOpen: false, cleared: false, wasChestOpen: false,
        animation: { active: false, duration: 120, startTime: 0, elapsed: 0 },
        stageNum: stageNum, password: password, items: []
    };

    INITIAL_ITEMS.forEach(itm => { state.items.push({ type: itm.type, needHearts: parseInt(itm.needHearts)||0, status: 'hidden' }); });

    for (let y = 0; y < 13; y++) {
        let row = [];
        for (let x = 0; x < 13; x++) {
            let cell = INITIAL_MAP[y][x];
            if (cell === 'P') { 
                pStartX = x * 2; pStartY = y * 2; row.push(0);
            } else if (['F','S','M','DV','DH','GU','GD','GL','GR'].includes(cell)) {
                let entType = cell === 'F' ? 'framer' : cell === 'S' ? 'snakey' : cell === 'M' ? 'medusa' : (cell === 'DV' || cell === 'DH') ? 'don_medosa' : 'gol';
                let ent = { type: entType, originalType: entType, x: x * 2, y: y * 2, startX: x * 2, startY: y * 2, targetX: x * 2, targetY: y * 2, isMoving: false, awake: false, eggTimer: 0 };
                if (entType === 'don_medosa') { ent.dmAxis = (cell === 'DV') ? 'y' : 'x'; ent.dmDir = 1; } 
                else if (entType === 'gol') { ent.golDir = cell === 'GU' ? 'up' : cell === 'GD' ? 'down' : cell === 'GL' ? 'left' : 'right'; }
                state.entities.push(ent); row.push(0); 
            } else {
                if (cell === 2 || cell === 7) state.totalHearts++;
                row.push(cell);
            }
        }
        state.map.push(row);
    }
    state.player = { x: pStartX, y: pStartY, startX: pStartX, startY: pStartY, targetX: pStartX, targetY: pStartY, dir: 'down' };
    updateUI();
}

function getEntityAt(hx, hy, ignore = null) {
    for (let e of state.entities) {
        if (e === ignore) continue;
        if (Math.abs(hx - e.x) < 2 && Math.abs(hy - e.y) < 2) return e;
    }
    return null;
}

function checkMapCollision(hx, hy, isPlayer = false, dx = 0, dy = 0) {
    let isAllRiver = true, hasWater = false, hasLava = false, isHit = false;
    let currentX = hx - dx, currentY = hy - dy;

    for (let y = 0; y < 2; y++) {
        for (let x = 0; x < 2; x++) {
            let cx = hx + x, cy = hy + y;
            let tx = Math.floor(cx / 2), ty = Math.floor(cy / 2);

            if (tx < 0 || tx >= 13 || ty < 0 || ty >= 13) return { hit: true, hasRiver: false, allRiver: false };
            let tile = state.map[ty][tx];
            
            let coveredByFE = state.floatingEggs.some(fe => cx >= fe.x && cx <= fe.x + 1 && cy >= fe.y && cy <= fe.y + 1);
            let isWall = (tile === 1 || (typeof tile === 'string' && tile.startsWith('W')) || tile === 4 || (!isPlayer && (tile === 3 || tile === 2 || tile === 7)));
            
            if (isWall) {
                isHit = true; isAllRiver = false;
            } else if (tile === 5) {
                if (coveredByFE) isAllRiver = false; else hasWater = true;
            } else if (tile === 6) {
                if (coveredByFE) isAllRiver = false; else hasLava = true;
            } else if (isPlayer && (tile === 'U' || tile === 'D' || tile === 'L' || tile === 'R')) {
                let tileMinX = tx * 2, tileMaxX = tx * 2 + 1, tileMinY = ty * 2, tileMaxY = ty * 2 + 1;
                let wasOnTile = (currentX <= tileMaxX && currentX + 1 >= tileMinX && currentY <= tileMaxY && currentY + 1 >= tileMinY);
                if (!wasOnTile) {
                    if (tile === 'U' && dy === 1) isHit = true; if (tile === 'D' && dy === -1) isHit = true;
                    if (tile === 'L' && dx === 1) isHit = true; if (tile === 'R' && dx === -1) isHit = true;
                }
                isAllRiver = false;
            } else { isAllRiver = false; }
        }
    }
    
    let isWaterOrLava = hasWater || hasLava;
    let outTile = hasLava ? 6 : 5; // 溶岩と水が混ざっている場合は溶岩優先
    
    if (isAllRiver && isWaterOrLava) return { hit: true, tile: outTile, hasRiver: true, allRiver: true };
    else if (isWaterOrLava || isHit) return { hit: true, tile: outTile, hasRiver: isWaterOrLava, allRiver: false };
    return { hit: false, hasRiver: false, allRiver: false };
}

function checkDMCollision(hx, hy, dm) {
    for (let y = 0; y < 2; y++) {
        for (let x = 0; x < 2; x++) {
            let cx = hx + x, cy = hy + y;
            let tx = Math.floor(cx / 2), ty = Math.floor(cy / 2);
            if (tx < 0 || tx >= 13 || ty < 0 || ty >= 13) return true;
            let tile = state.map[ty][tx];
            let isPassableFloor = (tile === 0 || (typeof tile === 'string' && tile.match(/^F[1-9]$/)) || ['U','D','L','R','B1','b1','B2','b2'].includes(tile));
            if (!isPassableFloor) return true;
        }
    }
    if (getEntityAt(hx, hy, dm)) return true;
    return false;
}

function tryMove(dx, dy) {
    if (dy === -1) state.player.dir = 'up'; else if (dy === 1) state.player.dir = 'down';
    if (dx === -1) state.player.dir = 'left'; else if (dx === 1) state.player.dir = 'right';
    const pNextX = state.player.x + dx, pNextY = state.player.y + dy;
    if (checkMapCollision(pNextX, pNextY, true, dx, dy).hit) return false;

    const hitE = getEntityAt(pNextX, pNextY);
    if (hitE) {
        if (hitE.type === 'snakey' || hitE.type === 'medusa' || hitE.type === 'don_medosa' || hitE.type === 'gol') return false;
        if (dx !== 0 && hitE.y !== state.player.y) return false;
        if (dy !== 0 && hitE.x !== state.player.x) return false;
        let fNextX = hitE.x + dx, fNextY = hitE.y + dy;

        if (hitE.type === 'egg') {
            let nextCol = checkMapCollision(fNextX, fNextY, false, dx, dy);
            let willFloat = false;
            if (nextCol.hasRiver && !nextCol.allRiver) {
                let fNextX2 = hitE.x + dx * 2, fNextY2 = hitE.y + dy * 2;
                let nextCol2 = checkMapCollision(fNextX2, fNextY2, false, dx, dy);
                if (nextCol2.allRiver && !getEntityAt(fNextX2, fNextY2, hitE)) {
                    fNextX = fNextX2; fNextY = fNextY2; willFloat = true;
                    hitE.floatOnLava = (nextCol2.tile === 6);
                } else return false;
            } else if (nextCol.allRiver) { 
                willFloat = true; hitE.floatOnLava = (nextCol.tile === 6);
            } else if (nextCol.hit) return false;
            hitE.willFloat = willFloat;
        } else {
            if (checkMapCollision(fNextX, fNextY, false, dx, dy).hit) return false;
        }

        if (getEntityAt(fNextX, fNextY, hitE)) return false;
        hitE.startX = hitE.x; hitE.startY = hitE.y;
        hitE.targetX = fNextX; hitE.targetY = fNextY;
        hitE.isMoving = true;
    }
    state.player.startX = state.player.x; state.player.startY = state.player.y;
    state.player.targetX = pNextX; state.player.targetY = pNextY;
    return true;
}

function tryShoot() {
    if (state.shots > 0 && !state.animation.active && !state.needle && state.projectiles.length === 0) {
        state.shots--; updateUI();
        let sx = state.player.x, sy = state.player.y;
        if (state.player.dir === 'up') sy -= 1; if (state.player.dir === 'down') sy += 1;
        if (state.player.dir === 'left') sx -= 1; if (state.player.dir === 'right') sx += 1;
        state.projectiles.push({ x: sx, y: sy, dir: state.player.dir, active: true });
        if(se) se.playSE("shot");
        input.shot = false; 
    }
}

function tryUseItem() {
    if (state.player.x % 2 !== 0 || state.player.y % 2 !== 0) return;
    let itemIndex = state.items.findIndex(i => i.status === 'ready');
    if (itemIndex === -1) return;
    let itemObj = state.items[itemIndex];

    let dx = 0, dy = 0;
    if (state.player.dir === 'up') dy = -1; if (state.player.dir === 'down') dy = 1;
    if (state.player.dir === 'left') dx = -1; if (state.player.dir === 'right') dx = 1;

    let tx = Math.floor(state.player.x / 2) + dx; let ty = Math.floor(state.player.y / 2) + dy;
    if (tx < 0 || tx >= 13 || ty < 0 || ty >= 13) return;
    let tile = state.map[ty][tx];
    let success = false;

    if (itemObj.type === 'arrow_top') {
        const arrowMap = { 'U':'R', 'R':'D', 'D':'L', 'L':'U' };
        if (arrowMap[tile]) { state.map[ty][tx] = arrowMap[tile]; success = true; }
    } else if (itemObj.type === 'floor_1') {
        if (tile === 5) {
            state.map[ty][tx] = (state.player.dir === 'up' || state.player.dir === 'down') ? 'F1' : 'F2'; success = true;
        } else if (tile === 6) { // 溶岩に対して橋を使用
            state.map[ty][tx] = (state.player.dir === 'up' || state.player.dir === 'down') ? 'B1' : 'B2'; success = true;
        }
    } else if (itemObj.type === 'hammer') {
        if (tile === 1 || tile === 'W0' || tile === 'W6' || tile === 'W7' || tile === 'W8' || tile === 'W9') {
            state.map[ty][tx] = 0; success = true;
        }
    }

    if (success) {
        itemObj.status = 'used'; updateUI();
        if(se) se.playSE("use_item");
    }
    input.item = false;
}

function checkLOS(m, p, axis) {
    let minX, maxX, minY, maxY;
    if (axis === 'y') {
        minX = Math.min(m.x, p.x); maxX = Math.max(m.x, p.x) + 1.9;
        minY = Math.min(m.y, p.y) + 2; maxY = Math.max(m.y, p.y) - 0.1;
    } else {
        minY = Math.min(m.y, p.y); maxY = Math.max(m.y, p.y) + 1.9;
        minX = Math.min(m.x, p.x) + 2; maxX = Math.max(m.x, p.x) - 0.1;
    }
    if (minX > maxX || minY > maxY) return true;

    for(let ty = Math.floor(minY/2); ty <= Math.floor(maxY/2); ty++) {
        for(let tx = Math.floor(minX/2); tx <= Math.floor(maxX/2); tx++) {
            let tile = state.map[ty][tx];
            let isBlock = (tile === 1 || (typeof tile === 'string' && tile.startsWith('W')) || tile === 2 || tile === 7 || tile === 3);
            if (isBlock) return false;
        }
    }
    for(let e of state.entities) {
        if (e === m) continue;
        if (e.x + 1.9 >= minX && e.x <= maxX && e.y + 1.9 >= minY && e.y <= maxY) return false;
    }
    return true;
}

function checkEnemies() {
    if (state.needle || state.animation.active || state.cleared) return;
    let p = state.player;
    for (let e of state.entities) {
        if (!['medusa', 'don_medosa', 'gol'].includes(e.type)) continue;
        let wakeUp = false, attack = false;
        let overlapX = Math.abs(p.x - e.x), overlapY = Math.abs(p.y - e.y);

        if (e.type === 'medusa') {
            if (overlapX < 2 && checkLOS(e, p, 'y')) { wakeUp = true; if (overlapX === 0) attack = true; }
            if (overlapY < 2 && checkLOS(e, p, 'x')) { wakeUp = true; if (overlapY === 0) attack = true; }
        } else if (e.type === 'don_medosa') {
            if (overlapX < 2 && checkLOS(e, p, 'y')) { wakeUp = true; if (overlapX === 0) attack = true; }
            if (overlapY < 2 && checkLOS(e, p, 'x')) { wakeUp = true; if (overlapY === 0) attack = true; }
            if (overlapX < 2 && overlapY < 2) attack = true;
        } else if (e.type === 'gol' && state.chestOpen) {
            if (e.golDir === 'up' && overlapX === 0 && p.y < e.y && checkLOS(e, p, 'y')) attack = true;
            if (e.golDir === 'down' && overlapX === 0 && p.y > e.y && checkLOS(e, p, 'y')) attack = true;
            if (e.golDir === 'left' && overlapY === 0 && p.x < e.x && checkLOS(e, p, 'x')) attack = true;
            if (e.golDir === 'right' && overlapY === 0 && p.x > e.x && checkLOS(e, p, 'x')) attack = true;
        }
        
        e.awake = wakeUp;
        if (attack) {
            music.stop();
            if(se) se.playSE("hit");
            state.needle = { x: e.x, y: e.y, tx: p.x, ty: p.y, axis: overlapX === 0 ? 'y' : 'x', progress: 0 };
            break;
        }
    }
}

function update(timestamp) {
    if (gameMode === 'init') {
        if (timestamp - initTimer > 2000) {
            setMode(gameMode === 'test_play' ? 'test_play' : 'game');
            music.play();
        }
        return;
    }
    if (gameMode !== 'game' && gameMode !== 'test_play') return;

    if (state.needle) {
        state.needle.progress += 0.1;
        if (state.needle.progress >= 1) {
            if (gameMode === 'test_play') setMode('edit');
            else {
                let targetStage = STAGES_DATA.find(st => st.world === currentWorld && st.stage === currentStage);
                if (targetStage) loadStageData(targetStage);
            }
        }
        return;
    }

    if (state.cleared) return;

    if (state.chestOpen && !state.wasChestOpen) {
        state.entities.forEach(e => { if (e.originalType === 'gol' && e.type === 'egg') e.type = 'gol'; });
        state.wasChestOpen = true;
    }

    for (let i = state.projectiles.length - 1; i >= 0; i--) {
        let p = state.projectiles[i];
        if (p.dir === 'up') p.y -= 1; else if (p.dir === 'down') p.y += 1;
        else if (p.dir === 'left') p.x -= 1; else if (p.dir === 'right') p.x += 1;

        let inPlayer = Math.abs(p.x - state.player.x) < 2 && Math.abs(p.y - state.player.y) < 2;

        let hitHeart = false;
        for (let y = 0; y < 2; y++) {
            for (let x = 0; x < 2; x++) {
                let tx = Math.floor((p.x + x) / 2), ty = Math.floor((p.y + y) / 2);
                if (tx >= 0 && tx < 13 && ty >= 0 && ty < 13) {
                    let tile = state.map[ty][tx];
                    if (tile === 2 || tile === 7) hitHeart = true;
                }
            }
        }

        if (p.x < 0 || p.x > 24 || p.y < 0 || p.y > 24 || (!inPlayer && checkMapCollision(p.x, p.y, false).hit) || hitHeart) {
            state.projectiles.splice(i, 1); continue;
        }
        
        let hitE = getEntityAt(p.x, p.y);
        if (hitE) {
            let isAligned = false;
            if ((p.dir === 'up' || p.dir === 'down') && p.x === hitE.x) isAligned = true;
            if ((p.dir === 'left' || p.dir === 'right') && p.y === hitE.y) isAligned = true;

            if (isAligned) {
                if (hitE.type === 'snakey' || (hitE.type === 'gol' && !state.chestOpen)) { 
                    hitE.type = 'egg'; hitE.eggTimer = 16; 
                } else if (hitE.type === 'egg') {
                    state.entities = state.entities.filter(e => e !== hitE);
                }
            }
            state.projectiles.splice(i, 1);
        }
    }

    if (!state.animation.active) {
        let anyMoved = false, playerDidMove = false;

        if (input.shot) { tryShoot(); } 
        else if (input.item) { tryUseItem(); } 
        else {
            let dx = 0, dy = 0;
            if (input.up || gpState.up) dy -= 1; else if (input.down || gpState.down) dy += 1;
            else if (input.left || gpState.left) dx -= 1; else if (input.right || gpState.right) dx += 1;
            if (dx !== 0 || dy !== 0) { if (tryMove(dx, dy)) { anyMoved = true; playerDidMove = true; } }
        }

        let dmDidMove = false;
        for (let e of state.entities) {
            if (e.type === 'don_medosa') {
                let eDx = e.dmAxis === 'x' ? e.dmDir : 0; let eDy = e.dmAxis === 'y' ? e.dmDir : 0;
                if (checkDMCollision(e.x + eDx, e.y + eDy, e)) {
                    e.dmDir *= -1; eDx = e.dmAxis === 'x' ? e.dmDir : 0; eDy = e.dmAxis === 'y' ? e.dmDir : 0;
                    if (checkDMCollision(e.x + eDx, e.y + eDy, e)) { eDx = 0; eDy = 0; }
                }
                if (eDx !== 0 || eDy !== 0) {
                    e.startX = e.x; e.startY = e.y; e.targetX = e.x + eDx; e.targetY = e.y + eDy;
                    e.isMoving = true; dmDidMove = true; anyMoved = true;
                }
            }
        }

        if (anyMoved) {
            if (!playerDidMove && dmDidMove) {
                state.player.startX = state.player.x; state.player.targetX = state.player.x;
                state.player.startY = state.player.y; state.player.targetY = state.player.y;
            }
            state.animation.active = true; state.animation.elapsed = 0; state.animation.startTime = timestamp;
        }
    }

    if (state.animation.active) {
        if (state.animation.startTime === 0) state.animation.startTime = timestamp;
        const elapsed = timestamp - state.animation.startTime;
        state.animation.elapsed = elapsed;
        
        if (elapsed >= state.animation.duration) {
            state.player.x = state.player.targetX; state.player.y = state.player.targetY;
            
            /*
            // 溶岩の上の橋の崩落処理 (プレイヤーが完全な1マスから移動した場合)
            let oldTx = Math.floor(state.player.startX / 2);
            let oldTy = Math.floor(state.player.startY / 2);
            let newTx = Math.floor(state.player.x / 2);
            let newTy = Math.floor(state.player.y / 2);
            if (oldTx !== newTx || oldTy !== newTy) {
                let oldTile = state.map[oldTy][oldTx];
                if (oldTile === 'B1') state.map[oldTy][oldTx] = 'b1';
                else if (oldTile === 'b1') state.map[oldTy][oldTx] = 6; // 溶岩に戻る
                else if (oldTile === 'B2') state.map[oldTy][oldTx] = 'b2';
                else if (oldTile === 'b2') state.map[oldTy][oldTx] = 6; // 溶岩に戻る
            }
            */

            // ★追加：ぴったり乗っていたマスから、半マス離れた瞬間に橋を劣化させる
            if (state.player.startX % 2 === 0 && state.player.startY % 2 === 0) {
                let oldTx = Math.floor(state.player.startX / 2);
                let oldTy = Math.floor(state.player.startY / 2);
                
                // 開始座標から移動している（＝半マス踏み出した）場合
                if (state.player.x !== state.player.startX || state.player.y !== state.player.startY) {
                    let oldTile = state.map[oldTy][oldTx];
                    if (oldTile === 'B1') state.map[oldTy][oldTx] = 'b1';
                    else if (oldTile === 'b1') state.map[oldTy][oldTx] = 6; // 溶岩に戻る
                    else if (oldTile === 'B2') state.map[oldTy][oldTx] = 'b2';
                    else if (oldTile === 'b2') state.map[oldTy][oldTx] = 6; // 溶岩に戻る
                }
            }
            

            for (let i = state.entities.length - 1; i >= 0; i--) {
                let e = state.entities[i];
                if (e.isMoving) {
                    e.x = e.targetX; e.y = e.targetY; e.isMoving = false;
                    if (e.type === 'egg') {
                        e.eggTimer -= 1; 
                        if (e.eggTimer <= 0) e.type = e.originalType;
                        if (e.willFloat) {
                            state.floatingEggs.push({ x: e.x, y: e.y, walks: e.floatOnLava ? 1 : 2, objOn: false });
                            state.entities.splice(i, 1);
                        }
                    }
                }
            }
            state.animation.active = false;
            
            for (let i = state.floatingEggs.length - 1; i >= 0; i--) {
                let fe = state.floatingEggs[i];
                let hasObjOn = false;
                if (state.player.x === fe.x && state.player.y === fe.y) hasObjOn = true;
                
                if (hasObjOn && !fe.objOn) { fe.objOn = true; fe.walks--; } 
                else if (!hasObjOn && fe.objOn) {
                    fe.objOn = false;
                    if (fe.walks <= 0) state.floatingEggs.splice(i, 1);
                }
            }

            checkEnemies();
            
            if (!state.needle) {
                if (state.player.x % 2 === 0 && state.player.y % 2 === 0) {
                    const tx = state.player.x / 2, ty = state.player.y / 2;
                    if (tx >= 0 && tx < 13 && ty >= 0 && ty < 13) {
                        const tile = state.map[ty][tx];

                        /*
                        // ★追加：橋の上の通行判定（完全にマスに乗った時点で劣化・崩落）
                        if (tile === 'B1') state.map[ty][tx] = 'b1';
                        else if (tile === 'b1') state.map[ty][tx] = 6; // 溶岩に戻る
                        else if (tile === 'B2') state.map[ty][tx] = 'b2';
                        else if (tile === 'b2') state.map[ty][tx] = 6; // 溶岩に戻る
                        */

                        if (tile === 2 || tile === 7) {
                            state.map[ty][tx] = 0; state.collectedHearts++;
                            if (tile === 7) state.shots++;
                            if(se) se.playSE("pickup_1");
                            
                            state.items.forEach(itm => {
                                if (itm.status === 'hidden' && state.collectedHearts >= itm.needHearts) {
                                    itm.status = 'ready'; 
                                    if(se) se.playSE("get_item");
                                }
                            });

                            updateUI();
                            if (state.collectedHearts >= state.totalHearts) { 
                                state.chestOpen = true; updateUI(); 
                                if(se) se.playSE("open_box");
                            }
                        } else if (tile === 3 && state.chestOpen && !state.cleared) {
                            state.map[ty][tx] = 0; state.cleared = true; updateUI();
                            music.stop();
                            if(se) se.playSE("get_box");

                            if (gameMode === 'game') {
                                let stageKey = `${currentWorld}-${currentStage}`;
                                SAVE_DATA.cleared[stageKey] = true;
                                
                                let clearCount = 0;
                                for (let s = 1; s <= 6; s++) { if (SAVE_DATA.cleared[`${currentWorld}-${s}`]) clearCount++; }
                                if (clearCount >= 4 && SAVE_DATA.unlockedWorld === currentWorld) {
                                    SAVE_DATA.unlockedWorld = Math.min(9, currentWorld + 1);
                                }
                                saveGameData();
                            }

                            setTimeout(() => {
                                if (gameMode === 'test_play') {
                                    setMode('edit');
                                } else {
                                    let nextStage = STAGES_DATA.find(st => st.world === currentWorld && st.stage === currentStage + 1);
                                    if (nextStage) {
                                        currentStage++; loadStageData(nextStage);
                                    } else {
                                        setMode('stage_select'); 
                                    }
                                }
                            }, 1000);
                        }
                    }
                }
            }
        }
    }
}

function drawSprite(spriteData, cx, cy, scale) {
    if (!spriteData) return;
    const dotSize = scale / 8;
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const colorCode = spriteData[r][c];
            if (PALETTE[colorCode]) {
                ctx.fillStyle = PALETTE[colorCode];
                ctx.fillRect(cx + c * dotSize, cy + r * dotSize, dotSize + 0.5, dotSize + 0.5);
            }
        }
    }
}

function drawEditMode() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < 13; y++) {
        for (let x = 0; x < 13; x++) {
            const cell = editMap[y][x];
            const px = x * TILE_SIZE, py = y * TILE_SIZE;
            drawSprite(SPRITES.floor_0, px, py, TILE_SIZE);
            
            // 溶岩橋の場合は下に溶岩を描画
            if (cell === 6 || ['B1','b1','B2','b2'].includes(cell)) drawSprite(SPRITES.lava_1, px, py, TILE_SIZE);
            
            const item = EDIT_PALETTE.find(p => p.id === cell);
            if (item && item.id !== 0 && item.id !== 6) drawSprite(SPRITES[item.sprite], px, py, TILE_SIZE);
            ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1; ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
        }
    }
}

function draw(timestamp) {
    if (gameMode === 'title' || gameMode === 'stage_select') return;
    if (gameMode === 'edit') { drawEditMode(); return; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameMode === 'init') {
        for (let y = 0; y < 13; y++) {
            for (let x = 0; x < 13; x++) drawSprite(SPRITES.floor_0, x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE);
        }
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.shadowColor = 'black'; ctx.shadowBlur = 4; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
        let displayStr = gameMode === 'test_play' ? "TEST PLAY" : `WORLD ${currentWorld} - STAGE ${currentStage}`;
        ctx.fillText(displayStr, canvas.width / 2, canvas.height / 2);
        ctx.shadowColor = 'transparent'; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
        return;
    }

    if (!state) return; 

    let prog = state.animation.active ? Math.min(1, state.animation.elapsed / state.animation.duration) : 0;
    let time = timestamp || 0;
    let riverSeq = Math.floor(time / 300) % 4; 
    let riverFrame = riverSeq === 0 ? 1 : (riverSeq === 1 ? 2 : (riverSeq === 2 ? 3 : 2));
    
    // 溶岩はゆっくりとしたアニメーション(500ms周期)
    let lavaFrame = (Math.floor(time / 500) % 3) + 1;
    let fFrame = Math.floor(time / 500) % 2 + 1;

    for (let y = 0; y < 13; y++) {
        for (let x = 0; x < 13; x++) {
            const tile = state.map[y][x];
            const px = x * TILE_SIZE, py = y * TILE_SIZE;
            
            let floorSprite = SPRITES.floor_0;
            if (tile === 0 || (typeof tile === 'string' && tile.match(/^F[1-9]$/))) {
                floorSprite = SPRITES[tile === 0 ? 'floor_0' : `floor_${tile[1]}`];
                drawSprite(floorSprite, px, py, TILE_SIZE);
            } else {
                drawSprite(SPRITES.floor_0, px, py, TILE_SIZE);
                
                // 溶岩および溶岩橋の背景
                if (tile === 6 || ['B1','b1','B2','b2'].includes(tile)) drawSprite(SPRITES[`lava_${lavaFrame}`], px, py, TILE_SIZE);
                
                if (tile === 1) drawSprite(SPRITES.wall_1, px, py, TILE_SIZE);
                if (typeof tile === 'string' && tile.startsWith('W')) drawSprite(SPRITES[`wall_${tile[1]}`], px, py, TILE_SIZE);
                if (tile === 4) drawSprite(SPRITES.tree, px, py, TILE_SIZE);
                if (tile === 5) drawSprite(SPRITES[`river_${riverFrame}`], px, py, TILE_SIZE);
                
                if (tile === 'B1') drawSprite(SPRITES.floor_1, px, py, TILE_SIZE);
                if (tile === 'b1') drawSprite(SPRITES.floor_1_broken, px, py, TILE_SIZE);
                if (tile === 'B2') drawSprite(SPRITES.floor_2, px, py, TILE_SIZE);
                if (tile === 'b2') drawSprite(SPRITES.floor_2_broken, px, py, TILE_SIZE);
                
                if (tile === 'GS') drawSprite(SPRITES.grasses, px, py, TILE_SIZE);
                if (tile === 'FL') drawSprite(SPRITES[`flower_${fFrame}`], px, py, TILE_SIZE);
                if (tile === 'U') drawSprite(SPRITES.arrow_top, px, py, TILE_SIZE);
                if (tile === 'D') drawSprite(SPRITES.arrow_bottom, px, py, TILE_SIZE);
                if (tile === 'L') drawSprite(SPRITES.arrow_left, px, py, TILE_SIZE);
                if (tile === 'R') drawSprite(SPRITES.arrow_right, px, py, TILE_SIZE);
                if (tile === 2) drawSprite(SPRITES.heart_normal, px, py, TILE_SIZE);
                if (tile === 7) drawSprite(SPRITES.heart_shot, px, py, TILE_SIZE);
                if (tile === 3) drawSprite(state.chestOpen ? SPRITES.chest_open : SPRITES.chest_closed, px, py, TILE_SIZE);
            }
        }
    }

    for (let fe of state.floatingEggs) {
        // 溶岩の場合は egg_sink をすぐ表示する等も可能ですが、共通で処理
        let spriteName = fe.walks <= 1 ? 'egg_sink' : 'egg';
        drawSprite(SPRITES[spriteName], fe.x * (TILE_SIZE/2), fe.y * (TILE_SIZE/2), TILE_SIZE);
    }

    for (let e of state.entities) {
        let fx = e.x, fy = e.y;
        if (state.animation.active && e.isMoving) {
            fx = e.startX + (e.targetX - e.startX) * prog;
            fy = e.startY + (e.targetY - e.startY) * prog;
        }
        const px = fx * (TILE_SIZE/2), py = fy * (TILE_SIZE/2);
        
        if (e.type === 'framer') drawSprite(SPRITES[`framer_${fFrame}`], px, py, TILE_SIZE);
        if (e.type === 'snakey') {
            let sSprite = state.chestOpen ? SPRITES[`snakey_happy_${Math.floor(time / 250) % 2 + 1}`] : ((state.player.x < e.x) ? SPRITES['snakey_left'] : SPRITES['snakey_right']);
            drawSprite(sSprite, px, py, TILE_SIZE);
        }
        if (e.type === 'medusa') drawSprite(e.awake ? SPRITES.medusa_awake : SPRITES.medusa_sleep, px, py, TILE_SIZE);
        if (e.type === 'don_medosa') drawSprite(SPRITES[`don_medosa_${fFrame}`], px, py, TILE_SIZE);
        if (e.type === 'gol') drawSprite(SPRITES[`gol_${e.golDir}_${state.chestOpen ? 'awake' : 'sleep'}`], px, py, TILE_SIZE);
        if (e.type === 'egg') {
            drawSprite(SPRITES.egg, px, py, TILE_SIZE);
            let text = Math.ceil(e.eggTimer).toString();
            let textX = px + TILE_SIZE - 18, textY = py + TILE_SIZE - 4;
            ctx.font = 'bold 14px sans-serif'; ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.strokeText(text, textX, textY);
            ctx.fillStyle = '#0000ff'; ctx.fillText(text, textX, textY);
        }
    }

    for (let p of state.projectiles) drawSprite(SPRITES.bullet, p.x * (TILE_SIZE/2), p.y * (TILE_SIZE/2), TILE_SIZE);

    let px = state.player.x, py = state.player.y;
    if (state.animation.active) {
        px = state.player.startX + (state.player.targetX - state.player.startX) * prog;
        py = state.player.startY + (state.player.targetY - state.player.startY) * prog;
    }
    let pFrame = Math.floor(time / 250) % 2 + 1;
    drawSprite(SPRITES[`player_${state.player.dir}_${pFrame}`], px * (TILE_SIZE/2), py * (TILE_SIZE/2), TILE_SIZE);

    if (state.needle) {
        let n = state.needle;
        let nx = n.x + (n.tx - n.x) * n.progress;
        let ny = n.y + (n.ty - n.y) * n.progress;
        drawSprite(n.axis === 'x' ? SPRITES.needle_h : SPRITES.needle_v, nx * (TILE_SIZE/2), ny * (TILE_SIZE/2), TILE_SIZE);
    }
}

function loop(timestamp) { 
    updateGamepad();
    update(timestamp); 
    draw(timestamp); 
    requestAnimationFrame(loop); 
}
bootGame();
</script>
