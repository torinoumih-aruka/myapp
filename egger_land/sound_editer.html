<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>mml studio</title>
<style>
  :root {
    --c-tr1: #88ccff;
    --c-tr2: #88ff88;
    --c-tr3: #ff88cc;
    --c-tr4: #ffcc88;
    
    --bg-base: #1e1e1e;
    --bg-panel: #2d2d2d;
    --bg-input: #111;
    --border-color: #555;
    --text-main: #f0f0f0;
    --text-dark: #222;
  }
  
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100dvh;
    background: var(--bg-base); color: var(--text-main);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column;
  }
  
  .title-bar {
    padding: 2px 6px; background: #000; border-bottom: 1px solid var(--border-color);
    font-size: 0.8rem; font-weight: bold;
  }
  
  .toolbar {
    display: flex; gap: 4px; padding: 4px 6px; align-items: center; flex-wrap: wrap;
    background: var(--bg-panel); border-bottom: 1px solid var(--border-color);
  }
  
  button, select, input[type="text"], input[type="number"], textarea {
    background: #444; color: var(--text-main);
    border: 1px solid var(--border-color); border-radius: 4px; padding: 4px 6px; font-size: 0.75rem;
    cursor: pointer; transition: opacity 0.2s;
  }
  button:active { background: #666; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  input[type="text"], input[type="number"], textarea { background: var(--bg-input); cursor: text; }
  
  .btn-blue { background: #2a5a8a; border-color: #3a7aba; }
  .btn-blue:active:not(:disabled) { background: #3a7aba; }
  .btn-yellow { background: #8a7a2a; border-color: #baa23a; }
  .btn-yellow.active { background: #baa23a; color: #000; }
  
  .track-tabs { display: flex; gap: 2px; padding: 4px 6px 0; background: var(--bg-panel); }
  .tab-item { display: flex; align-items: center; border: 1px solid var(--border-color); border-bottom: none; border-radius: 4px 4px 0 0; background: #222; overflow: hidden; }
  .track-tab { padding: 4px 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
  
  .tab-item[data-idx="0"] .track-tab.active { background: var(--c-tr1); color: var(--text-dark); }
  .tab-item[data-idx="1"] .track-tab.active { background: var(--c-tr2); color: var(--text-dark); }
  .tab-item[data-idx="2"] .track-tab.active { background: var(--c-tr3); color: var(--text-dark); }
  .tab-item[data-idx="3"] .track-tab.active { background: var(--c-tr4); color: var(--text-dark); }
  .mute-check { margin: 0 4px; cursor: pointer; accent-color: #ffaa00; }

  .editor-layout {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: 1fr 18px;
    grid-template-rows: 1fr 24px 40px 18px;
    overflow: hidden; padding: 2px; gap: 2px;
  }

  .piano-roll-container { grid-column: 1; grid-row: 1; background: #141f2a; position: relative; overflow: hidden; border: 1px solid var(--border-color); transition: background-color 0.2s;}
  
  .vol-menu {
    grid-column: 1; grid-row: 2;
    display: flex; align-items: center; gap: 15px; padding: 0 8px;
    background: #222; border: 1px solid var(--border-color); border-bottom: none; font-size: 0.75rem;
  }
  
  .volume-container { grid-column: 1; grid-row: 3; background: #141f2a; position: relative; overflow: hidden; border: 1px solid var(--border-color); transition: background-color 0.2s;}
  
  canvas { display: block; touch-action: none; cursor: crosshair; }

  .scroll-y-wrapper { grid-column: 2; grid-row: 1; overflow-y: scroll; overflow-x: hidden; scrollbar-color: #888 #333; scrollbar-width: thin; }
  .scroll-x-wrapper { grid-column: 1; grid-row: 4; overflow-x: scroll; overflow-y: hidden; scrollbar-color: #888 #333; scrollbar-width: thin; }
  
  .scroll-y-wrapper::-webkit-scrollbar, .scroll-x-wrapper::-webkit-scrollbar { width: 14px; height: 14px; }
  .scroll-y-wrapper::-webkit-scrollbar-track, .scroll-x-wrapper::-webkit-scrollbar-track { background: #333; border-radius: 7px; }
  .scroll-y-wrapper::-webkit-scrollbar-thumb, .scroll-x-wrapper::-webkit-scrollbar-thumb { background: #888; border-radius: 7px; }
  
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-content {
    background: var(--bg-panel); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color);
    min-width: 300px; max-width: 95%; max-height: 95%; overflow-y: auto;
  }
  .modal-title { font-weight: bold; margin-bottom: 10px; font-size: 0.9rem; border-bottom: 1px solid #444; padding-bottom: 4px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
  
  .setting-row { display: flex; align-items: center; margin-bottom: 8px; gap: 6px; }
  .setting-label { width: 90px; font-size: 0.8rem; }
  
  .env-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; text-align: center; }
  .env-table th { padding: 2px; font-weight: normal; color: #aaa; }
  .env-table td { padding: 2px; }
  .env-table input[type="number"] { width: 40px; text-align: center; padding: 2px; }
  .env-table select { width: 70px; padding: 2px; }
</style>
</head>
<body>

<div class="title-bar">mml studio - [<span id="dispTitle">new music</span>]</div>

<div class="toolbar">
  <label style="display:flex; align-items:center; gap:2px; font-size:0.75rem; cursor:pointer;">
    <input type="checkbox" id="chkLoop" checked style="margin:0; cursor:pointer;"> Loop
  </label>
  <button id="btnPlay" class="btn-blue">PLAY</button>
  <button id="btnStop" class="btn-blue">STOP</button>
  <button id="btnSave" class="btn-blue">SAVE</button>
  <button id="btnLoad" class="btn-blue">LOAD</button>
  <button id="btnImp" class="btn-blue">IMP</button>
  <button id="btnExp" class="btn-blue">EXP</button>
  <button id="btnSettings">⚙</button>
</div>

<div class="toolbar">
  <select id="valNoteType">
    <option value="96">全音符</option>
    <option value="48">2分音符</option>
    <option value="24" selected>4分音符</option>
    <option value="16">4分3連符</option>
    <option value="12">8分音符</option>
    <option value="8">8分3連符</option>
    <option value="6">16分音符</option>
    <option value="4">16分3連符</option>
  </select>
  <button id="btnMode" class="btn-yellow">配置モード(1)</button>
  <button id="btnUd" class="btn-blue" disabled>Ud</button>
  <button id="btnRd" class="btn-blue" disabled>Rd</button>
  <button id="btnCopyPaste" class="btn-blue">コピペ</button>
</div>

<div class="track-tabs">
  <div class="tab-item" data-idx="0">
    <div class="track-tab active" data-track="0">1</div>
    <input type="checkbox" class="mute-check" data-track="0" checked>
  </div>
  <div class="tab-item" data-idx="1">
    <div class="track-tab" data-track="1">2</div>
    <input type="checkbox" class="mute-check" data-track="1" checked>
  </div>
  <div class="tab-item" data-idx="2">
    <div class="track-tab" data-track="2">3</div>
    <input type="checkbox" class="mute-check" data-track="2" checked>
  </div>
  <div class="tab-item" data-idx="3">
    <div class="track-tab" data-track="3">N</div>
    <input type="checkbox" class="mute-check" data-track="3" checked>
  </div>

  <div style="margin-left: auto; display: flex; align-items: center; gap: 4px; padding-right: 8px;">
    <span style="font-size:0.75rem;">横</span>
    <select id="valZoomX" style="height: 22px; padding: 0 4px; margin-right: 6px;">
      <option value="10">10%</option>
      <option value="25">25%</option>
      <option value="50">50%</option>
      <option value="75">75%</option>
      <option value="100" selected>100%</option>
      <option value="150">150%</option>
      <option value="200">200%</option>
    </select>
    <span style="font-size:0.75rem;">縦</span>
    <select id="valZoomY" style="height: 22px; padding: 0 4px;">
      <option value="50">50%</option>
      <option value="100" selected>100%</option>
      <option value="200">200%</option>
    </select>
  </div>
</div>

<div class="editor-layout">
  <div class="piano-roll-container" id="rollWrapper"><canvas id="pianoCanvas"></canvas></div>
  <div class="scroll-y-wrapper" id="scrollYWrapper"><div id="scrollYInner" style="width: 1px;"></div></div>
  
  <div class="vol-menu" id="volMenu">
    <span style="font-weight: bold;">Volume</span>
    <label style="cursor:pointer;"><input type="checkbox" id="chkVolLock"> ロック</label>
    <label style="cursor:pointer;"><input type="checkbox" id="chkVolSnap"> 10%スナップ</label>
  </div>
  
  <div class="volume-container" id="volWrapper"><canvas id="volumeCanvas"></canvas></div>
  <div class="scroll-x-wrapper" id="scrollXWrapper"><div id="scrollXInner" style="height: 1px;"></div></div>
</div>

<div class="modal-overlay" id="modalSave"><div class="modal-content"><div class="modal-title">タイトルを入力してください</div><input type="text" id="saveTitleInput" style="width: 100%; box-sizing: border-box; padding: 6px;" value="new music"><div class="modal-actions"><button class="btnCancelModal">キャンセル</button><button id="execSave" class="btn-blue">OK</button></div></div></div>
<div class="modal-overlay" id="modalLoad"><div class="modal-content"><div class="modal-title">読み込むタイトルを選択してください</div><select id="loadSelect" style="width: 100%; padding: 6px;"></select><div class="modal-actions"><button class="btnCancelModal">キャンセル</button><button id="execLoad" class="btn-blue">OK</button></div></div></div>
<div class="modal-overlay" id="modalSettings"><div class="modal-content" style="min-width: 320px;"><div class="setting-row"><div class="setting-label">テンポ</div><input type="number" id="setTempo" value="120" min="20" max="300" style="width: 50px;"></div><div class="setting-row"><div class="setting-label">リピート</div><span>開始拍 <input type="number" id="setLoopS" value="1" min="1" style="width: 45px;"></span><span style="margin-left: 5px;">終了拍 <input type="number" id="setLoopE" value="17" min="2" style="width: 45px;"></span></div><div class="setting-row" style="border-bottom: 1px solid #444; padding-bottom: 8px;"><div class="setting-label">デフォルト音量</div><input type="number" id="setDefaultVol" value="80" min="0" max="100" style="width: 50px;"></div><div style="font-size: 0.8rem; margin-bottom: 4px;">音色 (Tr1 - Tr3)</div><table class="env-table"><tr><th></th><th>波形</th><th>Attack</th><th>Decay</th><th>Sustain</th><th>Release</th></tr><tbody id="envTbody"></tbody></table><div class="modal-actions"><button class="btnCancelModal">キャンセル</button><button id="execSettings" class="btn-blue">保存</button></div></div></div>
<div class="modal-overlay" id="modalCopy"><div class="modal-content"><div class="modal-title">コピペ</div><div class="setting-row"><div class="setting-label">コピー元</div>開始拍 <input type="number" id="copyStart" value="1" style="width:45px;"> 終了拍 <input type="number" id="copyEnd" value="5" style="width:45px;"></div><div class="setting-row" style="border-bottom: 1px solid #444; padding-bottom: 8px;"><div class="setting-label">コピー先</div>開始拍 <input type="number" id="pasteStart" value="5" style="width:45px;"></div><div style="font-size: 0.8rem; margin-bottom: 4px;">コピー対象トラック</div><div style="display: flex; gap: 8px; font-size: 0.8rem;"><label><input type="checkbox" id="chkCopyTr0" checked> Tr1</label><label><input type="checkbox" id="chkCopyTr1" checked> Tr2</label><label><input type="checkbox" id="chkCopyTr2" checked> Tr3</label><label><input type="checkbox" id="chkCopyTr3" checked> No</label></div><div style="font-size: 0.75rem; color: #f55; margin-top: 15px; background: #311; padding: 6px; border-radius: 4px;">※この操作はアンドゥで戻せません。また、コピペを行うと、いままでのアンドゥ情報が消えます。</div><div class="modal-actions"><button class="btnCancelModal">キャンセル</button><button id="execCopy" class="btn-blue">実行</button></div></div></div>
<div class="modal-overlay" id="modalImp"><div class="modal-content" style="min-width: 320px; width: 90%;"><div class="modal-title">JSONデータを貼り付けてください</div><textarea id="impTextarea" style="width: 100%; height: 150px; font-family: monospace; box-sizing: border-box; padding: 6px;" placeholder='{"title": "...", "mml_data": {...}}'></textarea><div class="modal-actions"><button class="btnCancelModal">キャンセル</button><button id="execImp" class="btn-blue">インポート</button></div></div></div>
<div class="modal-overlay" id="modalExp"><div class="modal-content"><div class="modal-title">出力する曲のタイトルを確認してください</div><input type="text" id="expTitleInput" style="width: 100%; box-sizing: border-box; padding: 6px;" value=""><div class="modal-actions"><button class="btnCancelModal">キャンセル</button><button id="execExp" class="btn-blue">OK</button></div></div></div>

<script>
const TICKS_PER_BEAT = 24;
let KEY_HEIGHT = 16;  // 縦幅を可変にするため let に変更
const TOTAL_KEYS = 72; 
const BASE_BEAT_WIDTH = 48;
const TRACK_COLORS = ['#88ccff', '#88ff88', '#ff88cc', '#ffcc88'];
const TRACK_BG_COLORS = ['#141f2a', '#142a14', '#2a1420', '#2a2014']; 
const LEFT_PAD = 40; 

const NOISE_BASE = 36; 
const DRUM_MAP = { 36: "Kick", 38: "Snar", 40: "CHH", 41: "OHH", 43: "Cras" };

let currentTitle = "new music";
let currentTempo = 120;
let loopStartBeat = 1;
let loopEndBeat = 17;
let defaultVolume = 80;

let audioCtx = null;
let noiseBuffer = null;

let currentTrack = 0;
let currentZoom = 1.0;
let snapTicks = 24;
let scrollOffsetX = 0;
let scrollOffsetY = 0;

// --- モード管理 ---
const MODE_PLACE = 1;
const MODE_MOVE  = 2;
const MODE_ERASE = 3;
let currentMode = MODE_PLACE;

const btnMode = document.getElementById('btnMode');
function updateModeUI() {
  if (currentMode === MODE_PLACE) {
    btnMode.innerText = '配置モード(1)';
    btnMode.classList.remove('active');
  } else if (currentMode === MODE_MOVE) {
    btnMode.innerText = '移動モード(2)';
    btnMode.classList.add('active');
  } else if (currentMode === MODE_ERASE) {
    btnMode.innerText = '消ゴムモード(3)';
    btnMode.classList.add('active');
  }
}
btnMode.addEventListener('click', () => {
  currentMode++;
  if (currentMode > 3) currentMode = 1;
  updateModeUI();
});

let tracksData = [
  { type: 'square50', env: {a: 0.01, d: 0.1, s: 0.5, r: 0.1}, mute: false, notes: [] },
  { type: 'square25', env: {a: 0.01, d: 0.2, s: 0.3, r: 0.2}, mute: false, notes: [] },
  { type: 'triangle', env: {a: 0.01, d: 0.0, s: 1.0, r: 0.1}, mute: false, notes: [] },
  { type: 'noise', env: {a: 0.01, d: 0.1, s: 0.0, r: 0.0}, mute: false, notes: [] }
];

tracksData[0].notes.push({ tick: 0, len: 24, pitchIdx: 36, vol: 80 });
tracksData[0].notes.push({ tick: 24, len: 24, pitchIdx: 38, vol: 80 });
tracksData[0].notes.push({ tick: 48, len: 24, pitchIdx: 40, vol: 100 });
tracksData[3].notes.push({ tick: 0, len: 12, pitchIdx: 36, vol: 90 });
tracksData[3].notes.push({ tick: 24, len: 12, pitchIdx: 38, vol: 90 });
tracksData[3].notes.push({ tick: 48, len: 12, pitchIdx: 36, vol: 90 });
tracksData[3].notes.push({ tick: 72, len: 12, pitchIdx: 43, vol: 90 });

document.addEventListener('keydown', (e) => {
  const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
  const isInput = activeTag === 'input' || activeTag === 'textarea' || (document.activeElement && document.activeElement.isContentEditable);
  if (isInput) return;

  if (e.key === 'z' || e.key === 'Z') {
    document.getElementById('btnUd').click();
  } else if (e.key === ' ') {
    e.preventDefault();
    if (isPlaying) stopSong(); else playSong();
  } else if (e.key === '1') {
    currentMode = MODE_PLACE; updateModeUI();
  } else if (e.key === '2') {
    currentMode = MODE_MOVE; updateModeUI();
  } else if (e.key === '3') {
    currentMode = MODE_ERASE; updateModeUI();
  }
});

let undoStack = [];
let redoStack = [];
function updateUndoRedoUI() {
  document.getElementById('btnUd').disabled = undoStack.length === 0;
  document.getElementById('btnRd').disabled = redoStack.length === 0;
}
function saveState() {
  const state = tracksData.map(t => ({ notes: JSON.parse(JSON.stringify(t.notes)) }));
  undoStack.push(state);
  if (undoStack.length > 10) undoStack.shift(); 
  redoStack = [];
  updateUndoRedoUI();
}
function restoreState(state) {
  state.forEach((st, idx) => { tracksData[idx].notes = JSON.parse(JSON.stringify(st.notes)); });
  render();
}
document.getElementById('btnUd').addEventListener('click', () => {
  if (undoStack.length === 0) return;
  redoStack.push(tracksData.map(t => ({ notes: JSON.parse(JSON.stringify(t.notes)) })));
  restoreState(undoStack.pop());
  updateUndoRedoUI();
});
document.getElementById('btnRd').addEventListener('click', () => {
  if (redoStack.length === 0) return;
  undoStack.push(tracksData.map(t => ({ notes: JSON.parse(JSON.stringify(t.notes)) })));
  restoreState(redoStack.pop());
  updateUndoRedoUI();
});

const pianoCanvas = document.getElementById('pianoCanvas');
const pCtx = pianoCanvas.getContext('2d');
const volCanvas = document.getElementById('volumeCanvas');
const vCtx = volCanvas.getContext('2d');

function getPxPerTick() { return (BASE_BEAT_WIDTH * currentZoom) / TICKS_PER_BEAT; }

function updateScrollBounds() {
  let maxTicks = loopEndBeat * TICKS_PER_BEAT + (TICKS_PER_BEAT * 8);
  tracksData.forEach(tr => tr.notes.forEach(n => { maxTicks = Math.max(maxTicks, n.tick + n.len + (TICKS_PER_BEAT*4)); }));
  
  const contentW = maxTicks * getPxPerTick() + LEFT_PAD;
  const contentH = TOTAL_KEYS * KEY_HEIGHT;
  const viewW = pianoCanvas.parentElement.clientWidth;
  const viewH = pianoCanvas.parentElement.clientHeight;
  
  document.getElementById('scrollXInner').style.width = Math.max(contentW, viewW) + 'px';
  document.getElementById('scrollYInner').style.height = Math.max(contentH, viewH) + 'px';
  
  const sX = document.getElementById('scrollXWrapper');
  const sY = document.getElementById('scrollYWrapper');
  scrollOffsetX = sX.scrollLeft;
  scrollOffsetY = sY.scrollTop;
}

const resizeObserver = new ResizeObserver(() => {
  pianoCanvas.width = pianoCanvas.parentElement.clientWidth;
  pianoCanvas.height = pianoCanvas.parentElement.clientHeight;
  volCanvas.width = volCanvas.parentElement.clientWidth;
  volCanvas.height = volCanvas.parentElement.clientHeight;
  updateScrollBounds(); render();
});
resizeObserver.observe(document.querySelector('.editor-layout'));

document.getElementById('scrollXWrapper').addEventListener('scroll', (e) => { scrollOffsetX = e.target.scrollLeft; render(); });
document.getElementById('scrollYWrapper').addEventListener('scroll', (e) => { scrollOffsetY = e.target.scrollTop; render(); });
document.getElementById('valNoteType').addEventListener('change', (e) => { snapTicks = parseInt(e.target.value); });

// 横・縦のズームイベント設定
document.getElementById('valZoomX').addEventListener('change', (e) => { 
  currentZoom = parseInt(e.target.value) / 100; 
  updateScrollBounds(); 
  render(); 
});
document.getElementById('valZoomY').addEventListener('change', (e) => { 
  KEY_HEIGHT = 16 * (parseInt(e.target.value) / 100); 
  updateScrollBounds(); 
  render(); 
});

function updateTrackBackground() {
  document.getElementById('rollWrapper').style.backgroundColor = TRACK_BG_COLORS[currentTrack];
  document.getElementById('volWrapper').style.backgroundColor = TRACK_BG_COLORS[currentTrack];
}

document.querySelectorAll('.track-tab').forEach((tab) => {
  tab.addEventListener('click', (e) => {
    document.querySelector('.track-tab.active').classList.remove('active');
    e.target.classList.add('active');
    currentTrack = parseInt(e.target.dataset.track);
    updateTrackBackground(); render();
  });
});
document.querySelectorAll('.mute-check').forEach((chk) => {
  chk.addEventListener('change', (e) => {
    const tr = parseInt(e.target.dataset.track);
    tracksData[tr].mute = !e.target.checked;
  });
});
document.querySelectorAll('.btnCancelModal').forEach(btn => { btn.addEventListener('click', (e) => { e.target.closest('.modal-overlay').classList.remove('show'); }); });

document.getElementById('btnCopyPaste').addEventListener('click', () => { document.getElementById('modalCopy').classList.add('show'); });
document.getElementById('execCopy').addEventListener('click', () => {
  const cStart = parseInt(document.getElementById('copyStart').value); const cEnd = parseInt(document.getElementById('copyEnd').value); const pStart = parseInt(document.getElementById('pasteStart').value);
  if(isNaN(cStart) || isNaN(cEnd) || isNaN(pStart) || cStart >= cEnd) { alert("開始拍と終了拍の設定が不正です。"); return; }
  const startTick = (cStart - 1) * TICKS_PER_BEAT; const lengthTick = (cEnd - cStart) * TICKS_PER_BEAT; const destTick = (pStart - 1) * TICKS_PER_BEAT; const deltaTick = destTick - startTick;
  [0, 1, 2, 3].forEach(i => {
    if (document.getElementById(`chkCopyTr${i}`).checked) {
      let trNotes = tracksData[i].notes.filter(n => !(n.tick >= destTick && n.tick < destTick + lengthTick));
      const srcNotes = tracksData[i].notes.filter(n => n.tick >= startTick && n.tick < startTick + lengthTick);
      srcNotes.forEach(n => { trNotes.push({ ...n, tick: n.tick + deltaTick }); });
      tracksData[i].notes = trNotes;
    }
  });
  undoStack = []; redoStack = []; updateUndoRedoUI(); document.getElementById('modalCopy').classList.remove('show'); updateScrollBounds(); render();
});

function buildExportObject(titleString) {
  const now = new Date();
  const update_date = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  const track_info = tracksData.map(t => ({ type: t.type, env: { ...t.env } }));
  const mml_data = { tracks: tracksData.map(t => ({ notes: JSON.parse(JSON.stringify(t.notes)) })), tempo: currentTempo, loopS: loopStartBeat, loopE: loopEndBeat, defaultVol: defaultVolume };
  return { title: titleString, update_date, mml_data, track_info };
}
const STORAGE_KEY = "mml_studio_music_data";

// --- エディタ操作 ---
let dragState = null; 
function getMousePos(e, canvas) { const rect = canvas.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; }

pianoCanvas.addEventListener('pointerdown', (e) => {
  pianoCanvas.setPointerCapture(e.pointerId);
  const pos = getMousePos(e, pianoCanvas);
  
  if (pos.x <= LEFT_PAD) {
    const pitchIdx = TOTAL_KEYS - 1 - Math.floor((pos.y + scrollOffsetY) / KEY_HEIGHT);
    playPreviewNote(pitchIdx);
    return;
  }

  const worldX = pos.x + scrollOffsetX - LEFT_PAD;
  if (worldX < 0) return;
  const worldY = pos.y + scrollOffsetY;
  const tick = Math.round(worldX / getPxPerTick());

  if (isPlaying) {
    seekSong(tick);
    return;
  }

  const pitchIdx = TOTAL_KEYS - 1 - Math.floor(worldY / KEY_HEIGHT);
  if (pitchIdx < 0 || pitchIdx >= TOTAL_KEYS) return;
  if (currentTrack === 3) {
    if (pitchIdx < NOISE_BASE || pitchIdx >= NOISE_BASE + 12 || !DRUM_MAP[pitchIdx]) return;
  }

  const notes = tracksData[currentTrack].notes;
  const hitNote = notes.find(n => n.pitchIdx === pitchIdx && tick >= n.tick && tick < n.tick + n.len);

  saveState();

  if (currentMode === MODE_ERASE) {
    if (hitNote) {
      tracksData[currentTrack].notes = notes.filter(n => n !== hitNote);
      render();
    } else {
      undoStack.pop(); updateUndoRedoUI();
    }
    return;
  }

  if (hitNote) {
    const pxStart = hitNote.tick * getPxPerTick();
    const pxEnd = (hitNote.tick + hitNote.len) * getPxPerTick();
    
    let isEdgeClick = false;
    let resizeMode = '';
    
    if (worldX - pxStart < 12) { isEdgeClick = true; resizeMode = 'resize-L'; }
    else if (pxEnd - worldX < 12) { isEdgeClick = true; resizeMode = 'resize-R'; }

    if (currentMode === MODE_MOVE) {
      dragState = { mode: 'move', note: hitNote, origTick: hitNote.tick, offsetTick: tick - hitNote.tick };
    } else if (currentMode === MODE_PLACE) {
      if (isEdgeClick) {
        dragState = { mode: resizeMode, note: hitNote, origTick: hitNote.tick, origLen: hitNote.len };
      }
    }
  } else {
    if (currentMode === MODE_PLACE) {
      const snapT = Math.floor(tick / snapTicks) * snapTicks;
      const overlapping = notes.filter(n => Math.max(snapT, n.tick) < Math.min(snapT + snapTicks, n.tick + n.len));
      if (overlapping.length >= 3) {
        undoStack.pop(); updateUndoRedoUI();
        return;
      }
      const newNote = { tick: snapT, len: snapTicks, pitchIdx: pitchIdx, vol: defaultVolume };
      notes.push(newNote);
      dragState = { mode: 'move', note: newNote, origTick: snapT, offsetTick: 0 };
      updateScrollBounds();
    } else {
      undoStack.pop(); updateUndoRedoUI();
    }
  }
  render();
});

pianoCanvas.addEventListener('pointermove', (e) => {
  if (!dragState) return;
  const pos = getMousePos(e, pianoCanvas);
  const worldX = pos.x + scrollOffsetX - LEFT_PAD;
  let currentTick = worldX / getPxPerTick();
  
  if (dragState.mode === 'resize-R') {
    let newEnd = Math.round(currentTick / snapTicks) * snapTicks;
    dragState.note.len = Math.max(4, newEnd - dragState.note.tick);
  } else if (dragState.mode === 'resize-L') {
    let newStart = Math.round(currentTick / snapTicks) * snapTicks;
    let endTick = dragState.origTick + dragState.origLen;
    if (newStart < endTick - 4) { dragState.note.tick = newStart; dragState.note.len = endTick - newStart; }
  } else if (dragState.mode === 'move') {
    let newStart = Math.round((currentTick - dragState.offsetTick) / snapTicks) * snapTicks;
    const worldY = pos.y + scrollOffsetY;
    const pitchIdx = TOTAL_KEYS - 1 - Math.floor(worldY / KEY_HEIGHT);
    
    if (currentTrack === 3) {
      if (DRUM_MAP[pitchIdx]) dragState.note.pitchIdx = pitchIdx;
    } else {
      if (pitchIdx >= 0 && pitchIdx < TOTAL_KEYS) dragState.note.pitchIdx = pitchIdx;
    }
    dragState.note.tick = newStart;
  }
  render();
});
pianoCanvas.addEventListener('pointerup', () => { if (dragState) { dragState = null; updateScrollBounds(); } });
pianoCanvas.addEventListener('pointercancel', () => { dragState = null; });

volCanvas.addEventListener('pointerdown', (e) => {
  if (isPlaying || document.getElementById('chkVolLock').checked) return;
  saveState(); handleVolume(e);
});
volCanvas.addEventListener('pointermove', (e) => { if (e.buttons === 1) handleVolume(e); });
function handleVolume(e) {
  if (isPlaying || document.getElementById('chkVolLock').checked) return;
  volCanvas.setPointerCapture(e.pointerId);
  const pos = getMousePos(e, volCanvas);
  const worldX = pos.x + scrollOffsetX - LEFT_PAD;
  if (worldX < 0) return;
  const tick = worldX / getPxPerTick();
  const doSnap = document.getElementById('chkVolSnap').checked;
  
  tracksData[currentTrack].notes.forEach(note => {
    if (tick >= note.tick && tick < note.tick + note.len) {
      let vol = 100 - (pos.y / volCanvas.height * 100);
      if (doSnap) vol = Math.round(vol / 10) * 10;
      note.vol = Math.max(0, Math.min(100, Math.round(vol)));
    }
  });
  render();
}

// --- 描画処理 ---
function render() {
  const w = pianoCanvas.width, h = pianoCanvas.height;
  const pxPerTick = getPxPerTick();
  
  pCtx.clearRect(0, 0, w, h);
  pCtx.save();
  pCtx.translate(-scrollOffsetX, -scrollOffsetY);
  
  for (let i = 0; i < TOTAL_KEYS; i++) {
    const y = i * KEY_HEIGHT;
    const pitchIdx = TOTAL_KEYS - 1 - i;
    if (y < scrollOffsetY - KEY_HEIGHT || y > scrollOffsetY + h) continue;
    
    if (currentTrack === 3) {
      if (pitchIdx < NOISE_BASE || pitchIdx >= NOISE_BASE + 12) {
        pCtx.fillStyle = '#050505'; pCtx.fillRect(scrollOffsetX + LEFT_PAD, y, w, KEY_HEIGHT - 1);
        continue;
      }
    }
    
    const isBlack = [1, 3, 6, 8, 10].includes(pitchIdx % 12);
    pCtx.fillStyle = isBlack ? 'rgba(255,255,255,0.02)' : 'rgba(255,255,255,0.06)';
    pCtx.fillRect(scrollOffsetX + LEFT_PAD, y, w, KEY_HEIGHT - 1);
    
    if (pitchIdx % 12 === 0) {
      pCtx.beginPath(); pCtx.setLineDash([4, 4]); pCtx.moveTo(scrollOffsetX + LEFT_PAD, y); pCtx.lineTo(scrollOffsetX + w, y);
      pCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; pCtx.stroke(); pCtx.setLineDash([]);
    }
  }

  const startTick = Math.max(0, Math.floor((scrollOffsetX - LEFT_PAD) / pxPerTick));
  const endTick = Math.ceil((scrollOffsetX + w - LEFT_PAD) / pxPerTick);
  for (let t = startTick; t <= endTick; t++) {
    if (t % (TICKS_PER_BEAT * 4) === 0) { 
      pCtx.fillStyle = 'rgba(255, 255, 255, 0.3)'; pCtx.fillRect(t * pxPerTick + LEFT_PAD, scrollOffsetY, 1, h);
    } else if (t % TICKS_PER_BEAT === 0) { 
      pCtx.fillStyle = 'rgba(255, 255, 255, 0.1)'; pCtx.fillRect(t * pxPerTick + LEFT_PAD, scrollOffsetY, 1, h);
    }
  }

  tracksData.forEach((track, idx) => {
    const isCur = (idx === currentTrack);
    track.notes.forEach(note => {
      const x = note.tick * pxPerTick + LEFT_PAD;
      const y = (TOTAL_KEYS - 1 - note.pitchIdx) * KEY_HEIGHT;
      const nw = note.len * pxPerTick;
      if (x + nw < scrollOffsetX || x > scrollOffsetX + w || y + KEY_HEIGHT < scrollOffsetY || y > scrollOffsetY + h) return;

      pCtx.fillStyle = isCur ? TRACK_COLORS[idx] : 'rgba(100,100,100,0.4)';
      pCtx.fillRect(x, y + 1, nw - 1, KEY_HEIGHT - 2);
      if (isCur) {
        pCtx.fillStyle = '#fff';
        pCtx.fillRect(x, y + 1, 3, KEY_HEIGHT - 2); pCtx.fillRect(x + nw - 4, y + 1, 3, KEY_HEIGHT - 2);
      }
    });
  });
  
  const loopStartPx = (loopStartBeat - 1) * TICKS_PER_BEAT * pxPerTick + LEFT_PAD;
  const loopEndPx = (loopEndBeat - 1) * TICKS_PER_BEAT * pxPerTick + LEFT_PAD;
  pCtx.fillStyle = 'rgba(255, 0, 0, 0.5)';
  pCtx.fillRect(loopStartPx, scrollOffsetY, 2, h);
  pCtx.fillRect(loopEndPx, scrollOffsetY, 2, h);
  
  if (isPlaying) {
    const playX = currentPlayTick * pxPerTick + LEFT_PAD;
    pCtx.fillStyle = '#ff3333';
    pCtx.fillRect(playX, scrollOffsetY, 2, h);
  }

  pCtx.fillStyle = '#1a1a1a';
  pCtx.fillRect(scrollOffsetX, scrollOffsetY, LEFT_PAD, h);
  
  // 縦の縮尺に合わせてフォントサイズと位置を動的調整
  pCtx.font = (KEY_HEIGHT < 12 ? 8 : (KEY_HEIGHT > 20 ? 12 : 10)) + "px sans-serif";
  const textYOffset = KEY_HEIGHT - Math.floor(KEY_HEIGHT / 4);

  for (let i = 0; i < TOTAL_KEYS; i++) {
    const y = i * KEY_HEIGHT;
    if (y < scrollOffsetY - KEY_HEIGHT || y > scrollOffsetY + h) continue;
    const pitchIdx = TOTAL_KEYS - 1 - i;
    
    if (currentTrack === 3) {
       if (pitchIdx >= NOISE_BASE && pitchIdx < NOISE_BASE + 12 && DRUM_MAP[pitchIdx]) {
           pCtx.fillStyle = '#444'; pCtx.fillRect(scrollOffsetX, y, LEFT_PAD, KEY_HEIGHT-1);
           pCtx.fillStyle = '#fff';
           pCtx.fillText(DRUM_MAP[pitchIdx].substring(0,4), scrollOffsetX + 4, y + textYOffset);
       }
       continue;
    }

    const isBlack = [1, 3, 6, 8, 10].includes(pitchIdx % 12);
    if (isBlack) {
        pCtx.fillStyle = '#2d2d2d'; pCtx.fillRect(scrollOffsetX, y, 24, KEY_HEIGHT - 1);
    } else {
        pCtx.fillStyle = '#eee'; pCtx.fillRect(scrollOffsetX, y, LEFT_PAD, KEY_HEIGHT - 1);
        pCtx.fillStyle = '#000';
        if (pitchIdx % 12 === 0) pCtx.fillText("C" + Math.floor(pitchIdx/12), scrollOffsetX + 20, y + textYOffset);
    }
    pCtx.fillStyle = '#000'; pCtx.fillRect(scrollOffsetX, y + KEY_HEIGHT - 1, LEFT_PAD, 1);
  }

  pCtx.restore();

  vCtx.clearRect(0, 0, volCanvas.width, volCanvas.height);
  vCtx.save(); vCtx.translate(-scrollOffsetX, 0);
  vCtx.strokeStyle = '#444'; vCtx.beginPath(); vCtx.moveTo(scrollOffsetX + LEFT_PAD, volCanvas.height/2); vCtx.lineTo(scrollOffsetX+w, volCanvas.height/2); vCtx.stroke();

  tracksData[currentTrack].notes.forEach(note => {
    const x = note.tick * pxPerTick + LEFT_PAD;
    const nw = note.len * pxPerTick;
    if (x + nw < scrollOffsetX || x > scrollOffsetX + w) return;
    const vh = (note.vol / 100) * volCanvas.height;
    const vy = volCanvas.height - vh;
    
    vCtx.fillStyle = TRACK_COLORS[currentTrack];
    vCtx.fillRect(x + 1, vy, Math.max(1, nw - 2), vh);
    vCtx.fillStyle = '#fff'; vCtx.fillRect(x + 1, vy - 2, Math.max(1, nw - 2), 4);
  });
  vCtx.restore();
}

let isPlaying = false;
let activeNodes = [];
let scheduleTimer = null;
let currentPlayTick = 0;
let nextTickTime = 0;

function createFamicomWave(ctx, type) {
  if (type.startsWith('square')) {
    const duty = { 'square12': 0.125, 'square25': 0.25, 'square50': 0.5 }[type] || 0.5;
    const real = new Float32Array(32), imag = new Float32Array(32);
    for (let i = 1; i < 32; i++) real[i] = (2 / (i * Math.PI)) * Math.sin(Math.PI * i * duty);
    return ctx.createPeriodicWave(real, imag);
  }
  return null; 
}

function initAudioIfNeeded() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (!noiseBuffer) {
    const size = audioCtx.sampleRate * 2;
    noiseBuffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
    const out = noiseBuffer.getChannelData(0);
    for (let i = 0; i < size; i++) out[i] = Math.random() * 2 - 1;
  }
}

function schedulePlaybackTrack(note, track, tIdx, sTime) {
  const secPerTick = (60 / currentTempo) / TICKS_PER_BEAT;
  const dur = note.len * secPerTick;
  const maxVol = (note.vol / 100) * 0.3;
  const gainNode = audioCtx.createGain();
  gainNode.connect(audioCtx.destination);
  
  if (tIdx === 3) {
    const p = note.pitchIdx;
    if (p === 36) { 
      const osc = audioCtx.createOscillator(); osc.type = 'sine';
      osc.frequency.setValueAtTime(150, sTime); osc.frequency.exponentialRampToValueAtTime(0.01, sTime + 0.15);
      gainNode.gain.setValueAtTime(maxVol * 2, sTime); gainNode.gain.exponentialRampToValueAtTime(0.01, sTime + 0.15);
      osc.connect(gainNode); osc.start(sTime); osc.stop(sTime + 0.15);
      activeNodes.push({ source: osc, gainNode: gainNode, endTime: sTime + 0.15 });
    } else if (p === 38) { 
      const tri = audioCtx.createOscillator(); tri.type = 'triangle';
      tri.frequency.setValueAtTime(150, sTime); tri.frequency.exponentialRampToValueAtTime(50, sTime + 0.1);
      const triGain = audioCtx.createGain();
      triGain.gain.setValueAtTime(maxVol, sTime); triGain.gain.exponentialRampToValueAtTime(0.01, sTime + 0.1);
      tri.connect(triGain); triGain.connect(gainNode);
      tri.start(sTime); tri.stop(sTime + 0.1);
      activeNodes.push({ source: tri, gainNode: triGain, endTime: sTime + 0.1 });
      
      const nSrc = audioCtx.createBufferSource(); nSrc.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 1000;
      const nGain = audioCtx.createGain();
      nGain.gain.setValueAtTime(maxVol, sTime); nGain.gain.exponentialRampToValueAtTime(0.01, sTime + 0.2);
      nSrc.connect(filter); filter.connect(nGain); nGain.connect(gainNode);
      nSrc.start(sTime); nSrc.stop(sTime + 0.2);
      activeNodes.push({ source: nSrc, gainNode: nGain, endTime: sTime + 0.2 });
    } else if (p === 40) { 
      const hSrc = audioCtx.createBufferSource(); hSrc.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 7000;
      gainNode.gain.setValueAtTime(maxVol * 0.5, sTime); gainNode.gain.exponentialRampToValueAtTime(0.01, sTime + 0.05);
      hSrc.connect(filter).connect(gainNode); hSrc.start(sTime); hSrc.stop(sTime + 0.05);
      activeNodes.push({ source: hSrc, gainNode: gainNode, endTime: sTime + 0.05 });
    } else if (p === 41) { 
      const hSrc = audioCtx.createBufferSource(); hSrc.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 7000;
      gainNode.gain.setValueAtTime(maxVol * 0.5, sTime); gainNode.gain.exponentialRampToValueAtTime(0.01, sTime + 0.3);
      hSrc.connect(filter).connect(gainNode); hSrc.start(sTime); hSrc.stop(sTime + 0.3);
      activeNodes.push({ source: hSrc, gainNode: gainNode, endTime: sTime + 0.3 });
    } else if (p === 43) { 
      const cSrc = audioCtx.createBufferSource(); cSrc.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 4000;
      gainNode.gain.setValueAtTime(maxVol * 0.8, sTime); gainNode.gain.exponentialRampToValueAtTime(0.01, sTime + 1.0);
      cSrc.connect(filter).connect(gainNode); cSrc.start(sTime); cSrc.stop(sTime + 1.0);
      activeNodes.push({ source: cSrc, gainNode: gainNode, endTime: sTime + 1.0 });
    }
  } else {
    const freq = 440 * Math.pow(2, (note.pitchIdx - 45) / 12);
    const env = track.env;
    gainNode.gain.setValueAtTime(0, sTime);
    gainNode.gain.linearRampToValueAtTime(maxVol, sTime + env.a);
    gainNode.gain.linearRampToValueAtTime(maxVol * env.s, sTime + env.a + env.d);
    gainNode.gain.setValueAtTime(maxVol * env.s, sTime + dur - env.r);
    gainNode.gain.linearRampToValueAtTime(0, sTime + dur);
    
    const osc = audioCtx.createOscillator();
    if (track.type === 'triangle') osc.type = 'triangle';
    else osc.setPeriodicWave(createFamicomWave(audioCtx, track.type));
    
    osc.frequency.value = freq;
    osc.connect(gainNode); osc.start(sTime); osc.stop(sTime + dur);
    activeNodes.push({ source: osc, gainNode: gainNode, endTime: sTime + dur + 1.0 });
  }
}

function playPreviewNote(pitchIdx) {
  if (currentTrack === 3) {
     if (pitchIdx < NOISE_BASE || pitchIdx >= NOISE_BASE + 12 || !DRUM_MAP[pitchIdx]) return;
  }
  initAudioIfNeeded();
  const track = tracksData[currentTrack];
  const dummyNote = { pitchIdx: pitchIdx, len: snapTicks, vol: defaultVolume };
  schedulePlaybackTrack(dummyNote, track, currentTrack, audioCtx.currentTime);
}

function seekSong(tick) {
  activeNodes.forEach(n => { try { n.source.stop(); } catch(e){} n.source.disconnect(); if(n.gainNode) n.gainNode.disconnect(); });
  activeNodes = [];
  currentPlayTick = Math.max(0, tick);
  nextTickTime = audioCtx.currentTime + 0.05;
}

function processNextTick() {
  const secPerTick = (60 / currentTempo) / TICKS_PER_BEAT;
  nextTickTime += secPerTick;
  currentPlayTick++;

  const isLoop = document.getElementById('chkLoop').checked;
  const loopStartTick = (loopStartBeat - 1) * TICKS_PER_BEAT;
  const loopEndTick = (loopEndBeat - 1) * TICKS_PER_BEAT;

  if (isLoop) {
    if (currentPlayTick >= loopEndTick) {
      currentPlayTick = loopStartTick;
    }
  } else {
    let maxTick = 0;
    tracksData.forEach(tr => {
      if (!tr.mute) tr.notes.forEach(n => maxTick = Math.max(maxTick, n.tick + n.len));
    });
    if (currentPlayTick >= maxTick) {
      isPlaying = false;
      setTimeout(() => { if (!isPlaying) stopSong(); }, 2000); 
    }
  }
}

function sequencerLoop() {
  if (!isPlaying) return;
  while (nextTickTime < audioCtx.currentTime + 0.1) {
    tracksData.forEach((track, tIdx) => {
      if (track.mute) return;
      track.notes.forEach(note => {
        if (note.tick === currentPlayTick) schedulePlaybackTrack(note, track, tIdx, nextTickTime);
      });
    });
    processNextTick();
    if (!isPlaying) break;
  }
  const currTime = audioCtx.currentTime;
  activeNodes = activeNodes.filter(n => n.endTime > currTime);

  render(); 
  if (isPlaying) scheduleTimer = requestAnimationFrame(sequencerLoop);
}

function playSong() {
  initAudioIfNeeded();
  stopSong(); isPlaying = true;
  document.getElementById('btnPlay').style.background = '#4a9a4a';
  document.getElementById('btnPlay').style.color = '#fff';
  currentPlayTick = 0;
  nextTickTime = audioCtx.currentTime + 0.05;
  sequencerLoop();
}

function stopSong() {
  isPlaying = false;
  if (scheduleTimer) { cancelAnimationFrame(scheduleTimer); scheduleTimer = null; }
  activeNodes.forEach(n => { try { n.source.stop(); } catch(e){} n.source.disconnect(); if(n.gainNode) n.gainNode.disconnect(); });
  activeNodes = [];
  document.getElementById('btnPlay').style.background = '';
  document.getElementById('btnPlay').style.color = '';
  render();
}

document.getElementById('btnPlay').addEventListener('click', playSong);
document.getElementById('btnStop').addEventListener('click', stopSong);

setTimeout(() => {
  updateTrackBackground();
  const sY = document.getElementById('scrollYWrapper');
  sY.scrollTop = (TOTAL_KEYS - 42) * KEY_HEIGHT - (pianoCanvas.parentElement.clientHeight / 2);
  scrollOffsetY = sY.scrollTop;
  updateScrollBounds(); render();
}, 100);
</script>
