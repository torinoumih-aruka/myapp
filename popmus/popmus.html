<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pop'n Clone V7 - Music Select</title>
    <style>
        * { letter-spacing: 0px !important; box-sizing: border-box; }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; color: #fff;
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
            overflow: hidden; touch-action: none;
        }
        .screen {
            display: none; width: 100%; height: 100%;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .active { display: flex; }
        
        h1 { font-size: 2.2rem; margin-bottom: 20px; color: #ffeb3b; text-shadow: 2px 2px 0px #e91e63; }
        button {
            padding: 15px 30px; font-size: 1.2rem; margin: 10px;
            background-color: #e91e63; color: white; border: none; border-radius: 25px;
            box-shadow: 0 4px 0 #880e4f; cursor: pointer;
            font-weight: bold;
        }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #880e4f; }

        .settings-container {
            width: 85%; max-width: 420px; background: #222; padding: 20px; border-radius: 15px; border: 2px solid #444;
            max-height: 90vh; overflow-y: auto;
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        select, input[type="number"] { padding: 6px; font-size: 0.95rem; width: 140px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; }

        /* --- Music Select Screen Styles --- */
        #screen-music-select { background: #111; justify-content: flex-start; }
        
        #song-list-container {
            width: 100%; height: 55%; overflow-y: auto; overflow-x: hidden;
            padding: 20px 0 50px 0; background: linear-gradient(135deg, #1a1a1a 0%, #000 100%);
        }
        .song-item {
            width: 80%; background: rgba(50, 50, 50, 0.8); border-left: 5px solid #555;
            margin-bottom: 15px; padding: 12px 20px; border-radius: 0 20px 20px 0;
            transition: all 0.2s ease;
        }
        .song-item.selected {
            background: linear-gradient(90deg, #e91e63, #9c27b0); border-left: 5px solid #ffeb3b;
            transform: scale(1.05); z-index: 10; box-shadow: 2px 4px 10px rgba(0,0,0,0.5);
        }
        .song-genre { font-size: 0.8rem; color: #ffeb3b; margin-bottom: 2px; }
        .song-title { font-size: 1.0rem; font-weight: bold; }
        
        #song-info-panel {
            width: 100%; height: 45%; background: #222; border-top: 3px solid #ffeb3b;
            padding: 15px; display: flex; flex-direction: column; justify-content: flex-start;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5); z-index: 20;
        }
        #song-desc { font-size: 0.85rem; color: #ddd; margin-bottom: 15px; line-height: 1.4; min-height: 2.8em; }
        .opt-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.9rem;}
        .opt-row select { width: 100px; padding: 4px; font-size: 0.9rem; }
        
        /* --- Game Screen Styles --- */
        #game-screen { position: relative; justify-content: flex-start; background: #000; }
        canvas { display: block; width: 100%; height: 85%; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 85%; pointer-events: none; }
        #gauge-container {
            width: 100%; height: 15%; background: #222; position: relative;
            display: flex; flex-direction: column; justify-content: center; align-items: center; border-top: 4px solid #444;
        }
        #gauge-bg { width: 90%; height: 25px; background: #333; border-radius: 12px; border: 2px solid #555; overflow: hidden; }
        #gauge-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #4caf50, #ffeb3b, #f44336); transition: width 0.1s; }
        .hud-text { position: absolute; z-index: 10; font-weight: bold; text-shadow: 2px 2px 2px rgba(0,0,0,0.8); }
        #score-display { top: 10px; right: 15px; font-size: 1.8rem; color: #fff; }
        #combo-display { top: 50px; right: 15px; font-size: 1.4rem; color: #ffeb3b; }
        #time-display { top: 10px; left: 15px; font-size: 1.2rem; color: #bbb; }
        #loading-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="screen-title" class="screen active">
        <h1>Pop'n Clone</h1>
        <button onclick="changeScreen('screen-music-select'); initMusicSelect();">MUSIC SELECT</button>
        <button onclick="changeScreen('screen-settings')" style="background-color: #2196f3; font-size: 1rem; padding: 10px 20px;">FREE GENERATOR</button>
    </div>

    <div id="screen-music-select" class="screen">
        <div id="song-list-container"></div>
        <div id="song-info-panel">
            <div id="song-desc"></div>
            <div class="opt-row">
                <label>ボタン</label>
                <select id="ms-buttons">
                    <option value="5">5 Buttons</option>
                    <option value="7">7 Buttons</option>
                    <option value="9" selected>9 Buttons</option>
                </select>
                <label>難易度</label>
                <select id="ms-diff">
                    <option value="normal">NORMAL</option>
                    <option value="hyper">HYPER</option>
                    <option value="ex" selected>EX</option>
                </select>
            </div>
            <div class="opt-row">
                <label>落下速度</label>
                <select id="ms-speed">
                    <option value="1">x1.0</option><option value="1.5">x1.5</option><option value="2">x2.0</option>
                    <option value="2.5" selected>x2.5</option><option value="3">x3.0</option><option value="4">x4.0</option>
                </select>
                <label>判定</label>
                <select id="ms-judge"><option value="easy">EASY</option><option value="normal" selected>NORMAL</option></select>
            </div>
            <button onclick="startMusicSelectGame()" style="width: 100%; margin: 10px 0 0 0;">PLAY</button>
        </div>
        <div id="loading-overlay"><h2 style="color:#03a9f4;">LOADING...</h2></div>
    </div>

    <div id="screen-settings" class="screen">
        <div class="settings-container">
            <h3 style="text-align: center; margin-top:0; color:#03a9f4;">FREE GENERATOR</h3>
            <div class="setting-row">
                <label>譜面傾向</label>
                <select id="set-pattern">
                    <option value="random" selected>ランダムミックス</option>
                    <option value="softrock">ソフトロックLONG風</option>
                    <option value="melt">メルトEX風</option>
                    <option value="anthem">アンセムトランス風</option>
                </select>
            </div>
            <div class="setting-row"><label>ライン数</label><select id="set-lines"><option value="5">5</option><option value="7">7</option><option value="9" selected>9</option></select></div>
            <div class="setting-row"><label>難度 (1-50)</label><input type="number" id="set-diff" value="35"></div>
            <div class="setting-row"><label>BPM</label><input type="number" id="set-bpm" value="150"></div>
            <div class="setting-row"><label>時間(秒)</label><input type="number" id="set-time" value="90"></div>
            <div class="setting-row">
                <label>落下速</label>
                <select id="set-speed">
                    <option value="1">x1.0</option><option value="1.5">x1.5</option><option value="2">x2.0</option>
                    <option value="2.5" selected>x2.5</option><option value="3">x3.0</option><option value="4">x4.0</option>
                </select>
            </div>
            <div class="setting-row"><label>判定</label><select id="set-judge"><option value="easy">EASY</option><option value="normal" selected>NORMAL</option></select></div>
            <button onclick="startFreeGame()" style="width:100%; margin: 10px 0 0 0;">START!</button>
            <button onclick="changeScreen('screen-title')" style="width:100%; margin: 10px 0 0 0; background:#555;">BACK</button>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="score-display" class="hud-text">0</div>
            <div id="combo-display" class="hud-text"></div>
            <div id="time-display" class="hud-text">0:00</div>
        </div>
        <div id="gauge-container">
            <div style="font-size: 0.8rem; margin-bottom: 4px; color: #aaa;">GROOVE GAUGE</div>
            <div id="gauge-bg"><div id="gauge-fill"></div></div>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <h1>RESULT</h1>
        <h2 id="result-score" style="font-size: 2.5rem; color: #ffeb3b;">0</h2>
        <div id="result-details" style="text-align: left; margin: 10px 0; line-height: 1.6;"></div>
        <button onclick="changeScreen('screen-title')">TITLE</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let animationId, config = {}, gameState = {}, notes = [];
    let particles = [], judgeTexts = [], activeLanes = [];
    
    // 基本9レーンカラー (白, 黄, 緑, 青, 赤, 青, 緑, 黄, 白)
    const laneColors9 = ['#ffffff', '#ffeb3b', '#4caf50', '#2196f3', '#f44336', '#2196f3', '#4caf50', '#ffeb3b', '#ffffff'];

    // --- 楽曲リストの定義 ---
    const songList = [
        {
            title: 'メルト', genre: 'メルト', file: 'melt_ex.json', bpm: 168,
            desc: "それはとろける恋心。パーキッツから爽快なポップスが届いたよ。",
            ignore7: [1, 7], ignore5: [0, 1, 7, 8]
        },
        {
            title: 'jewelry girl*', genre: 'ジュエリーロック', file: 'jlrock_ex.json', bpm: 173,
            desc: "残された想い出だけが、キラキラと輝き続ける…。ｊｕｎ新境地は、切なさ溢れるロックナンバー！",
            ignore7: [1, 7], ignore5: [0, 1, 7, 8]
        },
        {
            title: 'Votum stellarum iconoclasm', genre: 'アンセムトランス', file: 'anthem_trance_h.json', bpm: 147,
            desc: "星にかけた願いは、こうして星達の歌声となって舞い降りる。",
            ignore7: [1, 7], ignore5: [0, 1, 7, 8]
        },
        {
            title: 'チェイス！チェイス！チェイス！', genre: 'フレッシュ', file: 'fresh_ex.json', bpm: 176,
            desc: "新生活応援青春ソング。思わず口ずさんでしまうアップビートなポップチューンだよ！",
            ignore7: [1, 7], ignore5: [0, 1, 7, 8]
        }
    ];
    let selectedSongIdx = 0;

    // --- 画面遷移 ---
    function changeScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // --- ミュージックセレクトUIの構築 ---
    function initMusicSelect() {
        const container = document.getElementById('song-list-container');
        container.innerHTML = '';
        songList.forEach((song, idx) => {
            // 斜めに配置するためのオフセット計算
            const offset = 5 + (idx * 0);
            const div = document.createElement('div');
            div.className = `song-item ${idx === selectedSongIdx ? 'selected' : ''}`;
            div.style.marginLeft = `${offset}%`;
            div.innerHTML = `<div class="song-genre">${song.genre}</div><div class="song-title">${song.title}</div>`;
            div.onclick = () => selectSong(idx);
            container.appendChild(div);
        });
        updateSongInfo();
    }

    function selectSong(idx) {
        selectedSongIdx = idx;
        const items = document.querySelectorAll('.song-item');
        items.forEach((item, i) => {
            item.classList.remove('selected');
            if (i === idx) item.classList.add('selected');
        });
        updateSongInfo();
    }

    function updateSongInfo() {
        const song = songList[selectedSongIdx];
        document.getElementById('song-desc').innerText = song.desc;
    }

    // --- 譜面間引き・レーン変換処理 ---
    function processJSONChart(rawData, songDef, buttonsCount, difficultyMode) {
        let filtered = [];
        let ignoreList = [];
        if (buttonsCount === 7) ignoreList = songDef.ignore7;
        if (buttonsCount === 5) ignoreList = songDef.ignore5;

        // 除外されないレーンに新しい0からのインデックスを割り当てる
        let laneMap = {};
        let currentVisLane = 0;
        let activeColors = [];
        for (let i = 0; i < 9; i++) {
            if (!ignoreList.includes(i)) {
                laneMap[i] = currentVisLane;
                activeColors.push(laneColors9[i]);
                currentVisLane++;
            }
        }
        config.colors = activeColors; // プレイ用のレーン色を上書き

        // 1. 無効レーンを削除し、レーン番号を振り直す
        rawData.forEach(n => {
            if (!ignoreList.includes(n.l)) {
                filtered.push({ b: n.b, l: laneMap[n.l] });
            }
        });

        // 2. 難易度による間引き処理
        let thinned = [];
        let beatMap = {};
        filtered.forEach(n => {
            if (!beatMap[n.b]) beatMap[n.b] = [];
            beatMap[n.b].push(n);
        });

        for (let b in beatMap) {
            let beatVal = parseFloat(b);
            let notesAtBeat = beatMap[b];
            
            if (difficultyMode === 'ex') {
                // そのまま
                thinned.push(...notesAtBeat);
            } else if (difficultyMode === 'hyper') {
                // 同時押しを最大2つに制限
                thinned.push(...notesAtBeat.slice(0, 2));
            } else if (difficultyMode === 'normal') {
                // 8分音符(0.5刻み)のみ許可し、同時押しは単推しに
                if (beatVal % 0.5 === 0) {
                    thinned.push(notesAtBeat[0]);
                }
            }
        }
        return thinned;
    }

    // --- ゲーム開始（ミュージックセレクトから） ---
    async function startMusicSelectGame() {
        const song = songList[selectedSongIdx];
        const buttons = parseInt(document.getElementById('ms-buttons').value);
        const difficulty = document.getElementById('ms-diff').value;

        config = {
            lines: buttons,
            bpm: song.bpm, // 曲固有のBPM
            speed: parseFloat(document.getElementById('ms-speed').value),
            judgeStr: document.getElementById('ms-judge').value,
            mode: 'music-select'
        };

        const isEasy = config.judgeStr === 'easy';
        config.judgeWindows = { cool: isEasy?60:40, great: isEasy?100:70, good: isEasy?150:110, bad: isEasy?220:170 };

        document.getElementById('loading-overlay').style.display = 'flex';

        try {
            // JSONファイルの取得
            const response = await fetch(song.file);
            if (!response.ok) throw new Error("File not found");
            const rawData = await response.json();
            
            // 譜面の処理（レーン数と難易度に応じた間引き）
            const processedChart = processJSONChart(rawData, song, buttons, difficulty);
            
            notes = [];
            let maxBeat = 0;
            const beatInterval = 60000 / config.bpm;
            processedChart.forEach(n => {
                notes.push({ time: n.b * beatInterval, lane: n.l, hit: false, missed: false });
                if (n.b > maxBeat) maxBeat = n.b;
            });
            notes.sort((a, b) => a.time - b.time);
            
            // プレイ時間の自動計算
            config.duration = Math.ceil((maxBeat * beatInterval) / 1000) + 4;

            document.getElementById('loading-overlay').style.display = 'none';
            bootGame();

        } catch (err) {
            document.getElementById('loading-overlay').style.display = 'none';
            alert(`【エラー】\n${song.file} の読み込みに失敗しました。\nローカルのJSONファイルを読み込む場合、ブラウザのセキュリティ制限によりWebサーバー環境（Live Server等）経由で開く必要があります。`);
        }
    }

    // --- ゲーム開始（フリージェネレーターから） ---
    function startFreeGame() {
        config = {
            lines: parseInt(document.getElementById('set-lines').value),
            difficulty: parseInt(document.getElementById('set-diff').value),
            bpm: parseInt(document.getElementById('set-bpm').value),
            duration: parseInt(document.getElementById('set-time').value),
            speed: parseFloat(document.getElementById('set-speed').value),
            judgeStr: document.getElementById('set-judge').value,
            pattern: document.getElementById('set-pattern').value,
            mode: 'free'
        };

        const isEasy = config.judgeStr === 'easy';
        config.judgeWindows = { cool: isEasy?60:40, great: isEasy?100:70, good: isEasy?150:110, bad: isEasy?220:170 };
        
        // 色の割り当て
        if (config.lines === 5) config.colors = laneColors9.slice(2,7);
        else if (config.lines === 7) config.colors = laneColors9.slice(1,8);
        else config.colors = laneColors9;

        generateRandomNotes();
        bootGame();
    }

    // --- ランダム生成ロジック（フリー用） ---
    function generateRandomNotes() {
        notes = [];
        const beatInterval = 60000 / config.bpm;
        const totalBeats = (config.duration * config.bpm) / 60;
        
        let maxSimul = 1; 
        if (config.difficulty > 12) maxSimul = 2;
        if (config.difficulty > 24) maxSimul = 3;
        if (config.difficulty > 36) maxSimul = 4;
        if (config.difficulty > 45) maxSimul = 5;

        const allow16th = config.difficulty >= 20;
        const density = Math.min(0.95, config.difficulty / 50);

        let currentBeat = 4;

        while (currentBeat < totalBeats - 4) {
            let patternToUse = config.pattern;
            if (patternToUse === 'random') {
                const r = Math.random();
                if (r < 0.33) patternToUse = 'softrock';
                else if (r < 0.66) patternToUse = 'melt';
                else patternToUse = 'anthem';
            }

            const motifId = Math.floor(Math.random() * 4);
            let beatsUsed = 2;

            if (patternToUse === 'softrock') {
                if (motifId === 0) { 
                    let step = allow16th && density > 0.6 ? 0.25 : 0.5;
                    let len = Math.floor(4 * density) + 2;
                    for(let i=0; i<len; i++) {
                        notes.push({time: (currentBeat + i*step) * beatInterval, lane: i % config.lines, hit:false, missed:false});
                        if (maxSimul >= 2) notes.push({time: (currentBeat + i*step) * beatInterval, lane: (config.lines - 1) - (i % config.lines), hit:false, missed:false});
                    }
                    beatsUsed = len * step;
                } else if (motifId === 1) { 
                    let step = allow16th ? 0.25 : 0.5;
                    let rollLane = Math.random() > 0.5 ? 1 : config.lines - 2;
                    let len = Math.floor(8 * density) + 2;
                    for(let i=0; i<len; i++) {
                        notes.push({time: (currentBeat + i*step) * beatInterval, lane: rollLane, hit:false, missed:false});
                        if (i % 2 === 0 && maxSimul >= 2) notes.push({time: (currentBeat + i*step) * beatInterval, lane: Math.floor(config.lines/2), hit:false, missed:false});
                    }
                    beatsUsed = len * step;
                } else {
                    let step = density > 0.7 ? 0.5 : 1.0;
                    for(let i=0; i<4; i++) {
                        let base = Math.floor(config.lines/2);
                        notes.push({time: (currentBeat + i*step) * beatInterval, lane: base-1, hit:false, missed:false});
                        if(maxSimul >= 2) notes.push({time: (currentBeat + i*step) * beatInterval, lane: base+1, hit:false, missed:false});
                    }
                    beatsUsed = 4 * step;
                }
            } else if (patternToUse === 'melt') {
                if (motifId === 0) {
                    let step = allow16th ? 0.25 : 0.5;
                    let len = Math.min(config.lines, Math.floor(4 + density * 5));
                    let startLane = Math.random() > 0.5 ? 0 : config.lines - 1;
                    let dir = startLane === 0 ? 1 : -1;
                    for(let i=0; i<len; i++) notes.push({time: (currentBeat + i*step) * beatInterval, lane: startLane + i*dir, hit:false, missed:false});
                    beatsUsed = len * step;
                } else {
                    let step = allow16th && density > 0.5 ? 0.25 : 0.5;
                    let len = Math.floor(6 + density * 6);
                    let prev = Math.floor(config.lines/2);
                    for(let i=0; i<len; i++) {
                        let l;
                        do { l = Math.floor(Math.random() * config.lines); } while(l === prev);
                        notes.push({time: (currentBeat + i*step) * beatInterval, lane: l, hit:false, missed:false});
                        prev = l;
                    }
                    beatsUsed = len * step;
                }
            } else if (patternToUse === 'anthem') {
                if (motifId === 0) {
                    let pedalStep = allow16th && density > 0.8 ? 0.5 : 1.0;
                    let melodyStep = allow16th ? 0.25 : 0.5;
                    let pedalLane = Math.random() > 0.5 ? 0 : config.lines - 1;
                    for(let i=0; i<4; i++) notes.push({time: (currentBeat + i*pedalStep) * beatInterval, lane: pedalLane, hit:false, missed:false});
                    let melodyLen = Math.floor((4 * pedalStep) / melodyStep);
                    for(let i=0; i<melodyLen; i++) {
                        if(Math.random() < density) {
                            let l = Math.floor(Math.random() * (config.lines - 2)) + 1;
                            notes.push({time: (currentBeat + i*melodyStep) * beatInterval, lane: l, hit:false, missed:false});
                        }
                    }
                    beatsUsed = 4 * pedalStep;
                } else {
                    let step = 0.5;
                    let len = Math.floor(3 + density * 3);
                    let num = Math.min(maxSimul, 3);
                    for(let i=0; i<len; i++) {
                        let base = Math.floor(Math.random() * (config.lines-4));
                        notes.push({time: (currentBeat + i*step) * beatInterval, lane: base, hit:false, missed:false});
                        if(num >= 2) notes.push({time: (currentBeat + i*step) * beatInterval, lane: base + 2, hit:false, missed:false});
                        if(num >= 3) notes.push({time: (currentBeat + i*step) * beatInterval, lane: base + 4, hit:false, missed:false});
                    }
                    beatsUsed = len * step;
                }
            }
            
            let rest = 0;
            if (Math.random() > density) rest = 0.5;
            currentBeat += beatsUsed + rest;
        }
        notes.sort((a, b) => a.time - b.time);
    }

    // --- ゲームブート共通処理 ---
    function bootGame() {
        gameState = {
            startTime: performance.now() + 2000, score: 0, combo: 0, maxCombo: 0, gauge: 20, 
            scorePerNote: notes.length > 0 ? 100000 / notes.length : 0,
            counts: { cool: 0, great: 0, good: 0, bad: 0 }
        };
        
        particles = []; judgeTexts = []; activeLanes = new Array(config.lines).fill(false);
        activeTouches.clear();
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight * 0.85;
        
        changeScreen('screen-game');
        if (animationId) cancelAnimationFrame(animationId);
        gameLoop();
    }

    // --- アニメーションと描画関連 ---
    class Particle {
        constructor(x, y, color, type) {
            this.x = x; this.y = y; this.color = color; this.size = Math.random() * 3 + 1.5; 
            const angle = Math.random() * Math.PI * 2;
            const speed = type === 'cool' ? Math.random() * 2.5 + 1 : Math.random() * 1.5 + 0.5;
            this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
            this.life = 1.0; this.decay = 0.04 + Math.random() * 0.02; 
        }
        update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
    }

    function createBurst(x, y, color, type) {
        const count = type === 'cool' ? 15 : 8;
        for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color, type));
    }

    function gameLoop() {
        const currentTime = performance.now() - gameState.startTime;
        update(currentTime);
        draw(currentTime);
        if (currentTime > (config.duration * 1000) + 1000) return endGame();
        animationId = requestAnimationFrame(gameLoop);
    }

    function update(currentTime) {
        notes.forEach(n => {
            if (!n.hit && !n.missed && currentTime > n.time + config.judgeWindows.bad) {
                n.missed = true; registerHit('bad');
            }
        });
        
        particles.forEach(p => p.update()); particles = particles.filter(p => p.life > 0);
        judgeTexts.forEach(t => { t.life -= 0.03; t.y -= 0.5; }); judgeTexts = judgeTexts.filter(t => t.life > 0);

        const rem = Math.max(0, config.duration - Math.floor(currentTime / 1000));
        document.getElementById('time-display').innerText = `${Math.floor(rem/60)}:${(rem%60).toString().padStart(2, '0')}`;
    }

    function draw(currentTime) {
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        const laneW = canvas.width / config.lines;
        const judgeY = canvas.height - 100;
        const fallTime = 2000 / config.speed;

        for (let i = 0; i < config.lines; i++) {
            ctx.fillStyle = config.colors[i];
            ctx.globalAlpha = 0.15; ctx.fillRect(i * laneW, 0, laneW, canvas.height);
            ctx.globalAlpha = 1.0;
            if (activeLanes[i]) {
                ctx.globalAlpha = 0.5; ctx.fillRect(i * laneW, 0, laneW, canvas.height); ctx.globalAlpha = 1.0;
            }
            ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.strokeRect(i * laneW, 0, laneW, canvas.height);
        }

        ctx.strokeStyle = '#ff1744'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(0, judgeY); ctx.lineTo(canvas.width, judgeY); ctx.stroke();

        notes.forEach(n => {
            if (n.hit || n.missed) return;
            const diff = n.time - currentTime;
            if (diff > fallTime || diff < -200) return;
            const y = judgeY - (diff / fallTime) * judgeY;
            const x = n.lane * laneW + laneW / 2;
            
            ctx.fillStyle = config.colors[n.lane];
            ctx.beginPath(); ctx.ellipse(x, y, laneW * 0.42, 18, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath(); ctx.ellipse(x - laneW*0.1, y - 5, laneW * 0.15, 6, 0, 0, Math.PI * 2); ctx.fill();
        });

        particles.forEach(p => p.draw(ctx)); ctx.globalAlpha = 1.0; 
        judgeTexts.forEach(t => {
            ctx.globalAlpha = Math.max(0, t.life);
            ctx.fillStyle = t.color; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(t.text, t.x, t.y);
        }); ctx.globalAlpha = 1.0; 
    }

    // --- 入力制御 ---
    const activeTouches = new Map();

    function updateActiveLanes(e) {
        activeLanes.fill(false);
        const rect = canvas.getBoundingClientRect();
        const laneW = canvas.width / config.lines;
        const boundaryThreshold = 0.15;

        for (let i = 0; i < e.touches.length; i++) {
            const x = e.touches[i].clientX - rect.left;
            const lane = Math.floor(x / laneW);
            const ratio = (x % laneW) / laneW;

            if (lane >= 0 && lane < config.lines) {
                activeLanes[lane] = true;
                if (ratio < boundaryThreshold && lane > 0) activeLanes[lane - 1] = true;
                if (ratio > (1 - boundaryThreshold) && lane < config.lines - 1) activeLanes[lane + 1] = true;
            }
        }
    }

    function processHits(e) {
        const rect = canvas.getBoundingClientRect();
        const laneW = canvas.width / config.lines;
        const boundaryThreshold = 0.15;

        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            const x = t.clientX - rect.left;
            const lane = Math.floor(x / laneW);
            
            let lanesToHit = [];
            if (lane >= 0 && lane < config.lines) {
                lanesToHit.push(lane);
                const ratio = (x % laneW) / laneW;
                if (ratio < boundaryThreshold && lane > 0) lanesToHit.push(lane - 1);
                if (ratio > (1 - boundaryThreshold) && lane < config.lines - 1) lanesToHit.push(lane + 1);
            }

            const lastLane = activeTouches.get(t.identifier);

            if (e.type === 'touchstart' || lastLane !== lane) {
                activeTouches.set(t.identifier, lane);
                lanesToHit.forEach(l => checkHit(l, performance.now() - gameState.startTime));
            }
        }
    }

    function removeTouches(e) {
        for (let i = 0; i < e.changedTouches.length; i++) activeTouches.delete(e.changedTouches[i].identifier);
    }

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); updateActiveLanes(e); processHits(e); }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); updateActiveLanes(e); processHits(e); }, {passive: false});
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); updateActiveLanes(e); removeTouches(e); }, {passive: false});
    canvas.addEventListener('touchcancel', (e) => { e.preventDefault(); updateActiveLanes(e); removeTouches(e); }, {passive: false});

    function checkHit(lane, time) {
        let target = null; let min = Infinity;
        for (let n of notes) {
            if (n.lane === lane && !n.hit && !n.missed) {
                const diff = Math.abs(n.time - time);
                if (diff < config.judgeWindows.bad && diff < min) { min = diff; target = n; }
            }
        }
        if (target) {
            target.hit = true;
            let j = 'bad';
            if (min <= config.judgeWindows.cool) j = 'cool';
            else if (min <= config.judgeWindows.great) j = 'great';
            else if (min <= config.judgeWindows.good) j = 'good';
            registerHit(j, lane);
        }
    }

    function registerHit(j, lane = -1) {
        gameState.counts[j]++;
        const colors = { cool: '#03a9f4', great: '#8bc34a', good: '#ffeb3b', bad: '#f44336' };
        
        if (j === 'cool') {
            gameState.score += gameState.scorePerNote; gameState.combo++;
            gameState.gauge = Math.min(100, gameState.gauge + 2.0);
            if(lane !== -1) createBurst(lane * (canvas.width/config.lines) + (canvas.width/config.lines)/2, canvas.height-100, config.colors[lane], 'cool');
        } else if (j === 'great') {
            gameState.score += gameState.scorePerNote * 0.8; gameState.combo++;
            gameState.gauge = Math.min(100, gameState.gauge + 1.2);
            if(lane !== -1) createBurst(lane * (canvas.width/config.lines) + (canvas.width/config.lines)/2, canvas.height-100, config.colors[lane], 'great');
        } else if (j === 'good') {
            gameState.score += gameState.scorePerNote * 0.4; gameState.combo++;
            gameState.gauge = Math.min(100, gameState.gauge + 0.4);
        } else {
            gameState.combo = 0; gameState.gauge = Math.max(0, gameState.gauge - 1.5);
        }

        if (lane !== -1) {
            judgeTexts.push({
                text: j.toUpperCase(), color: colors[j],
                x: lane * (canvas.width/config.lines) + (canvas.width/config.lines)/2,
                y: canvas.height - 130, life: 1.0
            });
        }
        
        if (gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;
        updateUI();
    }

    function updateUI() {
        document.getElementById('score-display').innerText = Math.floor(gameState.score).toLocaleString();
        document.getElementById('combo-display').innerText = gameState.combo > 2 ? `${gameState.combo} COMBO` : '';
        document.getElementById('gauge-fill').style.width = `${gameState.gauge}%`;
        const fill = document.getElementById('gauge-fill');
        if (gameState.gauge >= 80) fill.style.background = 'linear-gradient(90deg, #ff5722, #ffeb3b)';
        else fill.style.background = 'linear-gradient(90deg, #4caf50, #8bc34a)';
    }

    function endGame() {
        cancelAnimationFrame(animationId);
        document.getElementById('result-score').innerText = Math.floor(gameState.score).toLocaleString();
        document.getElementById('result-details').innerHTML = `
            COOL: ${gameState.counts.cool}<br>GREAT: ${gameState.counts.great}<br>
            GOOD: ${gameState.counts.good}<br>BAD: ${gameState.counts.bad}<br>
            MAX COMBO: ${gameState.maxCombo}
        `;
        changeScreen('screen-result');
    }
</script>
