<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pop'n Clone V4</title>
    <style>
        /* [重要] ユーザー指定の固定スタイル */
        * { letter-spacing: 0px !important; }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; color: #fff;
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
            overflow: hidden; touch-action: none;
        }
        .screen {
            display: none; width: 100%; height: 100%;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .active { display: flex; }
        
        h1 { font-size: 2.2rem; margin-bottom: 20px; color: #ffeb3b; text-shadow: 2px 2px 0px #e91e63; }
        button {
            padding: 15px 30px; font-size: 1.2rem; margin: 10px;
            background-color: #e91e63; color: white; border: none; border-radius: 25px;
            box-shadow: 0 4px 0 #880e4f; cursor: pointer;
        }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #880e4f; }

        .settings-container {
            width: 85%; max-width: 400px; background: #222; padding: 20px; border-radius: 15px; border: 2px solid #444;
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        select, input { padding: 6px; font-size: 1rem; width: 110px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; }

        #game-screen { position: relative; justify-content: flex-start; background: #000; }
        canvas { display: block; width: 100%; height: 85%; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 85%;
            pointer-events: none;
        }
        #gauge-container {
            width: 100%; height: 15%; background: #222; position: relative;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-top: 4px solid #444;
        }
        #gauge-bg { width: 90%; height: 25px; background: #333; border-radius: 12px; border: 2px solid #555; overflow: hidden; }
        #gauge-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #4caf50, #ffeb3b, #f44336); transition: width 0.1s; }
        
        .hud-text { position: absolute; z-index: 10; font-weight: bold; text-shadow: 2px 2px 2px rgba(0,0,0,0.8); }
        #score-display { top: 10px; right: 15px; font-size: 1.8rem; color: #fff; }
        #combo-display { top: 50px; right: 15px; font-size: 1.4rem; color: #ffeb3b; }
        #time-display { top: 10px; left: 15px; font-size: 1.2rem; color: #bbb; }
    </style>
</head>
<body>

    <div id="screen-title" class="screen active">
        <h1>Pop'n Clone</h1>
        <button onclick="changeScreen('screen-settings')">PLAY GAME</button>
    </div>

    <div id="screen-settings" class="screen">
        <div class="settings-container">
            <h3 style="text-align: center; margin-top:0; color:#03a9f4;">GAME OPTIONS</h3>
            <div class="setting-row"><label>ライン数</label><select id="set-lines"><option value="5">5</option><option value="7">7</option><option value="9" selected>9</option></select></div>
            <div class="setting-row"><label>難度 (1-50)</label><input type="number" id="set-diff" value="25"></div>
            <div class="setting-row"><label>BPM</label><input type="number" id="set-bpm" value="128"></div>
            <div class="setting-row"><label>時間(秒)</label><input type="number" id="set-time" value="100"></div>
            <div class="setting-row">
                <label>落下速</label>
                <select id="set-speed">
                    <option value="1">x1</option>
                    <option value="1.5">x1.5</option>
                    <option value="2" selected>x2</option>
                    <option value="2.5">x2.5</option>
                    <option value="3">x3</option>
                    <option value="3.5">x3.5</option>
                    <option value="4">x4</option>
                </select>
            </div>
            <div class="setting-row"><label>判定</label><select id="set-judge"><option value="easy">EASY</option><option value="normal" selected>NORMAL</option></select></div>
            <button onclick="startGame()" style="width:100%; margin: 10px 0 0 0;">START!</button>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="score-display" class="hud-text">0</div>
            <div id="combo-display" class="hud-text"></div>
            <div id="time-display" class="hud-text">0:00</div>
        </div>
        <div id="gauge-container">
            <div style="font-size: 0.8rem; margin-bottom: 4px; color: #aaa;">GROOVE GAUGE</div>
            <div id="gauge-bg"><div id="gauge-fill"></div></div>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <h1>RESULT</h1>
        <h2 id="result-score" style="font-size: 2.5rem; color: #ffeb3b;">0</h2>
        <div id="result-details" style="text-align: left; margin: 10px 0; line-height: 1.6;"></div>
        <button onclick="changeScreen('screen-settings')">RETRY</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let animationId, config = {}, gameState = {}, notes = [];
    let particles = [], judgeTexts = [], activeLanes = [];
    
    const laneColors9 = ['#ffffff', '#ffeb3b', '#4caf50', '#2196f3', '#f44336', '#2196f3', '#4caf50', '#ffeb3b', '#ffffff'];

    function changeScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    class Particle {
        constructor(x, y, color, type) {
            this.x = x; this.y = y; this.color = color;
            this.size = Math.random() * 3 + 1.5; 
            const angle = Math.random() * Math.PI * 2;
            const speed = type === 'cool' ? Math.random() * 2.5 + 1 : Math.random() * 1.5 + 0.5;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.life = 1.0;
            this.decay = 0.04 + Math.random() * 0.02; 
        }
        update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
    }

    function createBurst(x, y, color, type) {
        const count = type === 'cool' ? 15 : 8;
        for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color, type));
    }

    // --- 譜面生成ロジック ---
    function addNote(time, lane) {
        notes.push({ time, lane: Math.max(0, Math.min(lane, config.lines - 1)), hit: false, missed: false });
    }

    // [隠しモード] ソフトロックLONG風 ジェネレーター
    function generateHiddenChart(beatInterval, totalBeats) {
        let currentBeat = 4;
        let measure = 0;

        while(currentBeat < totalBeats - 4) {
            let motif = measure % 6; // 6つのパターンをループ

            if (motif === 0) { // イントロ・歌い出し風：8分で左右に散る
                for(let i=0; i<8; i++) addNote((currentBeat + i*0.5) * beatInterval, (i%2===0)? 2 : 6);
            } else if (motif === 1) { // 16分ドラムロール＋4分メロディ
                for(let i=0; i<16; i++) {
                    addNote((currentBeat + i*0.25) * beatInterval, 1); // 16分ロール
                    if (i%4===0) addNote((currentBeat + i*0.25) * beatInterval, 4 + (i/4)%4);
                }
            } else if (motif === 2) { // 画像80小節付近の「X字クロス」
                for(let i=0; i<8; i++) {
                    addNote((currentBeat + i*0.5) * beatInterval, i);
                    addNote((currentBeat + i*0.5) * beatInterval, 8 - i);
                }
            } else if (motif === 3) { // 階段＋3連符
                for(let i=0; i<12; i++) {
                    addNote((currentBeat + i*0.333) * beatInterval, i%9);
                }
            } else if (motif === 4) { // 同時押しのラッシュ
                for(let i=0; i<8; i++) {
                    addNote((currentBeat + i*0.5) * beatInterval, 2);
                    addNote((currentBeat + i*0.5) * beatInterval, 6);
                    if(i%2===1) addNote((currentBeat + i*0.5) * beatInterval, 4);
                }
            } else { // 複雑なトリル
                for(let i=0; i<16; i++) {
                    addNote((currentBeat + i*0.25) * beatInterval, (i%4===0||i%4===1)? 3 : 5);
                }
            }
            currentBeat += 4;
            measure++;
        }
    }

    function generateNotes() {
        notes = [];
        const beatInterval = 60000 / config.bpm;
        const totalBeats = (config.duration * config.bpm) / 60;

        // 隠しモード判定
        if (config.bpm === 178 && config.duration === 150 && config.lines === 9) {
            generateHiddenChart(beatInterval, totalBeats);
            notes.sort((a, b) => a.time - b.time);
            return;
        }

        // --- 難易度に応じた制限 ---
        let maxSimul = 1; // 同時押し上限
        if (config.difficulty > 12) maxSimul = 2;
        if (config.difficulty > 24) maxSimul = 3;
        if (config.difficulty > 36) maxSimul = 4;
        if (config.difficulty > 45) maxSimul = 5;

        // 難度が高いほど、間隔が詰まる（16分や8分が出やすくなる）
        const density = Math.min(0.9, config.difficulty / 50);

        let currentBeat = 4;
        while (currentBeat < totalBeats - 4) {
            const patternType = Math.random();

            if (patternType < 0.15 && config.difficulty > 15) { 
                // 16分音符の連打 (ドラムロール等)
                let len = 4 + Math.floor(Math.random() * 4);
                let lane = Math.random() > 0.5 ? 0 : config.lines - 1;
                for(let i=0; i<len; i++) addNote((currentBeat + i*0.25) * beatInterval, lane);
                currentBeat += len * 0.25;
            } 
            else if (patternType < 0.3 && config.difficulty > 20) { 
                // 3連符
                let len = 3 + Math.floor(Math.random() * 3);
                let startLane = Math.floor(Math.random() * (config.lines - 2)) + 1;
                for(let i=0; i<len; i++) addNote((currentBeat + i*0.333) * beatInterval, startLane + (i%2===0?0:1));
                currentBeat += len * 0.333;
            } 
            else if (patternType < 0.5) { 
                // 階段 (8分音符)
                let len = 4 + Math.floor(Math.random() * 5);
                const dir = Math.random() > 0.5 ? 1 : -1;
                let lane = dir === 1 ? 0 : config.lines - 1;
                for (let i = 0; i < len; i++) {
                    addNote((currentBeat + i * 0.5) * beatInterval, lane);
                    lane += dir;
                    if (lane < 0) lane = 1; if (lane >= config.lines) lane = config.lines - 2;
                }
                currentBeat += len * 0.5;
            } 
            else { 
                // 通常配置 ＆ 同時押し
                let gap = 1.0; // 基本4分
                if (Math.random() < density) gap = 0.5; // 難度が高いと8分になりやすい
                if (Math.random() < (density - 0.4)) gap = 0.25; // かなり高難度だと16分も

                // 同時押し数の決定
                let numNotes = 1;
                if (Math.random() < density && maxSimul > 1) {
                    numNotes = 1 + Math.floor(Math.random() * maxSimul);
                }

                let used = [];
                for (let n = 0; n < numNotes; n++) {
                    let lane, attempts = 0;
                    do { 
                        lane = Math.floor(Math.random() * config.lines);
                        attempts++;
                    } while ((used.includes(lane) || used.includes(lane-1) || used.includes(lane+1)) && attempts < 10);
                    used.push(lane);
                    addNote(currentBeat * beatInterval, lane);
                }
                currentBeat += gap;
            }
        }
        notes.sort((a, b) => a.time - b.time);
    }

    // --- ゲームエンジン ---
    function startGame() {
        config = {
            lines: parseInt(document.getElementById('set-lines').value),
            difficulty: parseInt(document.getElementById('set-diff').value),
            bpm: parseInt(document.getElementById('set-bpm').value),
            duration: parseInt(document.getElementById('set-time').value),
            speed: parseFloat(document.getElementById('set-speed').value),
            judgeStr: document.getElementById('set-judge').value
        };
        const isEasy = config.judgeStr === 'easy';
        config.judgeWindows = { cool: isEasy?60:40, great: isEasy?100:70, good: isEasy?150:110, bad: isEasy?220:170 };
        config.colors = config.lines === 5 ? laneColors9.slice(2,7) : (config.lines === 7 ? laneColors9.slice(1,8) : laneColors9);
        
        generateNotes();
        gameState = {
            startTime: performance.now() + 2000, score: 0, combo: 0, maxCombo: 0, gauge: 20, 
            scorePerNote: notes.length > 0 ? 100000 / notes.length : 0,
            counts: { cool: 0, great: 0, good: 0, bad: 0 }
        };
        
        particles = []; judgeTexts = []; activeLanes = new Array(config.lines).fill(false);
        activeTouches.clear();
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight * 0.85;
        
        changeScreen('screen-game');
        if (animationId) cancelAnimationFrame(animationId);
        gameLoop();
    }

    function gameLoop() {
        const currentTime = performance.now() - gameState.startTime;
        update(currentTime);
        draw(currentTime);
        if (currentTime > (config.duration * 1000) + 1000) return endGame();
        animationId = requestAnimationFrame(gameLoop);
    }

    function update(currentTime) {
        notes.forEach(n => {
            if (!n.hit && !n.missed && currentTime > n.time + config.judgeWindows.bad) {
                n.missed = true; registerHit('bad');
            }
        });
        
        particles.forEach(p => p.update());
        particles = particles.filter(p => p.life > 0);
        
        judgeTexts.forEach(t => { t.life -= 0.03; t.y -= 0.5; });
        judgeTexts = judgeTexts.filter(t => t.life > 0);

        const rem = Math.max(0, config.duration - Math.floor(currentTime / 1000));
        document.getElementById('time-display').innerText = `${Math.floor(rem/60)}:${(rem%60).toString().padStart(2, '0')}`;
    }

    function draw(currentTime) {
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        const laneW = canvas.width / config.lines;
        const judgeY = canvas.height - 100;
        const fallTime = 2000 / config.speed;

        for (let i = 0; i < config.lines; i++) {
            ctx.fillStyle = config.colors[i];
            ctx.globalAlpha = 0.15;
            ctx.fillRect(i * laneW, 0, laneW, canvas.height);
            ctx.globalAlpha = 1.0;

            if (activeLanes[i]) {
                ctx.fillStyle = config.colors[i];
                ctx.globalAlpha = 0.5;
                ctx.fillRect(i * laneW, 0, laneW, canvas.height);
                ctx.globalAlpha = 1.0;
            }
            
            ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.strokeRect(i * laneW, 0, laneW, canvas.height);
        }

        ctx.strokeStyle = '#ff1744'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(0, judgeY); ctx.lineTo(canvas.width, judgeY); ctx.stroke();

        notes.forEach(n => {
            if (n.hit || n.missed) return;
            const diff = n.time - currentTime;
            if (diff > fallTime || diff < -200) return;
            const y = judgeY - (diff / fallTime) * judgeY;
            const x = n.lane * laneW + laneW / 2;
            
            ctx.fillStyle = config.colors[n.lane];
            ctx.beginPath(); ctx.ellipse(x, y, laneW * 0.42, 18, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath(); ctx.ellipse(x - laneW*0.1, y - 5, laneW * 0.15, 6, 0, 0, Math.PI * 2); ctx.fill();
        });

        particles.forEach(p => p.draw(ctx));
        ctx.globalAlpha = 1.0; 

        judgeTexts.forEach(t => {
            ctx.globalAlpha = Math.max(0, t.life);
            ctx.fillStyle = t.color;
            ctx.font = 'bold 30px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(t.text, t.x, t.y);
        });
        ctx.globalAlpha = 1.0; 
    }

    // --- タップ制御 ---
    const activeTouches = new Map();

    function updateActiveLanes(e) {
        activeLanes.fill(false);
        const rect = canvas.getBoundingClientRect();
        const laneW = canvas.width / config.lines;
        const boundaryThreshold = 0.15;

        for (let i = 0; i < e.touches.length; i++) {
            const x = e.touches[i].clientX - rect.left;
            const lane = Math.floor(x / laneW);
            const ratio = (x % laneW) / laneW;

            if (lane >= 0 && lane < config.lines) {
                activeLanes[lane] = true;
                if (ratio < boundaryThreshold && lane > 0) activeLanes[lane - 1] = true;
                if (ratio > (1 - boundaryThreshold) && lane < config.lines - 1) activeLanes[lane + 1] = true;
            }
        }
    }

    function processHits(e) {
        const rect = canvas.getBoundingClientRect();
        const laneW = canvas.width / config.lines;
        const boundaryThreshold = 0.15;

        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            const x = t.clientX - rect.left;
            const lane = Math.floor(x / laneW);
            
            let lanesToHit = [];
            if (lane >= 0 && lane < config.lines) {
                lanesToHit.push(lane);
                const ratio = (x % laneW) / laneW;
                if (ratio < boundaryThreshold && lane > 0) lanesToHit.push(lane - 1);
                if (ratio > (1 - boundaryThreshold) && lane < config.lines - 1) lanesToHit.push(lane + 1);
            }

            const lastLane = activeTouches.get(t.identifier);

            if (e.type === 'touchstart' || lastLane !== lane) {
                activeTouches.set(t.identifier, lane);
                lanesToHit.forEach(l => checkHit(l, performance.now() - gameState.startTime));
            }
        }
    }

    function removeTouches(e) {
        for (let i = 0; i < e.changedTouches.length; i++) activeTouches.delete(e.changedTouches[i].identifier);
    }

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); updateActiveLanes(e); processHits(e); }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); updateActiveLanes(e); processHits(e); }, {passive: false});
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); updateActiveLanes(e); removeTouches(e); }, {passive: false});
    canvas.addEventListener('touchcancel', (e) => { e.preventDefault(); updateActiveLanes(e); removeTouches(e); }, {passive: false});

    function checkHit(lane, time) {
        let target = null; let min = Infinity;
        for (let n of notes) {
            if (n.lane === lane && !n.hit && !n.missed) {
                const diff = Math.abs(n.time - time);
                if (diff < config.judgeWindows.bad && diff < min) { min = diff; target = n; }
            }
        }
        if (target) {
            target.hit = true;
            let j = 'bad';
            if (min <= config.judgeWindows.cool) j = 'cool';
            else if (min <= config.judgeWindows.great) j = 'great';
            else if (min <= config.judgeWindows.good) j = 'good';
            registerHit(j, lane);
        }
    }

    function registerHit(j, lane = -1) {
        gameState.counts[j]++;
        const colors = { cool: '#03a9f4', great: '#8bc34a', good: '#ffeb3b', bad: '#f44336' };
        
        if (j === 'cool') {
            gameState.score += gameState.scorePerNote; gameState.combo++;
            gameState.gauge = Math.min(100, gameState.gauge + 2.0);
            if(lane !== -1) createBurst(lane * (canvas.width/config.lines) + (canvas.width/config.lines)/2, canvas.height-100, config.colors[lane], 'cool');
        } else if (j === 'great') {
            gameState.score += gameState.scorePerNote * 0.8; gameState.combo++;
            gameState.gauge = Math.min(100, gameState.gauge + 1.2);
            if(lane !== -1) createBurst(lane * (canvas.width/config.lines) + (canvas.width/config.lines)/2, canvas.height-100, config.colors[lane], 'great');
        } else if (j === 'good') {
            gameState.score += gameState.scorePerNote * 0.4; gameState.combo++;
            gameState.gauge = Math.min(100, gameState.gauge + 0.4);
        } else {
            gameState.combo = 0; gameState.gauge = Math.max(0, gameState.gauge - 1.5);
        }

        if (lane !== -1) {
            judgeTexts.push({
                text: j.toUpperCase(), color: colors[j],
                x: lane * (canvas.width/config.lines) + (canvas.width/config.lines)/2,
                y: canvas.height - 130, life: 1.0
            });
        }
        
        if (gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;
        updateUI();
    }

    function updateUI() {
        document.getElementById('score-display').innerText = Math.floor(gameState.score).toLocaleString();
        document.getElementById('combo-display').innerText = gameState.combo > 2 ? `${gameState.combo} COMBO` : '';
        document.getElementById('gauge-fill').style.width = `${gameState.gauge}%`;
        const fill = document.getElementById('gauge-fill');
        if (gameState.gauge >= 80) fill.style.background = 'linear-gradient(90deg, #ff5722, #ffeb3b)';
        else fill.style.background = 'linear-gradient(90deg, #4caf50, #8bc34a)';
    }

    function endGame() {
        cancelAnimationFrame(animationId);
        document.getElementById('result-score').innerText = Math.floor(gameState.score).toLocaleString();
        document.getElementById('result-details').innerHTML = `
            COOL: ${gameState.counts.cool}<br>GREAT: ${gameState.counts.great}<br>
            GOOD: ${gameState.counts.good}<br>BAD: ${gameState.counts.bad}<br>
            MAX COMBO: ${gameState.maxCombo}
        `;
        changeScreen('screen-result');
    }
</script>
</body>
</html>
