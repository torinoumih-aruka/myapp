<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pop'n Clone</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111; color: #fff;
            font-family: sans-serif;
            overflow: hidden; /* スクロール防止 */
            touch-action: none; /* デフォルトのタッチアクションを無効化 */
        }
        .screen {
            display: none; width: 100%; height: 100%;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .active { display: flex; }
        
        /* タイトル・リザルト */
        h1 { font-size: 2.5rem; margin-bottom: 20px; color: #ffeb3b; text-shadow: 2px 2px 0px #e91e63; }
        button {
            padding: 15px 30px; font-size: 1.2rem; margin: 10px;
            background-color: #e91e63; color: white; border: none; border-radius: 25px;
            box-shadow: 0 4px 0 #880e4f; cursor: pointer;
        }
        button:active { transform: translateY(4px); box-shadow: none; }

        /* 設定画面 */
        .settings-container {
            width: 80%; max-width: 400px; background: #222; padding: 20px; border-radius: 10px;
        }
        .setting-row {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
        }
        select, input { padding: 5px; font-size: 1rem; width: 100px; }

        /* ゲーム画面 */
        #game-screen { position: relative; justify-content: flex-start; }
        canvas { display: block; background: #000; width: 100%; height: 85%; }
        #gauge-container {
            width: 100%; height: 15%; background: #333; position: relative;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-top: 2px solid #fff;
        }
        #gauge-bg { width: 90%; height: 30px; background: #555; border-radius: 15px; overflow: hidden; }
        #gauge-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff9800, #4caf50); transition: width 0.1s; }
        #score-display { position: absolute; top: 10px; right: 10px; font-size: 1.5rem; z-index: 10; text-shadow: 1px 1px 2px #000;}
        #combo-display { position: absolute; top: 50px; right: 10px; font-size: 1.2rem; color: #ffeb3b; z-index: 10;}
        #time-display { position: absolute; top: 10px; left: 10px; font-size: 1.2rem; z-index: 10;}
    </style>
</head>
<body>

    <div id="screen-title" class="screen active">
        <h1>Pop'n Clone</h1>
        <button onclick="changeScreen('screen-settings')">START</button>
    </div>

    <div id="screen-settings" class="screen">
        <div class="settings-container">
            <h2 style="text-align: center; margin-top:0;">設定</h2>
            <div class="setting-row">
                <label>ライン数</label>
                <select id="set-lines">
                    <option value="5">5</option>
                    <option value="7">7</option>
                    <option value="9" selected>9</option>
                </select>
            </div>
            <div class="setting-row">
                <label>難易度 (10-45)</label>
                <input type="number" id="set-diff" min="10" max="45" value="15">
            </div>
            <div class="setting-row">
                <label>BPM (50-400)</label>
                <input type="number" id="set-bpm" min="50" max="400" value="128">
            </div>
            <div class="setting-row">
                <label>時間(秒) (60-300)</label>
                <input type="number" id="set-time" min="60" max="300" step="10" value="100">
            </div>
            <div class="setting-row">
                <label>落下速度</label>
                <select id="set-speed">
                    <option value="1" selected>x1</option>
                    <option value="1.5">x1.5</option>
                    <option value="2">x2</option>
                    <option value="2.5">x2.5</option>
                    <option value="3">x3</option>
                    <option value="3.5">x3.5</option>
                    <option value="4">x4</option>
                </select>
            </div>
            <div class="setting-row">
                <label>判定</label>
                <select id="set-judge">
                    <option value="easy">Easy</option>
                    <option value="normal" selected>Normal</option>
                </select>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button onclick="startGame()">GAME START</button>
            </div>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div id="score-display">0</div>
        <div id="combo-display"></div>
        <div id="time-display">0:00</div>
        <canvas id="gameCanvas"></canvas>
        <div id="gauge-container">
            <div style="margin-bottom: 5px;">GROOVE GAUGE</div>
            <div id="gauge-bg">
                <div id="gauge-fill"></div>
            </div>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <h1>RESULT</h1>
        <h2 id="result-score" style="font-size: 2.5rem; color: #4caf50;">Score: 0</h2>
        <div style="text-align: left; margin-bottom: 20px; font-size: 1.2rem;">
            <p id="res-cool" style="color: #03a9f4; margin: 5px 0;">COOL: 0</p>
            <p id="res-great" style="color: #8bc34a; margin: 5px 0;">GREAT: 0</p>
            <p id="res-good" style="color: #ffeb3b; margin: 5px 0;">GOOD: 0</p>
            <p id="res-bad" style="color: #f44336; margin: 5px 0;">BAD: 0</p>
            <p id="res-maxcombo" style="margin: 5px 0;">MAX COMBO: 0</p>
        </div>
        <button onclick="changeScreen('screen-settings')">設定に戻る</button>
    </div>

<script>
    // --- 画面遷移管理 ---
    function changeScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // --- ゲーム設定・状態 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let animationId;
    let config = {};
    let gameState = {};
    let notes = [];
    let effects = []; // タップ時の判定エフェクト

    // ポップン風の色定義 (9ライン基準)
    const laneColors9 = ['#fff', '#ffeb3b', '#4caf50', '#2196f3', '#f44336', '#2196f3', '#4caf50', '#ffeb3b', '#fff'];

    function initSettings() {
        config = {
            lines: parseInt(document.getElementById('set-lines').value),
            difficulty: parseInt(document.getElementById('set-diff').value),
            bpm: parseInt(document.getElementById('set-bpm').value),
            duration: parseInt(document.getElementById('set-time').value),
            speed: parseFloat(document.getElementById('set-speed').value),
            judgeStr: document.getElementById('set-judge').value
        };

        // 判定幅 (ms)
        const isEasy = config.judgeStr === 'easy';
        config.judgeWindows = {
            cool: isEasy ? 50 : 30,
            great: isEasy ? 90 : 60,
            good: isEasy ? 140 : 100,
            bad: isEasy ? 200 : 150
        };

        // レーンごとの色を割り当て
        if (config.lines === 5) config.colors = [laneColors9[2], laneColors9[3], laneColors9[4], laneColors9[5], laneColors9[6]];
        else if (config.lines === 7) config.colors = [laneColors9[1], laneColors9[2], laneColors9[3], laneColors9[4], laneColors9[5], laneColors9[6], laneColors9[7]];
        else config.colors = laneColors9;
    }

    // --- ノーツ生成 ---
    function generateNotes() {
        notes = [];
        const totalBeats = (config.duration * config.bpm) / 60;
        const beatInterval = 60000 / config.bpm; // 1拍のミリ秒

        // 難易度(10〜45)に応じたノーツ生成確率と密度
        const density = config.difficulty / 45; 

        for (let beat = 4; beat < totalBeats; beat += 0.5) { // 最初の数拍は余白
            // 確率でノーツを配置
            if (Math.random() < density + 0.1) {
                const time = beat * beatInterval;
                // 同時押し数 (1〜4)
                let numNotes = 1;
                if (Math.random() < density * 0.5) numNotes = 2;
                if (Math.random() < density * 0.2) numNotes = 3;
                if (Math.random() < density * 0.05) numNotes = 4;

                let usedLanes = new Set();
                for (let i = 0; i < numNotes; i++) {
                    let lane;
                    do { lane = Math.floor(Math.random() * config.lines); } while (usedLanes.has(lane));
                    usedLanes.add(lane);

                    notes.push({
                        time: time,
                        lane: lane,
                        hit: false,
                        missed: false
                    });
                }
            }
        }
        // 判定時間順にソート
        notes.sort((a, b) => a.time - b.time);
    }

    // --- ゲーム開始 ---
    function startGame() {
        initSettings();
        generateNotes();

        // 10万点をノーツ数で分配 (全てCOOLの場合)
        const scorePerNote = notes.length > 0 ? 100000 / notes.length : 0;

        gameState = {
            startTime: performance.now() + 2000, // 2秒後スタート
            score: 0,
            combo: 0,
            maxCombo: 0,
            gauge: 0,
            scorePerNote: scorePerNote,
            counts: { cool: 0, great: 0, good: 0, bad: 0 }
        };
        effects = [];

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight * 0.85; // 画面の85%
        
        updateUI();
        changeScreen('screen-game');
        
        if (animationId) cancelAnimationFrame(animationId);
        gameLoop();
    }

    // --- ゲームループ ---
    function gameLoop() {
        const now = performance.now();
        const currentTime = now - gameState.startTime;

        updateLogic(currentTime);
        draw(currentTime);

        // 終了判定
        if (currentTime > (config.duration * 1000) + 2000) {
            endGame();
            return;
        }

        animationId = requestAnimationFrame(gameLoop);
    }

    // --- ロジック更新 ---
    function updateLogic(currentTime) {
        // 見逃し（Bad）判定
        notes.forEach(note => {
            if (!note.hit && !note.missed && currentTime > note.time + config.judgeWindows.bad) {
                note.missed = true;
                registerHit('bad');
            }
        });

        // エフェクトの寿命管理
        effects = effects.filter(e => currentTime - e.time < 500);

        // 残り時間更新
        const remaining = Math.max(0, config.duration - Math.floor(currentTime / 1000));
        document.getElementById('time-display').innerText = `${Math.floor(remaining/60)}:${(remaining%60).toString().padStart(2, '0')}`;
    }

    // --- 描画 ---
    function draw(currentTime) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const laneWidth = canvas.width / config.lines;
        const judgeY = canvas.height - 80;

        // レーン背景と判定ライン
        for (let i = 0; i < config.lines; i++) {
            ctx.fillStyle = (i % 2 === 0) ? '#1a1a1a' : '#222';
            ctx.fillRect(i * laneWidth, 0, laneWidth, canvas.height);
            
            // 下部の判定エリアの目印
            ctx.fillStyle = config.colors[i];
            ctx.globalAlpha = 0.3;
            ctx.fillRect(i * laneWidth + 2, judgeY - 10, laneWidth - 4, 20);
            ctx.globalAlpha = 1.0;
        }

        // 赤い判定ライン
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, judgeY);
        ctx.lineTo(canvas.width, judgeY);
        ctx.stroke();

        // 落下速度係数 (x1 = 2000msで画面上から判定ラインへ)
        const fallTimeMs = 2000 / config.speed;

        // ノーツ描画
        notes.forEach(note => {
            if (note.hit || note.missed) return;

            const timeDiff = note.time - currentTime;
            // 画面外なら描画しない
            if (timeDiff > fallTimeMs || timeDiff < -config.judgeWindows.bad) return;

            // Y座標計算
            const y = judgeY - (timeDiff / fallTimeMs) * judgeY;
            const x = note.lane * laneWidth + laneWidth / 2;

            // ポップ君を描画 (カプセル型)
            ctx.fillStyle = config.colors[note.lane];
            ctx.beginPath();
            ctx.ellipse(x, y, laneWidth * 0.4, 15, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
        });

        // 判定文字エフェクト描画
        effects.forEach(e => {
            const progress = (currentTime - e.time) / 500;
            ctx.globalAlpha = 1 - progress;
            ctx.fillStyle = e.color;
            ctx.font = 'bold 30px sans-serif';
            ctx.textAlign = 'center';
            // 少し上に浮き上がるアニメーション
            ctx.fillText(e.text, e.x, judgeY - 40 - (progress * 20));
            ctx.globalAlpha = 1.0;
        });
    }

    // --- タップ判定処理 ---
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault(); // ズーム等防止
        const currentTime = performance.now() - gameState.startTime;
        const rect = canvas.getBoundingClientRect();
        const laneWidth = canvas.width / config.lines;

        // 新規タップのみ処理 (同時押し対応)
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            const touchX = touch.clientX - rect.left;
            const lane = Math.floor(touchX / laneWidth);

            if (lane >= 0 && lane < config.lines) {
                checkHit(lane, currentTime);
            }
        }
    }, { passive: false });

    function checkHit(lane, currentTime) {
        // そのレーンで、まだ叩かれていない、判定枠内に最も近いノーツを探す
        let targetNote = null;
        let minDiff = Infinity;

        for (let i = 0; i < notes.length; i++) {
            const note = notes[i];
            if (note.lane === lane && !note.hit && !note.missed) {
                const diff = Math.abs(note.time - currentTime);
                if (diff < config.judgeWindows.bad && diff < minDiff) {
                    minDiff = diff;
                    targetNote = note;
                }
            }
        }

        if (targetNote) {
            targetNote.hit = true;
            let judge = 'bad';
            if (minDiff <= config.judgeWindows.cool) judge = 'cool';
            else if (minDiff <= config.judgeWindows.great) judge = 'great';
            else if (minDiff <= config.judgeWindows.good) judge = 'good';

            registerHit(judge, targetNote.lane);
        }
    }

    // --- スコア・ゲージ計算 ---
    function registerHit(judge, lane = -1) {
        gameState.counts[judge]++;
        
        let effectColor = '';
        let effectText = judge.toUpperCase();

        switch (judge) {
            case 'cool':
                gameState.score += gameState.scorePerNote;
                gameState.combo++;
                gameState.gauge = Math.min(100, gameState.gauge + 1); // ゲージ+1%
                effectColor = '#03a9f4';
                break;
            case 'great':
                gameState.score += gameState.scorePerNote * 0.8;
                gameState.combo++;
                gameState.gauge = Math.min(100, gameState.gauge + 0.5);
                effectColor = '#8bc34a';
                break;
            case 'good':
                gameState.score += gameState.scorePerNote * 0.5;
                gameState.combo++;
                gameState.gauge = Math.min(100, gameState.gauge + 0.2);
                effectColor = '#ffeb3b';
                break;
            case 'bad':
                gameState.combo = 0;
                gameState.gauge = Math.max(0, gameState.gauge - 3); // ミスはゲージ-3%
                effectColor = '#f44336';
                break;
        }

        if (gameState.combo > gameState.maxCombo) {
            gameState.maxCombo = gameState.combo;
        }

        // エフェクト追加
        if (lane !== -1) {
            const laneWidth = canvas.width / config.lines;
            effects.push({
                x: lane * laneWidth + laneWidth / 2,
                text: effectText,
                color: effectColor,
                time: performance.now() - gameState.startTime
            });
        }

        updateUI();
    }

    function updateUI() {
        document.getElementById('score-display').innerText = Math.floor(gameState.score);
        document.getElementById('combo-display').innerText = gameState.combo > 0 ? `${gameState.combo} COMBO` : '';
        document.getElementById('gauge-fill').style.width = `${gameState.gauge}%`;
        
        // ゲージの色変化（クリアライン目安など）
        if (gameState.gauge >= 80) {
            document.getElementById('gauge-fill').style.background = 'linear-gradient(90deg, #e91e63, #ffeb3b)';
        } else {
            document.getElementById('gauge-fill').style.background = 'linear-gradient(90deg, #ff9800, #4caf50)';
        }
    }

    // --- ゲーム終了 ---
    function endGame() {
        cancelAnimationFrame(animationId);
        
        document.getElementById('result-score').innerText = `Score: ${Math.floor(gameState.score)}`;
        document.getElementById('res-cool').innerText = `COOL: ${gameState.counts.cool}`;
        document.getElementById('res-great').innerText = `GREAT: ${gameState.counts.great}`;
        document.getElementById('res-good').innerText = `GOOD: ${gameState.counts.good}`;
        document.getElementById('res-bad').innerText = `BAD: ${gameState.counts.bad}`;
        document.getElementById('res-maxcombo').innerText = `MAX COMBO: ${gameState.maxCombo}`;

        changeScreen('screen-result');
    }

    // ウィンドウリサイズ対応
    window.addEventListener('resize', () => {
        if (document.getElementById('screen-game').classList.contains('active')) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.85;
        }
    });

</script>
</body>
</html>
