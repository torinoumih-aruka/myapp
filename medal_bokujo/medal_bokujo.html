<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>メダル牧場 - 施設・農業拡張版</title>
<style>
    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        font-family: sans-serif;
        letter-spacing: 0px;
    }
    body {
        margin: 0; padding: 0;
        width: 100vw; height: 100dvh;
        overflow: hidden;
        background-color: #333;
    }

    #title-screen {
        position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh;
        background-color: #8B4513; display: flex; flex-direction: column;
        justify-content: center; align-items: center; z-index: 1000; color: white;
    }
    #start-btn {
        padding: 15px 30px; font-size: 1.5rem; background-color: #FFD700; color: #333;
        border: none; border-radius: 10px; font-weight: bold;
    }

    #game-screen { display: none; width: 100vw; height: 100dvh; position: relative; }

    #ticker {
        position: absolute; top: 0; left: 0; width: 100vw; height: 1rem;
        background-color: black; color: white; font-size: 0.7rem; line-height: 1rem;
        white-space: nowrap; overflow: hidden; z-index: 100;
    }
    #ticker-text { display: inline-block; padding-left: 100vw; animation: ticker 15s linear infinite; }
    @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

    #fodder-status {
        position: absolute; top: 1.5rem; right: 10px;
        background-color: rgba(0, 0, 0, 0.7); color: white;
        padding: 5px 10px; border-radius: 5px; font-size: 0.9rem; font-weight: bold;
        z-index: 100; transition: opacity 0.3s;
    }

    #main-area {
        position: absolute; top: 1rem;
        bottom: calc(2rem + env(safe-area-inset-bottom)); 
        width: 100vw;
        overflow: hidden; background-color: #000;
    }
    canvas { display: block; }

    #menu-container {
        position: absolute; top: 30px; left: -240px;
        height: calc(100% - 100px);
        display: flex; transition: left 0.3s ease; z-index: 200; pointer-events: none;
    }
    #menu-container.open { left: 0; }
    
    #menu-panel {
        width: 240px; height: 100%;
        background-color: rgba(255, 255, 255, 0.95);
        border-right: 2px solid #333; 
        padding: 10px 10px 10px 30px;
        overflow-y: auto; pointer-events: auto; touch-action: pan-y;
    }
    
    #menu-tabs {
        width: 40px; display: flex; flex-direction: column; gap: 2px; pointer-events: auto;
        transition: opacity 0.3s;
    }
    .menu-tab {
        flex: 1; min-height: 45px; display: flex; align-items: center; justify-content: center;
        border-radius: 0 10px 10px 0; border: 1px solid #333; border-left: none;
        writing-mode: vertical-rl; text-orientation: upright;
        font-size: 0.8rem; font-weight: bold; cursor: pointer;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }
    .tab-ground { background-color: white; color: black; }
    .tab-crop { background-color: lightgreen; color: black; }
    .tab-facility { background-color: lightpink; color: black; }
    .tab-livestock { background-color: lightblue; color: black; }
    .tab-pet { background-color: lightyellow; color: black; }
    .tab-decoration { background-color: lightgray; color: black; }
    .tab-debug { background-color: black; color: white; }

    .menu-item {
        padding: 10px; margin-bottom: 8px; background: #fff;
        border: 2px solid #ccc; border-radius: 5px; font-size: 0.85rem;
        display: flex; align-items: center; gap: 5px; cursor: grab; touch-action: none;
    }
    .menu-item:active { background: #f0f0f0; border-color: #888; }
    .menu-item.debug-btn { cursor: pointer; text-align: center; justify-content: center; background: #eee; }

    #status-area {
        position: absolute; bottom: 10px; right: 10px; width: 170px;
        background-color: rgba(0, 0, 0, 0.7); color: white; border-radius: 5px; padding: 5px;
        font-size: 0.8rem; z-index: 100; display: none; line-height: 1.3;
    }
    #farm-stats-overlay {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background-color: rgba(0, 0, 0, 0.85); color: white; border: 2px solid #FFD700;
        border-radius: 10px; padding: 20px; z-index: 300; display: none;
        width: 80%; max-width: 300px; text-align: center;
    }

    #footer {
        position: absolute; bottom: 0; left: 0; width: 100vw;
        height: calc(2.2rem + env(safe-area-inset-bottom));
        padding: 0 10px env(safe-area-inset-bottom) 10px;
        background-color: black; color: yellow; display: flex; align-items: center;
        font-size: 1.1rem; z-index: 100;
    }
    #medal-count { flex-grow: 1; }
    .footer-btn { background: none; border: none; color: white; font-size: 1.2rem; margin-left: 10px; opacity: 0.5; cursor: pointer; padding: 5px; }
    .footer-btn.active { opacity: 1; color: #FFD700; }
    
    .pop-text {
        position: absolute; font-weight: bold; font-size: 1.2rem; z-index: 300; pointer-events: none;
        text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff,
                     0px 2px 0 #fff, 0px -2px 0 #fff, 2px 0px 0 #fff, -2px 0px 0 #fff;
        animation: floatUp 1s ease-out forwards;
    }
    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }

    #drag-ghost {
        position: fixed; pointer-events: none; z-index: 9999;
        font-size: 2.5rem; text-shadow: 0 0 5px rgba(255,255,255,0.8);
        display: none; transform: translate(-50%, -50%);
    }
</style>
</head>
<body>

<div id="title-screen">
    <h1>メダル牧場</h1>
    <button id="start-btn">ゲームスタート</button>
</div>

<div id="game-screen">
    <div id="ticker"><div id="ticker-text">施設を配置して作物を効率よく育てよう！目を長押しで縮小表示。ピックモードで施設を移動できます。</div></div>

    <div id="fodder-status">🌿：0個</div>

    <div id="main-area">
        <canvas id="game-canvas"></canvas>
        
        <div id="menu-container">
            <div id="menu-panel">
                <div id="menu-title" style="font-weight:bold; border-bottom:1px solid #333; margin-bottom:10px">メニュー</div>
                <div id="menu-items-list"></div>
            </div>
            <div id="menu-tabs">
                <div class="menu-tab tab-ground" data-target="ground">地面</div>
                <div class="menu-tab tab-crop" data-target="crop">作物</div>
                <div class="menu-tab tab-facility" data-target="facility">施設</div>
                <div class="menu-tab tab-livestock" data-target="livestock">家畜</div>
                <div class="menu-tab tab-pet" data-target="pet">ペット</div>
                <div class="menu-tab tab-decoration" data-target="decoration">装飾品</div>
                <div class="menu-tab tab-debug" data-target="debug">デバッグ</div>
            </div>
        </div>

        <div id="status-area">
            <div id="status-obj">上物: なし</div>
            <div id="status-ground">地面: 土</div>
            <div id="status-temp">気温: 20℃</div>
        </div>

        <div id="farm-stats-overlay">
            <h3 style="margin-top:0; color:#FFD700;">牧場の価値</h3>
            <p style="font-size:0.8rem;">※もう一度「📊」を押して閉じる</p>
        </div>
    </div>

    <div id="drag-ghost"></div>

    <div id="footer">
        <div id="medal-count">🪙: 0</div>
        <button class="footer-btn" id="btn-save">💾</button>
        <button class="footer-btn" id="btn-stats">📊</button>
        <button class="footer-btn" id="mode-inspect">🔎</button>
        <button class="footer-btn" id="mode-pick">🤏</button>
        <button class="footer-btn active" id="mode-view">👁️</button>
    </div>
</div>

<script>
let TILE_SIZE = 48; 
const MAP_SIZE = 50;
let canvas, ctx;
let gameLoopInterval;

let state = {
    medals: 5000,
    fodder: 0,
    map: [],
    camera: { x: 0, y: 0 },
    mode: 'view',
    selectedTile: null,
    activeAoEs: [], 
    draggingMapItem: null, 
    dragCoords: {x: 0, y: 0},
    lastTap: { time: 0, r: -1, c: -1 }, 
    isMenuOpen: false,
    activeMenuTab: null,
    isZoomedOut: false
};

const COLORS = { soil: '#8B5A2B', grass: '#7CFC00', field: '#DEB887', path: '#D3D3D3' };
const GROUND_NAMES = { soil: '土', grass: '草原', field: '畑', path: '道' };

const CROP_DATA = {
    tomato: { name: 'トマト', icon: '🍅', time: 10, minTemp: 15, maxTemp: 30, yield: 3, maxHarvest: 5 },
    potato: { name: 'ジャガイモ', icon: '🥔', time: 5, minTemp: 5, maxTemp: 25, yield: 1, maxHarvest: 20 },
    carrot: { name: 'ニンジン', icon: '🥕', time: 10, minTemp: 5, maxTemp: 20, yield: 2, maxHarvest: 10 },
    cucumber: { name: 'きゅうり', icon: '🥒', time: 5, minTemp: 20, maxTemp: 30, yield: 1, maxHarvest: 20 },
    broccoli: { name: 'ブロッコリー', icon: '🥦', time: 15, minTemp: 0, maxTemp: 15, yield: 4, maxHarvest: 5 },
    spinach: { name: 'ほうれんそう', icon: '🥬', time: 10, minTemp: 0, maxTemp: 15, yield: 2, maxHarvest: 10 },
    strawberry: { name: 'いちご', icon: '🍓', time: 10, minTemp: 5, maxTemp: 20, yield: 4, maxHarvest: 10 },
    pineapple: { name: 'パイナップル', icon: '🍍', time: 30, minTemp: 25, maxTemp: 30, yield: 10, maxHarvest: 5 },
    melon: { name: 'メロン', icon: '🍈', time: 30, minTemp: 20, maxTemp: 30, yield: 10, maxHarvest: 5 },
    fodder: { name: '餌', icon: '🌿', time: 5, minTemp: -999, maxTemp: 999, yield: 0, maxHarvest: 20 }
};

const MENU_DATA = {
    ground: [
        { name: '土', icon: '🟫', cost: 0, type: 'ground', groundType: 'soil' },
        { name: '草原', icon: '🟩', cost: 1, type: 'ground', groundType: 'grass' },
        { name: '畑', icon: '🟨', cost: 1, type: 'ground', groundType: 'field' },
        { name: '道', icon: '⬜', cost: 1, type: 'ground', groundType: 'path' }
    ],
    crop: [
        { name: 'トマトの種', icon: '🍅', cost: 2, type: 'seed', cropKey: 'tomato' },
        { name: 'ジャガイモの種', icon: '🥔', cost: 4, type: 'seed', cropKey: 'potato' },
        { name: 'ニンジンの種', icon: '🥕', cost: 4, type: 'seed', cropKey: 'carrot' },
        { name: 'きゅうりの種', icon: '🥒', cost: 2, type: 'seed', cropKey: 'cucumber' },
        { name: 'ブロッコリーの種', icon: '🥦', cost: 3, type: 'seed', cropKey: 'broccoli' },
        { name: 'ほうれんそうの種', icon: '🥬', cost: 3, type: 'seed', cropKey: 'spinach' },
        { name: 'いちごの種', icon: '🍓', cost: 3, type: 'seed', cropKey: 'strawberry' },
        { name: 'パイナップルの種', icon: '🍍', cost: 4, type: 'seed', cropKey: 'pineapple' },
        { name: 'メロンの種', icon: '🍈', cost: 5, type: 'seed', cropKey: 'melon' },
        { name: '餌の種', icon: '🌿', cost: 1, type: 'seed', cropKey: 'fodder' }
    ],
    facility: [
        { name: 'ホットストーン', icon: '🪨', cost: 1000, type: 'facility', facilityKey: 'hot_stone' },
        { name: 'ひんやりストーン', icon: '🪨', cost: 1000, type: 'facility', facilityKey: 'cold_stone' },
        { name: 'コンポスト', icon: '📦', cost: 100, type: 'facility', facilityKey: 'compost' },
        { name: 'スプリンクラー', icon: '⛲', cost: 100, type: 'facility', facilityKey: 'sprinkler' },
        { name: 'アップグレーダー', icon: '🎚️', cost: 2000, type: 'facility', facilityKey: 'upgrader' },
        { name: '柵', icon: '🪵', cost: 10, type: 'facility', facilityKey: 'fence' }
    ],
    livestock: [{ name: '鶏', icon: '🐓', cost: 50, type: 'livestock' }, { name: '牛', icon: '🐄', cost: 1000, type: 'livestock' }],
    pet: [{ name: '犬', icon: '🐕', cost: 50, type: 'pet' }],
    decoration: [{ name: '花', icon: '🌻', cost: 5, type: 'decoration' }],
    debug: [
        { name: 'メダル+1000', icon: '🪙', cost: 0, type: 'debug_medal' },
        { name: '時間を進める(5分)', icon: '⏩', cost: 0, type: 'debug_time' }
    ]
};

function initGame() {
    canvas = document.getElementById('game-canvas');
    ctx = canvas.getContext('2d');
    canvas.width = MAP_SIZE * TILE_SIZE;
    canvas.height = MAP_SIZE * TILE_SIZE;

    loadData();
    setupEvents();
    setupDragAndDrop();
    updateUIForMode();
    
    document.getElementById('title-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    
    state.camera.x = (canvas.width - window.innerWidth) / 2;
    state.camera.y = (canvas.height - window.innerHeight) / 2;

    requestAnimationFrame(render);
    
    gameLoopInterval = setInterval(() => {
        advanceGameTime(1);
    }, 1000);
}

function generateInitialMap() {
    let newMap = [];
    const centerStart = Math.floor((MAP_SIZE - 8) / 2);
    for (let r = 0; r < MAP_SIZE; r++) {
        let row = [];
        for (let c = 0; c < MAP_SIZE; c++) {
            let isCenter = r >= centerStart && r < centerStart + 8 && c >= centerStart && c < centerStart + 8;
            row.push({ ground: isCenter ? 'grass' : 'soil', isWet: false, temp: 20, fertilizer: 0, object: null });
        }
        newMap.push(row);
    }
    return newMap;
}

function updateMapStates() {
    state.activeAoEs = []; 
    for (let r = 0; r < MAP_SIZE; r++) {
        for (let c = 0; c < MAP_SIZE; c++) {
            state.map[r][c].temp = 20;
            state.map[r][c].fertilizer = 0;
            state.map[r][c].isWet = false;
        }
    }

    for (let r = 0; r < MAP_SIZE; r++) {
        for (let c = 0; c < MAP_SIZE; c++) {
            let obj = state.map[r][c].object;
            if (obj && obj.type === 'facility') {
                let upgrades = getUpgraderCount(r, c);
                obj.level = Math.min(3, 1 + upgrades);

                let baseSize = 0;
                if (obj.facilityKey === 'hot_stone' || obj.facilityKey === 'cold_stone' || obj.facilityKey === 'compost') {
                    baseSize = 5;
                } else if (obj.facilityKey === 'sprinkler') {
                    baseSize = 3;
                }

                if (baseSize > 0) {
                    let size = baseSize + upgrades * 2;
                    state.activeAoEs.push({r, c, size});
                    
                    if (obj.facilityKey === 'hot_stone') applyAreaEffect(r, c, size, (tr, tc) => state.map[tr][tc].temp += 5);
                    else if (obj.facilityKey === 'cold_stone') applyAreaEffect(r, c, size, (tr, tc) => state.map[tr][tc].temp -= 5);
                    else if (obj.facilityKey === 'compost') applyAreaEffect(r, c, size, (tr, tc) => state.map[tr][tc].fertilizer += 1);
                    else if (obj.facilityKey === 'sprinkler') applyAreaEffect(r, c, size, (tr, tc) => {
                        if (state.map[tr][tc].ground === 'field') state.map[tr][tc].isWet = true;
                    });
                }
            }
        }
    }
}

function getUpgraderCount(r, c) {
    let count = 0;
    const dirs = [[-1,0], [1,0], [0,-1], [0,1]];
    for (let d of dirs) {
        let nr = r + d[0], nc = c + d[1];
        if (nr >= 0 && nr < MAP_SIZE && nc >= 0 && nc < MAP_SIZE) {
            let obj = state.map[nr][nc].object;
            if (obj && obj.facilityKey === 'upgrader') count++;
        }
    }
    return count;
}

function applyAreaEffect(r, c, size, effectFn) {
    let half = Math.floor(size / 2);
    for (let i = r - half; i <= r + half; i++) {
        for (let j = c - half; j <= c + half; j++) {
            if (i >= 0 && i < MAP_SIZE && j >= 0 && j < MAP_SIZE) effectFn(i, j);
        }
    }
}

function advanceGameTime(seconds) {
    updateMapStates(); 

    for (let r = 0; r < MAP_SIZE; r++) {
        for (let c = 0; c < MAP_SIZE; c++) {
            let cell = state.map[r][c];
            if (cell.object && cell.object.type === 'crop' && cell.object.cropState === 'seedling') {
                let cropData = CROP_DATA[cell.object.cropKey];
                let isTempOk = cell.temp >= cropData.minTemp && cell.temp <= cropData.maxTemp;
                
                if (cell.isWet && isTempOk) {
                    cell.object.growthTimer += seconds;
                    if (cell.object.growthTimer >= cropData.time * 60) {
                        cell.object.cropState = 'ready';
                        cell.object.icon = cropData.icon;
                        cell.object.name = cropData.name;
                        
                        if(cell.object.cropKey !== 'fodder') {
                            cell.object.rank = rollQuality(cell.fertilizer);
                            cell.object.sellPrice = calculatePrice(cropData.yield, cell.object.rank);
                        } else {
                            cell.object.rank = '-';
                            cell.object.sellPrice = 0;
                        }
                    }
                }
            }
        }
    }
    updateInspectUI();
}

function rollQuality(fertilizer) {
    let f = Math.min(5, fertilizer);
    let r = Math.random();
    if (f === 0) return 'C';
    if (f === 1) return r < 0.6 ? 'C' : 'B';
    if (f === 2) return r < 0.2 ? 'C' : 'B';
    if (f === 3) return r < 0.6 ? 'B' : 'A';
    if (f === 4) return r < 0.2 ? 'B' : 'A';
    if (f === 5) return r < 0.7 ? 'A' : 'S';
    return 'C';
}

function calculatePrice(basePrice, rank) {
    if (rank === 'S') return basePrice * 5;
    if (rank === 'A') return basePrice * 3;
    if (rank === 'B') return Math.ceil(basePrice * 1.5);
    return basePrice;
}

function render() {
    canvas.width = MAP_SIZE * TILE_SIZE;
    canvas.height = MAP_SIZE * TILE_SIZE;
    canvas.style.transform = `translate(${-state.camera.x}px, ${-state.camera.y}px)`;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const startCol = Math.max(0, Math.floor(state.camera.x / TILE_SIZE));
    const endCol = Math.min(MAP_SIZE, Math.floor((state.camera.x + window.innerWidth) / TILE_SIZE) + 1);
    const startRow = Math.max(0, Math.floor(state.camera.y / TILE_SIZE));
    const endRow = Math.min(MAP_SIZE, Math.floor((state.camera.y + window.innerHeight) / TILE_SIZE) + 1);

    let time = Date.now();

    for (let r = startRow; r < endRow; r++) {
        for (let c = startCol; c < endCol; c++) {
            let cell = state.map[r][c];
            let x = c * TILE_SIZE; let y = r * TILE_SIZE;

            ctx.fillStyle = COLORS[cell.ground];
            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = 'rgba(0,0,0,0.05)';
            ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);

            if (cell.ground === 'field' && cell.isWet) {
                ctx.fillStyle = '#654321';
                ctx.beginPath();
                ctx.arc(x + TILE_SIZE/2, y + TILE_SIZE/2, TILE_SIZE/2 - 1, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    // 効果範囲の常時発光
    let aoeAlpha = (Math.sin(time / 300) + 1) / 2 * 0.4; // 0 ~ 0.4 で変動
    ctx.fillStyle = `rgba(0, 100, 255, ${aoeAlpha})`;
    for (let aoe of state.activeAoEs) {
        let half = Math.floor(aoe.size / 2);
        let startX = Math.max(0, aoe.c - half) * TILE_SIZE;
        let startY = Math.max(0, aoe.r - half) * TILE_SIZE;
        let w = (Math.min(MAP_SIZE - 1, aoe.c + half) - Math.max(0, aoe.c - half) + 1) * TILE_SIZE;
        let h = (Math.min(MAP_SIZE - 1, aoe.r + half) - Math.max(0, aoe.r - half) + 1) * TILE_SIZE;
        ctx.fillRect(startX, startY, w, h);
    }

    // 上物描画
    for (let r = startRow; r < endRow; r++) {
        for (let c = startCol; c < endCol; c++) {
            let cell = state.map[r][c];
            let x = c * TILE_SIZE; let y = r * TILE_SIZE;

            if (cell.object) {
                if (cell.object.facilityKey === 'fence') {
                    // 柵の場合は2本の杭を描画
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(x + TILE_SIZE * 0.2, y + TILE_SIZE * 0.2, TILE_SIZE * 0.15, TILE_SIZE * 0.6);
                    ctx.fillRect(x + TILE_SIZE * 0.65, y + TILE_SIZE * 0.2, TILE_SIZE * 0.15, TILE_SIZE * 0.6);
                    // 杭を繋ぐ横木
                    ctx.fillRect(x + TILE_SIZE * 0.15, y + TILE_SIZE * 0.35, TILE_SIZE * 0.7, TILE_SIZE * 0.15);
                } else {
                    // 透過設定をリセットして不透明にする
                    ctx.fillStyle = '#000000';
                    ctx.font = `${TILE_SIZE * 0.7}px sans-serif`;
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText(cell.object.icon, x + TILE_SIZE/2, y + TILE_SIZE/2 + 2);
                }

                if ((cell.object.type === 'crop' && (cell.object.rank === 'A' || cell.object.rank === 'S')) ||
                    (cell.object.type === 'facility' && cell.object.level === 3)) {
                    drawSparkles(ctx, x, y, TILE_SIZE, cell.object.type === 'crop' ? '#FFD700' : '#FFFFFF', time);
                }
            }

            if (state.selectedTile && state.selectedTile.r === r && state.selectedTile.c === c) {
                ctx.lineWidth = Math.max(2, TILE_SIZE * 0.08); ctx.strokeStyle = '#FFD700';
                ctx.strokeRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                ctx.lineWidth = Math.max(1, TILE_SIZE * 0.04); ctx.strokeStyle = '#000';
                ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
            }
        }
    }

    // ドラッグ中のアイテムと効果範囲
    if (state.draggingMapItem) {
        let obj = state.draggingMapItem.object;
        let worldX = state.dragCoords.x + state.camera.x;
        let worldY = state.dragCoords.y - 16 + state.camera.y;

        let c = Math.floor(worldX / TILE_SIZE);
        let r = Math.floor(worldY / TILE_SIZE);

        let baseSize = 0;
        if (obj.facilityKey === 'hot_stone' || obj.facilityKey === 'cold_stone' || obj.facilityKey === 'compost') baseSize = 5;
        if (obj.facilityKey === 'sprinkler') baseSize = 3;

        if (baseSize > 0) {
            let upgrades = getUpgraderCount(r, c);
            let size = baseSize + upgrades * 2;
            let half = Math.floor(size / 2);
            let startX = Math.max(0, c - half) * TILE_SIZE;
            let startY = Math.max(0, r - half) * TILE_SIZE;
            let w = (Math.min(MAP_SIZE - 1, c + half) - Math.max(0, c - half) + 1) * TILE_SIZE;
            let h = (Math.min(MAP_SIZE - 1, r + half) - Math.max(0, r - half) + 1) * TILE_SIZE;
            
            ctx.fillStyle = `rgba(0, 100, 255, ${aoeAlpha})`;
            ctx.fillRect(startX, startY, w, h);
        }

        let drawX = worldX - TILE_SIZE/2;
        let drawY = worldY - TILE_SIZE/2;

        if (obj.facilityKey === 'fence') {
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(drawX + TILE_SIZE * 0.2, drawY + TILE_SIZE * 0.2, TILE_SIZE * 0.15, TILE_SIZE * 0.6);
            ctx.fillRect(drawX + TILE_SIZE * 0.65, drawY + TILE_SIZE * 0.2, TILE_SIZE * 0.15, TILE_SIZE * 0.6);
            ctx.fillRect(drawX + TILE_SIZE * 0.15, drawY + TILE_SIZE * 0.35, TILE_SIZE * 0.7, TILE_SIZE * 0.15);
        } else {
            // ここも透過を引き継がないようにリセット
            ctx.fillStyle = '#000000';
            ctx.font = `${TILE_SIZE * 0.7}px sans-serif`;
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(obj.icon, drawX + TILE_SIZE/2, drawY + TILE_SIZE/2 + 2);
        }
    }

    requestAnimationFrame(render);
}

function drawSparkles(ctx, x, y, size, color, time) {
    ctx.fillStyle = color;
    let t = time / 200;
    for(let i = 0; i < 3; i++) {
        let angle = t + i * (Math.PI * 2 / 3);
        let px = x + size/2 + Math.cos(angle) * (size * 0.35);
        let py = y + size/2 + Math.sin(angle) * (size * 0.35);
        ctx.beginPath(); ctx.arc(px, py, Math.max(1, size * 0.06), 0, Math.PI*2); ctx.fill();
    }
}

function renderMenu(tabKey) {
    const list = document.getElementById('menu-items-list');
    list.innerHTML = '';
    const items = MENU_DATA[tabKey] || [];
    
    items.forEach(item => {
        const div = document.createElement('div');
        if(tabKey === 'debug') {
            div.className = 'menu-item debug-btn';
            div.innerText = `${item.icon} ${item.name}`;
            div.addEventListener('click', () => {
                if(item.type === 'debug_time') { advanceGameTime(5*60); updateMapStates(); alert("5分経過"); }
                if(item.type === 'debug_medal') addMedal(1000, window.innerWidth/2, window.innerHeight/2);
            });
        } else {
            div.className = 'menu-item drag-item';
            div.innerHTML = `<span style="font-size:1.5rem">${item.icon}</span> 
                             <div style="flex-grow:1"><b>${item.name}</b><br><span style="color:#666">🪙${item.cost}</span></div>`;
            div.dataset.item = JSON.stringify(item);
        }
        list.appendChild(div);
    });
}

function setupEvents() {
    document.querySelectorAll('.menu-tab').forEach(tab => {
        tab.addEventListener('click', (e) => {
            if(state.mode === 'view') return;
            const target = e.target.dataset.target;
            const titleMap = { ground:'地面', crop:'作物', facility:'施設', livestock:'家畜', pet:'ペット', decoration:'装飾品', debug:'デバッグ' };
            if (state.isMenuOpen && state.activeMenuTab === target) {
                document.getElementById('menu-container').classList.remove('open');
                state.isMenuOpen = false;
            } else {
                document.getElementById('menu-container').classList.add('open');
                document.getElementById('menu-title').innerText = `メニュー：${titleMap[target]}`;
                renderMenu(target);
                state.isMenuOpen = true;
                state.activeMenuTab = target;
            }
        });
    });

    let isDragging = false;
    let startX, startY, camStartX, camStartY;
    const mainArea = document.getElementById('main-area');

    mainArea.addEventListener('touchstart', (e) => {
        if(e.target.closest('#menu-container')) return;

        // ピックモード時の施設移動判定
        if (state.mode === 'pick') {
            let mx = e.touches[0].clientX + state.camera.x;
            let my = e.touches[0].clientY - 16 + state.camera.y;
            let c = Math.floor(mx / TILE_SIZE);
            let r = Math.floor(my / TILE_SIZE);
            
            if (r >= 0 && r < MAP_SIZE && c >= 0 && c < MAP_SIZE) {
                let cell = state.map[r][c];
                // アップグレーダー以外の施設ならドラッグ可能
                if (cell.object && cell.object.type === 'facility' && cell.object.facilityKey !== 'upgrader') {
                    state.draggingMapItem = { r, c, object: cell.object };
                    cell.object = null; 
                    state.dragCoords = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    e.preventDefault(); 
                    return; 
                }
            }
        }

        isDragging = true;
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        camStartX = state.camera.x; camStartY = state.camera.y;
    }, {passive: false});

    mainArea.addEventListener('touchmove', (e) => {
        if (state.draggingMapItem) {
            state.dragCoords = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            e.preventDefault();
            return;
        }

        if (!isDragging) return;
        state.camera.x = Math.max(0, Math.min(canvas.width - window.innerWidth, camStartX + (startX - e.touches[0].clientX)));
        state.camera.y = Math.max(0, Math.min(canvas.height - window.innerHeight + 40, camStartY + (startY - e.touches[0].clientY)));
    }, {passive: false});

    mainArea.addEventListener('touchend', (e) => {
        if (state.draggingMapItem) {
            let mx = e.changedTouches[0].clientX + state.camera.x;
            let my = e.changedTouches[0].clientY - 16 + state.camera.y;
            let c = Math.floor(mx / TILE_SIZE);
            let r = Math.floor(my / TILE_SIZE);

            if (r >= 0 && r < MAP_SIZE && c >= 0 && c < MAP_SIZE && !state.map[r][c].object) {
                state.map[r][c].object = state.draggingMapItem.object;
            } else {
                state.map[state.draggingMapItem.r][state.draggingMapItem.c].object = state.draggingMapItem.object;
            }
            state.draggingMapItem = null;
            updateMapStates(); 
            return;
        }

        if (!isDragging) return;
        isDragging = false;
        let endX = e.changedTouches[0].clientX; let endY = e.changedTouches[0].clientY;
        if (Math.abs(startX - endX) < 10 && Math.abs(startY - endY) < 10) {
            handleTap(endX, endY);
        }
    });

    let zoomTimer;
    const btnView = document.getElementById('mode-view');
    
    const startZoomTimer = (e) => {
        e.preventDefault(); 
        setMode('view');
        zoomTimer = setTimeout(() => {
            if(!state.isZoomedOut) toggleZoom(true);
        }, 400);
    };
    const cancelZoom = () => {
        clearTimeout(zoomTimer);
        if(state.isZoomedOut) toggleZoom(false);
    };

    btnView.addEventListener('touchstart', startZoomTimer, {passive: false});
    btnView.addEventListener('touchend', cancelZoom);
    btnView.addEventListener('mousedown', startZoomTimer);
    window.addEventListener('mouseup', cancelZoom);

    ['inspect', 'pick'].forEach(m => {
        document.getElementById(`mode-${m}`).addEventListener('click', () => setMode(m));
    });

    document.getElementById('btn-stats').addEventListener('click', () => {
        const overlay = document.getElementById('farm-stats-overlay');
        overlay.style.display = (overlay.style.display === 'block') ? 'none' : 'block';
    });
}

function setMode(newMode) {
    state.mode = newMode;
    document.querySelectorAll('.footer-btn').forEach(b => { if(b.id.startsWith('mode-')) b.classList.remove('active') });
    document.getElementById(`mode-${newMode}`).classList.add('active');
    document.getElementById('status-area').style.display = (newMode === 'inspect') ? 'block' : 'none';
    
    if (newMode !== 'inspect') {
        state.selectedTile = null;
    }
    updateUIForMode();
}

function updateUIForMode() {
    const isView = state.mode === 'view';
    document.getElementById('menu-tabs').style.opacity = isView ? '0' : '1';
    document.getElementById('menu-tabs').style.pointerEvents = isView ? 'none' : 'auto';
    document.getElementById('fodder-status').style.opacity = isView ? '0' : '1';
    
    if(isView && state.isMenuOpen) {
        document.getElementById('menu-container').classList.remove('open');
        state.isMenuOpen = false;
    }
}

function toggleZoom(enable) {
    state.isZoomedOut = enable;
    let oldSize = TILE_SIZE;
    TILE_SIZE = enable ? 24 : 48;
    let scale = TILE_SIZE / oldSize;
    
    let cx = state.camera.x + window.innerWidth / 2;
    let cy = state.camera.y + window.innerHeight / 2;
    state.camera.x = Math.max(0, Math.min((MAP_SIZE * TILE_SIZE) - window.innerWidth, cx * scale - window.innerWidth / 2));
    state.camera.y = Math.max(0, Math.min((MAP_SIZE * TILE_SIZE) - window.innerHeight + 40, cy * scale - window.innerHeight / 2));
}

function setupDragAndDrop() {
    let draggedItemData = null;
    const ghost = document.getElementById('drag-ghost');
    
    let initialTouch = null;
    let dragIntent = false;

    document.getElementById('menu-items-list').addEventListener('touchstart', (e) => {
        const itemEl = e.target.closest('.drag-item');
        if (!itemEl) return;
        
        initialTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY, itemEl: itemEl };
        dragIntent = false;
    }, {passive: true});

    document.addEventListener('touchmove', (e) => {
        if (initialTouch && !dragIntent) {
            let dx = Math.abs(e.touches[0].clientX - initialTouch.x);
            let dy = Math.abs(e.touches[0].clientY - initialTouch.y);
            if (dx > 10 && dx > dy) { 
                dragIntent = true;
                draggedItemData = JSON.parse(initialTouch.itemEl.dataset.item);
                ghost.innerText = draggedItemData.icon;
                ghost.style.display = 'block';
            } else if (dy > 10) {
                initialTouch = null;
            }
        }

        if (dragIntent && draggedItemData) {
            const touch = e.touches[0];
            ghost.style.left = touch.clientX + 'px';
            ghost.style.top = touch.clientY + 'px';
            
            if (draggedItemData.type !== 'ground' && touch.clientX > 240 && state.isMenuOpen) {
                document.getElementById('menu-container').classList.remove('open');
                state.isMenuOpen = false;
            }
            e.preventDefault(); 
        }
    }, {passive: false});

    document.addEventListener('touchend', (e) => {
        if (dragIntent && draggedItemData) {
            ghost.style.display = 'none';
            const touch = e.changedTouches[0];
            if (touch.clientX > 240 || !state.isMenuOpen) {
                processDropOnMap(touch.clientX, touch.clientY, draggedItemData);
            }
            draggedItemData = null;
        }
        initialTouch = null;
        dragIntent = false;
    });
}

function processDropOnMap(screenX, screenY, item) {
    let mx = screenX + state.camera.x;
    let my = screenY - 16 + state.camera.y;
    let c = Math.floor(mx / TILE_SIZE);
    let r = Math.floor(my / TILE_SIZE);

    if (r >= 0 && r < MAP_SIZE && c >= 0 && c < MAP_SIZE) {
        let cell = state.map[r][c];

        if (item.type === 'ground') {
            if (cell.object !== null) return alert("上物があるマスは変更できません");
            if (state.medals < item.cost) return alert("メダルが足りません");
            addMedal(-item.cost, screenX, screenY);
            cell.ground = item.groundType;
            updateMapStates();
        } 
        else if (item.type === 'seed') {
            if (cell.ground !== 'field') return alert("種は畑にのみ植えられます");
            if (cell.object !== null) return alert("既に上物があります");
            if (state.medals < item.cost) return alert("メダルが足りません");
            
            addMedal(-item.cost, screenX, screenY);
            let cropDef = CROP_DATA[item.cropKey];
            cell.object = { 
                type: 'crop', cropKey: item.cropKey, icon: '🌱', name: `${cropDef.name}の苗`, 
                cropState: 'seedling', harvestsLeft: cropDef.maxHarvest, growthTimer: 0 
            };
        }
        else {
            if (cell.object !== null) return alert("既に上物があります");
            if (state.medals < item.cost) return alert("メダルが足りません");
            
            addMedal(-item.cost, screenX, screenY);
            cell.object = { icon: item.icon, name: item.name, type: item.type, facilityKey: item.facilityKey };
            updateMapStates(); 
        }
    }
}

function handleTap(sx, sy) {
    let mx = sx + state.camera.x;
    let my = sy - 16 + state.camera.y;
    let c = Math.floor(mx / TILE_SIZE);
    let r = Math.floor(my / TILE_SIZE);

    if (r >= 0 && r < MAP_SIZE && c >= 0 && c < MAP_SIZE) {
        state.selectedTile = { r, c };
        let cell = state.map[r][c];

        let now = Date.now();
        if (state.lastTap.r === r && state.lastTap.c === c && (now - state.lastTap.time) < 300) {
            if (cell.object && cell.object.type === 'facility') {
                if (confirm(`${cell.object.name}を消去してよろしいですか？`)) {
                    cell.object = null;
                    updateMapStates();
                    updateInspectUI();
                }
            }
            state.lastTap.time = 0;
            return;
        }
        state.lastTap = { time: now, r, c };

        if (state.mode === 'inspect') {
            updateInspectUI();
        } 
        else if (state.mode === 'pick' && cell.object) {
            if (cell.object.type === 'trash' && state.medals >= 100) {
                addMedal(-100, sx, sy);
                cell.object = null;
            } 
            else if (cell.object.type === 'crop' && cell.object.cropState === 'ready') {
                let cropDef = CROP_DATA[cell.object.cropKey];
                
                if (cell.object.cropKey === 'fodder') {
                    state.fodder++;
                    document.getElementById('fodder-status').innerText = `🌿：${state.fodder}個`;
                    showPopText("🌿+1", sx, sy, '#32CD32');
                } else {
                    addMedal(cell.object.sellPrice, sx, sy);
                }

                cell.object.harvestsLeft--;
                if (cell.object.harvestsLeft <= 0) {
                    cell.object = null;
                } else {
                    cell.object.cropState = 'seedling';
                    cell.object.icon = '🌱';
                    cell.object.name = `${cropDef.name}の苗`;
                    cell.object.growthTimer = 0;
                    cell.object.rank = undefined;
                    cell.object.sellPrice = undefined;
                }
                updateInspectUI();
            }
        }
    }
}

function updateInspectUI() {
    if(state.mode !== 'inspect' || !state.selectedTile) return;
    let {r, c} = state.selectedTile;
    let cell = state.map[r][c];
    
    let objText = `上物: ${cell.object ? cell.object.name : 'なし'}`;
    if (cell.object) {
        if (cell.object.type === 'crop') {
            if (cell.object.cropState === 'seedling') {
                let stars = '⭐'.repeat(Math.min(5, cell.fertilizer));
                objText += `<br>(肥料: ${stars || 'なし'})`;
            } else if (cell.object.cropKey !== 'fodder') {
                objText += `<br>(ランク: ${cell.object.rank}, 価値: 🪙${cell.object.sellPrice})`;
            }
        } else if (cell.object.type === 'facility' && cell.object.level) {
            let lvText = cell.object.level === 3 ? 'MAX' : cell.object.level;
            objText += ` (Lv.${lvText})`;
        }
    }
    
    document.getElementById('status-obj').innerHTML = objText;
    document.getElementById('status-ground').innerText = `地面: ${GROUND_NAMES[cell.ground] || '不明'}`;
    document.getElementById('status-temp').innerText = `気温: ${cell.temp}℃${cell.isWet ? ' (湿)' : ''}`;
}

function showPopText(text, x, y, color) {
    const pop = document.createElement('div');
    pop.className = 'pop-text';
    pop.style.left = `${x}px`; pop.style.top = `${y}px`;
    pop.style.color = color;
    pop.innerText = text;
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 1000);
}

function addMedal(amt, x, y) {
    state.medals += amt;
    document.getElementById('medal-count').innerText = `🪙: ${state.medals}`;
    if(amt !== 0) showPopText(`🪙${amt > 0 ? '+' : ''}${amt}`, x, y, amt >= 0 ? '#4169E1' : '#DC143C');
}

function loadData() {
    state.map = generateInitialMap();
    document.getElementById('medal-count').innerText = `🪙: ${state.medals}`;
    document.getElementById('fodder-status').innerText = `🌿：${state.fodder}個`;
}

document.getElementById('start-btn').addEventListener('click', initGame);
</script>
