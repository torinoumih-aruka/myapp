<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>8x8 ドット絵エディター & アニメーションプレビュー</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --border-color: #333;
      --text-color: #e0e0e0;
      --accent-color: #4a90e2;
      --accent-hover: #357abd;
      --danger-color: #e24a4a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; padding: 0;
      background-color: var(--bg-color); color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* 透明背景用スタイル */
    [data-bg="checker"] {
      background-color: #fff;
      background-image: 
        linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%, #ccc),
        linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%, #ccc);
      background-size: 16px 16px; background-position: 0 0, 8px 8px;
    }
    [data-bg="red"] { background-color: #ff4d4d; background-image: none; }
    [data-bg="blue"] { background-color: #4d4dff; background-image: none; }
    [data-bg="yellow"] { background-color: #ffff4d; background-image: none; }
    [data-bg="green"] { background-color: #4dff4d; background-image: none; }
    [data-bg="pink"] { background-color: #ff80df; background-image: none; }
    [data-bg="purple"] { background-color: #bf40ff; background-image: none; }
    [data-bg="black"] { background-color: #000000; background-image: none; }
    [data-bg="gray"] { background-color: #808080; background-image: none; }

    header {
      background-color: #1a1a1a; padding: 15px 20px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    h1 { margin: 0; font-size: 1.2rem; }
    h2 { margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 15px;}
    h3 { margin-top: 10px; margin-bottom: 5px; font-size: 0.9rem; color: #aaa; }

    button {
      background-color: var(--accent-color); color: white; border: none;
      padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) { background-color: var(--accent-hover); }
    button.danger { background-color: var(--danger-color); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    input, select, textarea {
      background: #2a2a2a; color: var(--text-color); border: 1px solid var(--border-color);
      padding: 6px; border-radius: 4px; font-family: inherit;
    }

    .container {
      max-width: 1200px; margin: 0 auto; padding: 20px;
      display: grid; grid-template-columns: 1fr; gap: 20px;
    }
    @media(min-width: 800px) { .container { grid-template-columns: minmax(300px, 1fr) 350px; } }

    .panel {
      background-color: var(--panel-bg); border: 1px solid var(--border-color);
      border-radius: 8px; padding: 15px; margin-bottom: 20px;
    }

    /* Palette */
    .palette-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .color-swatch-container { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .color-swatch {
      width: 32px; height: 32px; border-radius: 4px; border: 2px solid transparent;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-weight: bold; color: #000; text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff;
    }
    .color-swatch.active { border-color: var(--accent-color); transform: scale(1.1); }
    #color-picker { width: 36px; height: 36px; padding: 0; cursor: pointer; }
    #color-picker:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Editor */
    .editor-container { display: flex; justify-content: center; margin: 20px 0; }
    #editor-canvas {
      width: 100%; max-width: 400px; aspect-ratio: 1; image-rendering: pixelated;
      cursor: crosshair; touch-action: none; border: 2px solid var(--border-color);
    }
    .editor-tools { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }

    /* Sprite List */
    .sprite-list { display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; }
    .sprite-item {
      display: flex; align-items: center; justify-content: space-between; background: #2a2a2a;
      padding: 8px; border-radius: 4px; cursor: pointer; border: 1px solid transparent;
    }
    .sprite-item:hover { background: #333; }
    .sprite-item.active { border-color: var(--accent-color); }
    .sprite-item canvas { width: 32px; height: 32px; image-rendering: pixelated; border: 1px solid #000; }
    .sprite-info { flex: 1; margin-left: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
    .sprite-actions { display: flex; gap: 4px; }
    .sprite-actions button { padding: 4px 6px; font-size: 0.8rem; }

    /* Animation */
    .anim-controls { display: flex; flex-direction: column; gap: 10px; }
    .anim-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    #anim-canvas {
      margin: 10px auto; display: block; image-rendering: pixelated; border: 2px solid var(--border-color);
    }
  </style>
</head>
<body>

<header>
  <h1>8x8 Sprite Editor</h1>
</header>

<div class="container">
  <div class="left-col">
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <div class="panel" style="margin-bottom:0;">
        <h2>データ管理</h2>
        <div style="margin-bottom: 10px;">
          <button id="btn-export" style="width:100%; margin-bottom:5px;">ファイル出力 (JSON)</button>
        </div>
        <div style="margin-bottom: 10px; padding-top:10px; border-top:1px solid var(--border-color);">
          <button id="btn-save-local" style="width:100%; margin-bottom:5px;">ブラウザにSAVE (名前付)</button>
          <div style="display:flex; gap:5px;">
            <select id="save-data-select" style="flex:1;"><option value="">-- 選択 --</option></select>
            <button id="btn-load-local">LOAD</button>
          </div>
        </div>
      </div>

      <div class="panel" style="margin-bottom:0;">
        <h2>設定</h2>
        <div style="margin-bottom: 10px;">
          <label style="display:block; margin-bottom:5px; font-size:0.9rem;">透明部分の背景色:</label>
          <select id="bg-color-select" style="width:100%;">
            <option value="checker">市松模様</option>
            <option value="red">赤</option>
            <option value="blue">青</option>
            <option value="yellow">黄</option>
            <option value="green">緑</option>
            <option value="pink">ピンク</option>
            <option value="purple">紫</option>
            <option value="black">黒</option>
            <option value="gray">灰色</option>
          </select>
        </div>
        <div id="manual-input-area" style="display:none; margin-top:15px;">
          <p style="font-size: 0.8rem; margin:0 0 5px 0;">直接JSON読込</p>
          <textarea id="json-input" style="height:60px;" placeholder='{"palette": {...}, "sprites": {...}}'></textarea>
          <button id="btn-load-json" style="width:100%; margin-top:5px;">読み込む</button>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-top: 20px;">
      <h2>エディター</h2>
      
      <div style="margin-bottom: 15px;">
        <h3>パレット</h3>
        <div id="palette-grid" class="palette-grid"></div>
        <div style="display: flex; gap: 15px; margin-top: 10px; align-items: center; flex-wrap: wrap;">
          <div style="display: flex; align-items: center; gap: 5px;">
            <label for="color-picker" style="font-size: 0.9rem;">選択色を編集:</label>
            <input type="color" id="color-picker" disabled>
          </div>
          <button id="btn-add-color">色を追加</button>
          <button id="btn-del-color" class="danger">色を削除</button>
        </div>
      </div>

      <div style="text-align: center; font-size: 1.2rem; font-weight: bold; margin-bottom: 5px;" id="current-sprite-name">-</div>
      
      <div class="editor-container">
        <canvas id="editor-canvas" data-bg="checker" width="320" height="320"></canvas>
      </div>
      
      <div class="editor-tools">
        <button id="btn-copy">コピー</button>
        <button id="btn-paste" disabled>ペースト</button>
        <button id="btn-paste-v" disabled>上下反転ペースト</button>
        <button id="btn-paste-h" disabled>左右反転ペースト</button>
      </div>
    </div>
  </div>

  <div class="right-col">
    
    <div class="panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h2 style="margin: 0; border: none; padding:0;">スプライト</h2>
        <button id="btn-add-sprite">+ 新規</button>
      </div>
      <div id="sprite-list" class="sprite-list"></div>
    </div>

    <div class="panel">
      <h2>プレビュー</h2>
      <div class="anim-controls">
        <div class="anim-row">
          <select id="anim-f1" style="width:30%"></select> →
          <select id="anim-f2" style="width:30%"></select> →
          <select id="anim-f3" style="width:30%"><option value="">-- なし --</option></select>
        </div>
        <div class="anim-row">
          <label style="font-size:0.9rem;">再生:</label>
          <select id="anim-pattern" style="flex:1;">
            <option value="A">1 → 2 (2枚用)</option>
            <option value="B">1 → 2 → 3 → 2 (3枚往復)</option>
            <option value="C">1 → 2 → 3 (3枚ループ)</option>
          </select>
        </div>
        <div class="anim-row" style="font-size:0.9rem;">
          サイズ: 
          <select id="anim-size">
            <option value="large">大</option>
            <option value="medium" selected>中</option>
            <option value="small">小</option>
          </select>
          速度:
          <select id="anim-speed">
            <option value="100">高速</option>
            <option value="250" selected>普通</option>
            <option value="500">ゆっくり</option>
          </select>
        </div>
        <div style="text-align: center; margin-top: 5px;">
          <button id="btn-play-anim">再生</button>
          <button id="btn-stop-anim">停止</button>
        </div>
        <canvas id="anim-canvas" data-bg="checker" width="128" height="128"></canvas>
      </div>
    </div>

  </div>
</div>

<script>
// --- State ---
let state = {
  palette: { ".": null },
  sprites: {}, 
  currentKey: null,
  currentColor: "."
};

let animTimer = null;
let currentBgColor = 'checker';
let copiedSprite = null; // コピーした2次元配列データ

// --- DOM Elements ---
const elEditorCanvas = document.getElementById('editor-canvas');
const ctxEditor = elEditorCanvas.getContext('2d');
const elPaletteGrid = document.getElementById('palette-grid');
const elColorPicker = document.getElementById('color-picker');
const elSpriteList = document.getElementById('sprite-list');
const elCurrentSpriteName = document.getElementById('current-sprite-name');
const elAnimCanvas = document.getElementById('anim-canvas');
const ctxAnim = elAnimCanvas.getContext('2d');
const selBgColor = document.getElementById('bg-color-select');

// --- Initialization ---
async function init() {
  loadSaveList();
  try {
    const res = await fetch('./assets.json');
    if (!res.ok) throw new Error('File not found');
    const data = await res.json();
    loadData(data);
  } catch (e) {
    document.getElementById('manual-input-area').style.display = 'block';
    loadData({
      palette: { ".": null, "1": "#002288", "2": "#a05040" },
      sprites: {
        "player_1": ["........", ".111111.", "1.1111.1", "11111111", "11.11.11", "1.1111.1", ".1....1.", "..1111.."]
      }
    });
  }
}

// --- Data Management (SAVE/LOAD) ---
function loadData(json) {
  state.palette = json.palette || { ".": null };
  state.sprites = {};
  if (json.sprites) {
    for (const [key, lines] of Object.entries(json.sprites)) {
      state.sprites[key] = lines.map(line => line.split(''));
    }
  }
  state.currentColor = ".";
  state.currentKey = Object.keys(state.sprites)[0] || null;
  
  renderPalette();
  renderSpriteList();
  updateAnimSelects();
  drawEditor();
}

function loadSaveList() {
  const data = JSON.parse(localStorage.getItem('asset_studio_data')) || {};
  const sel = document.getElementById('save-data-select');
  sel.innerHTML = '<option value="">-- 選択 --</option>';
  Object.keys(data).forEach(k => {
    const opt = document.createElement('option');
    opt.value = k; opt.innerText = k; sel.appendChild(opt);
  });
}

document.getElementById('btn-save-local').addEventListener('click', () => {
  const name = prompt("保存する名前を入力してください:");
  if(!name) return;
  const data = JSON.parse(localStorage.getItem('asset_studio_data')) || {};
  
  // 出力用形式に変換
  const outSprites = {};
  for (const [key, grid] of Object.entries(state.sprites)) {
    outSprites[key] = grid.map(row => row.join(''));
  }
  
  data[name] = { palette: state.palette, sprites: outSprites };
  localStorage.setItem('asset_studio_data', JSON.stringify(data));
  loadSaveList();
  document.getElementById('save-data-select').value = name;
  alert(`「${name}」として保存しました。`);
});

document.getElementById('btn-load-local').addEventListener('click', () => {
  const name = document.getElementById('save-data-select').value;
  if(!name) return alert("読み込むデータを選択してください。");
  const data = JSON.parse(localStorage.getItem('asset_studio_data')) || {};
  if(data[name]) loadData(data[name]);
});

document.getElementById('btn-load-json').addEventListener('click', () => {
  try {
    const data = JSON.parse(document.getElementById('json-input').value);
    loadData(data);
    document.getElementById('manual-input-area').style.display = 'none';
  } catch (e) { alert("無効なJSON形式です。"); }
});

document.getElementById('btn-export').addEventListener('click', () => {
  const outSprites = {};
  for (const [key, grid] of Object.entries(state.sprites)) { outSprites[key] = grid.map(row => row.join('')); }
  const outJson = JSON.stringify({ palette: state.palette, sprites: outSprites }, null, 2);
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if (isMobile) {
    window.location.href = `mailto:?subject=Assets JSON&body=${encodeURIComponent(outJson)}`;
  } else {
    navigator.clipboard.writeText(outJson).then(() => alert("JSONをクリップボードにコピーしました！")).catch(e => alert(e));
  }
});

// --- Settings (Background Color) ---
selBgColor.addEventListener('change', (e) => {
  currentBgColor = e.target.value;
  document.querySelectorAll('[data-bg]').forEach(el => el.setAttribute('data-bg', currentBgColor));
});

// --- Copy & Paste ---
function updatePasteButtons() {
  const hasCopied = copiedSprite !== null;
  document.getElementById('btn-paste').disabled = !hasCopied;
  document.getElementById('btn-paste-v').disabled = !hasCopied;
  document.getElementById('btn-paste-h').disabled = !hasCopied;
}

document.getElementById('btn-copy').addEventListener('click', () => {
  if(!state.currentKey) return;
  // Deep copy 2D array
  copiedSprite = state.sprites[state.currentKey].map(row => [...row]);
  updatePasteButtons();
});

function applyPaste(mode) {
  if(!state.currentKey || !copiedSprite) return;
  let newGrid = copiedSprite.map(row => [...row]); // Deep copy from clipboard
  
  if (mode === 'v') {
    newGrid.reverse();
  } else if (mode === 'h') {
    newGrid = newGrid.map(row => row.slice().reverse());
  }
  
  state.sprites[state.currentKey] = newGrid;
  drawEditor();
  renderSpriteList();
}
document.getElementById('btn-paste').addEventListener('click', () => applyPaste('normal'));
document.getElementById('btn-paste-v').addEventListener('click', () => applyPaste('v'));
document.getElementById('btn-paste-h').addEventListener('click', () => applyPaste('h'));


// --- Render Palette ---
function renderPalette() {
  elPaletteGrid.innerHTML = '';
  // '.' を除外してソートし、先頭に '.' を追加
  const keys = Object.keys(state.palette).filter(k => k !== '.').sort();
  keys.unshift('.');

  keys.forEach(key => {
    const container = document.createElement('div');
    container.className = 'color-swatch-container';

    const swatch = document.createElement('div');
    swatch.className = `color-swatch ${key === state.currentColor ? 'active' : ''}`;
    
    if (key === '.') {
      swatch.setAttribute('data-bg', currentBgColor); // 透明色の設定適用
      swatch.innerText = '.';
    } else {
      swatch.style.backgroundColor = state.palette[key];
      swatch.innerText = key;
    }

    swatch.addEventListener('click', (e) => {
      if(e.target === swatch) {
        state.currentColor = key;
        renderPalette();
      }
    });

    container.appendChild(swatch);
    elPaletteGrid.appendChild(container);
  });

  if (state.currentColor === '.') {
    elColorPicker.disabled = true; elColorPicker.value = '#000000';
  } else {
    elColorPicker.disabled = false; elColorPicker.value = state.palette[state.currentColor];
  }
}

elColorPicker.addEventListener('input', (e) => {
  if (state.currentColor !== '.' && state.palette[state.currentColor]) {
    state.palette[state.currentColor] = e.target.value;
    renderPalette(); drawEditor(); renderSpriteList();
  }
});

document.getElementById('btn-add-color').addEventListener('click', () => {
  const key = prompt("色番号を入力してください (0-9, A-Z):");
  if (!key) return;
  if (!/^[0-9A-Z]$/.test(key)) return alert("キーは 0〜9 または A〜Z (大文字) を指定してください。");
  if (state.palette.hasOwnProperty(key)) return alert("そのキーは既に存在します。");
  
  state.palette[key] = "#ffffff";
  state.currentColor = key;
  renderPalette();
});

document.getElementById('btn-del-color').addEventListener('click', () => {
  if (state.currentColor === '.') return alert("透明(.)は削除できません。");
  if (confirm(`色「${state.currentColor}」を削除しますか？`)) {
    delete state.palette[state.currentColor];
    state.currentColor = '.';
    renderPalette(); drawEditor(); renderSpriteList();
  }
});

// --- Render Sprite List ---
function moveSprite(key, direction) {
  const keys = Object.keys(state.sprites);
  const idx = keys.indexOf(key);
  if (direction === -1 && idx > 0) {
    [keys[idx-1], keys[idx]] = [keys[idx], keys[idx-1]];
  } else if (direction === 1 && idx < keys.length - 1) {
    [keys[idx], keys[idx+1]] = [keys[idx+1], keys[idx]];
  } else {
    return; // 移動不可
  }
  
  // 新しい順序でオブジェクト再構築
  const newSprites = {};
  keys.forEach(k => { newSprites[k] = state.sprites[k]; });
  state.sprites = newSprites;
  renderSpriteList();
  updateAnimSelects();
}

function renderSpriteList() {
  elSpriteList.innerHTML = '';
  for (const key of Object.keys(state.sprites)) {
    const item = document.createElement('div');
    item.className = `sprite-item ${key === state.currentKey ? 'active' : ''}`;
    
    const thumb = document.createElement('canvas');
    thumb.width = 8; thumb.height = 8; 
    thumb.setAttribute('data-bg', currentBgColor);
    drawGridToCanvas(thumb.getContext('2d'), state.sprites[key], 1);
    
    const info = document.createElement('div');
    info.className = 'sprite-info'; info.innerText = key;
    
    const actions = document.createElement('div');
    actions.className = 'sprite-actions';
    
    const btnUp = document.createElement('button'); btnUp.innerText = '▲';
    btnUp.onclick = (e) => { e.stopPropagation(); moveSprite(key, -1); };
    
    const btnDown = document.createElement('button'); btnDown.innerText = '▼';
    btnDown.onclick = (e) => { e.stopPropagation(); moveSprite(key, 1); };
    
    const btnRename = document.createElement('button'); btnRename.innerText = '名';
    btnRename.onclick = (e) => {
      e.stopPropagation();
      const newKey = prompt("新しい名前を入力してください:", key);
      if (newKey && newKey !== key) {
        if(state.sprites[newKey]) return alert("既に存在する名前です。");
        state.sprites[newKey] = state.sprites[key];
        delete state.sprites[key];
        if (state.currentKey === key) state.currentKey = newKey;
        // キー名を変更したら一番後ろにいってしまうのを防ぐならここも再構築が必要だが今回は末尾追加扱い
        renderSpriteList(); updateAnimSelects();
      }
    };
    
    const btnDel = document.createElement('button'); btnDel.className = 'danger'; btnDel.innerText = '削';
    btnDel.onclick = (e) => {
      e.stopPropagation();
      if(confirm(`「${key}」を削除しますか？`)) {
        delete state.sprites[key];
        if (state.currentKey === key) { state.currentKey = Object.keys(state.sprites)[0] || null; drawEditor(); }
        renderSpriteList(); updateAnimSelects();
      }
    };

    item.onclick = () => { state.currentKey = key; renderSpriteList(); drawEditor(); };
    actions.appendChild(btnUp); actions.appendChild(btnDown);
    actions.appendChild(btnRename); actions.appendChild(btnDel);
    item.appendChild(thumb); item.appendChild(info); item.appendChild(actions);
    elSpriteList.appendChild(item);
  }
}

document.getElementById('btn-add-sprite').addEventListener('click', () => {
  const key = prompt("新規スプライト名を入力してください:");
  if (!key) return;
  if (state.sprites[key]) return alert("既に存在する名前です。");
  state.sprites[key] = Array.from({length: 8}, () => Array(8).fill('.'));
  state.currentKey = key;
  renderSpriteList(); updateAnimSelects(); drawEditor();
});

// --- Editor Logic ---
function drawGridToCanvas(ctx, grid, cellSize) {
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  if(!grid) return;
  for (let y = 0; y < 8; y++) {
    for (let x = 0; x < 8; x++) {
      const colorKey = grid[y][x];
      if (colorKey !== '.') {
        ctx.fillStyle = state.palette[colorKey] || '#ff00ff';
        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
      }
    }
  }
}

function drawEditor() {
  elCurrentSpriteName.innerText = state.currentKey || "スプライトがありません";
  ctxEditor.clearRect(0, 0, elEditorCanvas.width, elEditorCanvas.height);
  if (!state.currentKey || !state.sprites[state.currentKey]) return;

  const cellSize = elEditorCanvas.width / 8;
  drawGridToCanvas(ctxEditor, state.sprites[state.currentKey], cellSize);

  ctxEditor.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctxEditor.lineWidth = 1; ctxEditor.beginPath();
  for (let i = 0; i <= 8; i++) {
    ctxEditor.moveTo(i * cellSize, 0); ctxEditor.lineTo(i * cellSize, elEditorCanvas.height);
    ctxEditor.moveTo(0, i * cellSize); ctxEditor.lineTo(elEditorCanvas.width, i * cellSize);
  }
  ctxEditor.stroke();
}

function getCoords(e) {
  const rect = elEditorCanvas.getBoundingClientRect();
  let clientX = e.clientX, clientY = e.clientY;
  if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
  const scaleX = elEditorCanvas.width / rect.width; const scaleY = elEditorCanvas.height / rect.height;
  const x = Math.floor(((clientX - rect.left) * scaleX) / (elEditorCanvas.width / 8));
  const y = Math.floor(((clientY - rect.top) * scaleY) / (elEditorCanvas.height / 8));
  return { x, y };
}

function paintCell(x, y) {
  if (!state.currentKey || x < 0 || x > 7 || y < 0 || y > 7) return;
  if (state.sprites[state.currentKey][y][x] !== state.currentColor) {
    state.sprites[state.currentKey][y][x] = state.currentColor;
    drawEditor();
  }
}

let isDrawing = false;
function startDraw(e) { e.preventDefault(); isDrawing = true; const { x, y } = getCoords(e); paintCell(x, y); }
function moveDraw(e) { e.preventDefault(); if (!isDrawing) return; const { x, y } = getCoords(e); paintCell(x, y); }
function endDraw(e) { if (isDrawing) { isDrawing = false; renderSpriteList(); } }

elEditorCanvas.addEventListener('mousedown', startDraw); elEditorCanvas.addEventListener('mousemove', moveDraw); window.addEventListener('mouseup', endDraw);
elEditorCanvas.addEventListener('touchstart', startDraw, { passive: false }); elEditorCanvas.addEventListener('touchmove', moveDraw, { passive: false }); elEditorCanvas.addEventListener('touchend', endDraw, { passive: false });


// --- Animation ---
function updateAnimSelects() {
  const keys = Object.keys(state.sprites);
  const selects = [document.getElementById('anim-f1'), document.getElementById('anim-f2'), document.getElementById('anim-f3')];
  selects.forEach((sel, idx) => {
    const val = sel.value;
    sel.innerHTML = idx === 2 ? '<option value="">-- なし --</option>' : '';
    keys.forEach(k => { const opt = document.createElement('option'); opt.value = k; opt.innerText = k; sel.appendChild(opt); });
    if (keys.includes(val)) sel.value = val;
  });
}

function updateAnimSize() {
  const sizeMap = { 'small': 64, 'medium': 128, 'large': 192 };
  const val = sizeMap[document.getElementById('anim-size').value];
  elAnimCanvas.width = val; elAnimCanvas.height = val;
  if (animTimer) { stopAnim(); playAnim(); }
}
document.getElementById('anim-size').addEventListener('change', updateAnimSize);
document.getElementById('anim-speed').addEventListener('change', () => { if(animTimer) { stopAnim(); playAnim(); } });

function playAnim() {
  if (animTimer) clearInterval(animTimer);
  
  const f1 = document.getElementById('anim-f1').value; const f2 = document.getElementById('anim-f2').value;
  const f3 = document.getElementById('anim-f3').value; const pattern = document.getElementById('anim-pattern').value;
  const speed = parseInt(document.getElementById('anim-speed').value, 10);

  if (!f1 || !f2) return alert("F1とF2は必須です。");
  let frames = [];
  if (pattern === 'A') frames = [f1, f2];
  else if (pattern === 'B') { if(!f3) return alert("F3が必要です。"); frames = [f1, f2, f3, f2]; }
  else if (pattern === 'C') { if(!f3) return alert("F3が必要です。"); frames = [f1, f2, f3]; }

  let currentFrame = 0; const cellSize = elAnimCanvas.width / 8;
  animTimer = setInterval(() => {
    const key = frames[currentFrame];
    if (state.sprites[key]) drawGridToCanvas(ctxAnim, state.sprites[key], cellSize);
    currentFrame = (currentFrame + 1) % frames.length;
  }, speed);
}

function stopAnim() { if (animTimer) { clearInterval(animTimer); animTimer = null; } ctxAnim.clearRect(0, 0, elAnimCanvas.width, elAnimCanvas.height); }

document.getElementById('btn-play-anim').addEventListener('click', playAnim);
document.getElementById('btn-stop-anim').addEventListener('click', stopAnim);

init();
</script>
</body>
