<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ばんさばん</title>
    <script src="tori_se.js"></script>
    <script src="tori_music.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: #fff; overflow: hidden; touch-action: none; font-family: "縁架ドット明朝24", sans-serif; user-select: none; }
        #game-container { width: 100vw; height: 100vh; position: relative; display: flex; justify-content: center; align-items: center; background: #000; }
        #gameCanvas { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
        
        @font-face { font-family: "縁架ドット明朝24"; src: url('fonts/EnkaDotMincho24.woff2') format('woff2'); }
        @font-face { font-family: 'DonguriDuel'; src: url('fonts/x10y12pxDonguriDuel.woff2') format('woff2'); }
        
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); z-index: 10; overflow-y: auto; }
        h1, h2 { color: #ffcc00; text-shadow: 2px 2px 0px #ff0000; text-align: center; margin: 10px; }
        .btn { padding: 10px 20px; font-size: 1.2rem; font-weight: bold; margin: 8px; border-radius: 8px; border: 2px solid #fff; background-color: #333; color: #fff; cursor: pointer; text-align: center; width: 220px; }
        .btn:active { background-color: #555; }
        .btn.disabled { opacity: 0.5; cursor: not-allowed; }
        
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 5; }
        #exp-bar-container { position: absolute; top: 5px; left: 5%; width: 90%; height: 10px; background: #333; border: 1px solid #fff; border-radius: 5px; overflow: hidden; }
        #exp-bar { width: 0%; height: 100%; background: #0088ff; }
        #timer { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 #000; }
        #coin-disp { position: absolute; top: 25px; right: calc(5% + 40px); font-size: 20px; font-weight: bold; color: gold; text-shadow: 2px 2px 0 #000; }
        #btn-pause { position: absolute; top: 25px; right: 5%; font-size: 24px; font-weight: bold; cursor: pointer; color: #fff; pointer-events: auto; text-shadow: 2px 2px 0 #000; }
        
        .equipment-area { position: absolute; top: 20px; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
        #equip-1p { left: 5%; }
        #equip-2p { right: 5%; align-items: flex-end;}
        .equip-row { display: flex; gap: 5px; }
        .equip-slot { width: 32px; height: 32px; border: 2px solid #555; background: rgba(0,0,0,0.5); border-radius: 4px; display: flex; justify-content: center; align-items: center; position: relative;}
        .equip-slot canvas { width: 24px; height: 24px; image-rendering: pixelated; }
        .equip-lvl { position: absolute; bottom: -5px; right: -5px; font-size: 10px; background: #000; padding: 2px; border-radius: 3px; border: 1px solid #fff; font-weight: bold;}

        .vpad { position: absolute; width: 120px; height: 120px; bottom: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); pointer-events: auto; display: none; touch-action: none; }
        .vstick { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.6); top: 35px; left: 35px; pointer-events: none; }
        #vpad-1p { left: 20px; }
        #vpad-2p { right: 20px; }

        .popup-item { background: #222; border: 2px solid #ffcc00; border-radius: 10px; padding: 10px; margin: 10px; display: flex; align-items: center; gap: 15px; cursor: pointer; width: 300px; pointer-events: auto; }
        .popup-item:hover { background: #444; }
        .popup-icon { width: 48px; height: 48px; border: 1px solid #fff; background: #000; display:flex; justify-content:center; align-items:center; }
        .popup-icon canvas { width: 32px; height: 32px; image-rendering: pixelated; }
        .popup-desc { font-size: 14px; flex: 1; text-align: left; line-height: 1.2;}

        .char-card { border: 2px solid #555; padding: 10px; margin: 10px; border-radius: 10px; cursor: pointer; background: #222; width: 250px; text-align: left; display:flex; gap:10px; flex-shrink:0; }
        .char-card.selected { border-color: #00ff00; background: #004400; }
        .char-card.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(100%); }
        .char-card canvas { width:48px; height:48px; object-fit: contain; image-rendering: pixelated;}
        .char-stats { font-size:12px; line-height:1.2; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="640" height="360"></canvas>
    
    <div id="hud">
        <div id="exp-bar-container"><div id="exp-bar"></div></div>
        <div id="timer">00:00</div>
        <div id="coin-disp">0 G</div>
        <div id="btn-pause">||</div>
        <div class="equipment-area" id="equip-1p">
            <div class="equip-row" id="eq-atk-1p"></div>
            <div class="equip-row" id="eq-buf-1p"></div>
        </div>
        <div class="equipment-area" id="equip-2p" style="display:none;">
            <div class="equip-row" id="eq-atk-2p"></div>
            <div class="equip-row" id="eq-buf-2p"></div>
        </div>
    </div>
    
    <div id="vpad-1p" class="vpad" data-player="0">
        <div class="vstick"></div>
    </div>
    <div id="vpad-2p" class="vpad" data-player="1">
        <div class="vstick"></div>
    </div>

    <div id="screen-title" class="screen" style="display:flex;">
        <h1 style="font-size:3rem; margin-bottom:20px; margin-top:auto;">ばんさばん</h1>
        <div class="btn" id="btn-start-1p">1人で遊ぶ</div>
        <div class="btn" id="btn-start-2p">2人で遊ぶ</div>
        <div class="btn" id="btn-shop">ショップ</div>
        <div style="margin-top:auto;"></div>
    </div>

    <div id="screen-char" class="screen">
        <h2 id="char-select-title" style="font-size:1.5rem; margin-bottom:20px;">キャラクターセレクト (1P)</h2>
        <div style="display:flex; flex-wrap:wrap; justify-content:center; max-width:800px;" id="char-list"></div>
        <div class="btn disabled" id="btn-char-decide">決定</div>
        <div class="btn" id="btn-char-back" style="margin-top:20px; background:#444;">タイトルへ</div>
    </div>

    <div id="screen-shop" class="screen">
        <h2 style="font-size:2rem; margin-bottom:20px;">ショップ - 所持金: <span id="shop-coins" style="color:gold;"></span> G</h2>
        <div id="shop-list" style="display:flex; flex-direction:column; align-items:center; overflow-y:auto; max-height:60vh; width:100%;"></div>
        <div class="btn" id="btn-shop-back" style="margin-top:20px; background:#444;">タイトルへ</div>
    </div>

    <div id="screen-levelup" class="screen">
        <h2 id="levelup-title" style="font-size:1.5rem; margin-bottom:5px;">レベルアップ！ (1P)</h2>
        <div style="display:flex; width:100%; max-width:600px; padding:0 20px; align-items:flex-start;">
            <div id="reroll-container" style="display:flex; flex-direction:column; align-items:center; width:80px; margin-right:10px; margin-top:10px; flex-shrink:0;">
                <div class="btn" id="btn-reroll" style="margin:0; width:100%; padding:5px; font-size:14px;">リロール</div>
                <div style="font-size:12px; margin-top:5px;">残り: <span id="reroll-count"></span>回</div>
            </div>
            <div id="levelup-choices" style="display:flex; flex-direction:column; align-items:stretch; flex-grow:1; width:100%;"></div>
        </div>
    </div>

    <div id="screen-chest" class="screen" style="background:rgba(0,0,0,0.9);">
        <h2 style="font-size:3rem; margin-bottom:30px;">宝箱を開けた！</h2>
        <canvas id="chestCanvas" width="640" height="360" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit: contain; z-index:-1;"></canvas>
        <div id="chest-items" style="display:flex; justify-content:center; gap:20px; margin-top:30px; flex-wrap:wrap; max-width:80%;"></div>
        <div class="btn" id="btn-chest-close" style="display:none; margin-top:50px;">閉じる</div>
    </div>
    
    <div id="screen-result" class="screen">
        <h1 id="result-title" style="font-size:3rem; margin-bottom:10px;">GAME OVER</h1>
        <div style="font-size:20px; margin:5px;">生存時間: <span id="result-time"></span></div>
        <div style="font-size:20px; margin:5px; color:gold;">集めたコイン: <span id="result-coins"></span></div>
        <div style="font-size:20px; margin:5px;">あたえたダメージ: <span id="result-dmg-dealt"></span></div>
        <div style="font-size:20px; margin:5px;">受けたダメージ: <span id="result-dmg-taken"></span></div>
        <div style="font-size:20px; margin:5px;">たおした敵の数: <span id="result-kills"></span></div>
        <div id="result-equips" style="display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; justify-content:center; max-width:80%;"></div>
        <div class="btn" id="btn-result-back" style="margin-top:20px;">タイトルへ</div>
    </div>

    <div id="screen-pause" class="screen" style="background:rgba(0,0,0,0.7); cursor:pointer;">
        <h1 style="font-size:4rem; margin:auto;">pause</h1>
    </div>
</div>

<script src="vansav_game.js"></script>
</body>
</html>
