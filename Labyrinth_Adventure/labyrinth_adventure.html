<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Labyrinth Adventure</title>
<style>
  /* =========================================
     1. 全体共通スタイル (ベース維持)
     ========================================= */
  body {
    margin: 0; padding: 0; background-color: #0a0a0a; color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Courier New', monospace;
    display: flex; flex-direction: column; align-items: center;
    touch-action: manipulation; overflow-x: hidden; padding-bottom: 60px;
  }

  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center;
  }
  .modal-content {
    position: relative; width: 90%; max-width: 400px; max-height: 80vh; background: #111;
    border: 2px solid #fff; border-radius: 5px; padding: 20px; overflow-y: auto;
    box-sizing: border-box; color: #fff; font-size: 0.85rem; pointer-events: auto;
  }
  .close-modal {
    position: absolute; top: 10px; right: 15px; font-size: 1.5rem; font-weight: bold;
    cursor: pointer; color: #aaa;
  }

  /* =========================================
     2. 共通UIコンポーネント
     ========================================= */
  #start-menu {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  #start-menu h1 { color: #fff; font-size: 2.5rem; margin-bottom: 20px; text-shadow: 0 0 10px #fff; text-align: center; }
  .menu-btn {
    padding: 15px 40px; margin: 10px; font-size: 1.2rem; font-weight: bold;
    background: #000; color: white; border: 2px solid #fff; border-radius: 5px; cursor: pointer; transition: transform 0.2s;
    font-family: 'Courier New', monospace;
  }
  .menu-btn:active { transform: scale(0.95); background: #333; }
  .sound-toggle { margin-top: 20px; font-size: 1.2rem; }
  .sound-toggle label { cursor: pointer; display: flex; align-items: center; gap: 10px; }

  #header {
    width: 100%; max-width: 450px; display: flex; justify-content: center; align-items: stretch; padding: 5px; box-sizing: border-box; z-index: 110; gap: 4px; position: relative;
  }
  .panel {
    background: #000; border: 2px solid #fff; border-radius: 5px; padding: 4px; text-align: center; display: flex; flex-direction: column; justify-content: center;
  }
  .panel div { font-size: 0.6rem; color: #aaa; line-height: 1; margin-bottom: 2px; }
  .panel span { font-size: 1.1rem; font-weight: bold; color: #fff; line-height: 1; }
  #btn-chart { cursor: pointer; font-size: 1.2rem; margin-right: 5px; }
  
  .p-bet { width: 45px; } .p-cnt { width: 45px; cursor: pointer; } .p-win { width: 75px; } .p-free { width: 45px; }
  #bet-input { width: 100%; text-align: center; background: transparent; color: #fff; border: none; font-size: 1.1rem; font-weight: bold; outline: none; padding: 0; }

  #controls-row {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); display: flex; flex-direction: row; justify-content: space-between; align-items: center;
    width: 100%; max-width: 450px; padding: 5px 15px; box-sizing: border-box; background: #000; border-top: 2px solid #fff; z-index: 200;
  }
  #medal-display { font-size: 1.1rem; color: #fff; font-weight: bold; text-align: left; min-width: 120px; }
  #spin-btn {
    padding: 8px 30px; font-size: 1.3rem; font-weight: bold; background: #000; color: white; border: 2px solid #fff; border-radius: 5px; cursor: pointer;
  }
  #spin-btn:disabled { background: #333; border-color: #666; color: #888; }

  #chart-canvas { width: 100%; height: 250px; background: #000; border: 1px solid #444; margin-top: 10px; }
  .chart-controls { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
  .chart-controls button { background: #333; color: #fff; border: 1px solid #666; padding: 5px 15px; cursor: pointer; border-radius: 4px; }
  .chart-controls button.active { background: #fff; color: #000; border-color: #fff; }

  /* =========================================
     3. Labyrinth Adventure 固有UI
     ========================================= */
  #game-container { position: relative; width: 100%; max-width: 450px; display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
  #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  
  /* スロット（迷路）エリア */
  #slot-area { position: relative; width: 330px; height: 265px; margin-top: 10px; z-index: 10; padding: 5px; background: rgba(0,0,0,0.6); border: 2px solid #fff; border-radius: 5px; }
  #grid-wrapper { display: grid; grid-template-columns: repeat(5, 60px); grid-template-rows: repeat(4, 60px); gap: 2px; position: relative; }
  .grid-cell { width: 60px; height: 60px; background: #111; border: 1px solid #333; display: flex; justify-content: center; align-items: center; font-size: 2rem; position: relative; box-sizing: border-box; overflow: hidden; }
  .col-0 { border-right: 2px solid #fff; background: #222; } /* キャラ登場マス */
  .cell-symbol { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 2; transition: top 0.1s; }
  canvas.arrow-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  
  /* 主人公の移動用要素 */
  #hero-sprite { position: absolute; width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; font-size: 2.2rem; z-index: 20; transition: all linear; pointer-events: none; display: none; text-shadow: 0 0 10px #fff; }

  /* 戦闘アニメーション表示エリア */
  #combat-area { position: relative; width: 340px; margin-top: 10px; background: #000; border: 2px solid #fff; border-radius: 5px; padding: 10px; box-sizing: border-box; display: flex; justify-content: space-around; align-items: center; z-index: 10; font-family: monospace; }
  .char-box { display: flex; flex-direction: column; align-items: center; width: 100px; }
  .char-emoji { font-size: 3rem; margin-bottom: 5px; transition: transform 0.1s; }
  .char-stats { font-size: 0.8rem; text-align: center; }
  .vs-text { font-size: 1.5rem; font-weight: bold; font-style: italic; color: #f00; text-shadow: 2px 2px 0 #fff; }

  /* RPG風メッセージウィンドウ */
  #rpg-message-box {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 320px; background: #000; border: 2px solid #fff; border-radius: 5px; padding: 15px;
    color: #fff; font-family: 'Courier New', monospace; font-size: 1rem; line-height: 1.5;
    z-index: 50; display: none; box-shadow: 0 0 20px rgba(0,0,0,0.8);
  }
  
  /* TOTAL WIN */
  #total-win-banner { position: fixed; top: 50%; left: 50%; width: 100%; max-width: 450px; background: rgba(0,0,0,0.95); color: #fff; text-align: center; padding: 20px 0; transform: translate(-50%, -50%); z-index: 150; display: none; border-top: 4px solid #fff; border-bottom: 4px solid #fff; }
  #total-win-banner h2 { font-size: 1.2rem; margin: 0; }
  #total-win-banner h1 { margin: 10px 0; font-size: 3rem; }
  #win-breakdown { font-size: 0.9rem; color: #aaa; text-align: left; display: inline-block; }

  .shake { animation: shakeAnim 0.3s; }
  @keyframes shakeAnim { 0% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } 100% { transform: translateX(0); } }
  .hit-flash { filter: brightness(2) drop-shadow(0 0 10px red); }
</style>
</head>
<body>

<div id="start-menu">
  <h1>Labyrinth<br>Adventure</h1>
  <button class="menu-btn" id="btn-newgame">はじめから</button>
  <button class="menu-btn" id="btn-continue" style="display:none;">つづきから</button>
  <div class="sound-toggle">
    <label><input type="checkbox" id="sound-checkbox" checked> 効果音をオンにする</label>
  </div>
</div>

<div id="release-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="close-modal" id="close-release-modal">&times;</div>
    <h3>リリースノート (Labyrinth Adventure v1.0)</h3>
    <div style="color:#ddd; line-height: 1.5;">
      【新作追加】<br>
      迷路探索とバトルが融合した新感覚スロット登場！<br>
      ・スピンで生成される迷路を主人公が進む！<br>
      ・アイテムを集めて報酬とステータスを強化！<br>
      ・最奥部で待ち受けるヌシを倒して特大ボーナスをゲット！<br>
    </div>
  </div>
</div>

<div id="chart-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="close-modal" id="close-chart-modal">&times;</div>
    <h3 style="margin-top:0;">本日のメダル獲得履歴</h3>
    <canvas id="chart-canvas"></canvas>
    <div class="chart-controls">
      <button id="btn-chart-1m">1分足</button>
      <button id="btn-chart-5m" class="active">5分足</button>
      <button id="btn-chart-60m">60分足</button>
    </div>
  </div>
</div>

<div id="game-container" style="display:none;">
  <canvas id="bg-canvas"></canvas>

  <div id="header">
    <div class="panel" id="btn-chart" title="履歴チャート">💹</div>
    <div class="panel p-bet"><div>BET</div><input type="number" id="bet-input" value="1" min="1" max="100"></div>
    <div class="panel p-cnt" id="spin-counter-btn"><div>CNT</div><span id="spin-counter">0</span></div>
    <div class="panel p-win"><div>WIN</div><span id="win-display">0</span></div>
    <div class="panel p-free" id="free-spin-panel"><div style="color:#0ff;">FREE</div><span id="free-spin-display" style="color:#0ff;">0</span></div>
  </div>

  <div id="slot-area">
    <div id="grid-wrapper"></div>
    <div id="hero-sprite">😀</div>
    <div id="rpg-message-box"></div>
  </div>

  <div id="combat-area">
    <div class="char-box">
      <div id="hero-emoji" class="char-emoji">😀</div>
      <div class="char-stats">HP: <span id="hero-hp-disp">5</span>/<span id="hero-maxhp-disp">5</span><br>ATK: <span id="hero-atk-disp">1</span><br>EXP: <span id="hero-exp-disp">0</span></div>
    </div>
    <div class="vs-text">VS</div>
    <div class="char-box">
      <div id="boss-emoji" class="char-emoji">🐊</div>
      <div class="char-stats" id="boss-stats-container">HP: <span id="boss-hp-disp">3</span><br>ATK: <span id="boss-atk-disp">1</span><br><span id="boss-name-disp">オオワニ</span></div>
    </div>
  </div>
</div>

<div id="controls-row" style="display:none;">
  <div id="medal-display">MEDALS: <br><span id="medal-count">50</span></div>
  <button id="spin-btn">SPIN</button>
</div>

<div id="total-win-banner">
  <h2>TOTAL WIN</h2>
  <h1 id="total-win-amount">0</h1>
  <div id="win-breakdown"></div>
</div>

<script>
// =============================================================================
// ゲームバランス調整用コンフィグ（ここで確率や速度を調整可能）
// =============================================================================
const GAME_CONFIG = {
    moveSpeed: 400,          // 主人公の移動速度（ミリ秒）
    turnSpeed: 2000,         // バトルの1ターンの時間（ミリ秒）
    spinDuration: 1500,      // スピンアニメーションの基本時間
    arrowCountMin: 4,        // 迷路に配置される矢印の最小数
    arrowCountMax: 16,       // 迷路に配置される矢印の最大数
    freeSpinProb: 0.01,      // 空きマスがフリースピンになる確率(1%)
    items: [
        { sym: '🍒', weight: 30,  mult: 0.5, type: 'reward', name: 'チェリー' },
        { sym: '🍇', weight: 25,  mult: 1.0, type: 'reward', name: 'ブドウ' },
        { sym: '🍊', weight: 20,  mult: 2.0, type: 'reward', name: 'オレンジ' },
        { sym: '🍖', weight: 15,  mult: 1.0, type: 'heal',   name: 'お肉(HP+1)' },
        { sym: '🗡️', weight:  5,  mult: 1.0, type: 'buff',   name: '剣(ATK+1)' },
        { sym: '💎', weight:  2,  mult: 10.0,type: 'reward', name: 'ダイヤ' },
        { sym: '',   weight: 40,  mult: 0,   type: 'blank',  name: '空き地' } // ブランク
    ],
    bosses: {
        1: { sym: '🐊', hp: 3, atk: 1, mult: 50,  name: 'オオワニ' },
        2: { sym: '🦀', hp: 5, atk: 2, mult: 80,  name: 'タラバガニ' },
        3: { sym: '🐲', hp: 10,atk: 4, mult: 200, name: 'ドラゴン' }
    }
};

// =============================================================================
// 変数・セーブデータ系
// =============================================================================
let medals = 50; 
let currentBet = 1; 
let spinCount = 0;
let soundEnabled = true;

// セーブ・ロード関数
function setCookie(name, value, days) {
  let expires = "";
  if (days) { let date = new Date(); date.setTime(date.getTime() + (days*24*60*60*1000)); expires = "; expires=" + date.toUTCString(); }
  document.cookie = name + "=" + (value || "")  + expires + "; path=/";
}
function getCookie(name) {
  let nameEQ = name + "="; let ca = document.cookie.split(';');
  for(let i=0;i < ca.length;i++) {
    let c = ca[i]; while (c.charAt(0)==' ') c = c.substring(1,c.length);
    if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
  }
  return null;
}
function saveGameData() {
  setCookie("labyrinth_medals", medals, 30); setCookie("labyrinth_bet", currentBet, 30); setCookie("labyrinth_spinCount", spinCount, 30);
  setCookie("labyrinth_hero", JSON.stringify(hero), 30); setCookie("labyrinth_stage", stage, 30);
}

// 履歴ロギング
let medalLog = JSON.parse(localStorage.getItem('labyrinth_log') || '[]');
let logDate = localStorage.getItem('labyrinth_logDate');
let todayStr = new Date().toDateString();
if (logDate !== todayStr) {
    medalLog = []; localStorage.setItem('labyrinth_logDate', todayStr); localStorage.setItem('labyrinth_log', JSON.stringify(medalLog));
}
function recordMedalLog(currentMedals) {
    medalLog.push({ time: new Date().getTime(), medals: currentMedals }); localStorage.setItem('labyrinth_log', JSON.stringify(medalLog));
}

// RPG状態管理
let hero = { hp: 5, maxHp: 5, atk: 1, exp: 0 };
let stage = 1;
let currentBoss = null;
let boardState = []; // 5x4のグリッド情報
let freeSpinsLeft = 0;
let isFreeSpinMode = false;
let isSpinning = false;
let runResult = { rewards: 0, steps: 0, items: [], defeatBoss: false, mazeCleared: false, expGained: 0 };

// =============================================================================
// サウンド関数
// =============================================================================
function playSoundSpin() { if(soundEnabled) zzfx(...[2,0,600,,.04,.13,1,2,,,109,.09,,,,,,.63,.05,,-1412]); }
function playSoundStop() { if(soundEnabled) zzfx(...[1.0,.1,523.2,.03,.02,0,4,1.3,,,,,,,,,.1,1.1,,.02,488]); }
function playSoundStep() { if(soundEnabled) zzfx(...[.4,0,150,,.02,.05,1,1,,,100,.05,,,,,,.5,,.05]); }
function playSoundItem() { if(soundEnabled) zzfx(...[1,0,400,,.05,.2,1,1,,,200,.05,,,,,,.3,,.1]); }
function playSoundHit()  { if(soundEnabled) zzfx(...[1.2,0,100,,.05,.1,4,1.5,,,150,.1,,,,,,.6,,.1]); }
function playSoundWin()  { if(soundEnabled) zzfx(...[.8,0,440,.05,.15,.2,2,.5,,,150,.1,,,,,,.5,.25,.05]); }
function playSoundLose() { if(soundEnabled) zzfx(...[1.5,0,80,,.1,.5,2,2,,,50,.2,,,,,,.8,,.1]); }

// =============================================================================
// 初期化・UIイベント
// =============================================================================
window.onload = () => {
  let savedMedals = getCookie("labyrinth_medals");
  if (savedMedals !== null && parseInt(savedMedals) > 0) document.getElementById('btn-continue').style.display = 'block';
  document.getElementById('release-modal').style.display = 'flex';
  initGrid(); drawBackground();
};

document.getElementById('close-release-modal').addEventListener('click', () => { document.getElementById('release-modal').style.display = 'none'; });
document.getElementById('btn-newgame').addEventListener('click', () => {
  soundEnabled = document.getElementById('sound-checkbox').checked;
  hero = { hp: 5, maxHp: 5, atk: 1, exp: 0 }; stage = 1; medals = 50; currentBet = 1; spinCount = 0;
  startGameUI();
});
document.getElementById('btn-continue').addEventListener('click', () => {
  soundEnabled = document.getElementById('sound-checkbox').checked;
  medals = parseInt(getCookie("labyrinth_medals") || 50); currentBet = parseInt(getCookie("labyrinth_bet") || 1); spinCount = parseInt(getCookie("labyrinth_spinCount") || 0);
  let savedHero = getCookie("labyrinth_hero"); if(savedHero) hero = JSON.parse(savedHero);
  stage = parseInt(getCookie("labyrinth_stage") || 1);
  startGameUI();
});

function startGameUI() {
  document.getElementById('start-menu').style.display = 'none'; document.getElementById('game-container').style.display = 'flex'; document.getElementById('controls-row').style.display = 'flex';
  document.getElementById('bet-input').value = currentBet;
  updateCombatUI(); updateUI();
  if(medalLog.length === 0) recordMedalLog(medals);
}

function updateUI() {
  document.getElementById('medal-count').innerText = medals; document.getElementById('spin-counter').innerText = spinCount;
  document.getElementById('free-spin-display').innerText = freeSpinsLeft;
  document.getElementById('free-spin-panel').style.borderColor = freeSpinsLeft > 0 ? '#0ff' : '#444';
}

function updateCombatUI() {
  document.getElementById('hero-hp-disp').innerText = hero.hp; document.getElementById('hero-maxhp-disp').innerText = hero.maxHp;
  document.getElementById('hero-atk-disp').innerText = hero.atk; document.getElementById('hero-exp-disp').innerText = hero.exp;
  
  currentBoss = GAME_CONFIG.bosses[stage];
  document.getElementById('boss-emoji').innerText = currentBoss.sym;
  document.getElementById('boss-hp-disp').innerText = currentBoss.hp;
  document.getElementById('boss-atk-disp').innerText = currentBoss.atk;
  document.getElementById('boss-name-disp').innerText = currentBoss.name;
  drawBackground();
}

// =============================================================================
// チャート関連 (流用)
// =============================================================================
let chartInterval = 5; 
document.getElementById('btn-chart').addEventListener('click', () => { document.getElementById('chart-modal').style.display = 'flex'; drawChart(); });
document.getElementById('close-chart-modal').addEventListener('click', () => { document.getElementById('chart-modal').style.display = 'none'; });
document.getElementById('btn-chart-1m').addEventListener('click', (e) => { chartInterval = 1; updateChartBtns(e.target); drawChart(); });
document.getElementById('btn-chart-5m').addEventListener('click', (e) => { chartInterval = 5; updateChartBtns(e.target); drawChart(); });
document.getElementById('btn-chart-60m').addEventListener('click', (e) => { chartInterval = 60; updateChartBtns(e.target); drawChart(); });
function updateChartBtns(btn) { document.querySelectorAll('.chart-controls button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
function drawChart() {
    const canvas = document.getElementById('chart-canvas'); const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.parentElement.clientWidth - 40; const h = canvas.height = 250;
    ctx.clearRect(0,0,w,h);
    if (medalLog.length === 0) { ctx.fillStyle = '#fff'; ctx.fillText("データがありません", w/2 - 40, h/2); return; }
    let intervalMs = chartInterval * 60 * 1000; let baseTime = new Date().setHours(0,0,0,0); let candles = []; let curIdx = 0;
    let cTime = Math.floor((medalLog[0].time - baseTime)/intervalMs) * intervalMs + baseTime; let lastClose = medalLog[0].medals;
    while(curIdx < medalLog.length) {
        let logs = []; while(curIdx < medalLog.length && medalLog[curIdx].time < cTime + intervalMs) { logs.push(medalLog[curIdx]); curIdx++; }
        if(logs.length > 0) {
            let open = lastClose; let close = logs[logs.length-1].medals; let high = Math.max(open, ...logs.map(l=>l.medals)); let low = Math.min(open, ...logs.map(l=>l.medals));
            candles.push({ open, high, low, close }); lastClose = close;
        }
        if(curIdx < medalLog.length) cTime = Math.floor((medalLog[curIdx].time - baseTime)/intervalMs) * intervalMs + baseTime;
    }
    if (candles.length === 0) return;
    let maxLog = Math.max(...candles.map(c=>c.high)); let minLog = Math.min(...candles.map(c=>c.low));
    if (maxLog === minLog) { maxLog += 10; minLog = Math.max(0, minLog - 10); }
    let range = maxLog - minLog; const leftMargin = 40; const chartW = w - leftMargin;
    ctx.fillStyle = '#aaa'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const drawAxis = (val) => { let y = h - ((val - minLog)/range)*h; y=Math.max(6,Math.min(h-6,y)); ctx.fillText(val, leftMargin - 5, y); ctx.strokeStyle='#333'; ctx.beginPath(); ctx.moveTo(leftMargin,y); ctx.lineTo(w,y); ctx.stroke(); };
    drawAxis(maxLog); drawAxis(Math.floor(minLog+range*0.5)); drawAxis(minLog);
    let candleWidth = Math.min(15, chartW / candles.length); let bodyWidth = Math.max(1, candleWidth*0.8);
    candles.forEach((c, i) => {
        let x = leftMargin + 2 + i * candleWidth;
        let yHigh = h - ((c.high - minLog) / range) * h; let yLow = h - ((c.low - minLog) / range) * h;
        let yOpen = h - ((c.open - minLog) / range) * h; let yClose = h - ((c.close - minLog) / range) * h;
        ctx.strokeStyle = c.close >= c.open ? '#f44' : '#4f4'; ctx.fillStyle = ctx.strokeStyle;
        ctx.beginPath(); ctx.moveTo(x + bodyWidth/2, yHigh); ctx.lineTo(x + bodyWidth/2, yLow); ctx.stroke();
        ctx.fillRect(x, Math.min(yOpen, yClose), bodyWidth, Math.max(1, Math.abs(yOpen - yClose)));
    });
}

// =============================================================================
// 背景描画
// =============================================================================
function drawBackground() {
  const canvas = document.getElementById('bg-canvas');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  if (stage === 1) { grad.addColorStop(0, '#131'); grad.addColorStop(1, '#242'); } // 草原
  else if (stage === 2) { grad.addColorStop(0, '#024'); grad.addColorStop(1, '#046'); } // 海
  else { grad.addColorStop(0, '#300'); grad.addColorStop(1, '#511'); } // 火山
  ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', drawBackground);

// =============================================================================
// グリッド初期化・描画
// =============================================================================
function initGrid() {
  const wrapper = document.getElementById('grid-wrapper');
  wrapper.innerHTML = '';
  for(let r=0; r<4; r++) {
    boardState[r] = [];
    for(let c=0; c<5; c++) {
      let cell = document.createElement('div');
      cell.className = `grid-cell ${c===0 ? 'col-0' : ''}`;
      cell.id = `cell-${c}-${r}`;
      
      let canvas = document.createElement('canvas');
      canvas.width = 60; canvas.height = 60; canvas.className = 'arrow-canvas';
      cell.appendChild(canvas);
      
      let symDiv = document.createElement('div');
      symDiv.className = 'cell-symbol'; symDiv.id = `sym-${c}-${r}`;
      cell.appendChild(symDiv);
      
      wrapper.appendChild(cell);
      boardState[r][c] = { type: 'blank', dir: null, sym: '', collected: false };
    }
  }
}

// 矢印をCanvasで描画
function drawArrowOnCanvas(c, r, dir, color='#888') {
  const canvas = document.querySelector(`#cell-${c}-${r} .arrow-canvas`);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,60,60);
  if(dir === null) return;
  
  ctx.fillStyle = color;
  ctx.beginPath();
  // 0:Up, 1:Right, 2:Down, 3:Left
  if(dir === 0) { ctx.moveTo(30,10); ctx.lineTo(50,30); ctx.lineTo(40,30); ctx.lineTo(40,50); ctx.lineTo(20,50); ctx.lineTo(20,30); ctx.lineTo(10,30); }
  if(dir === 1) { ctx.moveTo(50,30); ctx.lineTo(30,10); ctx.lineTo(30,20); ctx.lineTo(10,20); ctx.lineTo(10,40); ctx.lineTo(30,40); ctx.lineTo(30,50); }
  if(dir === 2) { ctx.moveTo(30,50); ctx.lineTo(10,30); ctx.lineTo(20,30); ctx.lineTo(20,10); ctx.lineTo(40,10); ctx.lineTo(40,30); ctx.lineTo(50,30); }
  if(dir === 3) { ctx.moveTo(10,30); ctx.lineTo(30,50); ctx.lineTo(30,40); ctx.lineTo(50,40); ctx.lineTo(50,20); ctx.lineTo(30,20); ctx.lineTo(30,10); }
  ctx.fill();
}

function updateCellDOM(c, r, cellData) {
  let symDiv = document.getElementById(`sym-${c}-${r}`);
  if(symDiv) symDiv.innerText = cellData.type === 'item' ? cellData.sym : (cellData.type === 'free' ? '🆓' : '');
  drawArrowOnCanvas(c, r, cellData.type === 'arrow' ? cellData.dir : null, cellData.collected ? '#333' : '#888');
  if(cellData.collected && cellData.type !== 'arrow') symDiv.innerText = '';
}

// ランダム抽選
function getRandomItem() {
  if (Math.random() < GAME_CONFIG.freeSpinProb) return { type: 'free', sym: '🆓' };
  let totalW = GAME_CONFIG.items.reduce((sum, item) => sum + item.weight, 0);
  let r = Math.random() * totalW; let sum = 0;
  for(let item of GAME_CONFIG.items) {
    sum += item.weight;
    if(r <= sum) return item.type === 'blank' ? { type: 'blank' } : { type: 'item', sym: item.sym, ref: item };
  }
  return { type: 'blank' };
}

// =============================================================================
// スピン制御
// =============================================================================
document.getElementById('spin-btn').addEventListener('click', () => { if(!isSpinning) startSpin(false); });

function startSpin(isFree) {
  let betVal = parseInt(document.getElementById('bet-input').value) || 1;
  if (!isFree) {
    if (medals < betVal) { alert("メダルが足りません！"); return; }
    currentBet = betVal; medals -= currentBet; spinCount++;
  }
  isFreeSpinMode = isFree; isSpinning = true;
  document.getElementById('spin-btn').disabled = true;
  document.getElementById('total-win-banner').style.display = 'none';
  document.getElementById('hero-sprite').style.display = 'none';
  updateUI(); playSoundSpin();

  // マップ生成
  let heroSpawnRow = Math.floor(Math.random() * 4);
  let mazeCells = [];
  for(let c=1; c<5; c++) for(let r=0; r<4; r++) mazeCells.push({c, r});
  mazeCells.sort(() => Math.random() - 0.5); // シャッフル
  
  let arrowCount = Math.floor(Math.random() * (GAME_CONFIG.arrowCountMax - GAME_CONFIG.arrowCountMin + 1)) + GAME_CONFIG.arrowCountMin;
  
  // 新しいボードデータ作成
  let nextBoard = [];
  for(let r=0; r<4; r++) {
    nextBoard[r] = [];
    for(let c=0; c<5; c++) {
      if(c === 0) {
         nextBoard[r][c] = (r === heroSpawnRow) ? { type: 'hero', sym: '😀' } : { type: 'blank' };
      } else {
         nextBoard[r][c] = { type: 'pending' };
      }
    }
  }

  // 矢印・アイテム配置
  for(let i=0; i<mazeCells.length; i++) {
    let {c, r} = mazeCells[i];
    if (i < arrowCount) {
       nextBoard[r][c] = { type: 'arrow', dir: Math.floor(Math.random() * 4), collected: false };
    } else {
       let item = getRandomItem();
       item.collected = false; nextBoard[r][c] = item;
    }
  }

  // スピンアニメーション（ダミーの切り替え）
  let ticks = 0;
  let animInterval = setInterval(() => {
    ticks++;
    for(let c=0; c<5; c++) {
      for(let r=0; r<4; r++) {
        // Col0は早く止める
        if (c === 0 && ticks > 10) { boardState[r][c] = nextBoard[r][c]; updateCellDOM(c, r, boardState[r][c]); continue; }
        if (c > 0 && ticks > 25) { boardState[r][c] = nextBoard[r][c]; updateCellDOM(c, r, boardState[r][c]); continue; }
        
        // 回転中演出
        let symDiv = document.getElementById(`sym-${c}-${r}`);
        if(c===0) symDiv.innerText = Math.random()>0.8 ? '😀' : '';
        else {
           let rType = Math.random();
           if(rType<0.5) { symDiv.innerText=''; drawArrowOnCanvas(c,r,Math.floor(Math.random()*4)); }
           else { symDiv.innerText = GAME_CONFIG.items[Math.floor(Math.random()*(GAME_CONFIG.items.length-1))].sym; drawArrowOnCanvas(c,r,null); }
        }
      }
    }
    if (ticks > 25) {
      clearInterval(animInterval); playSoundStop();
      setTimeout(() => startRunPhase(heroSpawnRow), 500);
    }
  }, 50);
}

// =============================================================================
// 移動フェーズ
// =============================================================================
function startRunPhase(startRow) {
  runResult = { rewards: 0, steps: 0, items: [], defeatBoss: false, mazeCleared: false, expGained: 0 };
  let heroX = 0; let heroY = startRow;
  let currentDir = 1; // 1: Right
  let visited = Array(4).fill(0).map(() => Array(5).fill(false));
  
  const sprite = document.getElementById('hero-sprite');
  sprite.style.display = 'flex'; sprite.innerText = '😀';
  sprite.style.transform = 'scale(1)';
  updateSpritePos(heroX, heroY);

  function step() {
    playSoundStep();
    visited[heroY][heroX] = true;

    // 現在マスの効果処理
    let cell = boardState[heroY][heroX];
    if (heroX > 0 && !cell.collected) {
       cell.collected = true;
       if (cell.type === 'arrow') {
           currentDir = cell.dir;
           drawArrowOnCanvas(heroX, heroY, cell.dir, '#ff0'); // 通った矢印をハイライト
       } else if (cell.type === 'item') {
           playSoundItem(); showPopupText(heroX, heroY, cell.sym);
           runResult.items.push(cell.ref);
           if (cell.ref.type === 'heal') hero.hp = Math.min(hero.maxHp + 1, hero.hp + 1); // 一時的に最大値超え可能とするか、最大値も上げるか。RPGっぽく最大値も上げる
           if (cell.ref.type === 'heal') hero.maxHp++;
           if (cell.ref.type === 'buff') hero.atk++;
           if (cell.ref.type === 'reward') runResult.rewards += (cell.ref.mult * currentBet);
           updateCombatUI(); updateCellDOM(heroX, heroY, cell);
       } else if (cell.type === 'free') {
           playSoundWin(); showPopupText(heroX, heroY, 'FREE+3');
           freeSpinsLeft += 3; updateUI(); updateCellDOM(heroX, heroY, cell);
       }
    }

    // 次の座標計算
    let nextX = heroX; let nextY = heroY;
    if(currentDir === 0) nextY--; else if(currentDir === 1) nextX++; else if(currentDir === 2) nextY++; else if(currentDir === 3) nextX--;
    
    // 終了判定
    if (nextX > 4) {
       // 右に抜けた -> 迷宮踏破！
       runResult.steps++; runResult.mazeCleared = true;
       setTimeout(() => handleDeepMaze(), 500);
       return;
    }
    if (nextX < 1 || nextY < 0 || nextY > 3 || visited[nextY][nextX]) {
       // 行き止まり・逆走・ループ
       setTimeout(() => handleRewardCalc(), 500);
       return;
    }

    // 次へ移動
    heroX = nextX; heroY = nextY; runResult.steps++;
    updateSpritePos(heroX, heroY);
    setTimeout(step, GAME_CONFIG.moveSpeed);
  }

  // 最初の1歩（Col0 -> Col1）
  setTimeout(() => {
      heroX = 1; updateSpritePos(heroX, heroY); runResult.steps++;
      setTimeout(step, GAME_CONFIG.moveSpeed);
  }, GAME_CONFIG.moveSpeed);
}

function updateSpritePos(c, r) {
  const sprite = document.getElementById('hero-sprite');
  sprite.style.left = (c * 62 + 2) + 'px'; // grid gap考慮
  sprite.style.top = (r * 62 + 2) + 'px';
}

function showPopupText(c, r, text) {
  let pop = document.createElement('div');
  pop.innerText = text; pop.style.position = 'absolute'; pop.style.left = (c * 62) + 'px'; pop.style.top = (r * 62) + 'px';
  pop.style.color = '#ff0'; pop.style.fontWeight = 'bold'; pop.style.zIndex = '30'; pop.style.textShadow = '2px 2px 0 #000';
  pop.style.animation = 'floatUp 1s forwards';
  document.getElementById('slot-area').appendChild(pop);
  setTimeout(() => pop.remove(), 1000);
}
const styleSheet = document.createElement("style");
styleSheet.innerText = `@keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }`;
document.head.appendChild(styleSheet);

// =============================================================================
// 最奥部・ボスバトル処理
// =============================================================================
function showRpgMessage(text, callback) {
  let box = document.getElementById('rpg-message-box');
  box.style.display = 'block'; box.innerHTML = '';
  let i = 0;
  let interval = setInterval(() => {
      box.innerHTML += text.charAt(i); i++;
      if (i >= text.length) { clearInterval(interval); setTimeout(() => { box.style.display = 'none'; if(callback) callback(); }, 1500); }
  }, 50);
}

function handleDeepMaze() {
  hero.exp++; updateCombatUI(); runResult.expGained = 1;
  showRpgMessage(`迷宮の最奥部に到達した！\n経験値を獲得した！`, () => {
      if (hero.exp >= 5) {
          startBossBattle();
      } else {
          runResult.rewards += (hero.exp * 10 * currentBet);
          handleRewardCalc();
      }
  });
}

function startBossBattle() {
  currentBoss.hp = GAME_CONFIG.bosses[stage].hp; updateCombatUI();
  showRpgMessage(`ヌシの ${currentBoss.name} があらわれた！`, bossTurnHero);
}

function bossTurnHero() {
  showRpgMessage(`😀 のこうげき！\n${currentBoss.name} に ${hero.atk} のダメージ！`, () => {
      playSoundHit();
      let bossEl = document.getElementById('boss-emoji'); bossEl.classList.add('hit-flash', 'shake'); setTimeout(()=>bossEl.classList.remove('hit-flash', 'shake'), 300);
      currentBoss.hp -= hero.atk; updateCombatUI();
      if (currentBoss.hp <= 0) {
          playSoundWin();
          runResult.defeatBoss = true;
          runResult.rewards += (currentBoss.mult * currentBet);
          showRpgMessage(`${currentBoss.name} をたおした！\n特大ボーナス獲得！`, () => { stage = stage===3 ? 1 : stage+1; hero.exp = 0; handleRewardCalc(); });
      } else {
          setTimeout(bossTurnEnemy, GAME_CONFIG.turnSpeed / 2);
      }
  });
}

function bossTurnEnemy() {
  showRpgMessage(`${currentBoss.name} のこうげき！\n😀 は ${currentBoss.atk} のダメージ！`, () => {
      playSoundHit();
      let heroEl = document.getElementById('hero-emoji'); heroEl.classList.add('hit-flash', 'shake'); setTimeout(()=>heroEl.classList.remove('hit-flash', 'shake'), 300);
      hero.hp -= currentBoss.atk; updateCombatUI();
      if (hero.hp <= 0) {
          playSoundLose();
          showRpgMessage(`😀 は たおれてしまった...\nステージ１からやりなおしだ。`, () => {
              hero = { hp: 5, maxHp: 5, atk: 1, exp: 0 }; stage = 1; handleRewardCalc();
          });
      } else {
          setTimeout(bossTurnHero, GAME_CONFIG.turnSpeed / 2);
      }
  });
}

// =============================================================================
// 報酬精算
// =============================================================================
function handleRewardCalc() {
  let stepBonus = 0;
  if (runResult.steps >= 8) { stepBonus = runResult.steps * currentBet; runResult.rewards += stepBonus; }
  
  let totalWin = Math.floor(runResult.rewards);
  if (totalWin > 0) {
      playSoundWin(); medals += totalWin; updateUI();
      
      let breakdown = [];
      if (runResult.items.filter(i=>i.type==='reward').length > 0) breakdown.push('アイテム獲得');
      if (stepBonus > 0) breakdown.push(`長距離ボーナス(+${stepBonus})`);
      if (runResult.mazeCleared && !runResult.defeatBoss) breakdown.push(`最奥部ボーナス`);
      if (runResult.defeatBoss) breakdown.push(`ボス撃破ボーナス`);
      
      document.getElementById('total-win-amount').innerText = totalWin;
      document.getElementById('win-breakdown').innerHTML = breakdown.join('<br>');
      document.getElementById('total-win-banner').style.display = 'block';
      setTimeout(finishTurn, 2500);
  } else {
      finishTurn();
  }
}

function finishTurn() {
  document.getElementById('total-win-banner').style.display = 'none';
  document.getElementById('hero-sprite').style.display = 'none';
  saveGameData(); recordMedalLog(medals);
  
  if (freeSpinsLeft > 0) {
      freeSpinsLeft--; updateUI();
      setTimeout(() => startSpin(true), 1000);
  } else {
      isSpinning = false; isFreeSpinMode = false;
      document.getElementById('spin-btn').disabled = false;
      updateCombatUI(); updateUI();
  }
}

</script>
