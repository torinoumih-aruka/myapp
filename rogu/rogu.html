<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ジェミニの大冒険</title>
    <style>
        :root {
            --bg-color: #000;
            --panel-color: #1a1a1a;
            --hp-color: #99cc00;
            --hunger-color: #ffcc00;
            --tile-w: 17px;
            --tile-h: 28px;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-color);
            color: white; font-family: sans-serif;
            overflow: hidden; touch-action: none;
        }

        #game-container {
            display: flex; flex-direction: column;
            height: 100dvh; max-width: 500px; margin: 0 auto;
            position: relative;
        }

        /* --- タイトル・設定画面 --- */
        #title-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99999; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        #title-screen h1 { color: yellow; margin-bottom: 40px; text-shadow: 2px 2px #ff0000; }
        .title-btn {
            background: #444; color: white; border: 2px solid white; border-radius: 8px;
            padding: 15px 40px; font-size: 20px; margin-bottom: 20px; cursor: pointer;
        }
        #config-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100000; display: none; flex-direction: column;
            padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        .config-row { margin-bottom: 15px; display: flex; flex-direction: column; }
        .config-row label { margin-bottom: 5px; color: #ddd; }
        .config-row input[type="range"] { width: 100%; }
        .config-row input[type="text"] { width: 100%; padding: 8px; font-size: 16px; background: #333; color: white; border: 1px solid #777;}
        
        /* 階層フェード */
        #floor-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: black; color: white; font-size: 24px; display: none;
            align-items: center; justify-content: center; z-index: 90000; opacity: 1; transition: opacity 1.5s ease;
        }

        /* ステータスエリア */
        #status-area { padding: 6px 10px; background: var(--panel-color); font-size: 13px; z-index: 200; border-bottom: 1px solid #333;}
        .stat-header { display: flex; justify-content: space-between; margin-bottom: 4px; color: #fff; font-size: 11px; white-space: nowrap;}
        .stat-row { display: flex; align-items: center; margin-bottom: 2px; }
        .bar-bg { flex-grow: 1; height: 8px; background: #333; border-radius: 4px; margin: 0 8px; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 0.2s; }
        #hp-fill { background: var(--hp-color); }
        #hunger-fill { background: var(--hunger-color); }

        #viewport { flex: 1; position: relative; overflow: hidden; background: #000; }

        /* [重要] -11px 維持 */
        #map-root {
            position: absolute; font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
            font-size: 28px; line-height: 28px; letter-spacing: -11px; transition: transform 0.1s linear; 
        }

        #measure-tile {
            position: absolute; visibility: hidden; pointer-events: none;
            font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif; font-size: 28px; line-height: 28px; letter-spacing: -11px;
        }

        /* レイヤーのZ-Index完全制御 */
        .layer { position: absolute; top: 0; left: 0; white-space: pre; }
        #terrain-layer { z-index: 10; }
        #entity-layer { z-index: 20; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;}
        #fog-layer { z-index: 50; position: absolute; top: 0; left: 0; display: grid; }
        
        .fog-cell { background-color: rgba(0, 0, 0, 0.7); transition: background-color 0.3s; }
        .fog-visible { background-color: rgba(0, 0, 0, 0); }

        #minimap-canvas { position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.6); border: 1px solid #444; z-index: 90; pointer-events: auto; cursor: pointer; }

        /* コントロールパッド縮小 */
        #controls {
            background: var(--panel-color); display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
            padding: 5px; z-index: 200; height: 25dvh; max-height: 180px; /* 縦幅を縮める */
        }
        .btn {
            background: #333; color: white; border: none; border-radius: 6px; font-size: 16px;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 3px #000; cursor: pointer; padding: 4px;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 1px #000; background: #444; }
        
        /* メッセージウィンドウ */
        #msg-log {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 92%; height: 2.8em; background: rgba(0, 0, 0, 0.85); color: white;
            padding: 4px 8px; font-size: 12px; border-radius: 6px; z-index: 100;
            overflow: hidden; pointer-events: none; line-height: 1.4; border: 1px solid #444;
        }

        #choice-dialog {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95); padding: 15px; border: 2px solid white;
            border-radius: 10px; z-index: 1000; display: none; text-align: center; width: 80%;
        }
        .choice-btn { margin: 8px; padding: 6px 15px; background: #333; color: white; border: 1px solid white; border-radius: 5px; cursor: pointer; }

        #inventory-panel {
            position: absolute; top: 2%; left: 5%; width: 90%; height: 90%;
            background: rgba(20, 20, 20, 0.95); border: 2px solid #555; border-radius: 10px;
            z-index: 500; display: none; flex-direction: column; padding: 10px; box-sizing: border-box;
        }
        #inventory-panel h3 { margin: 0 0 5px 0; font-size: 14px; border-bottom: 1px solid #555; padding-bottom: 5px; }
        #inv-list { flex: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none; font-size: 13px; }
        .inv-item { display: flex; flex-direction: column; padding: 6px 0; border-bottom: 1px dashed #444; }
        .inv-item-name { cursor: pointer; padding: 4px 0; }
        .inv-submenu { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        .inv-btn-small { background: #444; color: white; border: 1px solid #777; padding: 4px 8px; border-radius: 3px; font-size: 12px; cursor: pointer;}
        
        #debug-panel {
            position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; background: rgba(0,0,50,0.95);
            border: 2px solid #55f; z-index: 2000; display: none; flex-direction: column; padding: 10px; box-sizing: border-box;
        }
        #debug-log-view { flex: 1; overflow-y: auto; font-size: 11px; background: #000; padding: 5px; border: 1px solid #444; margin-bottom: 10px;}

        /* エンティティZ-Index */
        .entity {
            position: absolute; width: var(--tile-w); height: var(--tile-h);
            display: flex; align-items: center; justify-content: center; font-size: 28px;
            transition: left 0.15s ease-out, top 0.15s ease-out, transform 0.2s ease-in-out;
        }
        .entity[data-type="item"] { z-index: 21; }
        .entity[data-type="enemy"] { z-index: 22; }
        .entity[data-type="player"] { z-index: 23; }

        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.5); } }
        .entity.dying { animation: fadeOut 0.2s forwards; transition: none; }
    </style>
</head>
<body>

<div id="title-screen">
    <h1>ジェミニの大冒険</h1>
    <button class="title-btn" onclick="game.startGame()">ゲームスタート</button>
    <button class="title-btn" onclick="document.getElementById('config-screen').style.display='flex'">メニュー(設定)</button>
</div>

<div id="config-screen">
    <h2 style="margin-top:0;">設定</h2>
    <div class="config-row">
        <label>主人公の名前 (全角4文字以内)</label>
        <input type="text" id="cfg-name" value="ジェミニ" maxlength="4">
    </div>
    <div class="config-row">
        <label>敵の最大数: <span id="val-enemies">10</span></label>
        <input type="range" id="cfg-enemies" min="5" max="30" value="10" oninput="document.getElementById('val-enemies').innerText=this.value">
    </div>
    <div class="config-row">
        <label>リスポーンターン: <span id="val-respawn">30</span></label>
        <input type="range" id="cfg-respawn" min="10" max="50" value="30" oninput="document.getElementById('val-respawn').innerText=this.value">
    </div>
    <div class="config-row">
        <label>アイテムの最大数: <span id="val-items">10</span></label>
        <input type="range" id="cfg-items" min="2" max="20" value="10" oninput="document.getElementById('val-items').innerText=this.value">
    </div>
    <div class="config-row">
        <label>部屋の最大広さ: <span id="val-roomsize">15</span></label>
        <input type="range" id="cfg-roomsize" min="4" max="20" value="15" oninput="document.getElementById('val-roomsize').innerText=this.value">
    </div>
    <button class="title-btn" style="margin-top:20px;" onclick="document.getElementById('config-screen').style.display='none'">閉じる</button>
</div>

<div id="measure-tile">⬛</div>

<div id="game-container" style="display:none;">
    <div id="floor-overlay">地下 1階</div>

    <div id="status-area">
        <div class="stat-header">
            <span style="flex:1;"><span id="floor-val">1</span>F Lv.<span id="lv-val">1</span> 経験値:<span id="exp-val">0</span></span>
            <span style="flex:1; text-align:right;">力:<span id="str-val">8</span> 武器:<span id="atk-val">0</span> 盾:<span id="def-val">0</span></span>
        </div>
        <div class="stat-row" onclick="game.toggleDebugPanel()">
            <span style="width: 25px; font-weight:bold;">HP</span>
            <div class="bar-bg"><div id="hp-fill" class="bar-fill"></div></div>
            <span id="hp-val" style="width: 45px; text-align: right;">20/20</span>
        </div>
        <div class="stat-row">
            <span style="width: 25px;">🍞</span>
            <div class="bar-bg"><div id="hunger-fill" class="bar-fill"></div></div>
            <span id="hunger-val" style="width: 45px; text-align: right;">100%</span>
        </div>
    </div>

    <div id="viewport">
        <canvas id="minimap-canvas"></canvas>
        <div id="choice-dialog">
            <div id="choice-text" style="margin-bottom:15px; color:white;"></div>
            <div id="choice-buttons"></div>
        </div>
        <div id="map-root">
            <div id="terrain-layer" class="layer"></div>
            <div id="entity-layer"></div>
            <div id="fog-layer"></div>
        </div>
        <div id="msg-log">探索を開始した...</div>
    </div>

    <div id="inventory-panel">
        <h3 id="inv-title-bar"><span id="inv-title-text">🎒 持ち物</span> (<span id="inv-count">0</span>/20)</h3>
        <ul id="inv-list"></ul>
        <button id="close-inv-btn" style="margin-top:auto;" onclick="game.closeInventory()">閉じる</button>
    </div>

    <div id="debug-panel">
        <h3 style="margin-top:0;">デバッグメニュー</h3>
        <label><input type="checkbox" id="chk-debug-map" onchange="game.draw()"> 全マップ・エンティティ表示</label>
        <hr style="width:100%; border-color:#55f;">
        <div id="debug-log-view"></div>
        <button style="padding:10px; background:#f55; color:white; border:none;" onclick="document.getElementById('debug-panel').style.display='none'">閉じる</button>
    </div>

    <div id="controls">
        <button class="btn" onclick="game.handleInput(-1, -1)">↖</button>
        <button class="btn" onclick="game.handleInput(0, -1)">▲</button>
        <button class="btn" onclick="game.handleInput(1, -1)">↗</button>
        <button class="btn" style="background:#552222" onclick="game.openInventory()">🎒</button>

        <button class="btn" onclick="game.handleInput(-1, 0)">◀</button>
        <button class="btn" id="btn-center" style="font-size:14px" onclick="game.handleCenterBtn()">足踏み<br>⌛</button>
        <button class="btn" onclick="game.handleInput(1, 0)">▶</button>
        <button class="btn" style="background:#225522" onclick="game.handleFeet()">🦶</button>

        <button class="btn" onclick="game.handleInput(-1, 1)">↙</button>
        <button class="btn" onclick="game.handleInput(0, 1)">▼</button>
        <button class="btn" onclick="game.handleInput(1, 1)">↘</button>
        <button class="btn" style="visibility: hidden;"></button>
    </div>
</div>

<script>
    const CONFIG = {
        MAP_W: 50, MAP_H: 30, MINIMAP_TILE_SIZE: 3,
        TILES: { WALL: '⬛', FLOOR: '⬜', WATER: '🟦', STAIRS: '📶', PLAYER: '🙂' }
    };

    class Game {
        constructor() {
            this.gameState = 'TITLE'; 
            this.actualTileW = 17;   
            this.actualTileH = 28;
			this.seenTiles = new Set();
            this.fullLogHistory = [];
            this.config = { name: "ジェミニ", maxEnemies: 10, respawnTurn: 30, maxItems: 10, roomSize: 15 };
            
            this.enemyMaster = [];
            this.itemMaster = [];
            this.measureTileSize();
            this.setupFogGrid();
            this.loadMasterData();
        }

        measureTileSize() {
            const measureEl = document.getElementById('measure-tile');
            const rect = measureEl.getBoundingClientRect();
            this.actualTileW = rect.width || 17;
            this.actualTileH = rect.height || 28;
            document.documentElement.style.setProperty('--tile-w', `${this.actualTileW}px`);
        }

        async loadMasterData() {
            try {
                const [eRes, iRes] = await Promise.all([fetch('enemies.json'), fetch('items.json')]);
                if(!eRes.ok || !iRes.ok) throw new Error("JSON Fetch Error");
                this.enemyMaster = await eRes.json();
                this.itemMaster = await iRes.json();
            } catch (error) {
                // フォールバック
                this.enemyMaster = [
                    {id: "e1", emoji: "🐍", name: "ニョロヘビ", color: "red", hp: 10, exp: 5, atk: 3, def: 1, accuracy: 90, drop_rate: 2, behavior: "chase"},
                    {id: "e2", emoji: "💀", name: "さまようむくろ", color: "red", hp: 15, exp: 8, atk: 4, def: 2, accuracy: 85, drop_rate: 2, behavior: "wander"},
                    {id: "e3", emoji: "👹", name: "オニ小僧", color: "red", hp: 20, exp: 12, atk: 6, def: 3, accuracy: 80, drop_rate: 2, behavior: "random"}
                ];
                this.itemMaster = [
                    {id: "i1", emoji: "🥖", name: "パン", color: "cyan", category: "food", effects: {hunger: 40}, consumable: true, spawn_rate: 30},
                    {id: "i2", emoji: "🥬", name: "薬草", color: "cyan", category: "herb", effects: {hp: 25, hunger: 2}, consumable: true, spawn_rate: 20},
                    {id: "i3", emoji: "📜", name: "天の恵みの巻物", color: "cyan", category: "scroll", consumable: true, spawn_rate: 10},
                    {id: "i4", emoji: "📜", name: "地の恵みの巻物", color: "cyan", category: "scroll", consumable: true, spawn_rate: 10},
                    {id: "i5", emoji: "🗡️", name: "ダガー", color: "cyan", category: "weapon", effects: {atk: 2}, accuracy: 95, consumable: false, spawn_rate: 15},
                    {id: "i6", emoji: "🛡️", name: "木甲の盾", color: "cyan", category: "shield", effects: {def: 2}, consumable: false, spawn_rate: 15}
                ];
            }
        }

        startGame() {
            // コンフィグ取得
            const nameIn = document.getElementById('cfg-name').value.trim();
            this.config.name = nameIn.substring(0, 4) || "ジェミニ";
            this.config.color = "yellow";
            this.config.maxEnemies = parseInt(document.getElementById('cfg-enemies').value) || 10;
            this.config.respawnTurn = parseInt(document.getElementById('cfg-respawn').value) || 30;
            this.config.maxItems = parseInt(document.getElementById('cfg-items').value) || 10;
            this.config.roomSize = parseInt(document.getElementById('cfg-roomsize').value) || 15;

            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            
            this.floor = 1;
            this.player = { 
                id: 'player', type: 'player',
                x: 0, y: 0, level: 1, exp: 0, 
                maxHp: 20, hp: 20, maxHunger: 100, hunger: 100, 
                strength: 8, baseAtk: 5, baseDef: 0, 
                atk: 0, def: 0,
                inventory: [], equipment: { weapon: null, shield: null, bracelet: null }
            };
            this.fullLogHistory = [];
            document.getElementById('msg-log').innerHTML = ''; // ログクリア
            
            this.recalculateStats();
            this.initLevel(true);
        }

        initLevel(isFirst = false) {
            this.gameState = 'INIT';
            this.seenTiles.clear();
			this.entities = { enemies: [], items: [] };
            this.generateMap();
            this.spawnEntities();
            
            const overlay = document.getElementById('floor-overlay');
            overlay.textContent = `地下 ${this.floor}階`;
            overlay.style.display = 'flex';
            overlay.style.opacity = '1';
            
            this.draw(true); // 初期位置のズレ防止のため即時描画
            
            setTimeout(() => {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 1500);
                if (!isFirst) this.log(`${this.config.name}は 階段を降りた。`);
                this.gameState = 'PLAY';
            }, 100);
        }

        // --- マップ生成 (洪水の塗りつぶしで全床の接続を保証) ---
        generateMap() {
            this.map = Array.from({ length: CONFIG.MAP_H }, () => Array(CONFIG.MAP_W).fill(CONFIG.TILES.WALL));
            this.rooms = [];
            
            const numRooms = Math.floor(Math.random() * 10) + 1; 
            
            if (numRooms === 1) {
                this.rooms.push({ x: 1, y: 1, w: CONFIG.MAP_W - 2, h: CONFIG.MAP_H - 2 });
                for(let ry=1; ry<CONFIG.MAP_H-1; ry++) for(let rx=1; rx<CONFIG.MAP_W-1; rx++) this.map[ry][rx] = CONFIG.TILES.FLOOR;
            } else {
                const maxW = Math.max(4, this.config.roomSize);
                const maxH = Math.max(4, this.config.roomSize);

                for (let i = 0; i < numRooms; i++) {
                    const w = Math.floor(Math.random() * (maxW - 3)) + 4;
                    const h = Math.floor(Math.random() * (maxH - 3)) + 4;
                    const x = Math.floor(Math.random() * (CONFIG.MAP_W - w - 2)) + 1;
                    const y = Math.floor(Math.random() * (CONFIG.MAP_H - h - 2)) + 1;
                    if (this.rooms.some(r => x < r.x + r.w + 2 && x + w + 2 > r.x && y < r.y + r.h + 2 && y + h + 2 > r.y)) continue;
                    for (let ry = y; ry < y + h; ry++) for (let rx = x; rx < x + w; rx++) this.map[ry][rx] = CONFIG.TILES.FLOOR;
                    if (this.rooms.length > 0) {
                        let targetIdx = this.rooms.length - 1;
                        if (Math.random() < 0.2 && this.rooms.length > 1) targetIdx = Math.floor(Math.random() * (this.rooms.length - 1));
                        const prev = this.rooms[targetIdx];
                        this.digCorridor(Math.floor(prev.x+prev.w/2), Math.floor(prev.y+prev.h/2), Math.floor(x+w/2), Math.floor(y+h/2));
                    }
                    this.rooms.push({ x, y, w, h });
                }
            }

            // 水路
            const rivers = Math.floor(Math.random() * 3) + 2;
            for (let i = 0; i < rivers; i++) {
                let wx = Math.floor(Math.random() * CONFIG.MAP_W), wy = Math.floor(Math.random() * CONFIG.MAP_H);
                for (let j = 0; j < 40; j++) {
                    if (wy > 0 && wy < CONFIG.MAP_H-1 && wx > 0 && wx < CONFIG.MAP_W-1) this.map[wy][wx] = CONFIG.TILES.WATER;
                    const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
                    const d = dirs[Math.floor(Math.random() * 4)];
                    wx += d[0]; wy += d[1];
                }
            }

            // 全床の接続保証 (水路で分断された部分を繋ぐ)
            this.ensureAllFloorsConnected();

            // プレイヤーと階段の配置 (水や壁にならない場所を厳選)
            const pPos = this.getRandomValidPos();
            this.player.x = pPos.x; this.player.y = pPos.y;

            let sPos;
            do { sPos = this.getRandomValidPos(); } while(sPos.x === pPos.x && sPos.y === pPos.y);
            this.map[sPos.y][sPos.x] = CONFIG.TILES.STAIRS;
        }

        digCorridor(x1, y1, x2, y2) {
            let cx = x1, cy = y1;
            if (Math.random() < 0.5) {
                const midX = Math.floor((x1 + x2) / 2);
                while (cx !== midX) { cx += (midX > cx ? 1 : -1); if (this.map[cy]) this.map[cy][cx] = CONFIG.TILES.FLOOR; }
                while (cy !== y2) { cy += (y2 > cy ? 1 : -1); if (this.map[cy]) this.map[cy][cx] = CONFIG.TILES.FLOOR; }
                while (cx !== x2) { cx += (x2 > cx ? 1 : -1); if (this.map[cy]) this.map[cy][cx] = CONFIG.TILES.FLOOR; }
            } else {
                const midY = Math.floor((y1 + y2) / 2);
                while (cy !== midY) { cy += (midY > cy ? 1 : -1); if (this.map[cy]) this.map[cy][cx] = CONFIG.TILES.FLOOR; }
                while (cx !== x2) { cx += (x2 > cx ? 1 : -1); if (this.map[cy]) this.map[cy][cx] = CONFIG.TILES.FLOOR; }
                while (cy !== y2) { cy += (y2 > cy ? 1 : -1); if (this.map[cy]) this.map[cy][cx] = CONFIG.TILES.FLOOR; }
            }
        }

        ensureAllFloorsConnected() {
            let firstFloor = null;
            outer: for (let y = 0; y < CONFIG.MAP_H; y++) {
                for (let x = 0; x < CONFIG.MAP_W; x++) {
                    if (this.map[y][x] === CONFIG.TILES.FLOOR) { firstFloor = {x, y}; break outer; }
                }
            }
            if (!firstFloor) return;

            let connected = new Set();
            let q = [firstFloor];
            connected.add(`${firstFloor.x},${firstFloor.y}`);

            while(q.length > 0) {
                let {x, y} = q.shift();
                [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx, dy]) => {
                    let nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < CONFIG.MAP_W && ny >= 0 && ny < CONFIG.MAP_H) {
                        if ((this.map[ny][nx] === CONFIG.TILES.FLOOR) && !connected.has(`${nx},${ny}`)) {
                            connected.add(`${nx},${ny}`); q.push({x: nx, y: ny});
                        }
                    }
                });
            }

            let unconnected = [];
            for (let y = 0; y < CONFIG.MAP_H; y++) {
                for (let x = 0; x < CONFIG.MAP_W; x++) {
                    if (this.map[y][x] === CONFIG.TILES.FLOOR && !connected.has(`${x},${y}`)) unconnected.push({x, y});
                }
            }

            for (let u of unconnected) {
                if (connected.has(`${u.x},${u.y}`)) continue; 
                let bestDist = Infinity; let bestTarget = null;
                for (let str of connected) {
                    let [cx, cy] = str.split(',').map(Number);
                    let dist = Math.abs(cx - u.x) + Math.abs(cy - u.y);
                    if (dist < bestDist) { bestDist = dist; bestTarget = {x: cx, y: cy}; }
                }
                if (bestTarget) {
                    let curX = u.x, curY = u.y;
                    while (curX !== bestTarget.x || curY !== bestTarget.y) {
                        if (curX !== bestTarget.x) curX += (bestTarget.x > curX ? 1 : -1);
                        else if (curY !== bestTarget.y) curY += (bestTarget.y > curY ? 1 : -1);
                        if (this.map[curY][curX] !== CONFIG.TILES.STAIRS) {
                            this.map[curY][curX] = CONFIG.TILES.FLOOR;
                            connected.add(`${curX},${curY}`);
                        }
                    }
                }
            }
        }

        getRandomValidPos() {
            while(true) {
                let x = Math.floor(Math.random() * CONFIG.MAP_W);
                let y = Math.floor(Math.random() * CONFIG.MAP_H);
                if (this.map[y][x] === CONFIG.TILES.FLOOR && !this.entities.items.some(i=>i.x===x&&i.y===y) && !this.entities.enemies.some(e=>e.x===x&&e.y===y)) {
                    return {x, y};
                }
            }
        }

        spawnEntities() {
            this.entities.enemies = [];
            this.entities.items = [];
            
            // 敵
            const numE = Math.floor(Math.random() * this.config.maxEnemies) + 1;
            for(let i=0; i<numE; i++) {
                if(this.enemyMaster.length === 0) break;
                const pos = this.getRandomValidPos();
                this.spawnEnemyAt(pos.x, pos.y);
            }

            // アイテム
            const numI = Math.floor(Math.random() * (this.config.maxItems - 1)) + 2;
            for(let i=0; i<numI; i++) {
                if(this.itemMaster.length === 0) break;
                const pos = this.getRandomValidPos();
                const master = this.itemMaster[Math.floor(Math.random() * this.itemMaster.length)];
                let mod = 0;
                if (['weapon', 'shield', 'bracelet'].includes(master.category)) {
                    const r = Math.random() * 100;
                    if (r < 40) mod = 0; else if (r < 65) mod = 1; else if (r < 80) mod = 2; else if (r < 90) mod = 3; else mod = -1;
                }
                this.entities.items.push({ id: 'i-' + Math.random().toString(36).substr(2, 9), x: pos.x, y: pos.y, ...master, modifier: mod, isEquipped: false, type: 'item' });
            }
            this.turnCount = 0;
        }

        spawnEnemyAt(x, y) {
            const master = this.enemyMaster[Math.floor(Math.random() * this.enemyMaster.length)];
            // 50%で起きている
            const awake = Math.random() < 0.5;
            this.entities.enemies.push({
                id: 'e-' + Math.random().toString(36).substr(2, 9), type: 'enemy',
                x: x, y: y, hp: master.hp + (this.floor * 2), maxHp: master.hp + (this.floor * 2),
                atk: master.atk, def: master.def, exp: master.exp, accuracy: master.accuracy || 90, drop_rate: master.drop_rate || 2,
                name: master.name, emoji: master.emoji, color: master.color, behavior: master.behavior,
                isAwake: awake, lastSeenPos: null
            });
        }

        // --- プレイヤーステータス・経験値 ---
        getRequiredExp(level) {
            if (level === 1) return 10;
            if (level === 2) return 30;
            if (level === 3) return 60;
            if (level === 4) return 100;
            if (level === 5) return 200;
            if (level === 6) return 400;
            if (level === 7) return 700;
            if (level === 8) return 1000;
            return 1000 + (level - 9) * 1000;
        }

        recalculateStats() {
            let wAtk = this.player.equipment.weapon ? ((this.player.equipment.weapon.effects.atk||0) + this.player.equipment.weapon.modifier) : 0;
            let sDef = this.player.equipment.shield ? ((this.player.equipment.shield.effects.def||0) + this.player.equipment.shield.modifier) : 0;
            
            this.player.atk = wAtk; // 武器の純粋な攻撃力（表示用）
            this.player.def = sDef; // 盾の純粋な防御力（表示用）
        }

        gainExp(amount) {
            this.player.exp += amount;
            this.log(`${this.config.name}は ${amount}の経験値を得た`);
            
            while (this.player.level < 99 && this.player.exp >= this.getRequiredExp(this.player.level)) {
                this.player.level++;
                this.player.baseAtk += 2;
                this.player.maxHp += 5;
                this.player.hp += 5; // 増えた分だけ回復
                this.recalculateStats();
                this.log(`レベル${this.player.level}に上がった！`);
            }
        }

        // --- ロジック ---
        isCornerBlocked(cx, cy, nx, ny) {
            if (cx === nx || cy === ny) return false;
            const t1 = this.map[cy]?.[nx];
            const t2 = this.map[ny]?.[cx];
            if (t1 === CONFIG.TILES.WALL || t2 === CONFIG.TILES.WALL) return true;
            return false;
        }

        async handleInput(dx, dy) {
            if (this.gameState === 'THROWING') {
                if (dx === 0 && dy === 0) {
                    this.log("投げるのをやめた。");
                    this.endThrowMode();
                } else {
                    await this.executeThrow(dx, dy);
                }
                return;
            }

            if (this.gameState !== 'PLAY') return;

            const nx = this.player.x + dx, ny = this.player.y + dy;
            if (nx < 0 || nx >= CONFIG.MAP_W || ny < 0 || ny >= CONFIG.MAP_H) return;
            const targetTile = this.map[ny][nx];
            if (targetTile === CONFIG.TILES.WALL || targetTile === CONFIG.TILES.WATER) return;
            if (this.isCornerBlocked(this.player.x, this.player.y, nx, ny)) return;

            const enemy = this.entities.enemies.find(e => e.x === nx && e.y === ny);
            if (enemy) {
                this.gameState = 'ANIMATING';
                await this.playAttackAnim(this.player, enemy.x, enemy.y);
                this.combat(this.player, enemy);
                this.triggerTurn();
                return;
            }

            this.player.x = nx;
            this.player.y = ny;

            if (this.map[ny][nx] === CONFIG.TILES.STAIRS) {
                this.log(`${this.config.name}は 階段に乗った。`);
                this.showChoiceDialog("次のフロアに降りますか？", 
                    () => { this.floor++; this.initLevel(); }, 
                    () => { this.gameState = 'PLAY'; this.triggerTurn(); } 
                );
                return; 
            }

            this.triggerTurn();
        }

        handleCenterBtn() {
            if (this.gameState === 'THROWING') {
                this.log("投げるのをやめた。");
                this.endThrowMode();
            } else if (this.gameState === 'PLAY') {
                this.log("足踏み中...");
                this.triggerTurn();
            }
        }

        handleFeet() {
            if (this.gameState !== 'PLAY') return;
            const tile = this.map[this.player.y][this.player.x];
            const itemIdx = this.entities.items.findIndex(i => i.x === this.player.x && i.y === this.player.y);

            if (tile === CONFIG.TILES.STAIRS) {
                this.showChoiceDialog("次のフロアに降りますか？", 
                    () => { this.floor++; this.initLevel(); }, 
                    () => { this.gameState = 'PLAY'; } 
                );
            } else if (itemIdx !== -1) {
                this.showFeetItemMenu(itemIdx);
            } else {
                this.log("足元には 何もない。");
            }
        }

        async triggerTurn() {
            this.gameState = 'ANIMATING'; 

            this.hungerTurnCount++;
            if (this.hungerTurnCount >= 10) {
                this.player.hunger--; this.hungerTurnCount = 0;
            }
            if (this.player.hunger <= 0) { 
                this.player.hunger = 0; this.player.hp -= 1; this.log("お腹が空いて倒れそうだ...");
            }

            this.hpRecoveryTurnCount++;
            let healAmount = 0;
            const lv = this.player.level;
            if (lv <= 5 && this.hpRecoveryTurnCount >= 10) { healAmount = 1; this.hpRecoveryTurnCount = 0; }
            else if (lv >= 6 && lv <= 10 && this.hpRecoveryTurnCount >= 5) { healAmount = 1; this.hpRecoveryTurnCount = 0; }
            else if (lv >= 11 && lv <= 15) { healAmount = 1; }
            else if (lv >= 16 && lv <= 20) { healAmount = 2; }
            else if (lv >= 21) { healAmount = 3; }
            
            if (healAmount > 0 && this.player.hp < this.player.maxHp) {
                this.player.hp = Math.min(this.player.maxHp, this.player.hp + healAmount);
            }

            if (this.player.hp <= 0) { 
                alert("冒険失敗..."); location.reload(); return;
            }

            this.turnCount++;
            if (this.turnCount > this.config.respawnTurn && this.entities.enemies.length < this.config.maxEnemies && this.enemyMaster.length > 0) {
                this.turnCount = 0;
                let safe = false; let sx, sy;
                for(let i=0; i<20; i++){
                    const pos = this.getRandomValidPos();
                    if(Math.abs(pos.x - this.player.x) > 10 || Math.abs(pos.y - this.player.y) > 10) {
                        sx = pos.x; sy = pos.y; safe = true; break;
                    }
                }
                if (safe) this.spawnEnemyAt(sx, sy);
            }

            await this.moveEnemies();
            this.draw();
            if (this.gameState === 'ANIMATING') this.gameState = 'PLAY';
        }

        async playAttackAnim(attacker, tx, ty) {
            const el = document.querySelector(`[data-id="${attacker.id}"]`);
            if (el) {
                const dx = Math.sign(tx - attacker.x) * 50;
                const dy = Math.sign(ty - attacker.y) * 50;
                el.style.transform = `translate(${dx}%, ${dy}%)`;
                await new Promise(r => setTimeout(r, 200));
                el.style.transform = `translate(0, 0)`;
                await new Promise(r => setTimeout(r, 200));
            }
        }

        combat(atkEntity, defEntity) {
            const isPlayerAtk = (atkEntity === this.player);
            const accuracy = isPlayerAtk ? (this.player.equipment.weapon ? (this.player.equipment.weapon.accuracy || 98) : 98) : (atkEntity.accuracy || 90);
            const atkName = isPlayerAtk ? this.config.name : atkEntity.name;
            const defName = defEntity === this.player ? this.config.name : defEntity.name;

            if (Math.random() * 100 > accuracy) {
                this.log(`${atkName}の 攻撃は外れた`);
                return;
            }

            let dmg = 1;
            if (isPlayerAtk) {
                let wAtk = this.player.equipment.weapon ? (this.player.equipment.weapon.effects.atk||0) + this.player.equipment.weapon.modifier : 0;
                let base = this.player.baseAtk;
                let str = this.player.strength;
                let v1 = Math.round(base + (base * (wAtk + str - 8) / 16));
                let v2 = Math.round(v1 - (2 / base));
                let v3 = v2 + Math.floor(Math.random() * (base + 1));
                dmg = Math.max(1, v3 - defEntity.def); // 敵は純粋なdef
            } else {
                let pDef = this.player.baseDef + (this.player.equipment.shield ? (this.player.equipment.shield.effects.def||0) + this.player.equipment.shield.modifier : 0);
                dmg = Math.max(1, atkEntity.atk - pDef + Math.floor(Math.random() * 3));
            }
            
            if(isNaN(dmg)) dmg = 1; // フェイルセーフ
            defEntity.hp -= dmg;
            this.log(`${atkName}は ${defName}に ${dmg}ダメージを与えた`);

            if (defEntity.hp <= 0 && defEntity !== this.player) {
                this.log(`${defName}は倒れた`);
                this.entities.enemies = this.entities.enemies.filter(e => e !== defEntity);
                this.gainExp(defEntity.exp);
                
                // アイテムドロップ処理
                if (Math.random() * 100 < defEntity.drop_rate) {
                    if (this.itemMaster.length > 0) {
                        const m = this.itemMaster[Math.floor(Math.random() * this.itemMaster.length)];
                        let mod = 0;
                        if (['weapon', 'shield'].includes(m.category)) {
                            const r = Math.random() * 100;
                            if (r < 40) mod = 0; else if (r < 65) mod = 1; else if (r < 80) mod = 2; else if (r < 90) mod = 3; else mod = -1;
                        }
                        const item = { id: 'i-' + Math.random().toString(36).substr(2, 9), ...m, modifier: mod, isEquipped: false, type: 'item' };
                        this.dropItemAt(item, defEntity.x, defEntity.y);
                    }
                }
            }
        }

        async moveEnemies() {
            const playerRoom = this.rooms.find(r => this.player.x >= r.x && this.player.x < r.x + r.w && this.player.y >= r.y && this.player.y < r.y + r.h);
            const sortedEnemies = [...this.entities.enemies].sort((a,b) => Math.max(Math.abs(a.x-this.player.x),Math.abs(a.y-this.player.y)) - Math.max(Math.abs(b.x-this.player.x),Math.abs(b.y-this.player.y)));
            
            for (let e of sortedEnemies) {
                if (e.hp <= 0) continue; 
                
                const enemyRoom = this.rooms.find(r => e.x >= r.x && e.x < r.x + r.w && e.y >= r.y && e.y < r.y + r.h);
                const dist = Math.max(Math.abs(e.x - this.player.x), Math.abs(e.y - this.player.y));
                let canSee = (enemyRoom && playerRoom === enemyRoom) || (dist <= 1);

                if (canSee) { e.isAwake = true; e.lastSeenPos = { x: this.player.x, y: this.player.y }; }

                let willMoveRandomly = false;
                if (e.behavior === 'random' && Math.random() < 0.7) willMoveRandomly = true;

                if (dist === 1 && canSee && !this.isCornerBlocked(e.x, e.y, this.player.x, this.player.y)) {
                    if (willMoveRandomly) {
                        this.executeRandomMove(e);
                    } else {
                        await this.playAttackAnim(e, this.player.x, this.player.y);
                        this.combat(e, this.player);
                        if (this.player.hp <= 0) return;
                    }
                } else if (e.isAwake) {
                    if (willMoveRandomly) {
                        this.executeRandomMove(e);
                    } else {
                        const target = canSee ? { x: this.player.x, y: this.player.y } : (e.lastSeenPos || this.getRandomRoomCenter(e));
                        let bestDist = Infinity; let moves = [];
                        for (let my = -1; my <= 1; my++) {
                            for (let mx = -1; mx <= 1; mx++) {
                                if (mx === 0 && my === 0) continue;
                                const nx = e.x + mx, ny = e.y + my;
                                if (nx < 0 || nx >= CONFIG.MAP_W || ny < 0 || ny >= CONFIG.MAP_H) continue;
                                const t = this.map[ny][nx];
                                if (t === CONFIG.TILES.WALL || t === CONFIG.TILES.WATER) continue;
                                if (this.isCornerBlocked(e.x, e.y, nx, ny)) continue;
                                if (this.entities.enemies.some(oe => oe.x === nx && oe.y === ny) || (nx === this.player.x && ny === this.player.y)) continue;
                                
                                const d = Math.max(Math.abs(nx - target.x), Math.abs(ny - target.y));
                                if (d < bestDist) { bestDist = d; moves = [{x: mx, y: my}]; }
                                else if (d === bestDist) { moves.push({x: mx, y: my}); }
                            }
                        }
                        if(moves.length > 0) {
                            let m = moves[Math.floor(Math.random()*moves.length)];
                            e.x += m.x; e.y += m.y;
                        }
                    }
                }
            }
        }

        executeRandomMove(e) {
            let moves = [];
            for (let my = -1; my <= 1; my++) {
                for (let mx = -1; mx <= 1; mx++) {
                    if (mx === 0 && my === 0) continue;
                    const nx = e.x + mx, ny = e.y + my;
                    if (nx >= 0 && nx < CONFIG.MAP_W && ny >= 0 && ny < CONFIG.MAP_H) {
                        if (this.map[ny][nx] !== CONFIG.TILES.WALL && this.map[ny][nx] !== CONFIG.TILES.WATER) {
                            if (!this.isCornerBlocked(e.x, e.y, nx, ny) && !this.entities.enemies.some(oe => oe.x === nx && oe.y === ny) && !(nx === this.player.x && ny === this.player.y)) {
                                moves.push({x: mx, y: my});
                            }
                        }
                    }
                }
            }
            if (moves.length > 0) {
                let m = moves[Math.floor(Math.random()*moves.length)];
                e.x += m.x; e.y += m.y;
            }
        }

        getRandomRoomCenter(e) {
            if(this.rooms.length === 0) return {x: e.x, y: e.y};
            const r = this.rooms[Math.floor(Math.random() * this.rooms.length)];
            return { x: Math.floor(r.x + r.w/2), y: Math.floor(r.y + r.h/2) };
        }

        // --- インベントリ管理 ---
        pickupItem(specificIdx = -1) {
            const idx = specificIdx !== -1 ? specificIdx : this.entities.items.findIndex(i => i.x === this.player.x && i.y === this.player.y);
            if (idx !== -1) {
                const item = this.entities.items[idx];
                if(this.player.inventory.length < 20) {
                    this.player.inventory.push(item);
                    this.log(`${item.emoji}${this.getItemDisplayName(item, false)}を 拾った`);
                    this.entities.items.splice(idx, 1);
                } else {
                    this.log(`持ち物がいっぱいで ${item.emoji}${this.getItemDisplayName(item, false)}を 拾えない！`);
                }
            }
        }

        openInventory() {
            if (this.gameState !== 'PLAY') return;
            this.gameState = 'MENU';
            document.getElementById('msg-log').style.display = 'none';
            document.getElementById('inventory-panel').style.display = 'flex';
            document.getElementById('inv-title-text').innerText = '🎒 持ち物';
            this.renderInventory();
        }

        closeInventory() {
            document.getElementById('inventory-panel').style.display = 'none';
            document.getElementById('msg-log').style.display = 'block';
            if(this.gameState === 'MENU' || this.gameState === 'SELECT_TARGET' || this.gameState === 'FEET_MENU') this.gameState = 'PLAY';
        }

        getItemDisplayName(item, showEquipped = false) {
            let name = item.name;
            if (item.modifier > 0) name += `+${item.modifier}`;
            else if (item.modifier < 0) name += `${item.modifier}`;
            return (showEquipped && item.isEquipped ? "E " : "") + name;
        }

        renderInventory() {
            document.getElementById('inv-count').textContent = this.player.inventory.length;
            const list = document.getElementById('inv-list');
            list.innerHTML = '';
            
            this.player.inventory.forEach((it, index) => {
                const li = document.createElement('li');
                li.className = 'inv-item';
                li.id = `inv-item-${index}`;

                const nameDiv = document.createElement('div');
                nameDiv.className = 'inv-item-name';
                nameDiv.textContent = `${it.emoji}${this.getItemDisplayName(it, true)}`;
                nameDiv.style.color = it.color;
                
                nameDiv.onclick = () => {
                    if (this.gameState === 'SELECT_TARGET') {
                        this.applyScrollEffect(index);
                    } else {
                        this.showItemSubmenu(index, li);
                    }
                };
                li.appendChild(nameDiv);
                list.appendChild(li);
            });
        }

        showItemSubmenu(index, liElement) {
            this.renderInventory();
            const currentLi = document.getElementById(`inv-item-${index}`);
            const it = this.player.inventory[index];
            const subDiv = document.createElement('div');
            subDiv.className = 'inv-submenu';

            const isEquippable = ['weapon', 'shield', 'bracelet'].includes(it.category);
            
            const actionBtn = document.createElement('button');
            actionBtn.className = 'inv-btn-small';
            if (isEquippable) {
                if (it.isEquipped) {
                    actionBtn.textContent = '外す';
                    actionBtn.onclick = () => this.handleEquip(index, false);
                } else {
                    actionBtn.textContent = '装備';
                    actionBtn.onclick = () => this.handleEquip(index, true);
                }
            } else {
                actionBtn.textContent = '使う';
                actionBtn.onclick = () => this.handleUseItem(index);
            }

            const putBtn = document.createElement('button'); putBtn.className = 'inv-btn-small'; putBtn.textContent = '置く';
            putBtn.onclick = () => this.handlePutItem(index);

            const throwBtn = document.createElement('button'); throwBtn.className = 'inv-btn-small'; throwBtn.textContent = '投げる';
            throwBtn.onclick = () => this.startThrowMode(index);

            const cancelBtn = document.createElement('button'); cancelBtn.className = 'inv-btn-small'; cancelBtn.textContent = '閉じる';
            cancelBtn.onclick = () => this.renderInventory(); // サブメニューを閉じるだけ

            subDiv.appendChild(actionBtn); subDiv.appendChild(putBtn);
            subDiv.appendChild(throwBtn); subDiv.appendChild(cancelBtn);
            currentLi.appendChild(subDiv);
        }

        handleEquip(index, isEquipping) {
            const item = this.player.inventory[index];
            const cat = item.category;

            if (isEquipping) {
                if (this.player.equipment[cat]) this.player.equipment[cat].isEquipped = false;
                item.isEquipped = true;
                this.player.equipment[cat] = item;
                this.log(`${item.emoji}${this.getItemDisplayName(item, false)}を 装備した`);
            } else {
                item.isEquipped = false;
                this.player.equipment[cat] = null;
                this.log(`${item.emoji}${this.getItemDisplayName(item, false)}を 外した`);
            }
            this.recalculateStats();
            this.closeInventory();
            this.triggerTurn(); 
        }

        handleUseItem(index) {
            const item = this.player.inventory[index];
            let used = false;
            
            if (item.category === 'food') {
                if (this.player.hunger >= this.player.maxHunger) {
                    this.player.maxHunger += 2;
                }
                this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                this.log(`${item.emoji}${item.name}を 食べた`);
                used = true;
            } else if (item.category === 'herb') {
                if (this.player.hp >= this.player.maxHp) {
                    this.player.maxHp += 1;
                }
                this.player.hp = Math.min(this.player.maxHp, this.player.hp + (item.effects.hp||0));
                this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                this.log(`${item.emoji}${item.name}を 飲んだ`);
                used = true;
            } else if (item.name === "天の恵みの巻物" || item.name === "地の恵みの巻物") {
                this.gameState = 'SELECT_TARGET';
                this.scrollIndex = index;
                this.scrollTargetCategory = item.name === "天の恵みの巻物" ? 'weapon' : 'shield';
                document.getElementById('inv-title-text').innerText = 'どれに使いますか？';
                this.renderInventory();
                return; 
            } else {
                this.log(`${item.emoji}${item.name}を 使ったが 何も起きなかった`);
                used = true;
            }

            if (used && item.consumable) this.player.inventory.splice(index, 1);
            this.closeInventory();
            this.triggerTurn(); 
        }

        applyScrollEffect(targetIndex) {
            const targetItem = this.player.inventory[targetIndex];
            const scrollItem = this.player.inventory[this.scrollIndex];
            
            if (targetItem.category === this.scrollTargetCategory) {
                const up = Math.random() < 0.05 ? 3 : 1;
                targetItem.modifier += up;
                this.log(`${scrollItem.emoji}${scrollItem.name}を読んだ。${targetItem.emoji}${targetItem.name}の補正値が+${up}された！`);
                this.recalculateStats();
            } else {
                this.log(`${scrollItem.emoji}${scrollItem.name}は 効果が現れなかった`);
            }
            
            const removeIdx = this.scrollIndex < targetIndex ? this.scrollIndex : this.scrollIndex;
            this.player.inventory.splice(removeIdx, 1);
            
            this.closeInventory();
            this.triggerTurn();
        }

        handlePutItem(index) {
            const item = this.player.inventory[index];
            if (this.dropItemAt(item, this.player.x, this.player.y, true)) {
                this.player.inventory.splice(index, 1);
                if(item.isEquipped && this.player.equipment[item.category] === item) {
                    item.isEquipped = false; this.player.equipment[item.category] = null; this.recalculateStats();
                }
                this.log(`${item.emoji}${this.getItemDisplayName(item, false)}を 足元に置いた`);
                this.closeInventory();
                this.triggerTurn();
            } else {
                this.log(`${item.emoji}${this.getItemDisplayName(item, false)}を 置けなかった`);
                this.closeInventory();
            }
        }

        startThrowMode(index) {
            this.throwingItemIndex = index;
            this.closeInventory();
            this.gameState = 'THROWING';
            this.log("投げる方向を選んでください");
            document.getElementById('btn-center').innerHTML = '取消<br>❌';
        }
        
        endThrowMode() {
            this.gameState = 'PLAY';
            document.getElementById('btn-center').innerHTML = '足踏み<br>⌛';
        }

        async executeThrow(dx, dy) {
            this.endThrowMode();
            const item = this.player.inventory.splice(this.throwingItemIndex, 1)[0];
            if(item.isEquipped && this.player.equipment[item.category] === item) {
                item.isEquipped = false; this.player.equipment[item.category] = null; this.recalculateStats();
            }
            
            this.log(`${this.config.name}は ${item.emoji}${this.getItemDisplayName(item, false)}を投げた`);
            
            let cx = this.player.x, cy = this.player.y;
            let hitEnemy = null;
            
            for(let i=0; i<10; i++) {
                let nx = cx + dx, ny = cy + dy;
                if(this.map[ny][nx] === CONFIG.TILES.WALL) break;
                cx = nx; cy = ny;
                let enemy = this.entities.enemies.find(e => e.x === cx && e.y === cy);
                if(enemy) { hitEnemy = enemy; break; }
            }

            if(hitEnemy) {
                this.log(`${item.emoji}${this.getItemDisplayName(item, false)}が ${hitEnemy.name}に 当たった`);
                if(item.category === 'herb') {
                    hitEnemy.hp = Math.min(hitEnemy.maxHp, hitEnemy.hp + (item.effects.hp || 0));
                } else if(['weapon', 'shield', 'projectile'].includes(item.category)) {
                    let val = (item.effects.atk || 0) + (item.effects.def || 0) + (item.modifier || 0) + 1;
                    hitEnemy.hp -= val;
                    if(hitEnemy.hp <= 0) {
                        this.log(`${hitEnemy.name}は 倒れた`);
                        this.entities.enemies = this.entities.enemies.filter(e => e !== hitEnemy);
                        this.gainExp(hitEnemy.exp);
                    }
                }
            } else {
                // 落下処理
                if(!this.dropItemAt(item, cx, cy)) {
                    this.log(`${item.emoji}${this.getItemDisplayName(item, false)}は 使い物にならなくなった`);
                }
            }
            this.triggerTurn();
        }

        /**
         * 指定座標または周囲8マスにアイテムを落とす。strict=trueなら指定座標のみ。
         */
        dropItemAt(item, startX, startY, strict = false) {
            const isDroppable = (x, y) => {
                if(x < 0 || x >= CONFIG.MAP_W || y < 0 || y >= CONFIG.MAP_H) return false;
                if(this.map[y][x] !== CONFIG.TILES.FLOOR) return false;
                if(this.entities.items.some(i => i.x === x && i.y === y)) return false;
                return true;
            };
            if (isDroppable(startX, startY)) {
                item.x = startX; item.y = startY; this.entities.items.push(item); return true;
            }
            if (strict) return false;
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    if (isDroppable(startX + dx, startY + dy)) {
                        item.x = startX + dx; item.y = startY + dy; this.entities.items.push(item); return true;
                    }
                }
            }
            return false;
        }

        showFeetItemMenu(itemIdx) {
            this.gameState = 'FEET_MENU';
            const item = this.entities.items[itemIdx];
            document.getElementById('msg-log').style.display = 'none';
            const panel = document.getElementById('inventory-panel');
            panel.style.display = 'flex';
            document.getElementById('inv-title-text').innerHTML = `👣 足元 (${item.emoji}${this.getItemDisplayName(item, false)})`;
            
            const list = document.getElementById('inv-list');
            list.innerHTML = '';
            const subDiv = document.createElement('div');
            subDiv.className = 'inv-submenu';

            if (this.player.inventory.length < 20) {
                const pickBtn = document.createElement('button'); pickBtn.className = 'inv-btn-small'; pickBtn.textContent = '拾う';
                pickBtn.onclick = () => { this.pickupItem(itemIdx); this.closeInventory(); this.triggerTurn(); };
                subDiv.appendChild(pickBtn);

                if (['weapon', 'shield', 'bracelet'].includes(item.category)) {
                    const eqBtn = document.createElement('button'); eqBtn.className = 'inv-btn-small'; eqBtn.textContent = '装備する';
                    eqBtn.onclick = () => {
                        this.entities.items.splice(itemIdx, 1);
                        this.player.inventory.push(item);
                        this.handleEquip(this.player.inventory.length - 1, true);
                    };
                    subDiv.appendChild(eqBtn);
                } else {
                    const useBtn = document.createElement('button'); useBtn.className = 'inv-btn-small'; useBtn.textContent = '使う';
                    useBtn.onclick = () => {
                        this.entities.items.splice(itemIdx, 1);
                        this.player.inventory.push(item);
                        this.handleUseItem(this.player.inventory.length - 1);
                    };
                    subDiv.appendChild(useBtn);
                }
            } else {
                const exBtn = document.createElement('button'); exBtn.className = 'inv-btn-small'; exBtn.textContent = '交換';
                exBtn.onclick = () => { this.log("どれと交換しますか？ (未実装)"); this.closeInventory(); };
                subDiv.appendChild(exBtn);

                if (!['weapon', 'shield', 'bracelet'].includes(item.category)) {
                    const useBtn = document.createElement('button'); useBtn.className = 'inv-btn-small'; useBtn.textContent = '使う';
                    useBtn.onclick = () => {
                        this.entities.items.splice(itemIdx, 1);
                        this.player.inventory.push(item);
                        this.handleUseItem(this.player.inventory.length - 1);
                    };
                    subDiv.appendChild(useBtn);
                }
            }

            const throwBtn = document.createElement('button'); throwBtn.className = 'inv-btn-small'; throwBtn.textContent = '投げる';
            throwBtn.onclick = () => {
                this.entities.items.splice(itemIdx, 1);
                this.player.inventory.push(item);
                this.startThrowMode(this.player.inventory.length - 1);
            };
            subDiv.appendChild(throwBtn);

            const cancelBtn = document.createElement('button'); cancelBtn.className = 'inv-btn-small'; cancelBtn.textContent = '閉じる';
            cancelBtn.onclick = () => this.closeInventory();
            subDiv.appendChild(cancelBtn);
            list.appendChild(subDiv);
        }

        // --- デバッグ ---
        toggleDebugPanel() {
            const panel = document.getElementById('debug-panel');
            if(panel.style.display === 'flex') {
                panel.style.display = 'none';
            } else {
                panel.style.display = 'flex';
                document.getElementById('debug-log-view').innerHTML = this.fullLogHistory.join('<hr style="border-color:#333; margin:2px 0;">');
            }
        }

		/* ==========================================================
         * UI描画系
         * ========================================================== */

        /**
         * 【ログ表示】
         */
        log(msg) {
            const logEl = document.getElementById('msg-log');
            let html = msg;

            html = html.replace(new RegExp(this.config.name, 'g'), `<span style="color:${this.config.color}">${this.config.name}</span>`);
            this.enemyMaster.forEach(e => { html = html.replace(new RegExp(e.name, 'g'), `<span style="color:${e.color}">${e.name}</span>`); });
            this.itemMaster.forEach(it => { html = html.replace(new RegExp(it.name, 'g'), `<span style="color:${it.color}">${it.name}</span>`); });

            const lines = logEl.innerHTML.split('<br>').filter(l => l !== "");
            lines.push(html);
            if (lines.length > 2) lines.shift(); 
            logEl.innerHTML = lines.join('<br>');
        }

        /**
         * 【ダイアログ表示】
         */
        showChoiceDialog(message, onYes, onNo) {
            this.gameState = 'CHOICE';
            const dialog = document.getElementById('choice-dialog');
            document.getElementById('choice-text').innerHTML = message;
            
            const btnArea = document.getElementById('choice-buttons');
            btnArea.innerHTML = ''; 
            
            const btnYes = document.createElement('button');
            btnYes.className = 'choice-btn'; btnYes.textContent = '降りる';
            btnYes.onclick = () => { dialog.style.display = 'none'; onYes(); };
            
            const btnNo = document.createElement('button');
            btnNo.className = 'choice-btn'; btnNo.textContent = 'そのまま';
            btnNo.onclick = () => { dialog.style.display = 'none'; onNo(); };

            btnArea.appendChild(btnYes);
            btnArea.appendChild(btnNo);
            
            dialog.style.display = 'block';
        }


        // --- 描画系 ---
        setupFogGrid() {
            const fogLayer = document.getElementById('fog-layer');
            fogLayer.innerHTML = '';
            fogLayer.style.gridTemplateColumns = `repeat(${CONFIG.MAP_W}, ${this.actualTileW}px)`;
            fogLayer.style.gridTemplateRows = `repeat(${CONFIG.MAP_H}, ${this.actualTileH}px)`;
            this.fogCells = [];
            const count = CONFIG.MAP_W * CONFIG.MAP_H;
            for (let i = 0; i < count; i++) {
                const cell = document.createElement('div');
                cell.className = 'fog-cell';
                cell.style.width = `${this.actualTileW}px`;
                cell.style.height = `${this.actualTileH}px`;
                fogLayer.appendChild(cell);
                this.fogCells.push(cell);
            }
        }

        draw(forceNoAnimation = false) {
            const terrainLayer = document.getElementById('terrain-layer');
            const entityLayer = document.getElementById('entity-layer');
            const fogLayer = document.getElementById('fog-layer');
            
            document.getElementById('floor-val').textContent = this.floor;
            document.getElementById('lv-val').textContent = this.player.level;
            document.getElementById('exp-val').textContent = this.player.exp;
            document.getElementById('str-val').textContent = this.player.strength;
            document.getElementById('atk-val').textContent = this.player.atk;
            document.getElementById('def-val').textContent = this.player.def;

            document.getElementById('hp-fill').style.width = `${(this.player.hp / this.player.maxHp) * 100}%`;
            document.getElementById('hp-val').textContent = `${Math.ceil(this.player.hp)}/${this.player.maxHp}`;
            document.getElementById('hunger-fill').style.width = `${(this.player.hunger / this.player.maxHunger) * 100}%`;
            document.getElementById('hunger-val').textContent = `${Math.ceil(this.player.hunger)}%`;
            
            const inRoom = this.rooms.find(r => this.player.x >= r.x && this.player.x < r.x + r.w && this.player.y >= r.y && this.player.y < r.y + r.h);
            const visibleSet = new Set();
            const isDebugMap = document.getElementById('chk-debug-map') && document.getElementById('chk-debug-map').checked;

            this.fogCells.forEach((cell, i) => {
                const x = i % CONFIG.MAP_W, y = Math.floor(i / CONFIG.MAP_W);
                let isVisible = false;
                if (inRoom) {
                    if (x >= inRoom.x - 1 && x <= inRoom.x + inRoom.w && y >= inRoom.y - 1 && y <= inRoom.y + inRoom.h) isVisible = true;
                } else {
                    if (Math.abs(this.player.x - x) <= 1 && Math.abs(this.player.y - y) <= 1) isVisible = true;
                }
                if (isVisible || isDebugMap) {
                    this.seenTiles.add(`${x},${y}`);
                    cell.className = 'fog-cell fog-visible';
                    visibleSet.add(`${x},${y}`);
                } else { 
                    cell.className = 'fog-cell'; 
                }
            });

            terrainLayer.textContent = this.map.map((row, y) => row.map((tile, x) => {
                if (tile === CONFIG.TILES.STAIRS && !this.seenTiles.has(`${x},${y}`) && !isDebugMap) return CONFIG.TILES.FLOOR;
                return tile;
            }).join('')).join('\n');

            const allEntities = [
                { id: 'player', type: 'player', x: this.player.x, y: this.player.y, icon: CONFIG.TILES.PLAYER, awake: true },
                ...this.entities.enemies.filter(e => visibleSet.has(`${e.x},${e.y}`)).map(e => ({ id: e.id, type: 'enemy', x: e.x, y: e.y, icon: e.emoji, awake: e.isAwake })),
                ...this.entities.items.filter(it => this.seenTiles.has(`${it.x},${it.y}`)).map(it => ({ id: it.id, type: 'item', x: it.x, y: it.y, icon: it.emoji, awake: true }))
            ];

            const currentIds = new Set(allEntities.map(e => e.id));
            Array.from(entityLayer.children).forEach(child => {
                if (!currentIds.has(child.dataset.id)) {
                    if (child.dataset.type === 'enemy') { child.classList.add('dying'); setTimeout(() => child.remove(), 200); }
                    else child.remove();
                }
            });

            allEntities.forEach(ent => {
                let div = entityLayer.querySelector(`[data-id="${ent.id}"]`);
                let isNew = false;
                if (!div) {
                    div = document.createElement('div');
                    div.className = 'entity';
                    div.dataset.id = ent.id;
                    div.dataset.type = ent.type;
                    entityLayer.appendChild(div);
                    isNew = true;
                }
                div.textContent = ent.icon;
                if(ent.type === 'enemy') div.style.opacity = ent.awake ? '1' : '0.5';
                div.style.width = `${this.actualTileW}px`;
                div.style.height = `${this.actualTileH}px`;

                if (isNew || forceNoAnimation) {
                    div.style.transition = 'none';
                    div.style.left = `${ent.x * this.actualTileW}px`;
                    div.style.top = `${ent.y * this.actualTileH}px`;
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            div.style.transition = 'left 0.1s ease-out, top 0.1s ease-out, transform 0.2s ease-in-out'; 
                        });
                    });
                } else {
                    div.style.left = `${ent.x * this.actualTileW}px`;
                    div.style.top = `${ent.y * this.actualTileH}px`;
                }
            });

            const canvas = document.getElementById('minimap-canvas');
            const ts = CONFIG.MINIMAP_TILE_SIZE;
            canvas.width = CONFIG.MAP_W * ts;
            canvas.height = CONFIG.MAP_H * ts;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < CONFIG.MAP_H; y++) {
                for (let x = 0; x < CONFIG.MAP_W; x++) {
                    const key = `${x},${y}`;
                    if (this.player.x === x && this.player.y === y) {
                        ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(x*ts+ts/2, y*ts+ts/2, ts/2, 0, Math.PI*2); ctx.fill();
                    } else if (visibleSet.has(key) && this.entities.enemies.some(e => e.x === x && e.y === y)) {
                        ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(x*ts+ts/2, y*ts+ts/2, ts/2, 0, Math.PI*2); ctx.fill();
                    } else if (this.seenTiles.has(key)) {
                        if (this.entities.items.some(it => it.x === x && it.y === y)) {
                            ctx.fillStyle = 'cyan'; ctx.beginPath(); ctx.arc(x*ts+ts/2, y*ts+ts/2, ts/2, 0, Math.PI*2); ctx.fill();
                        } else {
                            const tile = this.map[y][x];
                            if (tile === CONFIG.TILES.STAIRS) { ctx.strokeStyle = 'white'; ctx.lineWidth = 1; ctx.strokeRect(x*ts+0.5, y*ts+0.5, ts-1, ts-1); }
                            else if (tile === CONFIG.TILES.WATER) { ctx.fillStyle = 'white'; ctx.fillRect(x*ts, y*ts, ts, ts); }
                            else if (tile === CONFIG.TILES.FLOOR) { ctx.fillStyle = '#4444ff'; ctx.fillRect(x*ts, y*ts, ts, ts); }
                        }
                    }
                }
            }

            const viewport = document.getElementById('viewport');
            const vx = (viewport.clientWidth / 2) - (this.player.x * this.actualTileW) - (this.actualTileW / 2);
            const vy = (viewport.clientHeight / 2) - (this.player.y * this.actualTileH) - (this.actualTileH / 2);
            
            const mapRoot = document.getElementById('map-root');
            if (forceNoAnimation) {
                mapRoot.style.transition = 'none';
                mapRoot.style.transform = `translate(${vx}px, ${vy}px)`;
                mapRoot.offsetHeight;
                mapRoot.style.transition = 'transform 0.1s linear';
            } else {
                mapRoot.style.transform = `translate(${vx}px, ${vy}px)`;
            }
        }
    }

    const game = new Game();
</script>
