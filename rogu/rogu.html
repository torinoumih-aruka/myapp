                    if (this.player.equipment.weapon.marks && this.player.equipment.weapon.marks.includes("浮") && defEntity.attributes && defEntity.attributes.includes("float")) {
                        extraRate += 0.5;
                    }
                    // ドレイン特攻
                    if (this.player.equipment.weapon.marks && this.player.equipment.weapon.marks.includes("ド") && defEntity.attributes && defEntity.attributes.includes("drain")) {
                        extraRate += 0.5;
                    }
                    // 竜特攻
                    if (this.player.equipment.weapon.marks && this.player.equipment.weapon.marks.includes("竜") && defEntity.attributes && defEntity.attributes.includes("dragon")) {
                        extraRate += 0.5;
                    }

                }
                let str = this.player.strength || 8; //ちから
                lvlAtk = this.player.level*1; // レベル攻撃力
                const random = 0.875 + Math.random() * (1.125 - 0.875); //乱数

                // 武器攻撃力＝武器の基本攻撃力×(0.75*ちから/32)
                let wAtkRst = Math.round(wAtk*(0.75*str/32));

                // 攻撃力＝ちから＋武器攻撃力＋レベル攻撃力
                let v1 = str+wAtkRst+lvlAtk;

                // ダメージ＝(攻撃力-(敵キャラの守備力+2)+1)×乱数
                dmg = Math.max(1,Math.floor((v1-((defEntity.def || 0)+2)+1)*random));

                /*
                let v1 = Math.round(base + (base * (wAtk + str - 8) / 16));
                let v2 = Math.round(v1 - (2 / base));
                let v3 = v2 + Math.floor(Math.random() * (base + 1));
                dmg = Math.max(1, v3 - (defEntity.def || 0));
                */

                if (this.player.equipment.weapon && this.player.equipment.weapon.marks && this.player.equipment.weapon.marks.includes("薬")) {
                    this.player.hp = Math.min(this.player.maxHp, this.player.hp + 2);
                }
                if (this.player.equipment.weapon && this.player.equipment.weapon.marks && this.player.equipment.weapon.marks.includes("弟")) {
                    this.player.hp = Math.min(this.player.maxHp, this.player.hp + 4);
                }
            } else {

                // 防御力（盾の防御力＋補正値）
                let pDef = this.player.baseDef + (this.player.equipment.shield ? (this.player.equipment.shield.effects.def||0) + this.player.equipment.shield.modifier : 0);

                const random = 0.875 + Math.random() * (1.125 - 0.875); //乱数

                /*
                dmg = Math.max(1, (atkEntity.atk || 0) - pDef + Math.floor(Math.random() * 3));
                */

                // ダメージ＝敵の攻撃力-防御力+1×乱数
                dmg = Math.max(1, Math.floor(((atkEntity.atk || 0) - pDef + 1)*random));
            }
            
            if(isNaN(dmg)) dmg = 1;
            defEntity.hp -= dmg;
            defEntity.statuses.paralyzed = 0; 
            
            this.log(`${atkName}は ${defName}に ${dmg}ダメージを与えた`);

            if (defEntity.hp <= 0 && defEntity !== this.player) {
                this.log(`${defName}は 倒れた`);
                this.entities.enemies = this.entities.enemies.filter(e => e.uid !== defEntity.uid);
                this.gainExp(defEntity.exp || 0);
                
                // アイテムドロップ
                this.processEnemyDrop(defEntity);
            }
        }

        async moveEnemies() {
            const playerRoom = this.rooms.find(r => this.player.x >= r.x && this.player.x < r.x + r.w && this.player.y >= r.y && this.player.y < r.y + r.h);
            const sortedEnemies = [...this.entities.enemies].sort((a,b) => Math.max(Math.abs(a.x-this.player.x),Math.abs(a.y-this.player.y)) - Math.max(Math.abs(b.x-this.player.x),Math.abs(b.y-this.player.y)));      

            for (let e of sortedEnemies) {
                if (e.hp <= 0) continue;                 
                if (e.statuses.paralyzed > 0) continue; 
                if (e.statuses.asleep > 0) { e.statuses.asleep--; continue; }
                if (e.statuses.confused > 0) e.statuses.confused--;
                if (e.statuses.double_speed > 0) {
                    e.statuses.double_speed--;
                    if(e.statuses.double_speed === 0) this.log(`${this.fmtE(e)}の 倍速が解けた`);
                }
                if (e.statuses.slow > 0) {
                    e.statuses.slow--;
                    if(e.statuses.slow === 0) this.log(`${this.fmtE(e)}の 鈍足が解けた`);
                }

                if (e.statuses.slow > 0) {
                    e.skipNextTurn = !e.skipNextTurn;
                    if(e.skipNextTurn) continue;
                }

                const enemyRoom = this.rooms.find(r => e.x >= r.x && e.x < r.x + r.w && e.y >= r.y && e.y < r.y + r.h);
                const dist = Math.max(Math.abs(e.x - this.player.x), Math.abs(e.y - this.player.y));
             
                let canSee = false;
                if (enemyRoom) {
                    if (playerRoom === enemyRoom) canSee = true;
                    else if (this.player.x >= enemyRoom.x - 2 && this.player.x < enemyRoom.x + enemyRoom.w + 2 &&
                             this.player.y >= enemyRoom.y - 2 && this.player.y < enemyRoom.y + enemyRoom.h + 2) canSee = true;
                } else {
                    if (dist <= 2) canSee = true;
                }

                if (canSee) { e.isAwake = true; e.lastSeenPos = null; e.waitCount = 0; }

                let isConfused = e.statuses.confused > 0;
                let willMoveRandomly = isConfused || (e.behavior === 'random' && Math.random() < 0.7);
                let isFear = e.behavior === 'fear';

                let speed = e.speed || 1;
                if (e.statuses.double_speed > 0) speed *= 2;
                let attacks = e.attack_count || 1;

                for (let s = 0; s < speed; s++) {
                    if (e.hp <= 0) break;
                    let currentDist = Math.max(Math.abs(e.x - this.player.x), Math.abs(e.y - this.player.y));

                    // 特殊遠距離行動（アーチャー）
                    if (e.behavior === 'archer' && canSee) {
                        const dx = this.player.x - e.x;
                        const dy = this.player.y - e.y;
                        // ▼修正: 斜め45度も直線として判定
                        if (dx === 0 || dy === 0 || Math.abs(dx) === Math.abs(dy)) {
                            if (currentDist <= 5 || Math.random() < 0.5) {
                                this.gameState = 'ANIMATING';
                                await this.playAttackAnim(e, this.player.x, this.player.y);
                                
                                const arrowMaster = this.itemMaster.find(m => m.id === e.projectile);
                                let arrow = { ...arrowMaster, uid: this.generateUid(), stack: 1, type: 'item' };
                                this.log(`${this.fmtE(e)}は ${arrow.name}を 撃ってきた`);
                                
                                // ▼修正: 軌道上の衝突判定
                                const stepX = Math.sign(dx);
                                const stepY = Math.sign(dy);
                                let hitTarget = null;
                                let cx = e.x, cy = e.y;
                                
                                for (let i = 0; i < 10; i++) {
                                    cx += stepX; cy += stepY;
                                    if (cx < 0 || cx >= CONFIG.MAP_W || cy < 0 || cy >= CONFIG.MAP_H) break;
                                    
                                    if (arrow.id === 'i101') {
                                        // TODO: 銀の矢の貫通処理
                                        break;
                                    } else {
                                        if (this.map[cy][cx] === CONFIG.TILES.WALL) {
                                            this.dropItemAt(arrow, cx - stepX, cy - stepY);
                                            hitTarget = 'wall';
                                            break;
                                        }
                                        let otherEnemy = this.entities.enemies.find(oe => oe.x === cx && oe.y === cy && oe.uid !== e.uid);
                                        if (otherEnemy) {
                                            let arrowDmg = Math.max(1, Math.floor((e.atk + arrow.effects.atk - (otherEnemy.def||0) + 1) * (0.875 + Math.random() * 0.25)));
                                            otherEnemy.hp -= arrowDmg;
                                            this.log(`${arrow.name}は ${this.fmtE(otherEnemy)}に 当たった`);
                                            if (otherEnemy.hp <= 0) {
                                                this.log(`${this.fmtE(otherEnemy)}は 倒れた`);
                                                this.entities.enemies = this.entities.enemies.filter(en => en.uid !== otherEnemy.uid);
                                                this.evolveEnemy(e);
                                                this.processEnemyDrop(otherEnemy);
                                            }
                                            hitTarget = 'enemy';
                                            break;
                                        }
                                        if (cx === this.player.x && cy === this.player.y) {
                                            let pDef = this.player.baseDef + (this.player.equipment.shield ? (this.player.equipment.shield.effects.def||0) + this.player.equipment.shield.modifier : 0);
                                            let dmg = Math.max(1, Math.floor((e.atk + arrow.effects.atk - pDef + 1) * (0.875 + Math.random() * 0.25)));
                                            this.player.hp -= dmg;
                                            this.log(`${this.fmtP()}は ${dmg}ダメージを受けた`);
                                            this.damageBracelet();
                                            hitTarget = 'player';
                                            break;
                                        }
                                    }
                                }
                                continue; 
                            }
                        }
                    }                  

                    if (currentDist === 1 && canSee && !this.isCornerBlocked(e.x, e.y, this.player.x, this.player.y)) {

                        // 特殊隣接行動
                        if (e.behavior === 'thief') {
                            if (Math.random() < 0.3) {
                                this.log(`${this.fmtE(e)}は 様子をみている`);
                            } else {
                                const unequipped = this.player.inventory.filter(i => !i.isEquipped);
                                if (unequipped.length > 0) {
                                    const targetItem = unequipped[Math.floor(Math.random() * unequipped.length)];
                                    this.player.inventory = this.player.inventory.filter(i => i.uid !== targetItem.uid);
                                    e.drop_item_uid = targetItem.uid;
                                    // itemそのものを敵キャラエンティティに保存
                                    e.stolenItem = targetItem;
                                    e.behavior = 'fear';
                                    this.log(`${this.fmtE(e)}は ${this.fmtI(targetItem)}を 盗んだ！`);
                                } else {
                                    // this.combat(e, this.player);
                                    this.log(`${this.fmtE(e)}は 様子をみている`);
                                }
                            }
                        } else if (e.behavior === 'breadfairy') {
                            if (Math.random() < 0.2) {
                                const unequipped = this.player.inventory.filter(i => !i.isEquipped);
                                if (unequipped.length > 0) {
                                    const targetItem = unequipped[Math.floor(Math.random() * unequipped.length)];
                                    const panMaster = this.itemMaster.find(m => m.name === 'パン');
                                    this.log(`${this.fmtE(e)}は パン変化の魔法を唱えた`);
                                    this.log(`${this.fmtI(targetItem)}は パンに変わった`);
                                    
                                    targetItem.id = panMaster.id; targetItem.name = panMaster.name;
                                    targetItem.emoji = panMaster.emoji; targetItem.category = panMaster.category;
                                    targetItem.effects = panMaster.effects; targetItem.consumable = panMaster.consumable;
                                } else {
                                    this.combat(e, this.player);
                                    this.damageBracelet();
                                }
                            } else {
                                await this.playAttackAnim(e, this.player.x, this.player.y);
                                this.combat(e, this.player);
                                this.damageBracelet();
                            }
                        } else if (e.behavior === 'poisonspider') {
                            if (Math.random() < 0.15) {
                                this.log(`${this.fmtE(e)}は どくばりを使った`);
                                if (this.player.equipment.shield && this.player.equipment.shield.marks && this.player.equipment.shield.marks.includes("鱗")) {
                                    this.log(`うろこの盾が 毒を防いだ！`);
                                } else {
                                    this.player.strength = Math.max(0, this.player.strength - 1);
                                    this.log(`${this.fmtP()}のちからが1下がった`);
                                }
                            } else {
                                await this.playAttackAnim(e, this.player.x, this.player.y);
                                this.combat(e, this.player);
                                this.damageBracelet();
                            }
                        } else if (willMoveRandomly) {
                            this.executeRandomMove(e);
                        } else if (isFear) {
                            this.executeFearMove(e);
                        } else {
                            for (let a = 0; a < attacks; a++) {
                                if (this.player.hp <= 0 || e.hp <= 0) break;
                                await this.playAttackAnim(e, this.player.x, this.player.y);
                                this.combat(e, this.player);
                                this.damageBracelet();
                            }
                            break; 
                        }
                    } else if (e.isAwake) {
                        if (willMoveRandomly) {
                            this.executeRandomMove(e);
                        } else if (isFear && canSee) {
                            this.executeFearMove(e);
                        } else {
                            this.executeChaseMove(e, canSee, enemyRoom);
                        }
                    }
                }
            }
        }

        executeChaseMove(e, canSee, enemyRoom) {
            let target = null;
            if (e.waitCount > 0) {
                e.waitCount--;
                if (e.waitCount === 0) e.pastPositions = []; 
                return; 
            }
            
            if (canSee) {
                target = { x: this.player.x, y: this.player.y };
            }

            if (!target && enemyRoom) {
                let exits = this.getRoomExits(enemyRoom);
                if (exits.length > 0) {
                    target = exits[Math.floor(Math.random() * exits.length)]; 
                }
            }

            let move = null;
            if (target) {
                let bestDist = Infinity; let bestMoves = [];
                for (let my = -1; my <= 1; my++) {
                    for (let mx = -1; mx <= 1; mx++) {
                        if (mx === 0 && my === 0) continue;
                        let nx = e.x + mx, ny = e.y + my;
                        if (this.canEnemyMoveTo(e, nx, ny)) {
                            let euclidDist = (nx - target.x)*(nx - target.x) + (ny - target.y)*(ny - target.y);
                            if (euclidDist < bestDist) {
                                bestDist = euclidDist; bestMoves = [{x: nx, y: ny}];
                            } else if (euclidDist === bestDist) {
                                bestMoves.push({x: nx, y: ny});
                            }
                        }
                    }
                }
                if (bestMoves.length > 0) move = bestMoves[Math.floor(Math.random() * bestMoves.length)];
            }

            if (!move && !enemyRoom) { 
                let validMoves = []; let allMoves = [];
                for (let my = -1; my <= 1; my++) {
                    for (let mx = -1; mx <= 1; mx++) {
                        if (mx === 0 && my === 0) continue;
                        let nx = e.x + mx, ny = e.y + my;
                        if (this.canEnemyMoveTo(e, nx, ny)) {
                            allMoves.push({x: nx, y: ny});
                            if (!e.pastPositions || !e.pastPositions.some(p => p.x === nx && p.y === ny)) {
                                validMoves.push({x: nx, y: ny});
                            }
                        }
                    }
                }
                if (validMoves.length > 0) {
                    move = validMoves[Math.floor(Math.random() * validMoves.length)];
                } else if (allMoves.length > 0) { 
                    e.waitCount = 2; 
                }
            }

            if (move) {
                if (!e.pastPositions) e.pastPositions = [];
                e.pastPositions.push({x: e.x, y: e.y});
                if (e.pastPositions.length > 2) e.pastPositions.shift();
                e.x = move.x; e.y = move.y;
            }
        }

        canEnemyMoveTo(e, nx, ny) {
            if (nx < 0 || nx >= CONFIG.MAP_W || ny < 0 || ny >= CONFIG.MAP_H) return false;
            const t = this.map[ny][nx];

            //if (t === CONFIG.TILES.WALL || t === CONFIG.TILES.WATER) return false;
            //if (this.isCornerBlocked(e.x, e.y, nx, ny)) return false;

            // ▼修正: 壁歩行フラグ、水上歩行フラグで歩行を判定する
            if (t === CONFIG.TILES.WALL && !e.canWalkWall) return false;
            if (t === CONFIG.TILES.WATER && !e.canWalkWall && !e.canWalkWater) return false;
            if (this.isCornerBlocked(e.x, e.y, nx, ny) && !e.canWalkWall) return false;

            if (this.entities.enemies.some(oe => oe.x === nx && oe.y === ny)) return false;
            if (nx === this.player.x && ny === this.player.y) return false;
            return true;
        }

        getRoomExits(room) {
            if (room.exits) return room.exits;
            let exits = [];
            for (let str of this.doorTiles) {
                let [dx, dy] = str.split(',').map(Number);
                if (dx >= room.x-1 && dx <= room.x+room.w && dy >= room.y-1 && dy <= room.y+room.h) {
                    exits.push({x: dx, y: dy});
                }
            }
            room.exits = exits;
            return exits;
        }

        // --- ランダム行動バグ修正 ---
        executeRandomMove(e) {
            let moves = [];
            for (let my = -1; my <= 1; my++) {
                for (let mx = -1; mx <= 1; mx++) {
                    if (mx === 0 && my === 0) continue;
                    const nx = e.x + mx, ny = e.y + my;
                    if (this.canEnemyMoveTo(e, nx, ny)) moves.push({x: nx, y: ny}); // ←ここを修正 (mx,myではなくnx,ny)
                }
            }
            if (moves.length > 0) {
                let m = moves[Math.floor(Math.random()*moves.length)];
                e.x = m.x; e.y = m.y;
            }
        }

        executeFearMove(e) {
            let bestDist = -1; let moves = [];
            for (let my = -1; my <= 1; my++) {
                for (let mx = -1; mx <= 1; mx++) {
                    if (mx === 0 && my === 0) continue;
                    const nx = e.x + mx, ny = e.y + my;
                    if (this.canEnemyMoveTo(e, nx, ny)) {
                        const d = Math.max(Math.abs(nx - this.player.x), Math.abs(ny - this.player.y));
                        if (d > bestDist) { bestDist = d; moves = [{x: nx, y: ny}]; }
                        else if (d === bestDist) { moves.push({x: nx, y: ny}); }
                    }
                }
            }
            if (moves.length > 0) {
                let m = moves[Math.floor(Math.random()*moves.length)];
                e.x = m.x; e.y = m.y;
            }
        }

        // --- インベントリ管理 ---
        // --- 投擲・スタック処理 ---
        pickupItemLogic(item) {
            const actualIdx = this.entities.items.findIndex(i => i.uid === item.uid);
            if (actualIdx !== -1) {
                this.entities.items.splice(actualIdx, 1);
                
                if (item.category === 'projectile') {
                    let existing = this.player.inventory.find(i => i.id === item.id);
                    if (existing) {
                        existing.stack = Math.min(99, (existing.stack||1) + (item.stack||1));
                        this.log(`${item.emoji}${this.fmtI(item)}を 拾った`);
                        return;
                    }
                }
                this.player.inventory.push(item);
                this.log(`${item.emoji}${this.fmtI(item)}を 拾った`);
            }
        }

        openInventory() {
            if (this.gameState !== 'PLAY' || this.isMsgAnimating) return;
            this.gameState = 'MENU';
            document.getElementById('msg-log').style.display = 'none';
            document.getElementById('inventory-panel').style.display = 'flex';
            document.getElementById('inv-title-text').innerText = '🎒 持ち物';
            this.renderInventory();
        }

        closeInventory() {
            document.getElementById('inventory-panel').style.display = 'none';
            document.getElementById('msg-log').style.display = 'block';
            
            if (this.gameState === 'SELECT_SYNTH_BASE' || this.gameState === 'SELECT_SYNTH_MAT') {
                if (this.synthScrollSource === 'feet' && this.synthScrollItem) {
                    this.entities.items.push(this.synthScrollItem);
                }
                this.synthScrollItem = null;
            }
            
            if (this.gameState === 'SELECT_TARGET') {
                if (this.scrollSource === 'feet' && this.scrollItem) {
                    this.entities.items.push(this.scrollItem);
                }
                this.scrollItem = null;
            }

            if (['MENU', 'SELECT_TARGET', 'FEET_MENU', 'SELECT_SYNTH_BASE', 'SELECT_SYNTH_MAT'].includes(this.gameState)) {
                this.gameState = 'PLAY';
            }
        }

        sortInventory() {
            this.player.inventory.sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
            this.renderInventory();
        }

        // --- 表示名ロジック（未識別対応） ---
        getItemDisplayName(item, showEquipped = false) {
            let name = item.name;
            let isUnidentified = false;

            if (['weapon', 'shield'].includes(item.category)) {
                if (this.config.unidentifyEquip && item.isIdentified === false) {
                    name += `(未識別)`;
                    isUnidentified = true;
                } else {
                    if (item.modifier > 0) name += `+${item.modifier}`;
                    else if (item.modifier < 0) name += `${item.modifier}`;
                }
            } else if (['herb', 'scroll', 'wand', 'bracelet'].includes(item.category)) {
                if (this.config.unidentifyItems && !this.identifiedItemIDs.has(item.id)) {
                    name = this.unidentifiedNames[item.id] || item.name;
                    isUnidentified = true;
                }
            }

            if (item.category === 'projectile' && item.stack > 0) name += `(${item.stack})`;
            if (item.category === 'wand') name += `(${item.uses || 0})`;
            
            let marksText = "";
            if (item.marks && item.marks.length > 0) {
                // ▼修正: 表示条件を bracelet に限定
                if (item.category === 'bracelet') {
                    if (item.marks.includes("呪")) marksText += "(呪)";
                    if (item.marks.includes("ヒビ")) marksText += "(ヒビ)";
                }
            }
            name += marksText;

            // 未識別の場合はHTMLタグで黄色にする (インベントリ表示用)
            let result = (showEquipped && item.isEquipped ? "E " : "") + name;
            if (isUnidentified && showEquipped) result = `<span style="color: yellow;">${result}</span>`;
            return result;
        }

        renderInventory() {
            document.getElementById('inv-count').textContent = this.player.inventory.length;
            const list = document.getElementById('inv-list');
            list.innerHTML = '';
            
            this.player.inventory.forEach((it, index) => {
                const li = document.createElement('li');
                li.className = 'inv-item';
                li.id = `inv-item-${index}`;

                const nameDiv = document.createElement('div');
                nameDiv.className = 'inv-item-name';
                //nameDiv.textContent = `${it.emoji}${this.getItemDisplayName(it, true)}`;
                nameDiv.innerHTML = `${it.emoji}${this.getItemDisplayName(it, true)}`;
                
                nameDiv.onclick = () => {
                    if (this.gameState === 'SELECT_TARGET') {
                        this.applyScrollEffect(index);
                    } else if (this.gameState === 'SELECT_SYNTH_BASE' || this.gameState === 'SELECT_SYNTH_MAT') {
                        this.handleSynthSelection(index);
                    } else {
                        this.showItemSubmenu(index, li);
                    }
                };
                li.appendChild(nameDiv);
                list.appendChild(li);
            });
        }

        showItemSubmenu(index, liElement) {
            this.renderInventory();
            const currentLi = document.getElementById(`inv-item-${index}`);
            const item = this.player.inventory[index];
            const subDiv = document.createElement('div');
            subDiv.style.display = 'flex'; subDiv.style.flexDirection = 'column';

            const descDiv = document.createElement('div');
            descDiv.style.color = 'white'; descDiv.style.fontSize = '12px'; descDiv.style.marginBottom = '5px';

            if (['herb', 'scroll','wand','bracelet'].includes(item.category)) {
                if (!this.identifiedItemIDs.has(item.id)) {
                    descDiv.innerHTML = "未識別のため効果が分からない";
                } else {
                    descDiv.innerHTML = item.description || "";
                }
            } else {
                descDiv.innerHTML = item.description || "";
            }
            
            if (['weapon', 'shield'].includes(item.category)) {
                let slotsText = "";
                const maxSlots = item.slots || 0;
                const marks = item.marks || [];
                for (let i = 0; i < maxSlots; i++) {
                    if (i < marks.length) slotsText += `[${marks[i]}]`;
                    else slotsText += `[ ]`;
                }
                if (maxSlots > 0) descDiv.innerHTML += `<br>スロット: ${slotsText}`;
            }
            subDiv.appendChild(descDiv);

            const btnContainer = document.createElement('div');
            btnContainer.className = 'inv-submenu';

            const isEquippable = ['weapon', 'shield', 'bracelet', 'projectile'].includes(item.category);
            
            const actionBtn = document.createElement('button');
            actionBtn.className = 'inv-btn-small';
            if (isEquippable) {
                if (item.isEquipped) {
                    actionBtn.textContent = '外す';
                    actionBtn.onclick = () => this.equipItemLogic(item, false);
                } else {
                    actionBtn.textContent = '装備';
                    actionBtn.onclick = () => this.equipItemLogic(item, true);
                }
            } else {
                actionBtn.textContent = '使う';
                actionBtn.onclick = () => this.useItemLogic(item, 'inventory');
            }

            const putBtn = document.createElement('button'); putBtn.className = 'inv-btn-small'; putBtn.textContent = '置く';
            putBtn.onclick = () => this.putItemLogic(item, 'inventory');

            const throwBtn = document.createElement('button'); throwBtn.className = 'inv-btn-small'; 
            throwBtn.textContent = item.category === 'projectile' ? '撃つ' : '投げる';
            throwBtn.onclick = () => this.startThrowMode(item, 'inventory');

            const cancelBtn = document.createElement('button'); cancelBtn.className = 'inv-btn-small'; cancelBtn.textContent = '閉じる';
            cancelBtn.onclick = () => this.renderInventory();

            btnContainer.appendChild(actionBtn); btnContainer.appendChild(putBtn);
            btnContainer.appendChild(throwBtn); btnContainer.appendChild(cancelBtn);
            subDiv.appendChild(btnContainer);
            currentLi.appendChild(subDiv);
        }

        // --- アイテム使用・装備ロジックの拡張 ---
        equipItemLogic(item, isEquipping) {
            const cat = item.category;
            if (isEquipping) {
                const currentEquip = this.player.equipment[cat];
                if (currentEquip && currentEquip.marks && currentEquip.marks.includes("呪")) {
                    this.log(`${currentEquip.emoji}${this.fmtI(currentEquip)}は 呪われていて外せない`);
                    this.closeInventory(); return;
                }
                if (currentEquip) currentEquip.isEquipped = false;
                
                item.isEquipped = true;
                item.isIdentified = true; // 装備したら識別される
                this.player.equipment[cat] = item;
                
                // 指輪装備時、水の上で外した判定のための事前準備
                this.log(`${item.emoji}${this.fmtI(item)}を 装備した`);
            } else {
                if (item.marks && item.marks.includes("呪")) {
                    this.log(`${item.emoji}${this.fmtI(item)}は 呪われていて外せない`);
                    this.closeInventory(); return;
                }
                item.isEquipped = false;
                this.player.equipment[cat] = null;
                this.log(`${item.emoji}${this.fmtI(item)}を 外した`);
                
                // 水路の指輪を水上で外した場合
                if (item.id === 'i104' && this.map[this.player.y][this.player.x] === CONFIG.TILES.WATER) {
                    this.warpPlayer();
                }
            }
            this.recalculateStats();
            this.closeInventory();
            this.triggerTurn(); 
        }



        useItemLogic(item, source) {
            let used = false;

            // 使用した時点で未識別なら識別済みにする（草、巻物）
            // ▼修正: 対象選択・方向指定が必要なアイテムはここでは識別しない
            const requireTargetItems = ["識別の巻物", "パンの巻物", "合成の巻物", "天の恵みの巻物", "地の恵みの巻物", "メッキの巻物", "火炎草"];
            if (['herb', 'scroll'].includes(item.category) && !requireTargetItems.includes(item.name)) {
                if (!this.identifiedItemIDs.has(item.id)) {
                    this.identifiedItemIDs.add(item.id);
                    this.log(`${this.unidentifiedNames[item.id]}は ${item.name}だった`);
                }
            }

            // 杖
            if (item.category === 'wand') {
                this.wandItem = item;
                this.wandSource = source;
                this.gameState = 'WAND_AIM';

                this.log("振る方向を選んでください");
                document.getElementById('btn-center').innerHTML = '取消<br>❌';
                this.closeInventory();
                return;
            }            

            if (item.category === 'food') {
                if (item.name === "くさったパン") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 食べた`);
                    this.player.hp -= 5;
                    this.player.strength = Math.max(0, this.player.strength - 1);
                    this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + 20);
                    if(this.player.hunger === this.player.maxHunger){
                        this.log(`お腹はいっぱいになったが ちからが1下がった`);
                    }else{
                        this.log(`お腹は少し満たされたが ちからが1下がった`);                        
                    }
                } else if (item.name === "パン") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 食べた`);
                    if(this.player.hunger === this.player.maxHunger){
                        this.player.maxHunger += 2;
                        this.log(`お腹がいっぱいになり 最大満腹度が2増えた`);
                    }else{
                        this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                        if(this.player.hunger === this.player.maxHunger){
                            this.log(`お腹がいっぱいになった`);
                        }else{
                            this.log(`お腹が少し満たされた`);                        
                        }
                    }
                } else if (item.name === "大きなパン") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 食べた`);
                    if(this.player.hunger === this.player.maxHunger){
                        this.player.maxHunger += 5;
                        this.log(`お腹がいっぱいになり 最大満腹度が5増えた`);
                    }else{
                        this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                        if(this.player.hunger === this.player.maxHunger){
                            this.log(`お腹がいっぱいになった`);
                        }else{
                            this.log(`お腹が少し満たされた`);                        
                        }
                    }
                } else if (item.name === "巨大なパン") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 食べた`);
                    this.player.maxHunger += 10;
                    this.player.hunger = this.player.maxHunger;
                    this.log(`お腹がいっぱいになり 最大満腹度が10増えた`);
                } else {
                    //if (this.player.hunger >= this.player.maxHunger) this.player.maxHunger += 2;
                    //this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                }
                //this.log(`${item.emoji}${this.fmtI(item)}を 食べた`);
                used = true;
            } else if (item.category === 'herb') {
                if (item.name === "しあわせ草") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 飲んだ`);
                    this.player.exp = this.getRequiredExp(this.player.level);
                    this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                    this.levelUp(); used = true;
                } else if (item.name === "不幸の種") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 飲んだ`);
                    this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                    this.levelDown(); used = true;
                } else if (item.name === "まどわし草" || item.name === "混乱草") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 飲んだ`);
                    this.player.statuses.confused = 20;
                    this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                    this.log(`${this.fmtP()}は 混乱した`);
                    used = true;
                } else if (item.name === "目薬草") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 飲んだ`);
                    this.player.statuses.see_all = true;
                    if(this.entities.traps) this.entities.traps.forEach(t => t.isVisible = true);
                    this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                    this.log(`${this.fmtP()}は 罠が見えるようになった`);
                    used = true;
                } else if (item.name === "毒草") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 飲んだ`);
                    this.player.hp -= 5;
                    this.player.strength = Math.max(0, this.player.strength - 1);
                    this.player.statuses.slow = 10;
                    this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                    this.log(`${this.fmtP()}は 鈍足状態になった`);
                    used = true;
                } else if (item.name === "すばやさ草") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 飲んだ`);
                    this.player.statuses.double_speed = 10;
                    this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                    this.log(`${this.fmtP()}は 倍速状態になった`);
                    used = true;
                } else if (item.name === "毒消し草") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 飲んだ`);
                    this.player.strength = this.player.maxStrength;
                    this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                    this.log(`${this.fmtP()}の ちからが回復した`);
                    used = true;
                } else if (item.name === "ちからのたね") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 飲んだ`);
                    this.player.maxStrength++; this.player.strength++;
                    this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                    this.log(`${this.fmtP()}の ちからの最大値が上がった`);
                    used = true;
                } else if (item.name === "高とび草") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 飲んだ`);
                    this.log(`${this.fmtP()}は ワープした`);
                    this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                    this.warpTarget(this.player); used = true;                   
                } else if (item.name === "火炎草") {
                    this.gameState = 'FIREBALL_AIM';
                    this.log("火炎を放つ方向を選んでください");
                    document.getElementById('btn-center').innerHTML = '取消<br>❌';
                    used = true; 
                } else if (item.name === "薬草") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 飲んだ`);
                    this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                    if (this.player.hp >= this.player.maxHp){
                        this.player.maxHp += 1;
                        this.log(`${this.fmtP()}の 最大HPが1増えた`);
                    } else {
                        this.player.hp = Math.min(this.player.maxHp, this.player.hp + (item.effects.hp||0));
                        this.log(`${this.fmtP()}の HPが${item.effects.hp}回復した`);
                    }
                    used = true;
                } else if (item.name === "弟切草") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 飲んだ`);
                    this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                    if (this.player.hp >= this.player.maxHp){
                        this.player.maxHp += 2;
                        this.log(`${this.fmtP()}の 最大HPが2増えた`);
                    } else {
                        this.player.hp = Math.min(this.player.maxHp, this.player.hp + (item.effects.hp||0));
                        this.log(`${this.fmtP()}の HPが${item.effects.hp}回復した`);
                    }
                    used = true;
                } else if (item.name === "命の草") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 飲んだ`);
                    this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                    this.player.maxHp += 5;
                    this.log(`${this.fmtP()}の 最大HPが5増えた`);
                    used = true;
                } else if (item.name === "胃拡張の種") {
                    this.log(`${item.emoji}${this.fmtI(item)}を 飲んだ`);
                    this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                    this.player.maxHunger += 10;
                    this.log(`${this.fmtP()}の 最大満腹度が10増えた`);
                    used = true;
                } else {
                    if (this.player.hp >= this.player.maxHp) this.player.maxHp += 1;
                    this.player.hp = Math.min(this.player.maxHp, this.player.hp + (item.effects.hp||0));
                    this.player.hunger = Math.min(this.player.maxHunger, this.player.hunger + (item.effects.hunger||0));
                    this.log(`${item.emoji}${this.fmtI(item)}を 飲んだ`);
                    this.log(`${this.fmtP()}の HPが${item.effects.hp}回復した`);
                    used = true;
                }
            } else if (item.category === 'scroll') {

                if (item.name === "識別の巻物" || item.name === "パンの巻物") {
                    this.gameState = 'SELECT_TARGET';
                    this.scrollItem = item;
                    this.scrollSource = source;
                    this.scrollTargetCategory = 'any'; 
                    //document.getElementById('inv-title-text').innerText = `${item.emoji}${item.name} どれに使う？`;
                    document.getElementById('inv-title-text').innerHTML = `${item.emoji}${this.getItemDisplayName(item, false)} どれに使う？`;
                    
                    if (source === 'feet') {
                        const idx = this.entities.items.findIndex(i => i.uid === item.uid);
                        if (idx !== -1) this.entities.items.splice(idx, 1);
                    }
                    this.renderInventory();
                    return; 
                } else if (item.name === "地獄耳の巻物") {
                    // this.entities.enemies.forEach(e => this.seenTiles.add(`${e.x},${e.y}`)); // 簡易的に表示
                    this.player.statuses.hear_all = true;
                    this.log(`モンスターの位置が分かるようになった`); used = true;
                } else if (item.name === "千里眼の巻物") {
                    this.entities.items.forEach(i => this.seenTiles.add(`${i.x},${i.y}`));
                    this.log(`アイテムの位置が分かるようになった`); used = true;
                } else if (item.name === "水枯れの巻物") {
                    for(let y=0; y<CONFIG.MAP_H; y++) {
                        for(let x=0; x<CONFIG.MAP_W; x++) {
                            if(this.map[y][x] === CONFIG.TILES.WATER) this.map[y][x] = CONFIG.TILES.FLOOR;
                        }
                    }
                    this.log(`フロア中の水が枯れた`); used = true;
                } else if (item.name === "大部屋の巻物") {
                    for(let y=1; y<CONFIG.MAP_H-1; y++) {
                        for(let x=1; x<CONFIG.MAP_W-1; x++) {
                            if(this.map[y][x] !== CONFIG.TILES.STAIRS) this.map[y][x] = CONFIG.TILES.FLOOR;
                        }
                    }
                    // 部屋情報を全体1部屋に上書き
                    this.rooms = [{ x: 1, y: 1, w: CONFIG.MAP_W - 2, h: CONFIG.MAP_H - 2 }];
                    this.log(`フロア中の壁が崩れた`); used = true;
                } else if (item.name === "バクスイの巻物") {
                    const room = this.rooms.find(r => this.player.x >= r.x && this.player.x < r.x + r.w && this.player.y >= r.y && this.player.y < r.y + r.h);
                    if (room) {
                        this.entities.enemies.forEach(e => {
                            if (e.x >= room.x && e.x < room.x + room.w && e.y >= room.y && e.y < room.y + room.h) e.statuses.asleep = 10;
                        });
                    } else {
                        this.entities.enemies.forEach(e => {
                            if (Math.abs(e.x - this.player.x) <= 1 && Math.abs(e.y - this.player.y) <= 1) e.statuses.asleep = 10;
                        });
                    }
                    this.log(`周囲の敵は 眠りに落ちた`);
                    used = true;
                } else if (item.name === "かなしばりの巻物") {
                    this.entities.enemies.forEach(e => {
                        if (Math.abs(e.x - this.player.x) <= 1 && Math.abs(e.y - this.player.y) <= 1) {
                            e.statuses.paralyzed = 9999;
                            this.log(`${this.fmtE(e)}は かなしばり状態になった`);
                        }
                    });
                    used = true;
                } else if (item.name === "しんくうぎりの巻物") {
                    const room = this.rooms.find(r => this.player.x >= r.x && this.player.x < r.x + r.w && this.player.y >= r.y && this.player.y < r.y + r.h);
                    this.entities.enemies.forEach(e => {
                        let inRange = false;
                        if (room) {
                            if (e.x >= room.x && e.x < room.x + room.w && e.y >= room.y && e.y < room.y + room.h) inRange = true;
                        } else {
                            if (Math.abs(e.x - this.player.x) <= 1 && Math.abs(e.y - this.player.y) <= 1) inRange = true;
                        }
                        if (inRange) {
                            let dmg = Math.floor(Math.random() * 21) + 15;
                            e.hp -= dmg;
                            e.statuses.paralyzed = 0;
                            this.log(`真空の刃が ${this.fmtE(e)}に ${dmg}ダメージを与えた`);
                            if (e.hp <= 0) {
                                this.log(`${this.fmtE(e)}は 倒れた`);
                                this.entities.enemies = this.entities.enemies.filter(en => en.uid !== e.uid);
                                this.gainExp(e.exp || 0);

                                // アイテムドロップ
                                this.processEnemyDrop(e);
                            }
                        }
                    });
                    used = true;
                } else if (item.name === "天の恵みの巻物" || item.name === "地の恵みの巻物" || item.name === "メッキの巻物") {
                    this.gameState = 'SELECT_TARGET';
                    this.scrollItem = item;
                    this.scrollSource = source;
                    if (item.name === "天の恵みの巻物") this.scrollTargetCategory = 'weapon';
                    else if (item.name === "地の恵みの巻物") this.scrollTargetCategory = 'shield';
                    else this.scrollTargetCategory = 'any_equip'; 
                    
                    //document.getElementById('inv-title-text').innerText = `${item.emoji}${item.name} どれに使う？`;
                    document.getElementById('inv-title-text').innerHTML = `${item.emoji}${this.getItemDisplayName(item, false)} どれに使う？`;

                    if (source === 'feet') {
                        const idx = this.entities.items.findIndex(i => i.uid === item.uid);
                        if (idx !== -1) this.entities.items.splice(idx, 1);
                    }
                    this.renderInventory();
                    return; 
                } else if (item.name === "合成の巻物") {
                    this.startSynthesis(item, source);
                    return;

                } else {
                    this.log(`${item.emoji}${this.fmtI(item)}を 使ったが 何も起きなかった`);
                    used = true;
                }
            }

            if (used && item.consumable && item.name !== "火炎草") {
                if (source === 'inventory') {
                    const idx = this.player.inventory.findIndex(i => i.uid === item.uid);
                    if (idx !== -1) this.player.inventory.splice(idx, 1);
                } else if (source === 'feet') {
                    const idx = this.entities.items.findIndex(i => i.uid === item.uid);
                    if (idx !== -1) this.entities.items.splice(idx, 1);
                }
            } else if (used && item.name === "火炎草") {
                this.fireballItem = item;
                this.fireballSource = source;
                if (source === 'feet') {
                    const idx = this.entities.items.findIndex(i => i.uid === item.uid);
                    if (idx !== -1) this.entities.items.splice(idx, 1);
                }
                this.closeInventory();
                return;
            }
            this.closeInventory();
            this.triggerTurn(); 
        }

        // 対象選択をするアイテムの処理
        applyScrollEffect(targetIndex) {
            const targetItem = this.player.inventory[targetIndex];
            const scrollItem = this.scrollItem;
            let success = false;
            
            if (scrollItem.name === "識別の巻物") {
                if (['weapon', 'shield'].includes(targetItem.category)) {
                    targetItem.isIdentified = true;
                    this.log(`${this.fmtI(targetItem)}が 識別された`);
                } else {
                    this.identifiedItemIDs.add(targetItem.id);
                    this.log(`${this.unidentifiedNames[targetItem.id]}は ${targetItem.name}だった`);
                }
                success = true;
            } else if (scrollItem.name === "パンの巻物") {
                const panMaster = this.itemMaster.find(m => m.name === "パン");
                const oldName = this.fmtI(targetItem);
                
                // パン化
                targetItem.id = panMaster.id; targetItem.name = panMaster.name;
                targetItem.emoji = panMaster.emoji; targetItem.category = panMaster.category;
                targetItem.effects = panMaster.effects; targetItem.consumable = panMaster.consumable;
                
                if (targetItem.isEquipped) {
                    targetItem.isEquipped = false;
                    this.player.equipment[targetItem.category] = null;
                    this.recalculateStats();
                }
                this.log(`${oldName}は パンに変化した`);
                success = true;
            } else if (this.scrollTargetCategory === 'any_equip') { 
                // メッキの巻物の指輪対応
                if (targetItem.category === 'bracelet') {
                    if (targetItem.marks) {
                        if (targetItem.marks.includes("呪")) {
                            targetItem.marks = targetItem.marks.filter(m => m !== "呪");
                            this.log(`${targetItem.emoji}${this.fmtI(targetItem)}の 呪いが解かれた`);
                        }
                        if (targetItem.marks.includes("ヒビ")) {
                            targetItem.marks = targetItem.marks.filter(m => m !== "ヒビ");
                            this.log(`${targetItem.emoji}${this.fmtI(targetItem)}の ヒビが直った`);
                        }
                    }
                    success = true;
                } else if (['weapon', 'shield'].includes(targetItem.category)) {
                    if (!targetItem.marks) targetItem.marks = [];
                    if (targetItem.marks.includes("メ")) {
                        this.log(`すでに メッキされている`);
                    } else if (targetItem.marks.length < (targetItem.slots||0)) {
                        targetItem.marks.push("メ");
                        this.log(`${this.fmtI(targetItem)}に メッキ加工をした`);
                        success = true;
                    } else {
                        this.log(`しかし 効果が無かった`); success = true; 
                    }
                }
            } else if (targetItem.category === this.scrollTargetCategory) {
                let isCursed = targetItem.marks && targetItem.marks.includes("呪");
                if (isCursed) {
                    targetItem.marks = targetItem.marks.filter(m => m !== "呪");
                    this.log(`${targetItem.emoji}${this.fmtI(targetItem)}の 呪いが解けた`);
                }
                const up = Math.random() < 0.05 ? 3 : 1;
                this.log(`${scrollItem.emoji}${this.fmtI(scrollItem)}を読んだ ${targetItem.emoji}${this.fmtI(targetItem)}が+${up}された！`);
                targetItem.modifier += up;
                this.recalculateStats();
                success = true;
            } else {
                this.log(`${scrollItem.emoji}${this.fmtI(scrollItem)}は 効果が現れなかった`);
            }
            
            if (this.scrollSource === 'inventory') {
                const idx = this.player.inventory.findIndex(i => i.uid === scrollItem.uid);
                if (idx !== -1) this.player.inventory.splice(idx, 1);
            } 

            // ▼追記：効果が発動（確定）した場合に識別状態にする
            if (success && scrollItem && !this.identifiedItemIDs.has(scrollItem.id)) {
                this.identifiedItemIDs.add(scrollItem.id);
                this.log(`${this.unidentifiedNames[scrollItem.id]}は ${scrollItem.name}だった`);
            }            

            this.scrollItem = null;
            this.closeInventory();
            this.triggerTurn();
        }

        startSynthesis(scrollItem, scrollSource) {
            this.synthScrollItem = scrollItem;
            this.synthScrollSource = scrollSource;
            this.gameState = 'SELECT_SYNTH_BASE';
            
            if (scrollSource === 'feet') {
                const idx = this.entities.items.findIndex(i => i.uid === scrollItem.uid);
                if (idx !== -1) this.entities.items.splice(idx, 1);
            }

            document.getElementById('inv-title-text').innerText = '合成のベース(武器・盾)を選ぶ';
            this.renderInventory();
        }

        handleSynthSelection(index) {
            const item = this.player.inventory[index];
            if (this.gameState === 'SELECT_SYNTH_BASE') {
                if (!['weapon', 'shield'].includes(item.category)) return;
                this.synthBaseIndex = index;
                this.gameState = 'SELECT_SYNTH_MAT';
                document.getElementById('inv-title-text').innerText = '合成する素材を選ぶ';
                this.renderInventory();
            } else if (this.gameState === 'SELECT_SYNTH_MAT') {
                if (index === this.synthBaseIndex) return; 
                this.executeSynth(index);
            }
        }

        executeSynth(matIndex) {
            const baseItem = this.player.inventory[this.synthBaseIndex];
            const matItem = this.player.inventory[matIndex];
            
            let success = true;
            if (matItem.category === 'weapon' && baseItem.category === 'shield') success = false;
            if (matItem.category === 'shield' && baseItem.category === 'weapon') success = false;
            if (!['weapon', 'shield'].includes(matItem.category) && !matItem.mark) success = false;

            if (!success) {
                this.log(`${baseItem.emoji}${this.fmtI(baseItem)}の 合成に失敗した`);
            } else {
                this.log(`${baseItem.emoji}${this.fmtI(baseItem)}に ${matItem.emoji}${this.fmtI(matItem)}を合成した`);
                
                if (matItem.category === baseItem.category) {
                    baseItem.modifier += (matItem.modifier || 0);
                }

                let newMarks = [];
                if (['weapon', 'shield'].includes(matItem.category)) {
                    newMarks = matItem.marks || [];
                } else if (matItem.mark) {
                    newMarks = [matItem.mark];
                }

                if (!baseItem.marks) baseItem.marks = [];
                for (let m of newMarks) {
                    if (baseItem.marks.length < (baseItem.slots || 0) && !baseItem.marks.includes(m)) {
                        baseItem.marks.push(m);
                    }
                }
                this.recalculateStats();
            }

            const idsToRemove = [matItem.uid];
            if (this.synthScrollSource === 'inventory') {
                idsToRemove.push(this.synthScrollItem.uid);
            }

            this.player.inventory = this.player.inventory.filter(i => !idsToRemove.includes(i.uid));

            if (matItem.isEquipped) {
                this.player.equipment[matItem.category] = null;
                this.recalculateStats();
            }

            // ▼追記：合成が確定した場合に識別状態にする
            if (success && this.synthScrollItem && !this.identifiedItemIDs.has(this.synthScrollItem.id)) {
                this.identifiedItemIDs.add(this.synthScrollItem.id);
                this.log(`${this.unidentifiedNames[this.synthScrollItem.id]}は ${this.synthScrollItem.name}だった`);
            }

            this.synthScrollItem = null;
            this.closeInventory();
            this.triggerTurn();
        }

        putItemLogic(item, source) {
            if (source === 'feet') return; 
            
            if (item.isEquipped && item.marks && item.marks.includes("呪")) {
                this.log(`${item.emoji}${this.fmtI(item)}は 呪われていて置けない`);
                this.closeInventory(); return;
            }

            if (this.dropItemAt(item, this.player.x, this.player.y, true)) {
                const idx = this.player.inventory.findIndex(i => i.uid === item.uid);
                if (idx !== -1) this.player.inventory.splice(idx, 1);
                
                if(item.isEquipped && this.player.equipment[item.category] === item) {
                    item.isEquipped = false; this.player.equipment[item.category] = null; this.recalculateStats();
                }
                this.log(`${item.emoji}${this.fmtI(item)}を 足元に置いた`);
                this.closeInventory();
                this.triggerTurn();
            } else {
                this.log(`${item.emoji}${this.fmtI(item)}を 置けなかった`);
                this.closeInventory();
            }
        }

        startThrowMode(item, source) {
            if (item.isEquipped && item.marks && item.marks.includes("呪")) {
                this.log(`${item.emoji}${this.fmtI(item)}は 呪われていて外せない`);
                this.closeInventory(); return;
            }
            
            if (item.category === 'projectile') {
                let throwArrow = { ...item, stack: 1, isEquipped: false };
                this.throwItem = throwArrow;
                this.throwItemOriginUid = item.uid; 
            } else {
                this.throwItem = item;
            }
            this.throwSource = source;
            if (source === 'feet') {
                const idx = this.entities.items.findIndex(i => i.uid === item.uid);
                if (idx !== -1) this.entities.items.splice(idx, 1);
            }
            this.closeInventory();
            this.gameState = 'THROWING';
            this.log(item.category === 'projectile' ? "撃つ方向を選んでください" : "投げる方向を選んでください");
            document.getElementById('btn-center').innerHTML = '取消<br>❌';
        }
        
        endThrowMode() {
            this.gameState = 'PLAY';
            document.getElementById('btn-center').innerHTML = '足踏み<br>⌛';
            
            if (this.scrollItem) {
                if (this.scrollSource === 'feet') this.entities.items.push(this.scrollItem);
                this.scrollItem = null;
            }
            if (this.synthScrollItem) {
                if (this.synthScrollSource === 'feet') this.entities.items.push(this.synthScrollItem);
                this.synthScrollItem = null;
            }
            if (this.throwItem) {
                if (this.throwSource === 'feet') {
                    if(this.throwItem.category === 'projectile' && this.throwItemOriginUid){
                    } else {
                        this.entities.items.push(this.throwItem);
                    }
                }
                this.throwItem = null;
            }
            if (this.fireballItem) {
                if (this.fireballSource === 'feet') this.entities.items.push(this.fireballItem);
                this.fireballItem = null;
            }
        }

        async executeThrow(dx, dy) {
            const item = this.throwItem;
            this.throwItem = null;
            document.getElementById('btn-center').innerHTML = '足踏み<br>⌛';
            this.gameState = 'PLAY';

            let thrownItem = JSON.parse(JSON.stringify(item)); // ディープコピーしてuidを振り直す
            thrownItem.uid = this.generateUid();
            thrownItem.isEquipped = false;

            if (this.throwSource === 'inventory') {
                if (item.category === 'projectile' && this.throwItemOriginUid) {
                    let origin = this.player.inventory.find(i => i.uid === this.throwItemOriginUid);
                    if (origin) {
                        origin.stack--;
                        if (origin.stack <= 0) {
                            this.player.inventory = this.player.inventory.filter(i => i.uid !== origin.uid);
                            if(origin.isEquipped) this.player.equipment.projectile = null;
                        }
                    }
                } else {
                    const idx = this.player.inventory.findIndex(i => i.uid === item.uid);
                    if (idx !== -1) this.player.inventory.splice(idx, 1);
                    if(item.isEquipped && this.player.equipment[item.category] === item) {
                        item.isEquipped = false; this.player.equipment[item.category] = null; this.recalculateStats();
                    }
                }
            }
            
            this.log(`${this.fmtP()}は ${thrownItem.emoji}${this.fmtI(thrownItem)}を${thrownItem.category==='projectile'?'撃った':'投げた'}`);

            // 遠投の指輪または銀の矢の貫通チェック
            let isPierce = (thrownItem.pierce || (this.player.equipment.bracelet && this.player.equipment.bracelet.name === "遠投の指輪"));
            isPierce = isPierce ?? false; // 上記の評価で失敗した場合はfalseをセット

            let cx = this.player.x, cy = this.player.y;
            let hitEnemies = [];

            const maxRange = (isPierce && thrownItem.category === 'projectile') ? 99 : 10;            

            for(let i=0; i<maxRange; i++) {
                let nx = cx + dx, ny = cy + dy;
                if(nx < 0 || nx >= CONFIG.MAP_W || ny < 0 || ny >= CONFIG.MAP_H) break;
                if(this.map[ny][nx] === CONFIG.TILES.WALL && !isPierce) break;
                
                cx = nx; cy = ny;
                let enemy = this.entities.enemies.find(e => e.x === cx && e.y === cy);
                if(enemy) {
                    hitEnemies.push({enemy: enemy, x: cx, y: cy});
                    if (!isPierce) break; // 貫通しないなら最初の1体でストップ
                }
            }

            if(hitEnemies.length > 0) {

                let idx = 0;
                for (let hit of hitEnemies) {
                    idx++;
                    let hitEnemy = hit.enemy;
                    if (Math.random() < 0.15) {
                        this.log(`${thrownItem.emoji}${this.fmtI(thrownItem)}は 当たらなかった`);
                        if (!isPierce) this.dropItemAt(thrownItem, hit.x, hit.y);
                    } else {
                        if(thrownItem.category === 'herb') {
                            if (thrownItem.name === "しあわせ草") {
                                this.evolveEnemy(hitEnemy);
                            } else if (thrownItem.name === "不幸の種") {
                                this.devolveEnemy(hitEnemy);
                            } else if (thrownItem.name === "まどわし草") {
                                hitEnemy.behavior = 'fear';
                            } else if (thrownItem.name === "混乱草") {
                                hitEnemy.statuses.confused = 20;
                            } else if (thrownItem.name === "毒草") {
                                hitEnemy.hp -= 5;
                                hitEnemy.statuses.slow = 10;
                                hitEnemy.statuses.paralyzed = 0;
                                this.log(`${this.fmtE(hitEnemy)}に 5ダメージを与えた`);
                                this.log(`${this.fmtE(hitEnemy)}は 鈍足状態になった`);
                            } else if (thrownItem.name === "すばやさ草") {
                                hitEnemy.statuses.double_speed = 10;
                                this.log(`${this.fmtE(hitEnemy)}は 倍速状態になった`);
                            } else if (thrownItem.name === "火炎草") {
                                let dmg = Math.floor(Math.random() * 11) + 40;
                                hitEnemy.hp -= dmg;
                                hitEnemy.statuses.paralyzed = 0;
                                this.log(`${this.fmtE(hitEnemy)}に ${dmg}ダメージを与えた`);
                            } else if (thrownItem.name === "毒消し草" || thrownItem.name === "ちからのたね") {
                                // TODO: 敵に当てた場合の効果ペンディング
                            } else if (thrownItem.name === "高とび草") {
                                warpTarget(hitEnemy);
                                this.log(`${this.fmtE(hitEnemy)}は ワープした`);
                            } else {
                                hitEnemy.hp = Math.min(hitEnemy.maxHp, hitEnemy.hp + (thrownItem.effects.hp || 0));
                            } 
                        } else if (thrownItem.name === "くさったパン") {
                            hitEnemy.hp -= 5;
                            hitEnemy.statuses.paralyzed = 0;
                            this.log(`${this.fmtE(hitEnemy)}に 5ダメージを与えた`);
                        } else if (thrownItem.category === 'wand') {
                            if (thrownItem.name === '鈍足の杖') {
                                hitEnemy.statuses.slow = 10;
                                this.log(`${this.fmtE(hitEnemy)}は 鈍足状態になった`);
                            } else if (thrownItem.name === '場所替えの杖') {

                                const px = this.player.x; const py = this.player.y;

                                // 貫通する場合は、最後にヒットした敵キャラと主人公位置を交換
                                if(isPierce){
                                    if(idx === hitEnemies.length-1){
                                        this.player.x = hitEnemy.x; this.player.y = hitEnemy.y;
                                        hitEnemy.x = px; hitEnemy.y = px;
                                        this.log(`${this.fmtP()}と ${this.fmtE(hitEnemy)}の 場所が入れ替わった`);
                                    }
                                } else {
                                    this.player.x = hitEnemy.x; this.player.y = hitEnemy.y;
                                    hitEnemy.x = px; hitEnemy.y = px;
                                    this.log(`${this.fmtP()}と ${this.fmtE(hitEnemy)}の 場所が入れ替わった`);
                                }
                            }
                        } else if(['weapon', 'shield', 'projectile'].includes(thrownItem.category)) {
                            let val = (thrownItem.effects.atk || 0) + (thrownItem.effects.def || 0) + (thrownItem.modifier || 0) + 1;
                            hitEnemy.hp -= val;
                            hitEnemy.statuses.paralyzed = 0;
                            this.log(`${this.fmtE(hitEnemy)}に ${val}ダメージを与えた`);
                        }
                        // 敵撃破処理 (省略せず組み込み)
                        if(hitEnemy.hp <= 0) {
                            this.log(`${this.fmtE(hitEnemy)}は 倒れた`);
                            this.entities.enemies = this.entities.enemies.filter(e => e.uid !== hitEnemy.uid);
                            this.gainExp(hitEnemy.exp || 0);

                            // アイテムドロップ
                            this.processEnemyDrop(hitEnemy);

                        }
                    }
                }
            } else {
                if (!isPierce) {
                    if(!this.dropItemAt(thrownItem, cx, cy)) {
                        this.log(`${thrownItem.emoji}${this.fmtI(thrownItem)}は 使い物にならなくなった`);
                    }
                } else {
                    this.log(`${thrownItem.emoji}${this.fmtI(thrownItem)}は 飛んでいった`); // 貫通して壁外へ
                }
            }
            this.triggerTurn();
        }

        dropItemAt(item, startX, startY, strict = false) {
            const isDroppable = (x, y) => {
                if(x < 0 || x >= CONFIG.MAP_W || y < 0 || y >= CONFIG.MAP_H) return false;
                //if(this.map[y][x] !== CONFIG.TILES.FLOOR) return false;
                if(this.map[y][x] !== CONFIG.TILES.FLOOR && this.map[y][x] !== CONFIG.TILES.WATER) return false;                
                if(this.entities.items.some(i => i.x === x && i.y === y)) return false;
                if(this.entities.traps && this.entities.traps.some(t => t.x === x && t.y === y)) return false;
                return true;
            };
            if (isDroppable(startX, startY)) {
                item.x = startX; item.y = startY; this.entities.items.push(item); return true;
            }
            if (strict) return false;
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    if (isDroppable(startX + dx, startY + dy)) {
                        item.x = startX + dx; item.y = startY + dy; this.entities.items.push(item); return true;
                    }
                }
            }
            return false;
        }

        showFeetItemMenu(item) {
            this.gameState = 'FEET_MENU';
            document.getElementById('msg-log').style.display = 'none';
            const panel = document.getElementById('inventory-panel');
            panel.style.display = 'flex';
            document.getElementById('inv-title-text').innerHTML = `👣 足元 (${item.emoji}${this.getItemDisplayName(item, false)})`;
            
            const list = document.getElementById('inv-list');
            list.innerHTML = '';
            const subDiv = document.createElement('div');
            subDiv.style.display = 'flex'; subDiv.style.flexDirection = 'column';

            const descDiv = document.createElement('div');
            descDiv.style.color = 'white'; descDiv.style.fontSize = '12px'; descDiv.style.marginBottom = '5px';

            if (['herb', 'scroll','wand','bracelet'].includes(item.category)) {
                if (!this.identifiedItemIDs.has(item.id)) {
                    descDiv.innerHTML = "未識別のため効果が分からない";
                } else {
                    descDiv.innerHTML = item.description || "";
                }
            } else {
                descDiv.innerHTML = item.description || "";
            }

            if (['weapon', 'shield'].includes(item.category)) {
                let slotsText = "";
                const maxSlots = item.slots || 0;
                const marks = item.marks || [];
                for (let i = 0; i < maxSlots; i++) {
                    if (i < marks.length) slotsText += `[${marks[i]}]`; else slotsText += `[ ]`;
                }
                if (maxSlots > 0) descDiv.innerHTML += `<br>スロット: ${slotsText}`;
            }
            subDiv.appendChild(descDiv);

            const btnContainer = document.createElement('div');
            btnContainer.className = 'inv-submenu';

            if (this.player.inventory.length < 20) {
                const pickBtn = document.createElement('button'); pickBtn.className = 'inv-btn-small'; pickBtn.textContent = '拾う';
                pickBtn.onclick = () => { this.pickupItemLogic(item); this.closeInventory(); this.triggerTurn(); };
                btnContainer.appendChild(pickBtn);

                if (['weapon', 'shield', 'bracelet', 'projectile'].includes(item.category)) {
                    const eqBtn = document.createElement('button'); eqBtn.className = 'inv-btn-small'; eqBtn.textContent = '装備する';
                    eqBtn.onclick = () => {
                        const idx = this.entities.items.findIndex(i => i.uid === item.uid);
                        if (idx !== -1) this.entities.items.splice(idx, 1);
                        this.player.inventory.push(item);
                        this.equipItemLogic(item, true);
                    };
                    btnContainer.appendChild(eqBtn);
                } else {
                    const useBtn = document.createElement('button'); useBtn.className = 'inv-btn-small'; useBtn.textContent = '使う';
                    useBtn.onclick = () => this.useItemLogic(item, 'feet');
                    btnContainer.appendChild(useBtn);
                }
            } else {
                const exBtn = document.createElement('button'); exBtn.className = 'inv-btn-small'; exBtn.textContent = '交換';
                exBtn.onclick = () => { this.log("どれと交換しますか？ (未実装)"); this.closeInventory(); };
                btnContainer.appendChild(exBtn);

                if (!['weapon', 'shield', 'bracelet', 'projectile'].includes(item.category)) {
                    const useBtn = document.createElement('button'); useBtn.className = 'inv-btn-small'; useBtn.textContent = '使う';
                    useBtn.onclick = () => this.useItemLogic(item, 'feet');
                    btnContainer.appendChild(useBtn);
                }
            }

            const throwBtn = document.createElement('button'); throwBtn.className = 'inv-btn-small'; 
            throwBtn.textContent = item.category === 'projectile' ? '撃つ' : '投げる';
            throwBtn.onclick = () => this.startThrowMode(item, 'feet');
            btnContainer.appendChild(throwBtn);

            const cancelBtn = document.createElement('button'); cancelBtn.className = 'inv-btn-small'; cancelBtn.textContent = '閉じる';
            cancelBtn.onclick = () => this.closeInventory();
            btnContainer.appendChild(cancelBtn);

            subDiv.appendChild(btnContainer);
            list.appendChild(subDiv);
        }

        // --- デバッグ ---
        toggleDebugPanel() {
            const panel = document.getElementById('debug-panel');
            if(panel.style.display === 'flex') {
                panel.style.display = 'none';
            } else {
                panel.style.display = 'flex';
                document.getElementById('debug-log-view').innerHTML = this.fullLogHistory.join('<hr style="border-color:#333; margin:2px 0;">');
                this.updateDebugSurroundings();
            }
        }

        updateDebugSurroundings() {
            let html = '<b style="color:white;">【周囲8マスのエンティティ情報】</b><br>';
            let found = false;
            
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    
                    let nx = this.player.x + dx;
                    let ny = this.player.y + dy;
                    
                    let enemies = this.entities.enemies.filter(e => e.x === nx && e.y === ny);
                    let items = this.entities.items.filter(i => i.x === nx && i.y === ny);
                    let traps = this.entities.traps ? this.entities.traps.filter(t => t.x === nx && t.y === ny) : [];
                    
                    if (enemies.length > 0 || items.length > 0 || traps.length > 0) {
                        found = true;
                        let dir = '';
                        if(dx===-1 && dy===-1) dir='↖'; else if(dx===0 && dy===-1) dir='↑'; else if(dx===1 && dy===-1) dir='↗';
                        else if(dx===-1 && dy===0) dir='←'; else if(dx===1 && dy===0) dir='→';
                        else if(dx===-1 && dy===1) dir='↙'; else if(dx===0 && dy===1) dir='↓'; else if(dx===1 && dy===1) dir='↘';
                        
                        html += `[${dir} ${nx},${ny}] `;
                        enemies.forEach(e => html += `<span style="color:${e.color}">${e.name}(UID:${e.uid})</span> `);
                        items.forEach(i => html += `<span style="color:${i.color}">${i.name}(UID:${i.uid})</span> `);
                        traps.forEach(t => html += `<span style="color:#aaa">${t.master.name}(UID:${t.uid})</span> `);
                        html += '<br>';
                    }
                }
            }
            
            if (!found) html += 'なし<br>';
            document.getElementById('debug-surroundings').innerHTML = html;
        }

		// --- UI描画系 ---
        log(msg) {
            let html = msg;
            
            // [P:主人公名]
            html = html.replace(/\[P:(.*?)\]/g, `<span style="color:${this.config.color}">$1</span>`);
            
            // [E:id:name]
            html = html.replace(/\[E:([^:]+):(.*?)\]/g, (match, id, name) => {
                const master = this.enemyMaster.find(e => e.id === id);
                const color = master ? master.color : 'red';
                return `<span style="color:${color}">${name}</span>`;
            });
            
            // [I:id:name]
            html = html.replace(/\[I:([^:]+):(.*?)\]/g, (match, id, name) => {
                const master = this.itemMaster.find(i => i.id === id);
                const color = master ? master.color : 'cyan';
                return `<span style="color:${color}">${name}</span>`;
            });

            this.fullLogHistory.push(html);
            this.msgQueue.push(html);

            if (!this.isMsgAnimating) {
                this.processMsgQueue();
            }
        }

        processMsgQueue() {
            if (this.msgQueue.length === 0) {
                this.isMsgAnimating = false;
                return;
            }
            
            const logEl = document.getElementById('msg-log');
            let lines = logEl.innerHTML.split('<br>').filter(l => l !== "");
            lines.push(this.msgQueue.shift());
            if (lines.length > 3) {
                lines.shift();
            }
            logEl.innerHTML = lines.join('<br>');
            
            if (this.msgQueue.length > 0) {
                setTimeout(() => this.processMsgQueue(), 300);
            } else {
                clearTimeout(this.msgClearTimer);
                this.msgClearTimer = setTimeout(() => {
                    logEl.innerHTML = '';
                    this.isMsgAnimating = false;
                }, 5000);
            }
        }

        // ダイアログ処理
        showChoiceDialog(message, onYes, onNo, onSave) {
            this.gameState = 'CHOICE';
